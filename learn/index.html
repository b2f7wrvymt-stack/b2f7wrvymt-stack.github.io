<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初中知识图谱 · 学习版（讲解+随堂测）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="知识图谱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f6e62">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root{
    --bg:#f5f6f4; --card:#ffffff; --ink:#1f2328; --sub:#6b7280;
    --line:#e3e6e2; --brand:#0f6e62; --brand-soft:#e7f1ef;
    --warn:#b45309; --warn-bg:#fff5e6; --err:#b3261e; --err-bg:#fdeceb;
    --soft:#8a94a0; --shadow:0 1px 3px rgba(20,30,25,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px 0}
  .hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.3px}
  .hd .meta{color:var(--sub);font-size:12.5px}
  .tabs{display:flex;gap:4px;margin-top:14px}
  .tab{padding:8px 18px;cursor:pointer;border:none;background:none;font-size:14px;color:var(--sub);
    border-bottom:2px solid transparent;font-family:inherit}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .tab .badge{display:inline-block;background:var(--err-bg);color:var(--err);border-radius:9px;
    padding:0 6px;font-size:11px;margin-left:5px;font-weight:600}

  .wrap{max-width:1280px;margin:0 auto;padding:16px 24px 40px}
  .toolbar{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row + .row{margin-top:10px}
  .search{flex:1 1 260px;min-width:200px;padding:8px 12px;border:1px solid var(--line);
    border-radius:7px;font-size:14px;font-family:inherit;outline:none;background:#fbfcfa}
  .search:focus{border-color:var(--brand);background:#fff}
  .lb{font-size:12px;color:var(--sub);white-space:nowrap;margin-right:2px}
  .chip{padding:4px 11px;border:1px solid var(--line);border-radius:16px;background:#fff;
    cursor:pointer;font-size:12.5px;color:var(--ink);font-family:inherit;white-space:nowrap}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip .n{opacity:.6;font-size:11px;margin-left:3px}
  .chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap}
  .stat{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}

  .cols{display:grid;grid-template-columns:390px 1fr;gap:14px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .list{max-height:72vh;overflow:auto}
  .li{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:9px;align-items:flex-start}
  .li:hover{background:#fafbf9}
  .li.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .li .body{flex:1;min-width:0}
  .li .nm{font-weight:560;font-size:13.5px}
  .li .cp{color:var(--sub);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:#eef1ee;color:#4b5a52;
    margin-right:5px;white-space:nowrap;vertical-align:1px}
  .tag.g{background:#eaf0fa;color:#35507f}
  .tag.err{background:var(--err-bg);color:var(--err);font-weight:600}
  .tag.star{background:var(--warn-bg);color:var(--warn)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--err);flex:none;margin-top:7px}
  .more{padding:11px;text-align:center;color:var(--brand);cursor:pointer;font-size:13px}
  .empty{padding:30px;text-align:center;color:var(--sub)}

  .detail{padding:18px 20px 26px;min-height:400px;max-height:82vh;overflow:auto}
  .ph{color:var(--sub);text-align:center;padding-top:90px}
  .ph b{display:block;color:var(--ink);font-size:15px;margin-bottom:8px}
  .dh{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .dh h2{font-size:19px;margin:0;font-weight:650}
  .starbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:4px 10px;cursor:pointer;font-size:12px;color:var(--sub);font-family:inherit;white-space:nowrap}
  .starbtn.on{background:var(--warn-bg);border-color:#f0d9b0;color:var(--warn)}
  .kv{color:var(--sub);font-size:12.5px;margin:7px 0 14px}
  .sec{margin-top:18px}
  .sec h3{font-size:13.5px;margin:0 0 9px;font-weight:650;display:flex;align-items:center;gap:7px}
  .sec h3 .cnt{font-weight:400;color:var(--sub);font-size:11.5px}
  .desc{background:#fafbf9;border:1px solid var(--line);border-radius:7px;padding:11px 13px;font-size:13px;color:#37413b}
  .mk{margin-top:8px;font-size:12.5px;color:#4b5a52}
  .mk b{color:var(--brand)}

  .errbox{background:var(--err-bg);border:1px solid #f3c9c6;border-radius:8px;padding:12px 14px;margin-top:6px}
  .errbox .et{font-weight:650;color:var(--err);font-size:13.5px}
  .errbox ul{margin:7px 0 0;padding-left:18px}
  .errbox li{font-size:12.5px;margin:3px 0;cursor:pointer}
  .errbox li:hover{text-decoration:underline}

  .lv{margin-bottom:9px}
  .lv .lvt{font-size:11.5px;color:var(--sub);margin-bottom:5px;letter-spacing:.3px}
  .node{display:flex;gap:7px;align-items:flex-start;padding:5px 9px;border:1px solid var(--line);
    border-radius:6px;margin-bottom:4px;background:#fff;cursor:pointer;font-size:12.5px}
  .node:hover{border-color:var(--brand);background:#fafdfc}
  .node .hh{font-size:10px;padding:1px 5px;border-radius:3px;flex:none;margin-top:2px}
  .node .hh.hard{background:var(--warn-bg);color:var(--warn)}
  .node .hh.soft{background:#eef1ee;color:var(--soft)}
  .node .r{color:var(--sub);font-size:11px;display:block;margin-top:1px}
  .node .badge-pri{font-size:10px;background:#eef1f6;color:#5a6b86;padding:1px 5px;border-radius:3px;flex:none;margin-top:2px}

  .mist{padding:13px 15px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff}
  .mist.m-empty{opacity:.62}
  .mist .mt{font-weight:650;font-size:14px}
  .mist .mq{font-size:11.5px;color:var(--err);margin-left:8px;font-weight:600}
  .mist .ml{font-size:12.5px;margin-top:6px}
  .mist .ml b{color:var(--sub);font-weight:600;display:inline-block;min-width:44px}
  .mist .mact{margin-top:8px;font-size:12px}
  .mist .mact a{cursor:pointer}
  .grp{font-size:13px;font-weight:650;color:var(--brand);margin:16px 0 8px;padding-left:2px;
    border-left:3px solid var(--brand);padding-left:8px}
  .note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
  mark{background:#fff0a8;padding:0 1px}

  /* ===== 学习模式 ===== */
  .ptabs{display:flex;gap:6px;margin:6px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ptab{padding:8px 16px;border:none;background:none;font-family:inherit;font-size:13.5px;
    color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .ptab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:650}
  .ptab .muted{font-size:10.5px;opacity:.6;font-weight:400}
  .pane{padding-bottom:10px}
  .tag.lsn{background:#e7f1ef;color:#0f6e62;font-weight:600}
  .tag.ok{background:#e9f4e6;color:#3a6b2f;font-weight:600}
  .lcard{background:#f7fbf9;border:1px solid #d8e8e2;border-left:4px solid var(--brand);
    border-radius:8px;padding:13px 15px;margin-top:8px}
  .lcard h4{margin:0 0 7px;font-size:13px;color:var(--brand);font-weight:650}
  .lcard ul{margin:0;padding-left:19px}
  .lcard li{font-size:13px;margin:4px 0}
  .lcard .eg,.lcard .trap{margin-top:10px;font-size:12.8px;line-height:1.75}
  .lcard .eg b{color:var(--brand)}
  .lcard .trap{background:var(--warn-bg);border:1px solid #f0dcb5;border-radius:6px;
    padding:8px 10px;color:#7a4c10}
  .lcard .trap b{color:var(--warn)}
  .basic{background:#fafbf9;border:1px solid var(--line);border-radius:7px;padding:11px 13px;font-size:13px}
  .selfbox{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;font-size:13px}
  .selfbox .sstate{margin-top:8px;font-size:12px;color:var(--sub)}
  .emptybox{background:#fafbf9;border:1px dashed var(--line);border-radius:8px;
    padding:20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.9}
  .btn2{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 13px;
    font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;margin:8px 6px 0 0}
  .btn2:hover{border-color:var(--brand);color:var(--brand)}
  .qhead{font-size:12.5px;color:var(--sub);margin-bottom:8px}
  .qbar{height:6px;background:#eef1ee;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .qbar-in{height:100%;background:var(--brand);width:0;transition:width .25s}
  .qcard{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:11px;background:#fff}
  .qt{font-size:13.5px;font-weight:560;margin-bottom:10px;line-height:1.7}
  .qt b{color:var(--brand);margin-right:5px}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{text-align:left;border:1px solid var(--line);background:#fcfdfb;border-radius:6px;
    padding:9px 12px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.6}
  .qopt:hover{border-color:var(--brand);background:#f5fbf9}
  .qopt.right{background:#e9f5e7;border-color:#8fc286;color:#2f6327;font-weight:600}
  .qopt.wrong{background:var(--err-bg);border-color:#e5aaa5;color:var(--err)}
  .qopt.dim{opacity:.55}
  .qwhy{margin-top:9px;border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.7}
  .qwhy.ok{background:#eef7ec;color:#33622c}
  .qwhy.no{background:var(--err-bg);color:#8a2b23}
  .qsum{margin-top:6px;border-radius:8px;padding:13px 15px;font-size:13.5px;line-height:1.8}
  .qsum.good{background:#eef7ec;border:1px solid #bfe0b6;color:#2f6327}
  .qsum.bad{background:var(--warn-bg);border:1px solid #f0dcb5;color:#7a4c10}
  .qsumact{margin-top:5px}
  .pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
  .pcard .v{font-size:26px;font-weight:680;color:var(--brand);line-height:1.2}
  .pcard .l{font-size:12px;color:var(--sub);margin-top:4px}
  .ptable{width:100%;border-collapse:collapse;font-size:13px;background:#fff;
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .ptable th,.ptable td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
  .ptable th{background:#f7f9f6;font-weight:650;color:var(--sub);font-size:12px}
  .ptable tr:last-child td{border-bottom:none}
  .ptable td.n{text-align:right;font-variant-numeric:tabular-nums}
  .pweak{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px}
  .pweak .w{display:flex;gap:10px;align-items:center;padding:9px 2px;
    border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .pweak .w:last-child{border-bottom:none}
  .pweak .w:hover{color:var(--brand)}
  .pweak .w .c{color:var(--err);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .psect{font-size:14px;font-weight:650;margin:22px 0 10px}
  @media(max-width:900px){
    .list{max-height:46vh}
    .detail{max-height:none;min-height:0}
    .pcards{grid-template-columns:repeat(2,1fr)}
    .ptabs{gap:2px}
    .ptab{padding:8px 11px;font-size:13px}
  }
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>初中知识图谱 · 七至九年级</h1>
    <span class="meta">语文 / 数学 / 英语 / 道法 / 历史 / 物理 / 化学　·　离线单页版　·　双击即开，无需联网</span>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="map">知识点与先修链</button>
    <button class="tab" data-v="mist">我的错题本<span class="badge" id="mistCnt">0</span></button>
    <button class="tab" data-v="prog">学习进度</button>
  </div>
</header>

<div class="wrap">
  <div id="vMap">
    <div class="toolbar">
      <div class="row">
        <input class="search" id="q" placeholder="搜索知识点、章节、领域……例如：沸腾、诚信、平均速度、辛亥革命">
        <span class="stat" id="stat"></span>
      </div>
      <div class="row" id="subjRow"><span class="lb">学科</span></div>
      <div class="row" id="gradeRow">
        <span class="lb">年级</span>
        <label class="chk"><input type="checkbox" id="onlyErr"> 只看有错题关联的知识点</label>
        <label class="chk"><input type="checkbox" id="onlyStar"> 只看我标记的复习点</label>
        <label class="chk"><input type="checkbox" id="onlyQuiz"> 只看有随堂测的点</label>
      </div>
    </div>
    <div class="cols">
      <div class="panel list" id="list"></div>
      <div class="panel detail" id="detail">
        <div class="ph"><b>← 点左侧任一知识点</b>每个点分「① 联系点 / ② 讲解 / ③ 随堂测」三段。<br>带「精讲」标签的点可直接练；有红点的是期中卷错过的相关知识点。</div>
      </div>
    </div>
  </div>

  <div id="vMist" style="display:none"></div>
  <div id="vProg" style="display:none"></div>

  <div class="note" id="note"></div>
</div>

s":"数学","g":3,"m":0,"c":"三年级上册 第6单元 分数的初步认识"},{"i":"cnm_p282","n":"口算除法","s":"数学","g":3,"m":0,"c":"三年级下册 第2单元 除数是一位数的除法"},{"i":"cnm_p284","n":"小数的大小比较","s":"数学","g":3,"m":0,"c":"三年级下册 第6单元 小数的初步认识"},{"i":"cnm_p199","n":"扇形统计图","s":"数学","g":6,"m":0,"c":"六年级下册 第6单元 整理和复习"},{"i":"cnm_001","n":"正数与负数的概念","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.1","d":"数与代数","x":"在小学认识负数的基础上，明确正数、负数、0 的含义，知道 0 既不是正数也不是负数。","k":"能判断一个数是正数、负数还是0；能说出 0 的特殊地位","sem":"上"},{"i":"cnm_002","n":"用正负数表示相反意义的量","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.1","d":"数与代数","x":"用正数和负数表示具有相反意义的量，如盈亏、增减、海拔高低。","k":"能把实际情境中的相反量用正负数表示；能解释正负数在情境中的含义","sem":"上"},{"i":"cnm_003","n":"有理数的分类","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.1","d":"数与代数","x":"把整数和分数统称为有理数，会按“整数、分数”或“正数、0、负数”两种方式分类。","k":"能说出有理数的定义；能按两种标准对有理数分类","sem":"上"},{"i":"cnm_004","n":"数轴","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.2","d":"数与代数","x":"规定了原点、正方向和单位长度的直线叫数轴，数轴把数与直线上的点联系起来。","k":"能说出数轴的三要素；能判断一条直线是否是数轴","sem":"上"},{"i":"cnm_005","n":"在数轴上表示有理数","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.2","d":"数与代数","x":"会在数轴上画出表示给定有理数的点，并读出数轴上点所表示的数。","k":"能在数轴上标出整数、小数、分数；能读出数轴上点对应的数","sem":"上"},{"i":"cnm_006","n":"相反数","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.3","d":"数与代数","x":"只有符号不同的两个数互为相反数，在数轴上位于原点两侧且到原点距离相等，0 的相反数是 0。","k":"能求一个数的相反数；理解 -(-a)=a 的含义","sem":"上"},{"i":"cnm_007","n":"绝对值的概念与几何意义","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.4","d":"数与代数","x":"数轴上表示数 a 的点到原点的距离叫 a 的绝对值，记作 |a|，其值非负。","k":"能说出绝对值的几何意义；知道互为相反数的两数绝对值相等","sem":"上"},{"i":"cnm_008","n":"绝对值的化简与计算","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.4","d":"数与代数","x":"按“正数取本身、负数取相反数、0 取 0”的法则求绝对值并作简单化简。","k":"能熟练求有理数的绝对值；能由 |x|=a 求 x","sem":"上"},{"i":"cnm_009","n":"有理数的大小比较","s":"数学","g":7,"m":1,"c":"七上 第一章 有理数 1.2.5","d":"数与代数","x":"利用数轴（右边的数大）和绝对值（负数绝对值大的反而小）比较有理数大小。","k":"会用数轴比较大小；会比较两个负数的大小","sem":"上"},{"i":"cnm_010","n":"有理数的加法法则","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.1.1","d":"数与代数","x":"掌握同号两数相加、异号两数相加以及与 0 相加的法则，先定符号再算绝对值。","k":"能说出加法法则；能正确计算两个有理数的和","sem":"上"},{"i":"cnm_011","n":"加法运算律与简便运算","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.1.1","d":"数与代数","x":"把小学的交换律、结合律推广到有理数，用于凑整、同号结合等简算。","k":"会用交换律结合律重新组合；能简化多个有理数的加法","sem":"上"},{"i":"cnm_012","n":"有理数的减法法则","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.1.2","d":"数与代数","x":"减去一个数等于加上这个数的相反数，把减法转化为加法。","k":"能把减法改写成加法；能正确计算有理数的减法","sem":"上"},{"i":"cnm_013","n":"有理数的加减混合运算","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.1.2","d":"数与代数","x":"把加减混合式统一成“代数和”形式，省略加号和括号后按顺序或用运算律计算。","k":"会把加减混合式改写为省略括号形式；能灵活运用运算律简化","sem":"上"},{"i":"cnm_014","n":"有理数的乘法法则","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.2.1","d":"数与代数","x":"同号得正、异号得负，并把绝对值相乘；任何数与 0 相乘都得 0。","k":"能说出符号法则；能正确计算两个有理数的积","sem":"上"},{"i":"cnm_015","n":"乘法运算律与多个因数相乘","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.2.1","d":"数与代数","x":"把交换律、结合律、分配律推广到有理数；多个非零因数相乘时由负因数个数定符号。","k":"能用分配律简算；能判断多个因数之积的符号","sem":"上"},{"i":"cnm_016","n":"倒数","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.2.2","d":"数与代数","x":"乘积为 1 的两个数互为倒数，0 没有倒数。","k":"能求有理数的倒数；知道 0 没有倒数的原因","sem":"上"},{"i":"cnm_017","n":"有理数的除法","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.2.2","d":"数与代数","x":"除以一个不为 0 的数等于乘这个数的倒数，并掌握除法的符号法则。","k":"能把除法转化为乘法；能正确计算有理数除法","sem":"上"},{"i":"cnm_018","n":"有理数的加减乘除混合运算","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.2.2","d":"数与代数","x":"按先乘除后加减、有括号先算括号的顺序进行四则混合运算。","k":"能确定运算顺序；结果正确且步骤规范","sem":"上"},{"i":"cnm_019","n":"乘方的概念","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.3.1","d":"数与代数","x":"求 n 个相同因数 a 的积的运算叫乘方，认识底数、指数、幂，注意 (-2)² 与 -2² 的区别。","k":"能指出幂的底数与指数；能区分 (-2)^2 与 -2^2","sem":"上"},{"i":"cnm_020","n":"乘方的运算与符号规律","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.3.1","d":"数与代数","x":"负数的奇次幂为负、偶次幂为正；0 的正整数次幂为 0；会计算有理数的乘方。","k":"能用符号规律判断幂的正负；能正确计算简单幂","sem":"上"},{"i":"cnm_021","n":"含乘方的有理数混合运算","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.3.1","d":"数与代数","x":"按先乘方、再乘除、后加减的顺序进行有理数的混合运算。","k":"能说出运算顺序；能正确计算含乘方和括号的式子","sem":"上"},{"i":"cnm_022","n":"科学记数法","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.3.2","d":"数与代数","x":"把一个大数写成 a×10ⁿ（1≤|a|<10，n 为正整数）的形式。","k":"能把大数写成科学记数法；能由科学记数法还原原数","sem":"上"},{"i":"cnm_023","n":"近似数与有效数字","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 2.3.3","d":"数与代数","x":"理解近似数、精确度，会按要求四舍五入取近似数并说出有效数字。","k":"会按精确度取近似数；能说出近似数的有效数字个数","sem":"上"},{"i":"cnm_024","n":"进位制的认识与探究","s":"数学","g":7,"m":1,"c":"七上 第二章 有理数的运算 综合与实践","d":"综合与实践","x":"认识二进制等进位制，探究不同进位制间的转换及其应用。","k":"能把二进制数化为十进制；能说明“逢二进一”的计数规则","sem":"上"},{"i":"cnm_025","n":"用字母表示数","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.1","d":"数与代数","x":"用字母表示数、运算律和公式，体会从具体到一般的抽象过程。","k":"能用字母表示数量和运算律；理解字母可取不同值","sem":"上"},{"i":"cnm_026","n":"代数式的概念与书写规范","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.1","d":"数与代数","x":"用运算符号把数或字母连接而成的式子叫代数式，掌握省略乘号、分数线书写等规范。","k":"能判断一个式子是否是代数式；能规范书写代数式","sem":"上"},{"i":"cnm_027","n":"列代数式","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.1","d":"数与代数","x":"把文字叙述的数量关系用代数式表示，如和、差、倍、比多比少。","k":"能列出简单数量关系的代数式；能处理多步关系","sem":"上"},{"i":"cnm_028","n":"解释代数式的实际意义","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.1","d":"数与代数","x":"结合具体情境说明代数式表示的数量含义。","k":"能为给定代数式编出一个情境；能说明各部分的含义","sem":"上"},{"i":"cnm_030","n":"用代数式表示规律","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.1/3.2","d":"数与代数","x":"观察数列或图形序列，归纳第 n 项的代数式。","k":"能写出简单规律的通项；能用代数式预测第 n 项的值","sem":"上"},{"i":"cnm_029","n":"代数式的值","s":"数学","g":7,"m":1,"c":"七上 第三章 代数式 3.2","d":"数与代数","x":"把字母的取值代入代数式并按运算顺序计算，注意负数代入要加括号。","k":"能正确代入求值；能处理负数和分数的代入","sem":"上"},{"i":"cnm_031","n":"单项式","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.1","d":"数与代数","x":"由数与字母的积组成的代数式叫单项式，认识系数与次数。","k":"能判断是否为单项式；能指出系数和次数","sem":"上"},{"i":"cnm_032","n":"多项式与整式","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.1","d":"数与代数","x":"几个单项式的和叫多项式，认识项、常数项、次数；单项式与多项式统称整式。","k":"能指出多项式的项数和次数；能区分整式与非整式","sem":"上"},{"i":"cnm_033","n":"同类项","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"所含字母相同且相同字母的指数也相同的项叫同类项。","k":"能判断同类项；知道常数项也是同类项","sem":"上"},{"i":"cnm_034","n":"合并同类项","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"同类项的系数相加，字母和字母的指数不变。","k":"能正确合并同类项；理解合并的依据是分配律","sem":"上"},{"i":"cnm_035","n":"去括号法则","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"括号前是 + 号去括号不变号，是 - 号去括号各项变号，并可用分配律去带系数的括号。","k":"能说出去括号法则；能正确去括号","sem":"上"},{"i":"cnm_036","n":"整式的加减","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"去括号并合并同类项，完成整式的加减运算。","k":"能完成整式的加减；结果书写规范","sem":"上"},{"i":"cnm_037","n":"整式化简求值","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"先化简整式再代入字母的值求值。","k":"能先化简后代入；能处理含负数的代入","sem":"上"},{"i":"cnm_038","n":"整式加减的应用","s":"数学","g":7,"m":1,"c":"七上 第四章 整式的加减 4.2","d":"数与代数","x":"用整式表示几何图形的周长、面积或实际问题中的和差关系，并化简说明。","k":"能用整式表示图形的周长；能解释化简结果的意义","sem":"上"},{"i":"cnm_039","n":"方程与方程的解","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.1.1","d":"数与代数","x":"含未知数的等式叫方程，使方程左右两边相等的未知数的值叫方程的解。","k":"能判断是否是方程；能检验一个数是否是方程的解","sem":"上"},{"i":"cnm_040","n":"等式的性质","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.1.2","d":"数与代数","x":"等式两边同加（减）同一个数或式，或同乘（除以）同一个不为 0 的数，等式仍成立。","k":"能说出等式的性质；能用性质变形方程","sem":"上"},{"i":"cnm_041","n":"一元一次方程的概念","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.1.2","d":"数与代数","x":"只含一个未知数、未知数的次数为 1 且等号两边都是整式的方程叫一元一次方程。","k":"能判断一元一次方程；能说出标准形式 ax+b=0","sem":"上"},{"i":"cnm_042","n":"移项与合并同类项解方程","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.2","d":"数与代数","x":"把含未知数的项移到一边、常数项移到另一边（移项要变号），再合并同类项、系数化为 1。","k":"能说出移项的依据；能解 ax+b=cx+d 型方程","sem":"上"},{"i":"cnm_043","n":"含括号的一元一次方程","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.2","d":"数与代数","x":"先去括号再移项合并，注意括号前系数和符号。","k":"能正确去括号；能解含括号的方程","sem":"上"},{"i":"cnm_044","n":"含分母的一元一次方程","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.2","d":"数与代数","x":"方程两边同乘各分母的最小公倍数去分母，注意不漏乘不含分母的项。","k":"能找最小公倍数去分母；避免漏乘","sem":"上"},{"i":"cnm_045","n":"列一元一次方程解应用题的步骤","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.3","d":"数与代数","x":"经过设未知数、找等量关系、列方程、求解、检验作答的建模过程解决实际问题。","k":"能找出题目中的等量关系；能规范完成设、列、解、验、答","sem":"上"},{"i":"cnm_046","n":"配套与工程问题","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.3","d":"数与代数","x":"通过“总量相等”“工作总量为 1”等关系列方程解决配套和工程问题。","k":"能找出配套比例的等量关系；会用 1 表示工作总量","sem":"上"},{"i":"cnm_047","n":"行程问题（相遇与追及）","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.3","d":"数与代数","x":"用路程=速度×时间，分析相遇、追及等行程问题中的等量关系。","k":"会画线段图分析行程；能区分相遇与追及的等量关系","sem":"上"},{"i":"cnm_048","n":"销售与利润问题","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.3","d":"数与代数","x":"结合标价、折扣、进价、利润率，用方程解决销售问题。","k":"能区分售价、进价和利润；能用方程求解折扣或进价","sem":"上"},{"i":"cnm_049","n":"分段计费与方案选择","s":"数学","g":7,"m":1,"c":"七上 第五章 一元一次方程 5.3","d":"数与代数","x":"用方程比较不同付费方案，寻找使方案费用相等的临界点。","k":"能列出各方案费用的代数式；会通过方程找临界点","sem":"上"},{"i":"cnm_050","n":"立体图形与平面图形","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.1.1","d":"图形与几何","x":"认识棱柱、圆柱、圆锥、球等立体图形和其由平面图形构成的特征，并辨别常见的平面图形。","k":"能说出常见立体图形的名称；能区分立体图形与平面图形","sem":"上"},{"i":"cnm_051","n":"从不同方向看与立体图形的展开图","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.1.1","d":"图形与几何","x":"会从正面、左面、上面观察简单立体图形，认识正方体等的展开图。","k":"能画出简单几何体的三视图草图；能判断正方体展开图","sem":"上"},{"i":"cnm_052","n":"点、线、面、体","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.1.2","d":"图形与几何","x":"理解点动成线、线动成面、面动成体，认识几何图形的组成。","k":"能说出点线面体的关系；能举出实例","sem":"上"},{"i":"cnm_053","n":"直线、射线、线段","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.2.1","d":"图形与几何","x":"认识直线、射线、线段的特征、表示方法及相互区别。","k":"能区分三者并正确表示；能画出对应图形","sem":"上"},{"i":"cnm_054","n":"直线与线段的基本事实","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.2.1","d":"图形与几何","x":"两点确定一条直线；两点之间线段最短；两点间线段的长度叫两点间的距离。","k":"能叙述两条基本事实；能用其解释生活现象","sem":"上"},{"i":"cnm_055","n":"线段的比较与运算","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.2.2","d":"图形与几何","x":"用度量或叠合比较线段长短，掌握线段的和差与中点概念。","k":"能比较线段大小；能用中点性质计算线段长度","sem":"上"},{"i":"cnm_056","n":"角的概念与表示","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.3.1","d":"图形与几何","x":"角是由有公共端点的两条射线组成的图形，也可看作射线绕端点旋转形成，会用三种方式表示角。","k":"能用多种方式表示角；会辨认平角和周角","sem":"上"},{"i":"cnm_057","n":"度、分、秒及其换算","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.3.1","d":"图形与几何","x":"1°=60′，1′=60″，会进行度分秒的互化及简单加减。","k":"能完成度分秒换算；能做角度加减运算","sem":"上"},{"i":"cnm_058","n":"角的比较与运算（含角平分线）","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.3.2","d":"图形与几何","x":"比较角的大小，进行角的和差运算，认识角的平分线。","k":"能进行角的和差与倍分运算；会用角平分线性质计算","sem":"上"},{"i":"cnm_059","n":"余角和补角","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.3.3","d":"图形与几何","x":"两角之和为 90° 称互为余角，和为 180° 称互为补角。","k":"能求一个角的余角和补角；能区分互余与互补","sem":"上"},{"i":"cnm_060","n":"同角（等角）的余角、补角相等","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 6.3.3","d":"图形与几何","x":"理解并用“同角或等角的余角（补角）相等”进行简单说理。","k":"能用该性质推理；能写出简单的说理过程","sem":"上"},{"i":"cnm_061","n":"综合与实践：设计学校田径运动会比赛场地","s":"数学","g":7,"m":1,"c":"七上 第六章 几何图形初步 综合与实践","d":"综合与实践","x":"综合运用图形、线段与测量知识，为学校田径运动会设计场地方案。","k":"能画出场地设计草图并标注尺寸；能说明方案的合理性","sem":"上"},{"i":"cnm_062","n":"邻补角","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.1.1","d":"图形与几何","x":"两条直线相交所成的角中，有一条公共边且另一边互为反向延长线的两个角叫邻补角，它们互补。","k":"能在图中找出邻补角；知道邻补角之和为 180°","sem":"下"},{"i":"cnm_063","n":"对顶角及其性质","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.1.1","d":"图形与几何","x":"一个角的两边分别是另一个角两边的反向延长线，这样的两个角是对顶角，对顶角相等。","k":"能识别对顶角；能用“同角的补角相等”说明对顶角相等","sem":"下"},{"i":"cnm_064","n":"垂线","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.1.2","d":"图形与几何","x":"两条直线相交成直角叫互相垂直，其中一条叫另一条的垂线，掌握过一点作已知直线垂线的方法及其唯一性。","k":"能说明垂直的定义和符号；能用三角尺过一点作垂线","sem":"下"},{"i":"cnm_065","n":"垂线段最短与点到直线的距离","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.1.2","d":"图形与几何","x":"直线外一点与直线上各点的连线中垂线段最短，垂线段的长度叫点到直线的距离。","k":"能说出垂线段最短的依据；能指出并度量点到直线的距离","sem":"下"},{"i":"cnm_066","n":"同位角、内错角、同旁内角","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.1.3","d":"图形与几何","x":"两条直线被第三条直线所截形成八个角，能辨认同位角、内错角、同旁内角。","k":"能在“三线八角”图中辨认三类角；能说出各自的位置特征","sem":"下"},{"i":"cnm_067","n":"平行线与平行公理","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.2.1","d":"图形与几何","x":"在同一平面内不相交的两条直线叫平行线；过直线外一点有且只有一条直线与已知直线平行；平行于同一直线的两直线平行。","k":"能说出平行公理及其推论；会用符号表示平行","sem":"下"},{"i":"cnm_068","n":"平行线的判定","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.2.2","d":"图形与几何","x":"同位角相等，或内错角相等，或同旁内角互补，两直线平行。","k":"能说出三种判定方法；能选择合适的判定证明平行","sem":"下"},{"i":"cnm_069","n":"平行线的性质","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.2.3","d":"图形与几何","x":"两直线平行，同位角相等、内错角相等、同旁内角互补。","k":"能说出三条性质；能用性质求角的度数","sem":"下"},{"i":"cnm_070","n":"平行线判定与性质的综合应用","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.2.3","d":"图形与几何","x":"综合运用判定与性质完成说理，处理含拐点的折线（如“猪蹄”“铅笔”模型）中的角度问题。","k":"能区分何时用判定、何时用性质；能添加平行线辅助线","sem":"下"},{"i":"cnm_071","n":"定义、命题与定理","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.3","d":"图形与几何","x":"认识定义、命题（条件与结论）、真命题与假命题、公理、定理和证明。","k":"能把命题改写成“如果…那么…”；能判断命题真假并举反例","sem":"下"},{"i":"cnm_072","n":"平移的概念与性质","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.4","d":"图形与几何","x":"把图形沿某一方向移动一定距离，图形的形状和大小不变，对应点连线平行（或在同一直线上）且相等。","k":"能说明平移的两要素；能指出对应点、对应线段的关系","sem":"下"},{"i":"cnm_073","n":"平移作图","s":"数学","g":7,"m":1,"c":"七下 第七章 相交线与平行线 7.4","d":"图形与几何","x":"根据平移方向与距离，画出已知图形平移后的图形。","k":"能作出简单图形的平移像；能找出平移方向和距离","sem":"下"},{"i":"cnm_074","n":"平方根与算术平方根","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.1","d":"数与代数","x":"如果 x²=a（a≥0）则 x 叫 a 的平方根，正的平方根叫算术平方根，正数有两个互为相反数的平方根，0 的平方根为 0，负数没有平方根。","k":"能区分平方根与算术平方根；会用符号 √a 和 ±√a","sem":"下"},{"i":"cnm_075","n":"开平方与平方根的求法","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.1","d":"数与代数","x":"会用平方运算求完全平方数的平方根，了解 √(a²)=|a|，并能用计算器求近似值。","k":"能求常见完全平方数的平方根；会化简 √(a²)","sem":"下"},{"i":"cnm_076","n":"立方根","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.2","d":"数与代数","x":"如果 x³=a，则 x 叫 a 的立方根，任何数都有唯一立方根，会求常见数的立方根。","k":"能求立方根；能说出立方根与平方根的区别","sem":"下"},{"i":"cnm_077","n":"无理数","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.3","d":"数与代数","x":"无限不循环小数叫无理数，如 √2、π；有限小数和无限循环小数都是有理数。","k":"能判断一个数是否是无理数；能举出无理数例子","sem":"下"},{"i":"cnm_078","n":"实数的分类与数轴表示","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.3","d":"数与代数","x":"有理数与无理数统称实数，实数与数轴上的点一一对应，实数的相反数、绝对值意义同有理数。","k":"能对实数分类；知道实数与数轴上的点一一对应","sem":"下"},{"i":"cnm_079","n":"算术平方根的估值与大小比较","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.3","d":"数与代数","x":"利用平方夹逼估计 √a 的大致范围，并比较含根号的实数大小。","k":"能估计 √a 在哪两个整数之间；能比较 √5 与 2.2 的大小","sem":"下"},{"i":"cnm_080","n":"实数的运算","s":"数学","g":7,"m":1,"c":"七下 第八章 实数 8.3","d":"数与代数","x":"有理数的运算法则和运算律在实数范围内仍适用，会进行含根号的简单运算。","k":"能进行含根号的混合运算；会按要求取近似值","sem":"下"},{"i":"cnm_081","n":"有序数对","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.1.1","d":"图形与几何","x":"用有顺序的两个数表示位置，如（列，行），顺序不同表示的位置不同。","k":"能用有序数对表示位置；能说明为什么要有顺序","sem":"下"},{"i":"cnm_082","n":"平面直角坐标系与点的坐标","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.1.1","d":"图形与几何","x":"两条互相垂直、原点重合的数轴构成平面直角坐标系，会根据坐标描点并读出点的坐标。","k":"能画出坐标系并描点；能写出点的坐标","sem":"下"},{"i":"cnm_083","n":"象限与坐标轴上点的坐标特征","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.1.1","d":"图形与几何","x":"会判断点所在象限，坐标轴上点的特征：x 轴上点纵坐标为 0，y 轴上点横坐标为 0。","k":"能判断各象限点的符号特征；能处理坐标轴上的点","sem":"下"},{"i":"cnm_084","n":"用坐标描述简单几何图形","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.1.2","d":"图形与几何","x":"建立坐标系，用坐标表示点、线段和多边形，并求线段长及图形面积。","k":"能求平行于坐标轴的线段长；能用坐标求简单图形面积","sem":"下"},{"i":"cnm_085","n":"用坐标表示地理位置","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.2.1","d":"图形与几何","x":"选择适当的原点和单位长度建立坐标系，用坐标表示平面图上的地理位置。","k":"能合理建立坐标系；能用坐标描述景点位置","sem":"下"},{"i":"cnm_086","n":"用坐标表示平移","s":"数学","g":7,"m":1,"c":"七下 第九章 平面直角坐标系 9.2.2","d":"图形与几何","x":"点向右（左）平移 a 个单位横坐标加（减）a，向上（下）平移 b 个单位纵坐标加（减）b；图形平移即各顶点同样平移。","k":"能写出点平移后的坐标；能由对应点坐标变化反推平移","sem":"下"},{"i":"cnm_087","n":"二元一次方程及其解","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.1","d":"数与代数","x":"含有两个未知数且未知数的次数都是 1 的整式方程叫二元一次方程，它有无数组解。","k":"能判断二元一次方程；能验证一对数是否是方程的解","sem":"下"},{"i":"cnm_088","n":"二元一次方程组及其解","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.1","d":"数与代数","x":"共含两个未知数的两个一次方程合在一起，叫二元一次方程组，两个方程的公共解叫方程组的解。","k":"能判断是否是方程组；能检验方程组的解","sem":"下"},{"i":"cnm_089","n":"代入消元法","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.2.1","d":"数与代数","x":"把一个方程变形用一个未知数表示另一个，代入另一个方程消元，转化为一元一次方程。","k":"能选择便于代入的方程；能正确求出方程组的解","sem":"下"},{"i":"cnm_090","n":"加减消元法","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.2.2","d":"数与代数","x":"当某未知数的系数相等或相反时，把两个方程相加或相减消去该未知数。","k":"能判断相加还是相减；必要时先乘数使系数相同","sem":"下"},{"i":"cnm_091","n":"列二元一次方程组解应用题","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.3","d":"数与代数","x":"根据两个等量关系设两个未知数、列方程组、求解并检验作答。","k":"能找到两个独立的等量关系；能规范列方程组并检验","sem":"下"},{"i":"cnm_092","n":"方程组应用的常见类型","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.3","d":"数与代数","x":"处理和差倍分、行程、浓度配比、分配与方案等需要两个未知数的实际问题。","k":"能判断类型并找等量关系；能解释解的实际意义并检验合理性","sem":"下"},{"i":"cnm_093","n":"三元一次方程组","s":"数学","g":7,"m":1,"c":"七下 第十章 二元一次方程组 10.4","d":"数与代数","x":"通过消元把三元一次方程组转化为二元、再转化为一元一次方程求解。","k":"能选择消元顺序；能正确求解简单三元方程组","sem":"下"},{"i":"cnm_094","n":"不等式及其解集","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.1.1","d":"数与代数","x":"用不等号表示大小关系的式子叫不等式，使不等式成立的未知数的值叫解，所有解的集合叫解集。","k":"能用不等式表示不等关系；能区分解与解集","sem":"下"},{"i":"cnm_095","n":"在数轴上表示不等式的解集","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.1.1","d":"数与代数","x":"用数轴上的空心圈（不含端点）和实心点（含端点）表示不等式的解集。","k":"能把解集画在数轴上；能从数轴写出解集","sem":"下"},{"i":"cnm_096","n":"不等式的性质","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.1.2","d":"数与代数","x":"不等式两边同加（减）同一个数，不等号方向不变；同乘（除以）正数方向不变，同乘（除以）负数方向改变。","k":"能说出三条性质；能用性质变形不等式","sem":"下"},{"i":"cnm_097","n":"一元一次不等式的解法","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.2","d":"数与代数","x":"类比一元一次方程的解法：去分母、去括号、移项、合并、系数化为 1，注意乘除负数时改变不等号方向。","k":"能解一元一次不等式并在数轴上表示解集；不遗漏变号","sem":"下"},{"i":"cnm_098","n":"一元一次不等式的应用","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.2","d":"数与代数","x":"把“不超过、至少、不低于”等表述转化为不等式并求整数解或最优方案。","k":"能把文字转化为不等式；能结合实际取合适的整数解","sem":"下"},{"i":"cnm_099","n":"一元一次不等式组的解法","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.3","d":"数与代数","x":"分别解各不等式，再用数轴取公共部分得到不等式组的解集（同大取大、同小取小、大小小大中间找、大大小小无解）。","k":"能解不等式组并用数轴表示；能判断无解情形","sem":"下"},{"i":"cnm_100","n":"不等式组的应用","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 11.3","d":"数与代数","x":"用不等式组描述含有多个限制条件的实际问题，如分配方案、参数取值范围。","k":"能列出不等式组；能结合整数条件确定方案","sem":"下"},{"i":"cnm_101","n":"综合与实践：低碳生活","s":"数学","g":7,"m":1,"c":"七下 第十一章 不等式与不等式组 综合与实践","d":"综合与实践","x":"收集生活数据，用方程、不等式比较不同出行或用能方案的碳排放。","k":"能收集并整理数据；能用不等式比较方案并给出建议","sem":"下"},{"i":"cnm_300","n":"统计活动的基本过程","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1","d":"统计与概率","x":"一次完整的统计活动包括提出问题、收集数据、整理数据、描述数据、分析数据、得出结论并作出决策。","k":"能按顺序说出统计活动的各个步骤；能在具体活动中说明每一步要做什么","sem":"下"},{"i":"cnm_102","n":"全面调查与抽样调查","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.1","d":"统计与概率","x":"全面调查对全体对象调查，抽样调查只调查一部分，知道各自适用的情形。","k":"能区分两种调查；能为给定问题选择调查方式","sem":"下"},{"i":"cnm_292","n":"数据收集的方法：问卷调查、实验与查阅资料","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.1","d":"统计与概率","x":"了解问卷调查、访谈、实验观测、查阅文献或网络资料等常见的数据收集方法及各自适用的情形。","k":"能说出常见的数据收集方法及适用情形；能为给定的统计问题选择合适的收集方法并指出可能产生的偏差","sem":"下"},{"i":"cnm_103","n":"总体、个体、样本与样本容量","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"统计与概率","x":"辨认调查中的总体、个体、样本和样本容量。","k":"能指出具体问题中的总体与样本；能说出样本容量","sem":"下"},{"i":"cnm_104","n":"样本的代表性与随机抽样","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"统计与概率","x":"认识抽样要具有代表性和随机性，能判断抽样方式是否合理。","k":"能指出有偏差的抽样方式；能设计简单的随机抽样","sem":"下"},{"i":"cnm_298","n":"简单随机抽样的实施（抽签法与随机数）","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"统计与概率","x":"按随机原则抽取样本，用抽签法或随机数（随机数表、计算器产生的随机数）使每个个体被抽到的机会相等。","k":"能按步骤用抽签法或随机数从总体中抽取样本；能说明这样做为什么使每个个体机会均等","sem":"下"},{"i":"cnm_299","n":"用样本百分比估计总体数量","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.1.2","d":"统计与概率","x":"用样本中某类个体所占的百分比估计总体中该类个体的数量，如估计全校喜欢阅读的人数或池塘中鱼的条数。","k":"能根据样本百分比估计总体中某类个体的数量；能说明估计结果受样本容量与代表性的影响","sem":"下"},{"i":"cnm_105","n":"扇形图、条形图与折线图","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"统计与概率","x":"按目的选择扇形图（占比）、条形图（数量）、折线图（变化趋势），并从图中读取信息。","k":"能根据目的选择统计图；能读出图中的数据并简单分析","sem":"下"},{"i":"cnm_293","n":"数据的分类整理与划记法、统计表","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"统计与概率","x":"按一定标准对原始数据分类，用划记法计数，并把结果填入含合计的统计表。","k":"能按给定标准对数据分类并用划记法正确计数；能把结果整理成统计表并用合计检验总数","sem":"下"},{"i":"cnm_294","n":"条形图与折线图的绘制","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"统计与概率","x":"根据数据范围选取合适的纵轴刻度，画出并标注条形图（比较各类数量）和折线图（反映随时间的变化）。","k":"能选取合适刻度并标明坐标轴名称与单位；能正确画出条形图和折线图并读出最大值与变化趋势","sem":"下"},{"i":"cnm_295","n":"扇形图的绘制：百分比与圆心角的换算","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"统计与概率","x":"把各类数据占总数的百分比换算成圆心角（百分比×360°），用量角器画出扇形图。","k":"能由数据求出各部分的百分比及对应圆心角；能用量角器作出扇形图并验证圆心角之和为 360°","sem":"下"},{"i":"cnm_296","n":"统计图的误导与偏差辨识","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.1","d":"统计与概率","x":"识别截断纵轴、刻度间隔不均、只选取部分数据等使统计图产生误导的做法，并能说明如何改正。","k":"能指出一幅统计图中夸大或掩盖差异的做法；能说出改进统计图的方法","sem":"下"},{"i":"cnm_106","n":"频数分布表与数据分组","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"统计与概率","x":"对数据进行分组，统计各组频数，画频数分布表。","k":"能确定组距和组数；能完成频数分布表","sem":"下"},{"i":"cnm_107","n":"频数分布直方图","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"统计与概率","x":"用直方图直观表示数据分布，从图中读取各组频数并分析。","k":"能画直方图；能由直方图读取频数","sem":"下"},{"i":"cnm_297","n":"频率（相对频数）的计算与意义","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"统计与概率","x":"频率等于频数除以数据总数，各组频率之和为 1；用频率反映各组数据占总体的比例。","k":"能由频数和总数求出频率并化为百分数；能验证各组频率之和为 1","sem":"下"},{"i":"cnm_301","n":"频数分布直方图的读图与分析","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.2","d":"统计与概率","x":"从直方图读出各组频数，求某个范围内的人数或所占比例，并判断数据分布的特点。","k":"能从直方图读出各组频数并求某范围的人数及占比；能说出数据分布较集中的区间","sem":"下"},{"i":"cnm_108","n":"趋势图","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 12.2.3","d":"统计与概率","x":"通过趋势图观察数据随时间变化的规律，并作简单预测。","k":"能描述变化趋势；能作出简单预测","sem":"下"},{"i":"cnm_109","n":"综合与实践：日昼时长规律的探究","s":"数学","g":7,"m":1,"c":"七下 第十二章 数据的收集、整理与描述 综合与实践","d":"综合与实践","x":"收集不同日期、地点的昼长数据，用统计图探究其变化规律。","k":"能收集并整理数据；能用图表描述规律并给出解释","sem":"下"},{"i":"cnm_110","n":"三角形的概念与分类","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.1","d":"图形与几何","x":"认识三角形的边、角、顶点，按边（不等边、等腰、等边）和按角（锐角、直角、钝角）对三角形分类。","k":"能说出三角形的基本元素；能按边或按角对三角形分类","sem":"上"},{"i":"cnm_111","n":"三角形三边关系","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.2","d":"图形与几何","x":"三角形任意两边之和大于第三边，任意两边之差小于第三边（依据两点之间线段最短）。","k":"能判断三条线段能否构成三角形；能求第三边的取值范围","sem":"上"},{"i":"cnm_112","n":"三角形的高","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.2","d":"图形与几何","x":"从三角形的一个顶点向对边（或其延长线）作垂线，顶点与垂足间的线段叫高，三角形有三条高。","k":"能画出锐角、直角、钝角三角形的高；知道三条高所在直线交于一点","sem":"上"},{"i":"cnm_113","n":"三角形的中线","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.2","d":"图形与几何","x":"连接顶点与对边中点的线段叫中线，三条中线交于重心，一条中线把三角形分成面积相等的两部分。","k":"能画出三角形的中线；知道中线平分三角形面积","sem":"上"},{"i":"cnm_114","n":"三角形的角平分线","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.2","d":"图形与几何","x":"三角形一个内角的平分线与对边相交，顶点与交点间的线段叫三角形的角平分线。","k":"能画出三角形的角平分线；知道三条角平分线交于一点","sem":"上"},{"i":"cnm_115","n":"三角形内角和定理","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.3","d":"图形与几何","x":"三角形三个内角的和等于 180°，可通过过一顶点作平行线说明。","k":"能说明内角和定理的证明思路；能求三角形中的未知角","sem":"上"},{"i":"cnm_116","n":"直角三角形的两个锐角互余","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.3","d":"图形与几何","x":"直角三角形的两个锐角互余；有两个角互余的三角形是直角三角形。","k":"能由一个锐角求另一个锐角；能判断有两角互余的三角形形状","sem":"上"},{"i":"cnm_117","n":"三角形的外角及其性质","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.3","d":"图形与几何","x":"三角形的外角等于与它不相邻的两个内角之和，并大于任何一个与它不相邻的内角。","k":"能识别三角形的外角；能用外角性质求角","sem":"上"},{"i":"cnm_118","n":"几何证明的基本格式","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 13.3","d":"图形与几何","x":"认识“已知、求证、证明”的格式，体会每一步都要有依据，理解为什么要证明。","k":"能写出规范的已知和求证；每一步都能写出依据","sem":"上"},{"i":"cnm_119","n":"综合与实践：确定匀质薄板的重心位置","s":"数学","g":8,"m":1,"c":"八上 第十三章 三角形 综合与实践","d":"综合与实践","x":"通过悬挂实验和作中线，探究三角形等匀质薄板的重心位置。","k":"能用悬挂法找重心；能说明三角形重心是三条中线的交点","sem":"上"},{"i":"cnm_120","n":"全等图形与全等三角形","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.1","d":"图形与几何","x":"能够完全重合的两个图形叫全等图形，认识全等三角形的对应顶点、对应边、对应角及“≌”的记法。","k":"能找出对应元素；能规范书写全等式","sem":"上"},{"i":"cnm_121","n":"全等三角形的性质","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.1","d":"图形与几何","x":"全等三角形的对应边相等、对应角相等。","k":"能用性质写出相等的边和角；能求全等三角形中的未知量","sem":"上"},{"i":"cnm_122","n":"全等判定：边边边（SSS）","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2","d":"图形与几何","x":"三边分别相等的两个三角形全等。","k":"能叙述 SSS；能用 SSS 证明全等","sem":"上"},{"i":"cnm_123","n":"全等判定：边角边（SAS）","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2","d":"图形与几何","x":"两边及其夹角分别相等的两个三角形全等。","k":"能辨别“夹角”；能用 SAS 证明全等","sem":"上"},{"i":"cnm_124","n":"全等判定：角边角（ASA）与角角边（AAS）","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2","d":"图形与几何","x":"两角及其夹边分别相等，或两角及其中一角的对边分别相等的两个三角形全等。","k":"能叙述 ASA 与 AAS；能由 ASA 与内角和推出 AAS","sem":"上"},{"i":"cnm_125","n":"全等判定：斜边、直角边（HL）","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2","d":"图形与几何","x":"斜边和一条直角边分别相等的两个直角三角形全等。","k":"能叙述 HL；能判断何时只能用 HL","sem":"上"},{"i":"cnm_126","n":"综合运用全等判定与规范书写","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2","d":"图形与几何","x":"根据已知条件选择合适的判定方法，补全条件并规范书写证明。","k":"能选择判定方法；能写出完整证明","sem":"上"},{"i":"cnm_127","n":"基本尺规作图：作等角与角平分线","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.2/14.3","d":"图形与几何","x":"用圆规和无刻度直尺作一个角等于已知角以及作已知角的平分线，作图依据是 SSS。","k":"能说出作图依据；能完成作图并保留痕迹","sem":"上"},{"i":"cnm_128","n":"角平分线的性质","s":"数学","g":8,"m":1,"c":"八上 第十四章 全等三角形 14.3","d":"图形与几何","x":"角平分线上的点到角两边的距离相等。","k":"能叙述性质并证明；能用性质求线段长","sem":"上"},{"i":"cnm_129","n":"角平分线的判定","s":"数学","g":8,"m":1,"c":"八上 第十四章 m":1,"c":"八上 第十七章 因式分解 17.2","d":"数与代数","x":"a²±2ab+b²=(a±b)²，识别完全平方式。","k":"能判断是否是完全平方式；能正确分解","sem":"上"},{"i":"cnm_154","n":"综合运用因式分解","s":"数学","g":8,"m":1,"c":"八上 第十七章 因式分解 17.2","d":"数与代数","x":"一般先提公因式，再用公式，直至不能再分解。","k":"能确定步骤；分解彻底","sem":"上"},{"i":"cnm_156","n":"分式的概念","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.1","d":"数与代数","x":"形如 A/B（A、B 为整式且 B 含字母）的式子叫分式，分母不为 0 时分式有意义，分子为 0 且分母不为 0 时值为 0。","k":"能判断分式；会求分式有意义与值为 0 的条件","sem":"上"},{"i":"cnm_157","n":"分式的基本性质","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.1","d":"数与代数","x":"分式的分子分母同乘（除以）同一个不为 0 的整式，分式值不变。","k":"能叙述性质；能做符号变形","sem":"上"},{"i":"cnm_158","n":"分式的约分与最简分式","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.1","d":"数与代数","x":"把分子分母的公因式约去，化为最简分式，必要时先因式分解。","k":"能找出公因式并约分；结果为最简分式","sem":"上"},{"i":"cnm_159","n":"分式的通分","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.1","d":"数与代数","x":"把异分母分式化为同分母分式，需要确定最简公分母。","k":"能找最简公分母；能完成通分","sem":"上"},{"i":"cnm_160","n":"分式的乘除","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.2","d":"数与代数","x":"分式相乘分子乘分子、分母乘分母；除以分式等于乘它的倒数，乘除后要约分。","k":"能完成分式乘除；结果化为最简","sem":"上"},{"i":"cnm_161","n":"分式的加减","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.3","d":"数与代数","x":"同分母分式相加减分母不变，异分母先通分；结果化为最简。","k":"能完成同分母与异分母加减；符号处理正确","sem":"上"},{"i":"cnm_162","n":"分式的混合运算与化简求值","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.3","d":"数与代数","x":"按先乘方、再乘除、后加减、有括号先算括号的顺序进行混合运算，并化简求值。","k":"能确定运算顺序；结果为最简分式","sem":"上"},{"i":"cnm_163","n":"同底数幂的除法","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.4","d":"数与代数","x":"aᵐ÷aⁿ=aᵐ⁻ⁿ（a≠0，m>n），底数不变、指数相减。","k":"能叙述法则；能计算同底数幂的商","sem":"上"},{"i":"cnm_164","n":"零指数幂、负整数指数幂与科学记数法","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.4","d":"数与代数","x":"a⁰=1（a≠0），a⁻ⁿ=1/aⁿ，并用 a×10⁻ⁿ 表示绝对值较小的数。","k":"能计算含零指数与负整数指数的式子；能把小数写成科学记数法","sem":"上"},{"i":"cnm_165","n":"分式方程的解法与增根","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.5","d":"数与代数","x":"分母中含未知数的方程叫分式方程，去分母化为整式方程求解，必须检验是否为增根。","k":"能解分式方程；会检验并舍去增根","sem":"上"},{"i":"cnm_166","n":"分式方程的应用","s":"数学","g":8,"m":1,"c":"八上 第十八章 分式 18.5","d":"数与代数","x":"用分式方程解决工程、行程、销售等问题，求解后检验并写出答案。","k":"能列出分式方程；能检验解是否符合实际","sem":"上"},{"i":"cnm_167","n":"二次根式的概念与有意义的条件","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.1","d":"数与代数","x":"形如 √a（a≥0）的式子叫二次根式，被开方数必须非负。","k":"能判断二次根式；能求使二次根式有意义的字母范围","sem":"下"},{"i":"cnm_168","n":"二次根式的性质","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.1","d":"数与代数","x":"(√a)²=a（a≥0），√(a²)=|a|。","k":"能区分两条性质；能化简 √(a²)","sem":"下"},{"i":"cnm_169","n":"二次根式的乘法","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.2","d":"数与代数","x":"√a·√b=√(ab)（a≥0，b≥0），可逆用化简。","k":"能进行二次根式乘法；能逆用法则化简","sem":"下"},{"i":"cnm_170","n":"二次根式的除法","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.2","d":"数与代数","x":"√a÷√b=√(a/b)（a≥0，b>0）。","k":"能进行二次根式除法；注意分母不为 0","sem":"下"},{"i":"cnm_171","n":"最简二次根式与分母有理化","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.2","d":"数与代数","x":"被开方数不含能开尽方的因数或因式、也不含分母的二次根式是最简二次根式，会化简并有理化分母。","k":"能判断最简二次根式；能化简 1/√2 等","sem":"下"},{"i":"cnm_172","n":"二次根式的加减","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.3","d":"数与代数","x":"先化为最简二次根式，再合并被开方数相同的根式（类似合并同类项）。","k":"能识别同类二次根式；能正确合并","sem":"下"},{"i":"cnm_173","n":"二次根式的混合运算","s":"数学","g":8,"m":1,"c":"八下 第十九章 二次根式 19.3","d":"数与代数","x":"综合运用二次根式的四则运算与乘法公式。","k":"能确定运算顺序；能用公式简化运算","sem":"下"},{"i":"cnm_174","n":"勾股定理","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.1","d":"图形与几何","x":"直角三角形两直角边的平方和等于斜边的平方：a²+b²=c²。","k":"能叙述定理；能已知两边求第三边","sem":"下"},{"i":"cnm_175","n":"勾股定理的证明","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.1","d":"图形与几何","x":"通过拼图和面积关系（如赵爽弦图）证明勾股定理。","k":"能说明一种证明的思路；能用面积法写出等式","sem":"下"},{"i":"cnm_176","n":"勾股定理的应用","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.1","d":"图形与几何","x":"用勾股定理解决梯子、折叠、最短路径等实际问题。","k":"能画图并构造直角三角形；能求实际长度","sem":"下"},{"i":"cnm_179","n":"用勾股定理在数轴上表示无理数","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.1","d":"图形与几何","x":"借助直角三角形斜边在数轴上作出 √2、√5 等对应的点。","k":"能构造相应的直角三角形；能用圆规截取在数轴上","sem":"下"},{"i":"cnm_177","n":"勾股定理的逆定理","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.2","d":"图形与几何","x":"如果三角形三边满足 a²+b²=c²，那么它是直角三角形，满足的三个正整数叫勾股数。","k":"能用逆定理判断直角三角形；能说出常见勾股数","sem":"下"},{"i":"cnm_178","n":"勾股定理逆定理的应用","s":"数学","g":8,"m":1,"c":"八下 第二十章 勾股定理 20.2","d":"图形与几何","x":"在实际问题（方向、距离）中用逆定理判断垂直关系并求值。","k":"能选最长边为斜边验证；能解决方向角问题","sem":"下"},{"i":"cnm_180","n":"多边形及其对角线","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.1","d":"图形与几何","x":"认识多边形的边、顶点、内角、外角、对角线及正多边形，知道 n 边形从一个顶点出发可引 n-3 条对角线。","k":"能说出多边形的相关概念；能算对角线条数","sem":"下"},{"i":"cnm_181","n":"多边形的内角和","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.1","d":"图形与几何","x":"n 边形内角和为 (n-2)×180°，可通过分割成三角形推导。","k":"能推导内角和公式；能用公式求边数或角度","sem":"下"},{"i":"cnm_182","n":"多边形的外角和","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.1","d":"图形与几何","x":"任意多边形的外角和为 360°。","k":"能说明外角和为 360°；能用于求正多边形的边数","sem":"下"},{"i":"cnm_183","n":"平行四边形的性质","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.2","d":"图形与几何","x":"平行四边形对边平行且相等、对角相等、对角线互相平分。","k":"能叙述并证明性质；能用性质求边角","sem":"下"},{"i":"cnm_184","n":"平行四边形的判定","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.2","d":"图形与几何","x":"两组对边分别平行（相等）、一组对边平行且相等、对角线互相平分、两组对角分别相等的四边形是平行四边形。","k":"能叙述各判定；能选择合适的判定证明","sem":"下"},{"i":"cnm_185","n":"三角形的中位线","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.2","d":"图形与几何","x":"三角形的中位线平行于第三边且等于第三边的一半。","k":"能叙述并证明；能用于求线段长和证明平行","sem":"下"},{"i":"cnm_186","n":"矩形的性质","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"矩形的四个角都是直角，对角线相等且互相平分。","k":"能叙述性质；能用性质计算","sem":"下"},{"i":"cnm_187","n":"直角三角形斜边上的中线","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"直角三角形斜边上的中线等于斜边的一半。","k":"能叙述并用矩形证明；能用于求线段长","sem":"下"},{"i":"cnm_188","n":"矩形的判定","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"有一个角是直角的平行四边形、对角线相等的平行四边形、有三个角是直角的四边形是矩形。","k":"能叙述判定；能选择判定证明","sem":"下"},{"i":"cnm_189","n":"菱形的性质","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"菱形四边相等，对角线互相垂直平分且平分每组对角，面积等于对角线乘积的一半。","k":"能叙述性质；能求边长与面积","sem":"下"},{"i":"cnm_190","n":"菱形的判定","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"四边相等的四边形、对角线互相垂直的平行四边形、一组邻边相等的平行四边形是菱形。","k":"能叙述判定；能选择判定证明","sem":"下"},{"i":"cnm_191","n":"正方形的性质与判定","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 21.3","d":"图形与几何","x":"正方形兼有矩形和菱形的性质，会判定正方形并梳理平行四边形、矩形、菱形、正方形的包含关系。","k":"能说出正方形的性质；能画出四类四边形的包含关系图","sem":"下"},{"i":"cnm_192","n":"四边形中的折叠与动点问题","s":"数学","g":8,"m":1,"c":"八下 第二十一章 四边形 综合","d":"图形与几何","x":"在矩形、菱形、正方形背景中处理折叠、动点，利用全等、勾股定理建立方程。","k":"能画出折叠前后的对应关系；能列方程求线段长","sem":"下"},{"i":"cnm_193","n":"变量与常量","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.1","d":"数与代数","x":"在变化过程中取不同值的量是变量，取值不变的量是常量。","k":"能指出变化过程中的变量与常量；能举出生活实例","sem":"下"},{"i":"cnm_194","n":"函数的概念","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.1","d":"数与代数","x":"如果一个变化过程中有两个变量 x、y，对于 x 的每一个确定的值，y 都有唯一确定的值与之对应，那么 y 是 x 的函数。","k":"能判断是否是函数；能说出自变量与因变量","sem":"下"},{"i":"cnm_195","n":"自变量的取值范围","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.1","d":"数与代数","x":"根据分母不为 0、被开方数非负及实际意义确定自变量的取值范围。","k":"能求简单函数式的取值范围；会考虑实际意义","sem":"下"},{"i":"cnm_196","n":"函数值","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.1","d":"数与代数","x":"给定自变量的值，代入函数关系求对应的函数值。","k":"能正确代入求值；能由函数值反求自变量","sem":"下"},{"i":"cnm_197","n":"函数的图象","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.2","d":"数与代数","x":"用列表、描点、连线画函数图象，并从图象读取信息。","k":"能画简单函数图象；能从图象读出函数值与变化趋势","sem":"下"},{"i":"cnm_198","n":"函数的三种表示方法","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.2","d":"数与代数","x":"函数可用解析式、列表、图象表示，了解三者的优缺点与相互转换。","k":"能说出三种表示方法；能在不同表示之间转换","sem":"下"},{"i":"cnm_199","n":"用函数刻画实际变化规律","s":"数学","g":8,"m":1,"c":"八下 第二十二章 函数 22.2","d":"数与代数","x":"把实际问题中的变量关系写成函数解析式并分析其变化。","k":"能写出实际问题的函数关系式；能结合实际确定取值范围","sem":"下"},{"i":"cnm_200","n":"正比例函数","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.1","d":"数与代数","x":"形如 y=kx（k≠0）的函数是正比例函数，图象是过原点的直线。","k":"能判断正比例函数；能求 k 与画图","sem":"下"},{"i":"cnm_201","n":"一次函数的概念","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.1","d":"数与代数","x":"形如 y=kx+b（k≠0）的函数叫一次函数，正比例函数是 b=0 的特例。","k":"能判断一次函数；能由条件确定参数","sem":"下"},{"i":"cnm_202","n":"一次函数的图象与画法","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.2","d":"数与代数","x":"一次函数图象是一条直线，用两点法（常取与坐标轴交点）作图。","k":"能用两点法作图；能求与坐标轴交点","sem":"下"},{"i":"cnm_203","n":"一次函数的性质","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.2","d":"数与代数","x":"k 决定增减性与倾斜方向，b 决定与 y 轴交点，据此判断图象经过的象限。","k":"能由 k、b 判断增减性与象限；能比较函数值大小","sem":"下"},{"i":"cnm_204","n":"一次函数图象的平移","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.2","d":"数与代数","x":"直线 y=kx+b 向上（下）平移 m 个单位得 y=kx+b±m。","k":"能写出平移后的解析式；能说明平移不改变 k","sem":"下"},{"i":"cnm_205","n":"待定系数法求一次函数解析式","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.2","d":"数与代数","x":"设 y=kx+b，由两点（或条件）列方程组求出 k、b。","k":"能列方程组求 k、b；能由图象确定解析式","sem":"下"},{"i":"cnm_206","n":"一次函数与一元一次方程","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.3","d":"数与代数","x":"方程 kx+b=0 的解就是函数 y=kx+b 的图象与 x 轴交点的横坐标。","k":"能由图象读出方程的解；能说明二者关系","sem":"下"},{"i":"cnm_207","n":"一次函数与一元一次不等式","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.3","d":"数与代数","x":"不等式 kx+b>0 的解集是图象在 x 轴上方部分对应的 x 的范围。","k":"能由图象写出不等式解集；能数形结合","sem":"下"},{"i":"cnm_208","n":"一次函数与二元一次方程组","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.3","d":"数与代数","x":"两个一次函数图象的交点坐标就是对应二元一次方程组的解。","k":"能由交点求方程组的解；能用方程组求交点","sem":"下"},{"i":"cnm_209","n":"实际问题与一次函数","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 23.4","d":"数与代数","x":"建立一次函数模型（含分段函数）解决收费、行程、方案选择等实际问题。","k":"能建立函数关系式；能结合图象与不等式选择方案","sem":"下"},{"i":"cnm_210","n":"综合与实践：音乐与数学","s":"数学","g":8,"m":1,"c":"八下 第二十三章 一次函数 综合与实践","d":"综合与实践","x":"探究弦长、频率、音高等量之间的数量关系，用函数思想描述音乐中的数学。","k":"能收集弦长与音高数据；能用表格或函数描述关系","sem":"下"},{"i":"cnm_211","n":"平均数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"理解平均数是反映一组数据集中趋势的统计量，会求算术平均数。","k":"能计算平均数；能说明其含义","sem":"下"},{"i":"cnm_212","n":"加权平均数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"各数据重要程度不同时按权重计算加权平均数。","k":"能识别权并计算；能解释权的作用","sem":"下"},{"i":"cnm_213","n":"中位数与众数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"中位数是数据排序后居中的数据（偶数个取中间两数的平均），众数是出现次数最多的数据。","k":"能求中位数与众数；能解释含义","sem":"下"},{"i":"cnm_214","n":"集中趋势统计量的选择","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"根据数据特点和问题需要选择平均数、中位数或众数描述集中趋势。","k":"能说明三者的适用情形；能结合情境作出选择","sem":"下"},{"i":"cnm_302","n":"用样本平均数估计总体平均数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"总体太大无法全部调查时，用随机抽取的样本的平均数估计总体的平均数。","k":"能计算样本平均数并用它估计总体平均数；能说明样本容量与代表性对估计的影响","sem":"下"},{"i":"cnm_303","n":"极端值对平均数与中位数的影响","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.1","d":"统计与概率","x":"个别特别大或特别小的数据会明显拉动平均数，而中位数基本不受影响，据此判断哪个统计量更能代表一般水平。","k":"能找出一组数据中的极端值并判断它对平均数的影响；能说明何时宜用中位数描述一般水平","sem":"下"},{"i":"cnm_215","n":"极差、方差与标准差","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.2","d":"统计与概率","x":"用极差、方差、标准差刻画数据的离散程度，方差越小数据越稳定。","k":"能计算极差与方差；能比较两组数据的稳定性","sem":"下"},{"i":"cnm_304","n":"用方差比较两组数据的稳定性","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.2","d":"统计与概率","x":"在平均数相同或相近时，通过比较方差（或标准差）判断哪组数据波动更小、更稳定，并据此决策。","k":"能分别算出两组数据的方差并比较大小；能结合情境解释稳定性并作出选择","sem":"下"},{"i":"cnm_306","n":"用样本方差估计总体的稳定性","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.2","d":"统计与概率","x":"用随机抽取样本的方差估计总体数据的波动程度，如比较两批产品尺寸的稳定性。","k":"能计算样本方差并据此估计总体的稳定性；能说明样本容量过小会使估计不可靠","sem":"下"},{"i":"cnm_216","n":"数据的四分位数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.3","d":"统计与概率","x":"把数据分成四等份的三个分点叫四分位数，可用来描述数据的分布范围。","k":"能求四分位数；能解释四分位距","sem":"下"},{"i":"cnm_305","n":"箱线图的读取与比较","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.3","d":"统计与概率","x":"用最小值、第一四分位数、中位数、第三四分位数、最大值画成的箱线图，读出数据的中心与分散情况并比较两组数据。（箱线图是否为教材必学内容待核。）","k":"能说出箱线图各部分对应的五个统计量；能由箱线图比较两组数据的中位数与离散程度","sem":"下"},{"i":"cnm_217","n":"数据的分组与由分组数据估计平均数","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 24.4","d":"统计与概率","x":"把数据分组后用组中值估计平均数，体会分组对信息的保留与损失。","k":"能用组中值估计平均数；能说明估计的局限","sem":"下"},{"i":"cnm_218","n":"综合与实践：学生体质健康调查与分析","s":"数学","g":8,"m":1,"c":"八下 第二十四章 数据的分析 综合与实践","d":"综合与实践","x":"设计调查方案，收集学生体质数据，用统计量与统计图分析并提出建议。","k":"能设计并实施调查；能用适当统计量得出并表述结论","sem":"下"},{"i":"cnm_219","n":"一元二次方程的概念","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.1","d":"数与代数","x":"只含一个未知数、未知数最高次数为 2 的整式方程叫一元二次方程，一般形式 ax²+bx+c=0（a≠0）。","k":"能判断一元二次方程；能指出二次项系数、一次项系数和常数项","sem":"上"},{"i":"cnm_220","n":"直接开平方法","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"形如 x²=p 或 (x+m)²=p 的方程，利用平方根的意义直接求解。","k":"能判断可用直接开平方法；能求出两个根并考虑 p<0 无解","sem":"上"},{"i":"cnm_221","n":"配方法","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"通过配方把方程化为 (x+m)²=n 的形式再求解，配方时加上一次项系数一半的平方。","k":"能完成配方；能用配方法解方程","sem":"上"},{"i":"cnm_222","n":"公式法与求根公式","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"由配方法推出求根公式 x=(-b±√(b²-4ac))/(2a)（b²-4ac≥0），并用其解方程。","k":"能写出求根公式；能正确代入求解并化简","sem":"上"},{"i":"cnm_223","n":"根的判别式","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"Δ=b²-4ac 决定根的情况：Δ>0 两个不等实根，Δ=0 两个相等实根，Δ<0 无实根。","k":"能由 Δ 判断根的个数；能求参数范围","sem":"上"},{"i":"cnm_224","n":"因式分解法","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"把方程一边化为 0，另一边分解成一次因式的积，利用“若 ab=0 则 a=0 或 b=0”求解。","k":"能先移项再因式分解；能求出两个根","sem":"上"},{"i":"cnm_225","n":"一元二次方程解法的选择","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.2","d":"数与代数","x":"根据方程特点灵活选用直接开平方、因式分解、配方、公式法。","k":"能说明选用方法的理由；能高效求解","sem":"上"},{"i":"cnm_227","n":"增长率与传播问题","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.3","d":"数与代数","x":"用一元二次方程解决平均增长（降低）率、传播扩散等问题，注意检验根的合理性。","k":"能列出 a(1+x)²=b 型方程；能舍去不合题意的根","sem":"上"},{"i":"cnm_228","n":"面积与销售利润问题","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 25.3","d":"数与代数","x":"用一元二次方程解决围图形面积、商品销售利润等问题。","k":"能画图并找等量关系；能检验解是否符合实际","sem":"上"},{"i":"cnm_226","n":"一元二次方程根与系数的关系（拓展）","s":"数学","g":9,"m":1,"c":"九上 第二十五章 一元二次方程 拓展","d":"数与代数","x":"若 x₁、x₂ 是 ax²+bx+c=0 的两根，则 x₁+x₂=-b/a，x₁x₂=c/a（课标仅要求“了解”，见例67）。","k":"能由求根公式推出关系；能用于求对称式的值","sem":"上"},{"i":"cnm_229","n":"二次函数的概念","s":"数学","g":9,"m":1,"c":"九上 第二十六章 二次函数 26.1","d":"数与代数","x":"形如 y=ax²+bx+c（a≠0）的函数叫二次函数。","k":"能判断二次函数；能由条件确定参数范围","sem":"上"},{"i":"cnm_230","n":"y=ax² 的图象与性质","s":"数学","g":9,"m":1,"c":"九上 第二十六章 二次函数 26.2","d":"数与代数","x":"抛物线 y=ax² 顶点在原点，对称轴为 y 轴，a 的符号决定开口方向，|a| 决定开口大小。","k":"能画图并说出开口、顶点、对称轴；能比较函数值大小","sem":"上"},{"i":"cnm_231","n":"y=a(x-h)²+k 的图象与平移","s":"数学","g":9,"m":1,"c":"九上 第二十六章 二次函数 26.2","d":"数与代数","x":"抛物线 y=a(x-h)²+k 的顶点为 (h,k)，对称轴为 x=h，可由 y=ax² 平移得到。","k":"能写出顶点与对称轴；能说出平移方式","sem":"上"},{"i":"cnm_232","n":"y=ax²+bx+c 的图象与性质","s":"数学","g":9,"m":1,"c":"九上 第二十六章 二次函数 26.2","d":"数与代数","x":"通过配方化为顶点式，得出顶点坐标 (-b/2a, (4ac-b²)/4a)，并研究增减性。","k":"会配方化为顶点式；能说出顶点、对称轴和增减性","sem":"上"},{"i":"cnm_233","n":"待定系数法求二次函数解析式","s":"数 图列出所有结果，求事件的概率。","k":"能画树状图或列表；能判断何时用何方法","sem":"下"},{"i":"cnm_289","n":"概率的应用与游戏的公平性","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.2","d":"统计与概率","x":"用概率判断游戏是否公平并进行决策。","k":"能计算双方获胜概率；能判断游戏的公平性","sem":"下"},{"i":"cnm_310","n":"放回与不放回摸球问题的区分","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.2","d":"统计与概率","x":"摸球试验中，放回时每次的结果总数不变，不放回时第二次的结果总数减少，需据此列出全部结果。","k":"能判断题目是放回还是不放回；能分别列出两种情形的全部等可能结果并求概率","sem":"下"},{"i":"cnm_311","n":"三步及以上试验用树状图求概率","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.2","d":"统计与概率","x":"试验有三步或更多步时，用树状图逐步分支列出全部结果，再数出所求事件的结果个数。","k":"能画出三步试验的树状图并写出全部结果；能由树状图求事件的概率","sem":"下"},{"i":"cnm_313","n":"概率与统计图表综合问题","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.2","d":"统计与概率","x":"从条形图、扇形图或统计表中读取各类数据的数量，再按等可能计算随机抽取一个个体属于某类的概率。","k":"能从统计图表中提取各类个体的数量；能据此计算随机抽取一个个体属于某类的概率","sem":"下"},{"i":"cnm_288","n":"用频率估计概率","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.3","d":"统计与概率","x":"大量重复试验中，事件发生的频率稳定于概率，可用频率估计概率。","k":"能说明频率与概率的区别；能由试验数据估计概率","sem":"下"},{"i":"cnm_312","n":"用频率估计合格率、发芽率等实际概率","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.3","d":"统计与概率","x":"在产品抽检、种子发芽等无法列举结果的情形中，用大量重复试验的频率估计概率，并用估计值预测总体。","k":"能由试验数据估计发芽率或合格率；能用估计的概率预测总体中的数量","sem":"下"},{"i":"cnm_314","n":"对概率意义的常见误解辨析","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 34.3","d":"统计与概率","x":"辨析“概率是 0.5 就是每两次必有一次”“前几次都是反面下次一定是正面”等误解，理解概率反映的是大量重复试验中频率稳定的趋势。","k":"能指出对概率意义的常见误解；能用频率的稳定性解释概率的含义","sem":"下"},{"i":"cnm_315","n":"综合与实践：用随机试验检验游戏的公平性（补充课题）","s":"数学","g":9,"m":1,"c":"九下 第三十四章 随机事件的概率 综合应用（补充课题，非已核实的教材栏目）","d":"综合与实践","x":"设计一个两人转盘或摸球游戏，用列表法、树状图算出双方获胜的概率，再用多次试验的频率检验游戏是否公平。本条为补充课题，非已核实的教材栏目，供教师取舍。","k":"能设计规则使双方获胜的概率相等并用概率说明；能用试验频率检验理论概率并解释误差","sem":"下"},{"i":"cne_p001","n":"英语字母表","s":"英语","g":3,"m":0,"c":"三年级上册 第1单元 Making friends"},{"i":"cne_p002","n":"字母的大写和小写","s":"英语","g":3,"m":0,"c":"三年级上册 第1单元 Making friends"},{"i":"cne_p004","n":"辅音字母 b 的开头音","s":"英语","g":3,"m":0,"c":"三年级上册 第1单元 Making friends"},{"i":"cne_p005","n":"问候用语","s":"英语","g":3,"m":0,"c":"三年级上册 第1单元 Making friends"},{"i":"cne_p006"," 变速运动，会用平均速度做简单计算。","k":"能用 v = s/t 及其变形进行计算；能进行 m/s 与 km/h 的换算（1 m/s = 3.6 km/h）；知道平均速度要用总路程除以总时间","sem":"上"},{"i":"cnp_004","n":"速度的测量","s":"物理","g":8,"m":1,"c":"八上 第一章 机械运动 1.4","d":"运动和相互作用","x":"会用刻度尺和停表（或传感器）测量物体运动的平均速度，知道实验原理是 v = s/t，能分析斜面上小车前后半程的速度变化。","k":"能说出测平均速度的原理和器材；会根据测量数据计算各段的平均速度；知道小车沿斜面下滑时速度越来越大","sem":"上"},{"i":"cnp_005","n":"声音的产生与传播","s":"物理","g":8,"m":1,"c":"八上 第二章 声现象 2.1","d":"运动和相互作用","x":"知道声音是由物体振动产生的，声音的传播需要介质，真空不能传声；知道声速与介质种类和温度有关，15 ℃ 空气中声速约 340 m/s。","k":"能说出声音产生和传播的条件；知道真空不能传声；能比较声音在固体、液体、气体中传播的快慢","sem":"上"},{"i":"cnp_006","n":"声音的特性","s":"物理","g":8,"m":1,"c":"八上 第二章 声现象 2.2","d":"运动和相互作用","x":"知道音调、响度、音色是声音的三个特性：音调与频率有关，响度与振幅和距离发声体远近有关，音色由发声体本身决定。","k":"能区分音调、响度和音色；知道音调由频率决定，响度与振幅有关；知道人耳听觉的频率范围及超声、次声","sem":"上"},{"i":"cnp_007","n":"声的利用","s":"物理","g":8,"m":1,"c":"八上 第二章 声现象 2.3","d":"运动和相互作用","x":"知道声可以传递信息，也可以传递能量，能举出回声定位、B 超、超声波清洗、碎石等实例。","k":"能区分声传递信息与传递能量的实例；会用回声测距进行简单计算","sem":"上"},{"i":"cnp_008","n":"噪声的危害和控制","s":"物理","g":8,"m":1,"c":"八上 第二章 声现象 2.4","d":"运动和相互作用","x":"知道噪声的来源和危害，知道用分贝（dB）表示声音强弱的等级，知道在声源处、传播过程中、人耳处控制噪声的方法。","k":"能说出控制噪声的三个途径并举例；知道分贝表示声音强弱的等级","sem":"上"},{"i":"cnp_009","n":"跨学科实践：制作隔音房间模型","s":"物理","g":8,"m":1,"c":"八上 第二章 声现象 2.5","d":"跨学科实践","x":"运用声的传播和噪声控制知识，选择材料、设计并制作隔音房间模型，比较不同材料的隔音效果。","k":"能说出选择隔音材料要考虑的因素；能设计控制变量的比较方案","sem":"上","w":["实验表述：探究问题与判断依据"]},{"i":"cnp_010","n":"温度","s":"物理","g":8,"m":1,"c":"八上 第三章 物态变化 3.1","d":"物质","x":"知道温度表示物体的冷热程度，知道摄氏温度的规定，了解液体温度计的原理（液体热胀冷缩），会正确使用温度计和体温计。","k":"能说出摄氏温度的规定和常见温度值；会正确使用温度计测量并读数（含零下读数）；知道体温计的特点与使用注意","sem":"上","w":["物态变化·名称偷换"]},{"i":"cnp_011","n":"熔化和凝固","s":"物理","g":8,"m":1,"c":"八上 第三章 物态变化 3.2","d":"物质","x":"知道熔化和凝固的概念，知道晶体有熔点、非晶体没有，晶体熔化时吸热温度不变，能读熔化、凝固图像。","k":"能区分熔化与凝固，说出吸热、放热；能区分晶体和非晶体；能从熔化图像读出熔点和熔化时间","sem":"上","w":["物态变化·名称偷换"]},{"i":"cnp_012","n":"汽化和液化","s":"物理","g":8,"m":1,"c":"八上 第三章 物态变化 3.3","d":"物质","x":"知道汽化的两种方式（蒸发和沸腾）及其特点，知道影响蒸发快慢的因素、沸点与气压的关系，知道液化的两种方法；会探究水沸腾前后温度变化的特点。","k":"能区分蒸发与沸腾；能说出影响蒸发快慢的三个因素；知道沸腾的条件和沸腾时温度不变","sem":"上","w":["物态变化·名称偷换"]},{"i":"cnp_013","n":"升华和凝华","s":"物理","g":8,"m":1,"c":"八上 第三章 物态变化 3.4","d":"物质","x":"知道升华和凝华，升华吸热、凝华放热；能用六种物态变化解释雪、霜、雾、露和水循环等现象。","k":"能区分升华与凝华；能判断霜、雾、露、雪等现象对应的物态变化；能说出六种物态变化的吸放热","sem":"上","w":["物态变化·名称偷换"]},{"i":"cnp_014","n":"跨学科实践：探索厨房中的物态变化问题","s":"物理","g":8,"m":1,"c":"八上 第三章 物态变化 3.5","d":"跨学科实践","x":"在厨房情境中观察和解释蒸、煮、冷冻、解冻等过程中的物态变化，提出节能、安全的改进办法。","k":"能用物态变化解释厨房中的常见现象；能提出与物态变化有关的安全或节能建议","sem":"上","w":["物态变化·名称偷换"]},{"i":"cnp_015","n":"光的直线传播","s":"物理","g":8,"m":1,"c":"八上 第四章 光现象 4.1","d":"运动和相互作用","x":"知道光源，知道光在同种均匀介质中沿直线传播，能解释影子、小孔成像、日食月食；知道真空中光速约 3×10⁸ m/s。","k":"能用光的直线传播解释影子、小孔成像等现象；知道光速大小，知道光年是长度单位","sem":"上"},{"i":"cnp_016","n":"光的反射","s":"物理","g":8,"m":1,"c":"八上 第四章 光现象 4.2","d":"运动和相互作用","x":"探究并了解光的反射定律：反射光线、入射光线和法线在同一平面内，反射光线和入射光线分居法线两侧，反射角等于入射角；知道镜面反射和漫反射，知道光路可逆。","k":"能说出光的反射定律；会根据入射角求反射角（角都与法线相比）；能区分镜面反射和漫反射","sem":"上"},{"i":"cnp_017","n":"平面镜成像","s":"物理","g":8,"m":1,"c":"八上 第四章 光现象 4.3","d":"运动和相互作用","x":"探究并了解平面镜成像的特点：像与物大小相等，像与物到镜面的距离相等，像与物的连线与镜面垂直，成的是虚像；知道平面镜的应用。","k":"能说出平面镜成像的特点；能根据物距求像距、像与物的距离；知道探究中用玻璃板代替平面镜的原因","sem":"上"},{"i":"cnp_018","n":"光的折射","s":"物理","g":8,"m":1,"c":"八上 第四章 光现象 4.4","d":"运动和相互作用","x":"通过实验了解光的折射现象及特点：光从空气斜射入水或玻璃中，折射角小于入射角；垂直入射时传播方向不变；能解释池水变浅、筷子“折断”等现象。","k":"能说出光从空气斜射入水中时折射光线的偏折方向；能用光的折射解释常见现象；知道折射中光路可逆","sem":"上"},{"i":"cnp_019","n":"光的色散","s":"物理","g":8,"m":1,"c":"八上 第四章 光现象 4.5","d":"运动和相互作用","x":"通过实验了解白光由多种色光组成，知道光的三原色是红、绿、蓝，了解不同色光混合现象；了解红外线和紫外线的应用。","k":"知道太阳光经三棱镜分解成七种色光；能说出光的三原色；能举出红外线和紫外线的应用","sem":"上"},{"i":"cnp_020","n":"透镜","s":"物理","g":8,"m":1,"c":"八上 第五章 透镜及其应用 5.1","d":"运动和相互作用","x":"认识凸透镜和凹透镜，知道主光轴、光心、焦点、焦距；了解凸透镜对光有会聚作用，凹透镜对光有发散作用，会画三条特殊光线。","k":"能区分凸透镜和凹透镜；知道凸透镜的会聚作用、凹透镜的发散作用；会画平行于主光轴、过光心、过焦点的特殊光线","sem":"上"},{"i":"cnp_021","n":"生活中的透镜","s":"物理","g":8,"m":1,"c":"八上 第五章 透镜及其应用 5.2","d":"运动和相互作用","x":"了解照相机、投影仪、放大镜的成像特点，知道实像和虚像的区别。","k":"能说出照相机、投影仪、放大镜所成像的性质；能区分实像和虚像","sem":"上"},{"i":"cnp_022","n":"凸透镜成像的规律","s":"物理","g":8,"m":1,"c":"八上 第五章 透镜及其应用 5.3","d":"运动和相互作用","x":"探究并了解凸透镜成像规律：u > 2f 成倒立缩小实像，f < u < 2f 成倒立放大实像，u < f 成正立放大虚像；成实像时物近像远像变大。","k":"能根据物距与焦距的关系判断像的性质；知道成实像时“物近像远像变大”；能由成像情况推算焦距范围","sem":"上"},{"i":"cnp_023","n":"眼睛和眼镜","s":"物理","g":8,"m":1,"c":"八上 第五章 透镜及其应用 5.4","d":"运动和相互作用","x":"知道眼睛相当于照相机，晶状体相当于凸透镜，视网膜上成倒立、缩小的实像；知道近视眼、远视眼的成因和矫正方法。","k":"能说出近视眼像成在视网膜前方、用凹透镜矫正；能说出远视眼像成在视网膜后方、用凸透镜矫正","sem":"上"},{"i":"cnp_024","n":"跨学科实践：制作望远镜","s":"物理","g":8,"m":1,"c":"八上 第五章 透镜及其应用 5.5","d":"跨学科实践","x":"了解开普勒望远镜由两个凸透镜组成，物镜成倒立、缩小的实像，目镜相当于放大镜；动手制作简易望远镜并调节。","k":"知道望远镜物镜和目镜的作用；能根据透镜焦距选择物镜和目镜","sem":"上"},{"i":"cnp_025","n":"质量","s":"物理","g":8,"m":1,"c":"八上 第六章 质量与密度 6.1","d":"物质","x":"知道质量是物体所含物质的多少，是物体的属性，不随形状、状态、位置、温度改变；会用托盘天平测量质量。","k":"能进行质量单位换算并估测常见物体质量；知道质量不随形状、状态、位置变化；会正确使用托盘天平（放平、归零、调平衡、左物右码）","sem":"上"},{"i":"cnp_026","n":"密度","s":"物理","g":8,"m":1,"c":"八上 第六章 质量与密度 6.2","d":"物质","x":"理解密度是物质的一种特性，ρ = m/V，单位 kg/m³ 和 g/cm³（1 g/cm³ = 1×10³ kg/m³），能用公式进行计算。","k":"能用 ρ = m/V 及变形计算；能进行 g/cm³ 与 kg/m³ 的换算；知道同种物质密度一般不随质量、体积变化","sem":"上"},{"i":"cnp_027","n":"测量液体和固体的密度","s":"物理","g":8,"m":1,"c":"八上 第六章 质量与密度 6.3","d":"物质","x":"会用量筒测体积，会用天平和量筒测量固体和液体的密度，能分析实验步骤顺序对误差的影响。","k":"会正确读量筒（视线与凹液面底部相平）；会用排水法测固体体积并算密度；能设计减小误差的液体密度测量步骤","sem":"上"},{"i":"cnp_028","n":"密度的应用","s":"物理","g":8,"m":1,"c":"八上 第六章 质量与密度 6.4","d":"物质","x":"能利用密度鉴别物质、计算不便直接测量的质量或体积，解释水结冰体积变大、气体密度受温度影响等现象。","k":"会用密度鉴别物质；会用 m = ρV、V = m/ρ 求不能直接测量的量；能解释水的反常膨胀等现象","sem":"上"},{"i":"cnp_029","n":"力","s":"物理","g":8,"m":1,"c":"八下 第七章 力 7.1","d":"运动和相互作用","x":"知道力是物体对物体的作用，物体间力的作用是相互的；知道力可以改变物体的运动状态和形状；知道力的三要素，会画力的示意图，力的单位是牛顿（N）。","k":"能说出力的作用效果；知道物体间力的作用是相互的；知道力的三要素并会画力的示意图","sem":"下"},{"i":"cnp_030","n":"弹力","s":"物理","g":8,"m":1,"c":"八下 第七章 力 7.2","d":"运动和相互作用","x":"知道弹性和弹力，知道在弹性限度内弹簧伸长量与拉力成正比，会正确使用弹簧测力计测量力。","k":"能说出弹力产生的条件；会正确使用并读取弹簧测力计；知道弹簧伸长量与拉力成正比（弹性限度内）","sem":"下"},{"i":"cnp_031","n":"重力","s":"物理","g":8,"m":1,"c":"八下 第七章 力 7.3","d":"运动和相互作用","x":"知道重力是由于地球的吸引而使物体受到的力，方向竖直向下，作用点在重心；知道 G = mg，g 约为 9.8 N/kg（题中常取 10 N/kg）。","k":"能用 G = mg 计算重力或质量；知道重力方向竖直向下并说出应用；能区分质量和重力","sem":"下"},{"i":"cnp_032","n":"牛顿第一定律","s":"物理","g":8,"m":1,"c":"八下 第八章 运动和力 8.1","d":"运动和相互作用","x":"通过阻力对物体运动影响的实验和科学推理认识牛顿第一定律；知道一切物体都有惯性，惯性只与质量有关，能用惯性解释生活现象。","k":"能说出牛顿第一定律及其得出方法（实验 + 推理）；知道惯性大小只与质量有关；能用惯性解释急刹车、安全带等现象","sem":"下"},{"i":"cnp_033","n":"二力平衡","s":"物理","g":8,"m":1,"c":"八下 第八章 运动和力 8.2","d":"运动和相互作用","x":"知道平衡状态和平衡力，知道二力平衡的条件：作用在同一物体上，大小相等、方向相反、作用在同一直线上；能区分平衡力与相互作用力。","k":"能说出二力平衡的四个条件；能区分平衡力与相互作用力；会用二力平衡求未知力","sem":"下"},{"i":"cnp_034","n":"摩擦力","s":"物理","g":8,"m":1,"c":"八下 第八章 运动和力 8.3","d":"运动和相互作用","x":"知道摩擦力，探究并了解滑动摩擦力大小与压力大小和接触面粗糙程度有关；知道增大和减小摩擦的方法。","k":"能说出影响滑动摩擦力大小的两个因素；知道测滑动摩擦力要匀速直线拉动木块；能判断增大或减小摩擦的方法","sem":"下"},{"i":"cnp_035","n":"同一直线上二力的合成","s":"物理","g":8,"m":1,"c":"八下 第八章 运动和力 8.4","d":"运动和相互作用","x":"了解合力的概念，知道同一直线上方向相同的两个力的合力等于二力之和，方向相反时等于二力之差、方向与较大的力相同。","k":"会求同一直线上同向两力的合力；会求同一直线上反向两力的合力并判断方向","sem":"下"},{"i":"cnp_036","n":"压强","s":"物理","g":8,"m":1,"c":"八下 第九章 压强 9.1","d":"运动和相互作用","x":"理解压强 p = F/S，单位帕斯卡（Pa），知道增大和减小压强的方法；会计算固体压强。","k":"能用 p = F/S 计算并统一单位（面积用 m²）；能判断增大或减小压强的方法；知道压力作用效果与压力和受力面积有关","sem":"下"},{"i":"cnp_037","n":"液体的压强","s":"物理","g":8,"m":1,"c":"八下 第九章 压强 9.2","d":"运动和相互作用","x":"知道液体内部向各个方向都有压强；探究并了解液体压强与深度和液体密度有关，p = ρgh；了解连通器及其应用。","k":"知道液体压强随深度增加而增大，与液体密度有关；会用 p = ρgh 计算（h 是到自由液面的竖直距离）；能举出连通器的应用","sem":"下"},{"i":"cnp_038","n":"大气压强","s":"物理","g":8,"m":1,"c":"八下 第九章 压强 9.3","d":"运动和相互作用","x":"知道大气压强的存在，了解托里拆利实验和标准大气压（约 1.013×10⁵ Pa，相当于 760 mm 水银柱），知道大气压随高度增加而减小及其与生活的关系。","k":"能举例说明大气压的存在；知道标准大气压的数值；知道大气压随海拔升高而减小","sem":"下"},{"i":"cnp_039","n":"跨学科实践：制作简易活塞式抽水机","s":"物理","g":8,"m":1,"c":"八下 第九章 压强 9.4","d":"跨学科实践","x":"了解活塞式抽水机利用大气压把水抽上来的原理，动手制作简易抽水机，知道它能把水抽高的高度受大气压限制。","k":"能说出活塞式抽水机的工作原理；知道在 1 个标准大气压下抽水高度约为 10 m","sem":"下"},{"i":"cnp_040","n":"流体压强与流速的关系","s":"物理","g":8,"m":1,"c":"八下 第九章 压强 9.5","d":"运动和相互作用","x":"知道流体在流速大的地方压强小、流速小的地方压强大，能解释飞机升力、站台安全线等现象。","k":"能说出流体压强与流速的关系；能用它解释飞机升力和安全线等现象","sem":"下"},{"i":"cnp_041","n":"浮力","s":"物理","g":8,"m":1,"c":"八下 第十章 浮力 10.1","d":"运动和相互作用","x":"知道浮力的方向竖直向上，浮力产生的原因是液体对物体上下表面的压力差；会用称重法测浮力；探究并了解浮力大小与排开液体的体积和液体密度有关。","k":"会用称重法 F浮 = G - F示 求浮力；知道浮力方向竖直向上；知道浮力大小与 V排 和 ρ液 有关，与浸没深度无关","sem":"下"},{"i":"cnp_042","n":"阿基米德原理","s":"物理","g":8,"m":1,"c":"八下 第十章 浮力 10.2","d":"运动和相互作用","x":"知道阿基米德原理：浸在液体中的物体受到向上的浮力，大小等于它排开液体所受的重力，F浮 = G排 = ρ液 g V排。","k":"能说出阿基米德原理；会用 F浮 = ρ液 g V排 计算；知道 V排 与物体体积的关系（浸没时相等）","sem":"下"},{"i":"cnp_043","n":"物体的浮沉条件及应用","s":"物理","g":8,"m":1,"c":"八下 第十章 浮力 10.3","d":"运动和相互作用","x":"知道物体的浮沉条件（比较 F浮 与 G，或 ρ物 与 ρ液），知道漂浮时 F浮 = G，了解轮船、潜水艇、气球、密度计的原理。","k":"能用浮力与重力或密度比较判断浮沉；知道漂浮、悬浮时 F浮 = G；能说出潜水艇靠改变自身重力实现浮沉","sem":"下"},{"i":"cnp_044","n":"跨学科实践：制作微型密度计","s":"物理","g":8,"m":1,"c":"八下 第十章 浮力 10.4","d":"跨学科实践","x":"利用漂浮条件制作简易密度计，知道密度计在不同液体中受到的浮力相等，液体密度越大，浸入越浅，刻度上小下大。","k":"知道密度计利用漂浮时 F浮 = G 的原理；能判断密度计刻度的分布特点","sem":"下"},{"i":"cnp_045","n":"功","s":"物理","g":8,"m":1,"c":"八下 第十一章 功和机械能 11.1","d":"能量","x":"知道做功的两个必要因素（作用在物体上的力、物体在力的方向上移动的距离），会用 W = Fs 计算，单位焦耳（J）。","k":"能判断力是否对物体做功；会用 W = Fs 计算功","sem":"下"},{"i":"cnp_046","n":"功率","s":"物理","g":8,"m":1,"c":"八下 第十一章 功和机械能 11.2","d":"能量","x":"知道功率表示做功的快慢，P = W/t，单位瓦特（W）；能推导并使用 P = Fv。","k":"会用 P = W/t 计算功率；能区分功和功率；会用 P = Fv 进行简单计算","sem":"下"},{"i":"cnp_047","n":"动能和势能","s":"物理","g":8,"m":1,"c":"八下 第十一章 功和机械能 11.3","d":"能量","x":"知道动能、重力势能、弹性势能；知道动能与质量和速度有关，重力势能与质量和高度有关，弹性势能与弹性形变程度有关。","k":"能说出影响动能、重力势能大小的因素；能用控制变量法分析探究动能大小的实验","sem":"下"},{"i":"cnp_048","n":"机械能及其转化","s":"物理","g":8,"m":1,"c":"八下 第十一章 功和机械能 11.4","d":"能量","x":"知道机械能是动能和势能的总和，能分析动能和势能的相互转化，知道只有动能和势能相互转化时机械能守恒。","k":"能分析滚摆、单摆、人造卫星等过程中的能量转化；知道不计空气阻力时机械能守恒","sem":"下"},{"i":"cnp_049","n":"杠杆","s":"物理","g":8,"m":1,"c":"八下 第十二章 简单机械 12.1","d":"运动和相互作用","x":"知道杠杆的五要素，会画力臂；探究并了解杠杆的平衡条件 F₁l₁ = F₂l₂；能区分省力杠杆、费力杠杆和等臂杠杆。","k":"会找支点、画力臂（支点到力的作用线的距离）；会用 F₁l₁ = F₂l₂ 计算；能判断省力杠杆、费力杠杆","sem":"下"},{"i":"cnp_050","n":"跨学科实践：制作简易杆秤","s":"物理","g":8,"m":1,"c":"八下 第十二章 简单机械 12.2","d":"跨学科实践","x":"运用杠杆平衡条件设计并制作简易杆秤，确定定盘星（零刻度）和刻度，了解我国古代杆秤的智慧。","k":"能用杠杆平衡条件说明杆秤的原理；知道杆秤的刻度是均匀的","sem":"下"},{"i":"cnp_051","n":"滑轮","s":"物理","g":8,"m":1,"c":"八下 第十二章 简单机械 12.3","d":"运动和相互作用","x":"知道定滑轮不省力但能改变力的方向，动滑轮能省一半力但费距离；会分析滑轮组的承重绳子段数，F = (G物 + G动)/n，s = nh。","k":"能说出定滑轮、动滑轮的特点；会数滑轮组承担物重的绳子段数 n；会用 F = (G + G动)/n 和 s = nh 计算","sem":"下"},{"i":"cnp_052","n":"机械效率","s":"物理","g":8,"m":1,"c":"八下 第十二章 简单机械 12.4","d":"能量","x":"知道有用功、额外功、总功，知道机械效率 η = W有/W总，机械效率总小于 1；了解提高机械效率的方法。","k":"能区分有用功、额外功和总功；会计算滑轮组、斜面的机械效率；能说出提高机械效率的方法","sem":"下"},{"i":"cnp_053","n":"热量 比热容","s":"物理","g":9,"m":1,"c":"九全 第十三章 内能 13.1","d":"能量","x":"知道热量是热传递过程中传递内能的多少；通过实验了解比热容，会用 Q = cmΔt 计算吸收或放出的热量；能用水的比热容大解释生活现象。","k":"会用 Q = cmΔt 计算；知道水的比热容是 4.2×10³ J/(kg·℃) 并能解释应用；知道比热容是物质的特性","sem":"全"},{"i":"cnp_054","n":"分子动理论的初步知识","s":"物理","g":9,"m":1,"c":"九全 第十三章 内能 13.2","d":"物质","x":"知道物质由分子、原子构成；知道分子在不停地做无规则运动，温度越高运动越剧烈（扩散现象）；知道分子间存在引力和斥力，分子间有间隙。","k":"能用扩散现象说明分子在运动；知道温度越高分子热运动越剧烈；知道分子间有引力和斥力","sem":"全"},{"i":"cnp_055","n":"内能","s":"物理","g":9,"m":1,"c":"九全 第十三章 内能 13.3","d":"能量","x":"知道内能是物体内所有分子动能和分子势能的总和，一切物体都有内能；知道做功和热传递是改变内能的两种方式；能区分温度、热量和内能。","k":"能说出改变内能的两种方式并举例；知道一切物体都有内能；能区分温度、热量、内能","sem":"全"},{"i":"cnp_056","n":"能量的转化与守恒","s":"物理","g":9,"m":1,"c":"九全 第十四章 内能的利用 14.1","d":"能量","x":"知道能量既不会凭空消灭，也不会凭空产生，只会从一种形式转化为其他形式或从一个物体转移到其他物体，总量保持不变；知道永动机不可能实现。","k":"能说出能量守恒定律；能分析常见过程中的能量转化；能解释永动机为什么不可能实现","sem":"全"},{"i":"cnp_057","n":"热机","s":"物理","g":9,"m":1,"c":"九全 第十四章 内能的利用 14.2","d":"能量","x":"了解热机是把内能转化为机械能的机器；知道汽油机四个冲程（吸气、压缩、做功、排气）及其能量转化。","k":"能说出汽油机四个冲程的顺序；知道压缩冲程机械能转化为内能，做功冲程内能转化为机械能；能根据飞轮转速算做功次数","sem":"全"},{"i":"cnp_058","n":"热机的效率","s":"物理","g":9,"m":1,"c":"九全 第十四章 内能的利用 14.3","d":"能量","x":"知道燃料的热值，会用 Q放 = mq 计算；知道热机效率是用来做有用功的能量与燃料完全燃烧放出能量之比，了解提高热机效率的途径。","k":"会用 Q = mq 计算燃料放出的热量；知道热值是燃料的特性；会计算热机效率","sem":"全"},{"i":"cnp_059","n":"跨学科实践：制作简易热机模型","s":"物理","g":9,"m":1,"c":"九全 第十四章 内能的利用 14.4","d":"跨学科实践","x":"利用内能做功的原理设计并制作简易热机模型（如蒸汽小船、热气流风车），分析其中的能量转化和提高效率的方法。","k":"能说出简易热机模型中的能量转化；能提出提高模型效率的改进办法","sem":"全"},{"i":"cnp_060","n":"两种电荷","s":"物理","g":9,"m":1,"c":"九全 第十五章 电流和电路 15.1","d":"运动和相互作用","x":"知道摩擦起电和两种电荷，同种电荷相互排斥、异种电荷相互吸引；了解验电器、导体和绝缘体；知道原子由原子核和电子构成，摩擦起电是电子的转移。","k":"知道电荷间的相互作用规律；知道摩擦起电的实质是电子转移；能区分常见的导体和绝缘体","sem":"全"},{"i":"cnp_061","n":"电流和电路","s":"物理","g":9,"m":1,"c":"九全 第十五章 电流和电路 15.2","d":"运动和相互作用","x":"知道电流的形成和方向（正电荷定向移动的方向），知道电路的组成（电源、用电器、开关、导线），会看、会画简单电路图，了解通路、断路、短路。","k":"能说出电路的基本组成；知道电流方向的规定；能识别通路、断路和短路","sem":"全"},{"i":"cnp_062","n":"串联电路和并联电路","s":"物理","g":9,"m":1,"c":"九全 第十五章 电流和电路 15.3","d":"运动和相互作用","x":"知道串联电路和并联电路的连接特点，会连接简单的串联、并联电路，能说出生活中采用串联或并联的实例。","k":"能根据电流路径判断串联和并联；知道串联电路中开关控制整个电路、并联电路干路开关控制全部；能举出家庭电路用电器并联等实例","sem":"全"},{"i":"cnp_063","n":"电流的测量","s":"物理","g":9,"m":1,"c":"九全 第十五章 电流和电路 15.4","d":"运动和相互作用","x":"知道电流的单位安培（A）和毫安（mA），会使用电流表：串联在电路中，电流从“+”接线柱流入，选择合适的量程并正确读数。","k":"会进行电流单位换算；知道电流表要串联、正进负出；会根据量程正确读数","sem":"全"},{"i":"cnp_064","n":"串、并联电路中电流的规律","s":"物理","g":9,"m":1,"c":"九全 第十五章 电流和电路 15.5","d":"运动和相互作用","x":"探究并了解串联电路中电流处处相等，并联电路中干路电流等于各支路电流之和。","k":"知道串联电路电流处处相等；知道并联电路干路电流等于各支路电流之和；能用规律求未知电流","sem":"全"},{"i":"cnp_065","n":"电压","s":"物理","g":9,"m":1,"c":"九全 第十六章 电压·电阻 16.1","d":"运动和相互作用","x":"知道电压是形成电流的原因，单位伏特（V），记住一节干电池 1.5 V、家庭电路 220 V；会使用电压表：并联在被测电路两端，正进负出。","k":"知道常见电压值；知道电压表要并联；会进行电压单位换算","sem":"全"},{"i":"cnp_066","n":"串、并联电路中电压的规律","s":"物理","g":9,"m":1,"c":"九全 第十六章 电压·电阻 16.2","d":"运动和相互作用","x":"探究并了解串联电路两端的总电压等于各部分电路两端电压之和，并联电路中各支路两端的电压相等且等于电源电压。","k":"知道串联电路电压规律 U = U₁ + U₂；知道并联电路各支路电压相等；能用规律求未知电压","sem":"全"},{"i":"cnp_067","n":"电阻","s":"物理","g":9,"m":1,"c":"九全 第十六章 电压·电阻 16.3","d":"运动和相互作用","x":"知道电阻表示导体对电流的阻碍作用，单位欧姆（Ω）；知道导体的电阻与材料、长度、横截面积和温度有关，与电压、电流无关。","k":"能说出影响电阻大小的因素；知道电阻是导体的性质，与电压电流无关；会进行电阻单位换算","sem":"全"},{"i":"cnp_068","n":"变阻器","s":"物理","g":9,"m":1,"c":"九全 第十六章 电压·电阻 16.4","d":"运动和相互作用","x":"知道滑动变阻器通过改变接入电路中电阻丝的长度来改变电阻，会正确连接（一上一下）并判断滑片移动时电阻的变化；了解其在电路中的作用。","k":"知道滑动变阻器的原理；会“一上一下”连接并判断电阻变化；知道闭合开关前滑片应处于最大阻值处","sem":"全"},{"i":"cnp_069","n":"跨学科实践：制作简易调光台灯","s":"物理","g":9,"m":1,"c":"九全 第十六章 电压·电阻 16.5","d":"跨学科实践","x":"运用电路连接和变阻器知识设计并制作简易调光台灯，分析滑片位置与灯泡亮度的关系，注意用电安全。","k":"能画出调光台灯的电路图（灯与变阻器串联）；能分析滑片移动时灯泡亮度变化","sem":"全"},{"i":"cnp_070","n":"电流与电压、电阻的关系","s":"物理","g":9,"m":1,"c":"九全 第十七章 欧姆定律 17.1","d":"运动和相互作用","x":"探究电流与电压、电阻的关系：电阻一定时电流与电压成正比，电压一定时电流与电阻成反比；会用控制变量法设计实验并分析数据。","k":"知道电阻一定时 I 与 U 成正比；知道电压一定时 I 与 R 成反比；知道实验中滑动变阻器的作用","sem":"全"},{"i":"cnp_071","n":"欧姆定律","s":"物理","g":9,"m":1,"c":"九全 第十七章 欧姆定律 17.2","d":"运动和相互作用","x":"理解欧姆定律 I = U/R，会用它及变形式 U = IR、R = U/I 进行计算；知道 R = U/I 只是计算电阻的方法，电阻不由电压和电流决定。","k":"会用 I = U/R 及其变形计算；知道公式中各量要对应同一导体同一时刻；理解 R = U/I 不表示电阻与电压成正比","sem":"全"},{"i":"cnp_072","n":"电阻的测量","s":"物理","g":9,"m":1,"c":"九全 第十七章 欧姆定律 17.3","d":"运动和相互作用","x":"会用伏安法（电流表和电压表）测量电阻：原理 R = U/I，能画电路图、连接电路、多次测量求平均值；知道小灯泡电阻随温度变化。","k":"知道伏安法测电阻的原理和电路图；知道测定值电阻要多次测量取平均值；知道小灯泡电阻随温度升高而增大，不宜求平均","sem":"全"},{"i":"cnp_073","n":"欧姆定律在串、并联电路中的应用","s":"物理","g":9,"m":1,"c":"九全 第十七章 欧姆定律 17.4","d":"运动和相互作用","x":"能运用欧姆定律和串、并联电路的电流、电压规律进行计算；知道串联总电阻 R = R₁ + R₂，并联电路总电阻小于任一分电阻。","k":"会求串联电路总电阻和电流；会用欧姆定律解并联电路问题；能分析滑片移动时电表示数的变化","sem":"全"},{"i":"cnp_074","n":"电能 电功","s":"物理","g":9,"m":1,"c":"九全 第十八章 电功率 18.1","d":"能量","x":"知道电能的单位焦耳和千瓦时（度），1 kW·h = 3.6×10⁶ J；会读电能表并计算消耗的电能；知道电功 W = UIt。","k":"会换算 kW·h 与 J；会读电能表并算出用电量；会用 W = UIt 计算电功","sem":"全"},{"i":"cnp_075","n":"电功率","s":"物理","g":9,"m":1,"c":"九全 第十八章 电功率 18.2","d":"能量","x":"知道电功率表示电流做功的快慢，P = W/t = UI；知道额定电压、额定功率和实际功率；会进行简单计算。","k":"会用 P = UI、P = W/t 计算；能区分额定功率和实际功率；会根据铭牌计算电流或电阻","sem":"全"},{"i":"cnp_076","n":"跨学科实践：为家庭节约用电提建议","s":"物理","g":9,"m":1,"c":"九全 第十八章 电功率 18.3","d":"跨学科实践","x":"调查家庭用电情况，运用电功和电功率知识估算用电量，从减小功率、缩短时间等方面提出节约用电的建议。","k":"能用 W = Pt 估算家用电器用电量；能提出合理的节约用电建议","sem":"全"},{"i":"cnp_077","n":"焦耳定律","s":"物理","g":9,"m":1,"c":"九全 第十八章 电功率 18.4","d":"能量","x":"通过实验了解电流的热效应，知道焦耳定律 Q = I²Rt；能用焦耳定律说明电热的利用和防止。","k":"会用 Q = I²Rt 计算；能解释电炉丝热而导线不热等现象；能举例说明电热的利用和防止","sem":"全"},{"i":"cnp_078","n":"安全用电","s":"物理","g":9,"m":1,"c":"九全 第十九章 生活用电 19.1","d":"能量","x":"知道人体的安全电压不高于 36 V，了解触电的类型和原因，知道安全用电原则（不接触低压带电体，不靠近高压带电体）和触电急救方法。","k":"知道安全电压；能判断安全与不安全的用电行为；知道发现触电先切断电源","sem":"全"},{"i":"cnp_079","n":"家庭电路的基本组成","s":"物理","g":9,"m":1,"c":"九全 第十九章 生活用电 19.2","d":"能量","x":"了解家庭电路的组成（进户线、电能表、总开关、保险装置、插座、灯泡、开关等），知道火线和零线、试电笔的使用、三线插头和漏电保护器的作用，知道电流过大的原因。","k":"能说出家庭电路的组成顺序；会正确使用试电笔辨别火线零线；知道电流过大的两个原因（短路、总功率过大）","sem":"全"},{"i":"cnp_080","n":"跨学科实践：为家庭电路做设计","s":"物理","g":9,"m":1,"c":"九全 第十九章 生活用电 19.3","d":"跨学科实践","x":"综合家庭电路组成、安全用电和电功率知识，为房间设计电路：确定用电器连接方式、开关和插座位置，估算总功率并选择合适的导线和保险装置。","k":"能设计各用电器并联、开关控制火线的电路；能根据总功率估算干路电流并选择器材","sem":"全"},{"i":"cnp_081","n":"磁现象 磁场","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.1","d":"运动和相互作用","x":"知道磁体的磁极及磁极间相互作用规律；通过实验认识磁场，知道磁感线可以形象描述磁场，磁体外部磁感线从 N 极出发回到 S 极；知道地磁场。","k":"知道磁极间相互作用规律；知道磁感线的方向；知道地磁场的 N 极在地理南极附近","sem":"全"},{"i":"cnp_082","n":"电生磁","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.2","d":"运动和相互作用","x":"通过奥斯特实验知道电流周围存在磁场；探究并了解通电螺线管外部磁场的方向，会用安培定则判断通电螺线管的极性。","k":"知道奥斯特实验说明电流周围有磁场；会用安培定则判断螺线管 N 极；知道螺线管外部磁场与条形磁体相似","sem":"全"},{"i":"cnp_083","n":"电磁铁 电磁继电器","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.3","d":"运动和相互作用","x":"知道电磁铁的磁性有无可由通断电控制，磁性强弱与电流大小和线圈匝数有关；了解电磁继电器是利用低压控制电路控制高压工作电路的开关。","k":"能说出影响电磁铁磁性强弱的因素；知道电磁继电器的作用和原理；能举出电磁铁的应用","sem":"全"},{"i":"cnp_084","n":"电动机","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.4","d":"运动和相互作用","x":"通过实验了解通电导线在磁场中受力的作用，知道受力方向与电流方向和磁场方向有关；知道电动机的原理和能量转化，了解换向器的作用。","k":"知道通电导线在磁场中受力及影响方向的因素；知道电动机把电能转化为机械能；知道换向器的作用","sem":"全"},{"i":"cnp_085","n":"跨学科实践：制作简易直流电动机","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.5","d":"跨学科实践","x":"利用磁体、漆包线、电池等制作简易直流电动机，理解线圈转动的原因，能排查不转的故障并提出改进方法。","k":"能说出简易电动机的结构和原理；能分析线圈不转的原因并改进","sem":"全"},{"i":"cnp_086","n":"磁生电","s":"物理","g":9,"m":1,"c":"九全 第二十章 电与磁 20.6","d":"运动和相互作用","x":"探究并了解导体在磁场中运动时产生感应电流的条件（闭合电路的一部分导体做切割磁感线运动）；知道发电机的原理和能量转化，了解交流电。","k":"能说出产生感应电流的条件；知道发电机把机械能转化为电能；能区分电动机和发电机的原理","sem":"全"},{"i":"cnp_087","n":"电磁波的海洋","s":"物理","g":9,"m":1,"c":"九全 第二十一章 电磁波及其应用 21.1","d":"运动和相互作用","x":"知道电磁波的产生和传播，电磁波可以在真空中传播，速度 c = 3×10⁸ m/s；知道波长、频率和波速的关系 c = λf。","k":"知道电磁波在真空中的传播速度；会用 c = λf 计算；知道电磁波能在真空中传播","sem":"全"},{"i":"cnp_088","n":"广播、电视和移动通信","s":"物理","g":9,"m":1,"c":"九全 第二十一章 电磁波及其应用 21.2","d":"运动和相互作用","x":"了解广播、电视、移动电话利用电磁波传递信息的大致过程，知道手机既是发射台又是接收台。","k":"知道广播、电视和手机都用电磁波传递信息；知道手机既能发射又能接收电磁波","sem":"全"},{"i":"cnp_089","n":"卫星通信和光纤通信","s":"物理","g":9,"m":1,"c":"九全 第二十一章 电磁波及其应用 21.3","d":"运动和相互作用","x":"了解卫星通信（如北斗卫星导航系统）、光纤通信的特点；知道光纤是利用激光在光导纤维中多次反射传递信息。","k":"知道光纤通信利用激光在光纤内反射传播；知道卫星通信和北斗系统利用电磁波","sem":"全"},{"i":"cnp_090","n":"能源利用的现状和面临的挑战","s":"物理","g":9,"m":1,"c":"九全 第二十二章 能源与可持续发展 22.1","d":"能量","x":"知道一次能源和二次能源、可再生能源和不可再生能源，了解化石能源的使用现状和带来的环境问题，知道能量的转化和转移具有方向性。","k":"能区分可再生能源和不可再生能源；能举出化石能源带来的环境问题；知道能量转化具有方向性","sem":"全"},{"i":"cnp_091","n":"新能源的发展","s":"物理","g":9,"m":1,"c":"九全 第二十二章 能源与可持续发展 22.2","d":"能量","x":"了解核能（裂变、聚变）、太阳能、风能等新能源，知道核电站利用核裂变、太阳内部发生核聚变，知道核能利用可能带来的问题。","k":"知道核电站利用核裂变；知道太阳能来自太阳内部的核聚变；知道核能利用的优点和风险","sem":"全"},{"i":"cnp_092","n":"跨学科实践：为节约能源设计方案","s":"物理","g":9,"m":1,"c":"九全 第二十二章 能源与可持续发展 22.3","d":"跨学科实践","x":"调查学校或家庭的能源使用情况，运用效率、电功率等知识估算节能效果，设计可行的节约能源方案，体会可持续发展的重要性。","k":"能估算节能措施的节约量；能提出合理可行的节能方案","sem":"全"},{"i":"cnc_p001","n":"识字：天地人","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p002","n":"识字：金木水火土","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p003","n":"识字：口耳目手足","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p004","n":"识字：日月山川","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p005","n":"入学教育：我上学了","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p006","n":"语文园地一·我说你做","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p007","n":"快乐读书吧：读书真快乐","s":"语文","g":1,"m":0,"c":"一年级上册 第1单元 识字·天地人"},{"i":"cnc_p008","n":"单韵母 a、o、e 和四声","s":"语文","g":1,"m":0,"c":"一年级上册 第2单元 汉语拼音·单韵母"},{"i":"cnc_p009","n":"单韵母 i、u、ü","s":"语文","g":1,"m":0,"c":"一年级上册 第2单元 汉语拼音·单韵母"},{"i":"cnc_p010","n":"声母 b、p、m、f","s":"语文","g":1,"m":0,"c":"一年级上册 第2单元 汉语拼音·单韵母"},{"i":"cnc_p011","n":"声母 d、t、n、l","s":"语文","g":1,"m":0,"c":"一年级上册 第2单元 汉语拼音·单韵母"},{"i":"cnc_p012","n":"语文园地二·日积月累《画》","s":"语文","g":1,"m":0,"c":"一年级上册 第2单元 汉语拼音·单韵母"},{"i":"cnc_p013","n":"声母 g、k、h","s":"语文","g":1,"m":0,"c":"一年级上册 第3单元 汉语拼音·声母"},{"i":"cnc_p014","n":"声母 j、q、x","s":"语文","g":1,"m":0,"c":"一年级上册 第3单元 汉语拼音·声母"},{"i":"cnc_p015","n":"平舌声母 z、c、s","s":"语文","g":1,"m":0,"c":"一年级上册 第3单元 汉语拼音·声母"},{"i":"cnc :9,"m":1,"c":"九年级上册 第3单元 物质构成的奥秘","d":"物质的组成与结构","x":"知道原子由原子核和核外电子构成，原子核由质子和中子构成。原子中质子数等于核外电子数。","k":"能用微粒、元素或化学式表示物质的组成；能完成教材要求的简单判断或计算","sem":"上"},{"i":"cnk_j011","n":"元素","s":"化学","g":9,"m":1,"c":"九年级上册 第3单元 物质构成的奥秘","d":"物质的组成与结构","x":"元素是质子数相同的一类原子的总称。能书写常见元素符号，并知道元素周期表给出原子序数、符号和相对原子质量。","k":"能用微粒、元素或化学式表示物质的组成；能完成教材要求的简单判断或计算","sem":"上"},{"i":"cnk_j012","n":"水资源及其利用","s":"化学","g":9,"m":1,"c":"九年级上册 第4单元 自然界的水","d":"化学与社会·跨学科实践","x":"知道淡水并不充裕，能说出沉淀、过滤、吸附和蒸馏等净化水的方法，以及节约用水、防止水污染。","k":"能说出化学与资源、健康或材料的一个基本事实；能判断一种常见做法是否符合节约资源和保护环境","sem":"上"},{"i":"cnk_j013","n":"水的组成","s":"化学","g":9,"m":1,"c":"九年级上册 第4单元 自然界的水","d":"物质的性质与应用","x":"通过电解水知道水由氢、氧两种元素组成。氢气与氧气体积比约为 2:1，并会检验这两种气体。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"上"},{"i":"cnk_j014","n":"化学式与化合价","s":"化学","g":9,"m":1,"c":"九年级上册 第4单元 自然界的水","d":"物质的组成与结构","x":"能用化学式表示常见物质，知道常见元素的化合价，并据此书写简单化学式。这一部分属于「物质组成的表示」。","k":"能用微粒、元素或化学式表示物质的组成；能完成教材要求的简单判断或计算","sem":"上"},{"i":"cnk_j015","n":"根据化学式的计算","s":"化学","g":9,"m":1,"c":"九年级上册 第4单元 自然界的水","d":"物质的组成与结构","x":"能根据化学式，由相对原子质量求相对分子质量，并求元素质量比。计算用的相对原子质量在题中给出。这一部分仍属于「物质组成的表示」，不是单独的课题名。","k":"能用微粒、元素或化学式表示物质的组成；能完成教材要求的简单判断或计算","sem":"上"},{"i":"cnk_j016","n":"水的组成及变化的探究","s":"化学","g":9,"m":1,"c":"九年级上册 第4单元 自然界的水","d":"科学探究与化学实验","x":"完成实验活动：电解水，比较两端气体体积，并检验氢气和氧气。","k":"能说出本课的探究步骤或实验操作要点；能把现象和证据对应到教材中的结论","sem":"上"},{"i":"cnk_j017","n":"质量守恒定律","s":"化学","g":9,"m":1,"c":"九年级上册 第5单元 化学反应的定量关系","d":"物质的化学变化","x":"认识质量守恒定律：参加化学反应的各物质质量总和等于生成的各物质质量总和。能从原子种类、数目和质量不变来解释。","k":"能判断变化类型或写出相关的化学方程式；能用质量守恒或反应规律解释一个典型事实","sem":"上"},{"i":"cnk_j018","n":"化学方程式的书写","s":"化学","g":9,"m":1,"c":"九年级上册 第5单元 化学反应的定量关系","d":"物质的化学变化","x":"能根据实验事实书写简单化学方程式：配平、注明条件，气体和沉淀用箭头标出。不能改动化学式右下角的数字来配平。","k":"能判断变化类型或写出相关的化学方程式；能用质量守恒或反应规律解释一个典型事实","sem":"上"},{"i":"cnk_j019","n":"利用化学方程式的简单计算","s":"化学","g":9,"m":1,"c":"九年级上册 第5单元 化学反应的定量关系","d":"物质的化学变化","x":"能根据配平的化学方程式，由一种纯净物的质量求出另一种物质的质量。参加计算的必须是实际参加反应的纯净物质量。","k":"能判断变化类型或写出相关的化学方程式；能用质量守恒或反应规律解释一个典型事实","sem":"上"},{"i":"cnk_j020","n":"碳单质的多样性","s":"化学","g":9,"m":1,"c":"九年级上册 第6单元 碳和碳的氧化物","d":"物质的性质与应用","x":"知道金刚石、石墨等都由碳元素组成，但物理性质差异很大。知道木炭、活性炭有吸附性。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"上"},{"i":"cnk_j021","n":"二氧化碳的性质","s":"化学","g":9,"m":1,"c":"九年级上册 第6单元 碳和碳的氧化物","d":"物质的性质与应用","x":"知道二氧化碳的主要性质和用途：密度比空气大，能溶于水并与水反应，能使澄清石灰水变浑浊，一般不燃烧也不支持燃烧。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"上"},{"i":"cnk_j022","n":"一氧化碳","s":"化学","g":9,"m":1,"c":"九年级上册 第6单元 碳和碳的氧化物","d":"物质的性质与应用","x":"了解一氧化碳有可燃性和毒性，并能与某些金属氧化物反应。不把「还原性」当作必须记住的术语。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"上"},{"i":"cnk_j023","n":"二氧化碳的实验室制取","s":"化学","g":9,"m":1,"c":"九年级上册 第6单元 碳和碳的氧化物","d":"物质的性质与应用","x":"用大理石或石灰石与稀盐酸制取二氧化碳，选择固液不加热装置和向上排空气法，并用澄清石灰水检验。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"上"},{"i":"cnk_j024","n":"二氧化碳的实验室制取与性质","s":"化学","g":9,"m":1,"c":"九年级上册 第6单元 碳和碳的氧化物","d":"科学探究与化学实验","x":"完成实验活动：制取二氧化碳，检验，并观察它不支持燃烧、密度比空气大等性质。","k":"能说出本课的探究步骤或实验操作要点；能把现象和证据对应到教材中的结论","sem":"上"},{"i":"cnk_j025","n":"燃料的燃烧","s":"化学","g":9,"m":1,"c":"九年级上册 第7单元 能源的合理利用与开发","d":"物质的化学变化","x":"知道燃烧需要可燃物、与氧气接触以及温度达到着火点。灭火就是破坏其中至少一个条件。不采用具体的着火点数字。","k":"能判断变化类型或写出相关的化学方程式；能用质量守恒或反应规律解释一个典型事实","sem":"上"},{"i":"cnk_j026","n":"化石能源的合理利用","s":"化学","g":9,"m":1,"c":"九年级上册 第7单元 能源的合理利用与开发","d":"化学与社会·跨学科实践","x":"知道煤、石油、天然气是化石能源。石油分馏主要是物理变化。完全燃烧与不完全燃烧的产物不同。节约能源、减少排放。","k":"能说出化学与资源、健康或材料的一个基本事实；能判断一种常见做法是否符合节约资源和保护环境","sem":"上"},{"i":"cnk_j027","n":"燃烧条件的探究","s":"化学","g":9,"m":1,"c":"九年级上册 第7单元 能源的合理利用与开发","d":"科学探究与化学实验","x":"完成实验活动：用对照实验说明燃烧的三个条件。不记录红磷、白磷的具体着火点数字。","k":"能说出本课的探究步骤或实验操作要点；能把现象和证据对应到教材中的结论","sem":"上"},{"i":"cnk_j028","n":"金属材料","s":"化学","g":9,"m":1,"c":"九年级下册 第8单元 金属和金属材料","d":"物质的性质与应用","x":"知道金属的导电性、导热性、延展性和金属光泽，以及合金与纯金属的性质差异。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"下"},{"i":"cnk_j029","n":"金属与氧气、酸的反应","s":"化学","g":9,"m":1,"c":"九年级下册 第8单元 金属和金属材料","d":"物质的性质与应用","x":"知道常见金属与氧气、与稀酸反应的现象和化学方程式。铝表面的致密氧化膜能保护内部。","k":"能说出本课物质的主要性质或用途；能用性质解释一个教材中的典型事实","sem":"下"},{"i":"cnk_j030","n":"金属活动性顺序","s":"化学","g":9,"m":1,"c":"九年级下册 第8单元
