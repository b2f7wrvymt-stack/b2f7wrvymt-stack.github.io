吸引"],"a":0,"why":"摩擦起电只是电子从一个物体转移到另一个物体，电荷总量守恒，并未创造电荷。"}]},"cnp_061":{"core":["知道电流的形成和方向（正电荷定向移动的方向），知道电路的组成（电源、用电器、开关、导线），会看、会画简单电路图，了解通路、断路、短路"],"trap":"电路四种元件：电源、用电器、开关、导线。三种状态：通路、断路、短路。","quiz":[{"q":"关于电流方向和电路，下列说法正确的是","o":["规定正电荷定向移动的方向为电流方向","电路中可以没有电源","短路时用电器仍能正常工作"],"a":0,"why":"持续电流必须有电源且电路闭合；短路时电流绕过用电器直接回负极，会烧坏电源。"}]},"cnp_062":{"core":["知道串联电路和并联电路的连接特点，会连接简单的串联、并联电路，能说出生活中采用串联或并联的实例"],"trap":"判断方法：数电流路径。只有一条是串联，出现分支就是并联。","quiz":[{"q":"关于串、并联电路，下列说法正确的是","o":["家庭电路中各用电器是并联的","串联电路中各用电器可以独立工作","并联电路干路开关只控制一条支路"],"a":0,"why":"并联各支路互不影响，所以家用电器并联；串联电路中一个断开则全部停止；并联干路开关控制所有用电器。"}]},"cnp_063":{"core":["知道电流的单位安培（A）和毫安（mA），会使用电流表：串联在电路中，电流从“+”接线柱流入，选择合适的量程并正确读数"],"trap":"1 A = 1000 mA；读数前先看接的是哪个量程，再读对应刻度。","quiz":[{"q":"关于电流表的使用，下列说法正确的是","o":["电流表与被测电路串联，电流从「+」接线柱流入","电流表要并联在被测用电器两端","可以把电流表直接接到电源两极"],"a":0,"why":"电流表串联、正进负出、选合适量程；不经过用电器直接接电源两极会烧坏电表。"}]},"cnp_064":{"core":["探究并了解串联电路中电流处处相等，并联电路中干路电流等于各支路电流之和"],"trap":"串联 I = I₁ = I₂，并联 I = I₁ + I₂，两条规律别用反。","quiz":[{"q":"并联电路中干路电流为 0.8 A，一条支路为 0.3 A，另一条支路电流是","o":["0.5 A","1.1 A","0.8 A"],"a":0,"why":"并联 I = I₁ + I₂，故 I₂ = 0.8 − 0.3 = 0.5 A；串联电路才是电流处处相等。"}]},"cnp_065":{"core":["知道电压是形成电流的原因，单位伏特（V），记住一节干电池 1.5 V、家庭电路 220 V","会使用电压表：并联在被测电路两端，正进负出"],"trap":"电压是形成电流的原因；1 kV = 1000 V，1 V = 1000 mV。","quiz":[{"q":"关于电压与电压表，下列说法正确的是","o":["电压表并联在被测电路两端，一节干电池电压约 1.5 V","电压表要串联在电路中","家庭电路电压是 36 V"],"a":0,"why":"电压表并联、正进负出；一节干电池 1.5 V，家庭电路 220 V，人体安全电压不高于 36 V。"}]},"cnp_066":{"core":["探究并了解串联电路两端的总电压等于各部分电路两端电压之和，并联电路中各支路两端的电压相等且等于电源电压"],"trap":"串联「分压」、并联「分流」，记住这两句，电表示数变化题就好解了。","quiz":[{"q":"关于串、并联电路的电压，下列说法正确的是","o":["串联电路两端总电压等于各部分电压之和","并联电路各支路电压之和等于电源电压","串联电路各用电器两端电压一定相等"],"a":0,"why":"串联 U = U₁ + U₂（分压）；并联各支路电压相等且等于电源电压。串联只有规格相同的用电器才均分电压。"}]},"cnp_067":{"core":["知道电阻表示导体对电流的阻碍作用，单位欧姆（Ω）","知道导体的电阻与材料、长度、横截面积和温度有关，与电压、电流无关"],"trap":"导线越长、越细，电阻越大；多数金属温度越高电阻越大。1 MΩ = 10⁶ Ω。","quiz":[{"q":"关于电阻，下列说法正确的是","o":["电阻是导体本身的性质，与材料、长度、横截面积和温度有关，与电压电流无关","导体两端电压越大，电阻越大","通过导体的电流越大，电阻越小"],"a":0,"why":"R = U/I 只是计算电阻的方法，不能说电阻由电压电流决定；不加电压时电阻依然存在。"}]},"cnp_068":{"core":["知道滑动变阻器通过改变接入电路中电阻丝的长度来改变电阻，会正确连接（一上一下）并判断滑片移动时电阻的变化","了解其在电路中的作用"],"trap":"判断阻值变化只看「下接线柱到滑片之间」那段电阻丝的长度是变长还是变短。","quiz":[{"q":"关于滑动变阻器，下列说法正确的是","o":["通过改变接入电路中电阻丝的长度来改变电阻，接线要「一上一下」","接线要「两上」或「两下」","闭合开关前滑片应放在阻值最小处"],"a":0,"why":"「两下」接成定值电阻，「两上」等于接入一段导线，都不起变阻作用；闭合前应调到最大阻值以保护电路。"}]},"cnp_069":{"core":["运用电路连接和变阻器知识设计并制作简易调光台灯，分析滑片位置与灯泡亮度的关系，注意用电安全"],"trap":"接入电阻变大 → 电流变小 → 灯泡变暗；实际家庭电路中开关还必须接在火线上。","quiz":[{"q":"简易调光台灯中，灯泡与滑动变阻器应","o":["串联，靠改变接入电阻改变电流和亮度","并联，让变阻器直接分流","串联，但变阻器只起开关作用"],"a":0,"why":"必须串联才能改变通过灯泡的电流；若并联，灯泡两端电压始终等于电源电压，亮度不变。"}]},"cnp_070":{"core":["探究电流与电压、电阻的关系：电阻一定时电流与电压成正比，电压一定时电流与电阻成反比","会用控制变量法设计实验并分析数据"],"trap":"两个实验里滑动变阻器作用不同：前者用来改变定值电阻两端电压，后者用来保持不同电阻两端电压不变。","quiz":[{"q":"探究电流与电压、电阻的关系，下列说法正确的是","o":["电阻一定时电流与电压成正比；电压一定时电流与电阻成反比","电压一定时电流与电阻成正比","两个关系可以同时研究，不用控制变量"],"a":0,"why":"必须用控制变量法：先固定 R 研究 I 与 U，再固定 U 研究 I 与 R，不能同时改变两个量。"}]},"cnp_071":{"core":["理解欧姆定律 I = U/R，会用它及变形式 U = IR、R = U/I 进行计算","知道 R = U/I 只是计算电阻的方法，电阻不由电压和电流决定"],"trap":"计算时 I、U、R 必须对应同一导体、同一时刻，单位统一用 A、V、Ω。","quiz":[{"q":"关于欧姆定律 I = U/R 及变形式 R = U/I，下列说法正确的是","o":["R = U/I 只是计算电阻的方法，电阻不由电压和电流决定","由 R = U/I 可知电阻与电压成正比","导体两端电压为 0 时，电阻也为 0"],"a":0,"why":"电阻由导体本身决定，公式只是量度方式；电压为 0 时电流为 0，但电阻不变。"}]},"cnp_072":{"core":["会用伏安法（电流表和电压表）测量电阻：原理 R = U/I，能画电路图、连接电路、多次测量求平均值","知道小灯泡电阻随温度变化"],"trap":"电路：电流表串联、电压表并联在待测电阻两端，滑动变阻器串联用于改变电压并保护电路。","quiz":[{"q":"关于伏安法测电阻，下列说法正确的是","o":["原理是 R = U/I；测定值电阻可多次测量取平均值减小误差","原理是 R = U/I；测小灯泡电阻也应多次测量取平均值","电流表应与待测电阻并联"],"a":0,"why":"小灯泡电阻随温度升高而增大，多次测的是不同状态下的电阻，求平均值没有物理意义。"}]},"cnp_073":{"core":["能运用欧姆定律和串、并联电路的电流、电压规律进行计算","知道串联总电阻 R = R₁ + R₂，并联电路总电阻小于任一分电阻"],"trap":"两电阻并联可用 R = R₁R₂/(R₁+R₂)；分析滑片移动时电表示数变化，先判断总电阻怎么变，再用 I = U/R。","quiz":[{"q":"两个电阻 R₁ = 4 Ω、R₂ = 6 Ω 串联，总电阻是","o":["10 Ω","2.4 Ω","2 Ω"],"a":0,"why":"串联 R = R₁ + R₂ = 10 Ω；2.4 Ω 是它们并联时的总电阻，并联总电阻一定小于任一分电阻。"}]},"cnp_074":{"core":["知道电能的单位焦耳和千瓦时（度），1 kW·h = 3.6×10⁶ J","会读电能表并计算消耗的电能","知道电功 W = UIt"],"trap":"算用电量用「月末示数 − 月初示数」，电能表最后一位常是小数位，别读错。","quiz":[{"q":"关于电能与电功，下列说法正确的是","o":["1 kW·h = 3.6×10⁶ J，电功 W = UIt","1 kW·h = 3.6×10³ J","电能表测量的是电功率"],"a":0,"why":"1 kW·h = 1000 W × 3600 s = 3.6×10⁶ J；电能表（电度表）累计的是消耗的电能，不是功率。"}]},"cnp_075":{"core":["知道电功率表示电流做功的快慢，P = W/t = UI","知道额定电压、额定功率和实际功率","会进行简单计算"],"trap":"铭牌「220 V 100 W」可求正常工作电流 I = P/U，以及电阻 R = U²/P。","quiz":[{"q":"关于电功率，下列说法正确的是","o":["P = W/t = UI，表示电流做功的快慢","额定功率就是实际功率","用电器两端电压降低时，额定功率随之变小"],"a":0,"why":"额定功率是用电器在额定电压下的功率，是铭牌上的固定值；实际功率才随实际电压变化。"}]},"cnp_076":{"core":["调查家庭用电情况，运用电功和电功率知识估算用电量，从减小功率、缩短时间等方面提出节约用电的建议"],"trap":"节电两条路：减小功率（换节能电器）、缩短使用时间；W = Pt 计算时单位要配套（kW 配 h 得 kW·h，W 配 s 得 J）。","quiz":[{"q":"一台 1 kW 的空调使用 5 h，消耗的电能是","o":["5 kW·h（约 5 度电）","0.2 kW·h","5000 J"],"a":0,"why":"W = Pt = 1 kW × 5 h = 5 kW·h = 5 度 = 1.8×10⁷ J。"}]},"cnp_077":{"core":["通过实验了解电流的热效应，知道焦耳定律 Q = I²Rt","能用焦耳定律说明电热的利用和防止"],"trap":"并联（电压相同）时用 Q = U²t/R 比较更方便，电阻小的反而发热多——两种情形别混用。","quiz":[{"q":"关于焦耳定律 Q = I²Rt，下列说法正确的是","o":["电流产生的热量与电流的平方、电阻、通电时间成正比","电炉丝热而导线不热，是因为导线中的电流更小","串联电路中电阻越小发热越多"],"a":0,"why":"电炉丝与导线串联、电流相同，但电炉丝电阻大得多，由 Q = I²Rt 可知它发热多；串联时电流相同，电阻大的发热多。"}]},"cnp_078":{"core":["知道人体的安全电压不高于 36 V，了解触电的类型和原因，知道安全用电原则（不接触低压带电体，不靠近高压带电体）和触电急救方法"],"trap":"原则：不接触低压带电体，不靠近高压带电体；湿手不碰开关，不在电线上晾衣服。","quiz":[{"q":"关于安全用电，下列说法正确的是","o":["人体安全电压不高于 36 V；发现有人触电应先切断电源","安全电压是 220 V","发现有人触电应立刻用手把人拉开"],"a":0,"why":"先切断电源（或用干燥木棍挑开电线）再施救，直接用手拉会使施救者一起触电。"}]},"cnp_079":{"core":["了解家庭电路的组成（进户线、电能表、总开关、保险装置、插座、灯泡、开关等），知道火线和零线、试电笔的使用、三线插头和漏电保护器的作用，知道电流过大的原因"],"trap":"进户线顺序：电能表 → 总开关 → 保险装置；试电笔氖管发光的是火线；三孔插座「左零右火上接地」。","quiz":[{"q":"关于家庭电路，下列说法正确的是","o":["开关接在火线与用电器之间；电流过大的原因有短路和总功率过大","开关应接在零线上","保险装置应并联在电路中"],"a":0,"why":"开关接火线，断开后用电器不再带电才安全；保险装置要串联在干路上才能起到保护作用。"}]},"cnp_080":{"core":["综合家庭电路组成、安全用电和电功率知识，为房间设计电路：确定用电器连接方式、开关和插座位置，估算总功率并选择合适的导线和保险装置"],"trap":"三孔插座的接地线把用电器金属外壳接地，是为了防止漏电时触电。","quiz":[{"q":"设计家庭电路时，下列做法正确的是","o":["各用电器并联、开关接火线，按总功率估算干路电流后选导线与保险装置","各用电器串联便于统一控制","保险装置额定电流越大越安全"],"a":0,"why":"并联才能独立工作；总功率越大干路电流 I = P/U 越大；保险装置额定电流要与导线允许电流匹配，过大反而失去保护。"}]},"cnp_081":{"core":["知道磁体的磁极及磁极间相互作用规律","通过实验认识磁场，知道磁感线可以形象描述磁场，磁体外部磁感线从 N 极出发回到 S 极"],"trap":"磁感线是为描述磁场假想的曲线、实际不存在；磁场本身是真实存在的物质。","quiz":[{"q":"关于磁体和磁场，下列说法正确的是","o":["同名磁极相互排斥，磁体外部磁感线从 N 极出发回到 S 极","同名磁极相互吸引","地磁场的 N 极在地理北极附近"],"a":0,"why":"同名排斥、异名吸引；地磁场的 N 极在地理南极附近，所以指南针的 N 极指向北方。"}]},"cnp_082":{"core":["通过奥斯特实验知道电流周围存在磁场","探究并了解通电螺线管外部磁场的方向，会用安培定则判断通电螺线管的极性"],"trap":"安培定则：右手四指弯向电流方向，大拇指所指的那一端就是 N 极。","quiz":[{"q":"关于奥斯特实验和通电螺线管，下列说法正确的是","o":["奥斯特实验说明电流周围存在磁场；螺线管极性可用安培定则判断","奥斯特实验说明磁能生电","通电螺线管外部磁场与条形磁体完全不同"],"a":0,"why":"奥斯特实验是「电生磁」；通电螺线管外部磁场与条形磁体相似，极性用安培（右手螺旋）定则判断。"}]},"cnp_083":{"core":["知道电磁铁的磁性有无可由通断电控制，磁性强弱与电流大小和线圈匝数有关","了解电磁继电器是利用低压控制电路控制高压工作电路的开关"],"trap":"电磁继电器用低电压弱电流的控制电路，去控制高电压强电流的工作电路，本质是一个自动开关。","quiz":[{"q":"关于电磁铁，下列说法正确的是","o":["磁性的有无可由通断电控制，磁性强弱与电流大小和线圈匝数有关","磁性强弱只与电流大小有关","电磁铁用钢芯比铁芯好"],"a":0,"why":"电流越大、匝数越多磁性越强；软铁芯通电有磁、断电即消磁，钢芯会保留磁性反而不适用。"}]},"cnp_084":{"core":["通过实验了解通电导线在磁场中受力的作用，知道受力方向与电流方向和磁场方向有关","知道电动机的原理和能量转化，了解换向器的作用"],"trap":"受力方向与电流方向和磁场方向都有关；换向器在线圈刚过平衡位置时自动改变线圈中的电流方向。","quiz":[{"q":"关于电动机，下列说法正确的是","o":["原理是通电导线在磁场中受力运动，把电能转化为机械能","原理是电磁感应","能量转化是机械能转化为电能"],"a":0,"why":"电动机通电受力转动，电能→机械能；发电机才基于电磁感应，是机械能→电能。"}]},"cnp_085":{"core":["利用磁体、漆包线、电池等制作简易直流电动机，理解线圈转动的原因，能排查不转的故障并提出改进方法"],"trap":"半刮漆包线让线圈靠惯性转过半周，相当于一个最简单的「换向器」。","quiz":[{"q":"简易直流电动机线圈不转，下列排查思路不合理的是","o":["只要增大电源电压，任何故障都能排除","检查漆包线两端的漆是否按要求刮去（半刮）","检查磁体与线圈距离是否过远"],"a":0,"why":"常见故障是漆未刮净导致接触不良、磁体太远磁力弱、电池没电、线圈不平衡；单纯加压解决不了接触或平衡问题。"}]},"cnp_086":{"core":["探究并了解导体在磁场中运动时产生感应电流的条件（闭合电路的一部分导体做切割磁感线运动）","知道发电机的原理和能量转化，了解交流电"],"trap":"电动机＝通电受力（电能→机械能），发电机＝电磁感应（机械能→电能），两张原理图最常混考。","quiz":[{"q":"关于电磁感应，下列说法正确的是","o":["闭合电路的一部分导体做切割磁感线运动时，才产生感应电流","只要导体在磁场中运动就产生感应电流","发电机把电能转化为机械能"],"a":0,"why":"必须同时满足「闭合电路」「一部分导体」「切割磁感线」三个条件；发电机把机械能转化为电能。"}]},"cnp_087":{"core":["知道电磁波的产生和传播，电磁波可以在真空中传播，速度 c = 3×10⁸ m/s","知道波长、频率和波速的关系 c = λf"],"trap":"c = λf 中 c 一定，频率越高波长越短；计算时频率单位要先换成 Hz。","quiz":[{"q":"关于电磁波，下列说法正确的是","o":["电磁波可在真空中传播，速度 c = 3×10⁸ m/s，且 c = λf","电磁波不能在真空中传播","电磁波在真空中的速度是 340 m/s"],"a":0,"why":"电磁波传播不需要介质，真空中约 3×10⁸ m/s；340 m/s 是 15 ℃ 空气中的声速。"}]},"cnp_088":{"core":["了解广播、电视、移动电话利用电磁波传递信息的大致过程，知道手机既是发射台又是接收台"],"trap":"声音、图像信号要先「调制」到高频电磁波上才能发射，接收端再解调还原。","quiz":[{"q":"关于广播、电视和移动通信，下列说法正确的是","o":["都利用电磁波传递信息，手机既是发射台又是接收台","手机只能接收不能发射","移动电话靠超声波传递信息"],"a":0,"why":"广播、电视、手机都用电磁波；手机要双向通话，所以既能发射也能接收。"}]},"cnp_089":{"core":["了解卫星通信（如北斗卫星导航系统）、光纤通信的特点","知道光纤是利用激光在光导纤维中多次反射传递信息"],"trap":"光纤通信容量大、抗干扰强、损耗小；北斗卫星导航系统利用电磁波传递信息。","quiz":[{"q":"关于光纤通信，下列说法正确的是","o":["利用激光在光导纤维内多次反射传递信息","利用电磁波在真空中直线传播传递信息","利用电流在导线中传递信息"],"a":0,"why":"光在光纤内壁不断发生全反射把信息传到远端；卫星通信（含北斗）才是利用电磁波。"}]},"cnp_090":{"core":["知道一次能源和二次能源、可再生能源和不可再生能源，了解化石能源的使用现状和带来的环境问题，知道能量的转化和转移具有方向性"],"trap":"一次能源（直接取自自然）与二次能源（如电能，由一次能源加工得来）按「是否加工」划分，别和「可否再生」混。","quiz":[{"q":"下列能源中，属于可再生能源的是","o":["太阳能","煤","石油"],"a":0,"why":"太阳能、风能、水能可源源不断从自然界得到；煤、石油、天然气是化石能源，不可再生。"}]},"cnp_091":{"core":["了解核能（裂变、聚变）、太阳能、风能等新能源，知道核电站利用核裂变、太阳内部发生核聚变，知道核能利用可能带来的问题"],"trap":"核能优点是能量巨大、污染小；风险是核废料有放射性、事故泄漏危害大。","quiz":[{"q":"关于核能，下列说法正确的是","o":["核电站利用可控核裂变，太阳内部发生的是核聚变","核电站利用核聚变","太阳内部发生的是核裂变"],"a":0,"why":"现有核电站都是可控制的重核裂变链式反应；太阳的能量来自轻核聚变（热核反应）。"}]},"cnp_092":{"core":["调查学校或家庭的能源使用情况，运用效率、电功率等知识估算节能效果，设计可行的节约能源方案，体会可持续发展的重要性"],"trap":"方案要写清「谁、在什么时间、做什么、怎么检查」，和道法课里「可执行计划」的要求是同一套思路。","quiz":[{"q":"估算节能效果时，下列思路正确的是","o":["用 W = Pt 比较改造前后的电能差，并结合使用时间估算节约量","只比较电器功率大小，不考虑使用时间","用电器效率越高，一定越费电"],"a":0,"why":"用电量由功率和使用时间共同决定，两者都要算；效率提高意味着做同样的有用功耗电更少。"}]}};

    (pre[e.a]=pre[e.a]||[]).push(e);

  });
  var SUBJ=['语文','数学','英语','道法','历史','物理','化学'];
  var SUBJC={'语文':'#7c5b3f','数学':'#2f5d8a','英语':'#6b4a86','道法':'#a05a2c','历史':'#8a3f3f','物理':'#256b6b','化学':'#4a6b2f'};
  var GRADE={7:'七年级',8:'八年级',9:'九年级'};
  var st={q:'',subj:'全部',grade:0,onlyErr:false,onlyStar:false,onlyQuiz:false,limit:60,sel:null,view:'map',pane:'learn'};

  // localStorage 复习标记（file:// 下可能不可用，做容错）
  var stars={};
  try{ stars=JSON.parse(localStorage.getItem('kmap_stars')||'{}'); }catch(e){ stars={}; }
  function saveStars(){ try{ localStorage.setItem('kmap_stars',JSON.stringify(stars)); }catch(e){} }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hl(s){ var q=st.q.trim(); if(!q) return esc(s);
    return esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>'); }
  function mainNodes(){ return N.filter(function(n){return n.m===1;}); }

  // ---------- 筛选栏 ----------
  function buildChips(){
    var sr=document.getElementById('subjRow');
    var all=mainNodes();
    sr.innerHTML='<span class="lb">学科</span>';
    ['全部'].concat(SUBJ).forEach(function(s){
      var cnt = s==='全部'? all.length : all.filter(function(n){return n.s===s;}).length;
      var b=document.createElement('button');
      b.className='chip'+(st.subj===s?' on':'');
      b.innerHTML=esc(s)+'<span class="n">'+cnt+'</span>';
      b.onclick=function(){ st.subj=s; st.limit=60; buildChips(); renderList(); };
      sr.appendChild(b);
    });
    var gr=document.getElementById('gradeRow');
    Array.prototype.slice.call(gr.querySelectorAll('.chip')).forEach(function(x){x.remove();});
    var last=gr.querySelector('.lb');
    [{v:0,t:'全部'},{v:7,t:'七年级'},{v:8,t:'八年级'},{v:9,t:'九年级'}].forEach(function(g){
      var b=document.createElement('button');
      b.className='chip'+(st.grade===g.v?' on':'');
      b.textContent=g.t;
      b.onclick=function(){ st.grade=g.v; st.limit=60; buildChips(); renderList(); };
      gr.insertBefore(b, last.nextSibling);
      last=b;
    });
    document.getElementById('mistCnt').textContent = MIST.filter(function(m){return m.q!=='—';}).length;
  }

  function filtered(){
    var q=st.q.trim().toLowerCase();
    return mainNodes().filter(function(n){
      if(st.subj!=='全部' && n.s!==st.subj) return false;
      if(st.grade && n.g!==st.grade) return false;
      if(st.onlyErr && !(n.w&&n.w.length)) return false;
      if(st.onlyStar && !stars[n.i]) return false;
      if(st.onlyQuiz && !LESSONS[n.i]) return false;
      if(q){
        var t=(n.n+' '+(n.c||'')+' '+(n.d||'')+' '+(n.x||'')).toLowerCase();
        if(t.indexOf(q)<0) return false;
      }
      return true;
    });
  }

  // ---------- 列表 ----------
  function renderList(){
    var arr=filtered(), box=document.getElementById('list');
    var errN=arr.filter(function(n){return n.w&&n.w.length;}).length;
    document.getElementById('stat').textContent =
      '共 '+arr.length+' 个知识点 · 其中 '+errN+' 个关联错题';
    if(!arr.length){ box.innerHTML='<div class="empty">没有匹配的知识点，换个关键词或清掉筛选试试</div>'; return; }
    var show=arr.slice(0,st.limit), h='';
    show.forEach(function(n){
      var tags='<span class="tag" style="background:'+SUBJC[n.s]+'18;color:'+SUBJC[n.s]+'">'+esc(n.s)+'</span>'+
               '<span class="tag g">'+GRADE[n.g]+(n.sem?('·'+esc(n.sem)):'')+'</span>';
      if(n.w&&n.w.length) tags+='<span class="tag err">错题关联 '+n.w.length+'</span>';
      if(stars[n.i]) tags+='<span class="tag star">★ 复习</span>';
      if(LESSONS[n.i]) tags+='<span class="tag lsn">精讲·'+LESSONS[n.i].quiz.length+'题</span>';
      if(qrec[n.i] && qrec[n.i].mastered) tags+='<span class="tag ok">已掌握</span>';
      h+='<div class="li'+(st.sel===n.i?' on':'')+'" data-id="'+esc(n.i)+'">'+
         (n.w&&n.w.length?'<span class="dot"></span>':'')+
         '<div class="body"><div class="nm">'+hl(n.n)+'</div>'+
         '<div class="cp">'+tags+esc(n.c||'')+'</div></div></div>';
    });
    if(arr.length>st.limit) h+='<div class="more" id="moreBtn">↓ 还有 '+(arr.length-st.limit)+' 个，点击加载更多</div>';
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('.li'),function(el){
      el.onclick=function(){ st.sel=el.getAttribute('data-id'); renderList(); renderDetail(); };
    });
    var mb=document.getElementById('moreBtn');
    if(mb) mb.onclick=function(){ st.limit+=80; renderList(); };
  }

  // ---------- 先修链（BFS 分层，去重防环）----------
  function upstream(id){
    var levels=[], seen={}, cur=[id];
    seen[id]=1;
    for(var d=0; d<7; d++){
      var nxt=[];
      cur.forEach(function(x){
        (pre[x]||[]).forEach(function(e){
          if(seen[e.b]) return;
          seen[e.b]=1; nxt.push(e);
        });
      });
      if(!nxt.length) break;
      levels.push(nxt);
      cur=nxt.map(function(e){return e.b;});
      if(Object.keys(seen).length>160) break;
    }
    return levels;
  }

  function nodeLine(e, isRoot){
    var n=byId[e.b]; if(!n) return '';
    var hard=e.h===1;
    var tag=n.m===1?'':'<span class="badge-pri">小学基础</span>';
    var g=n.m===1?'<span class="tag g">'+GRADE[n.g]+'</span>':'';
    return '<div class="node" data-id="'+esc(n.i)+'">'+
      '<span class="hh '+(hard?'hard':'soft')+'">'+(hard?'必需':'相关')+'</span>'+
      '<div><b>'+esc(n.n)+'</b> '+tag+g+
      (e.r?'<span class="r">'+esc(e.r)+'</span>':'')+'</div></div>';
  }


  // ===== 学习模式：答题记录（本机 localStorage） =====
  var qrec={}, qs={};
  try{ qrec=JSON.parse(localStorage.getItem('kmap_quiz2')||'{}'); }catch(e){ qrec={}; }
  function saveQ(){ try{ localStorage.setItem('kmap_quiz2',JSON.stringify(qrec)); }catch(e){} }

  function paneTabs(active, hasQuiz){
    return '<div class="ptabs">'+
      '<button class="ptab'+(active==='link'?' on':'')+'" data-p="link">① 联系点</button>'+
      '<button class="ptab'+(active==='learn'?' on':'')+'" data-p="learn">② 讲解</button>'+
      '<button class="ptab'+(active==='quiz'?' on':'')+'" data-p="quiz">③ 随堂测'+(hasQuiz?'':' <span class="muted">待配</span>')+'</button>'+
      '</div>';
  }

  function linkHTML(id,n){
    var h='';
    if(n.w && n.w.length){
      h+='<div class="sec"><h3 style="color:var(--err)">⚠ 关联错题（孩子期中卷失分点）</h3><div class="errbox"><ul>';
      n.w.forEach(function(t){ h+='<li data-mist="'+esc(t)+'">'+esc(t)+' → 点击查看错因与对策</li>'; });
      h+='</ul></div></div>';
    }
    var lv=upstream(id);
    h+='<div class="sec"><h3>先修链 · 往回追根因 <span class="cnt">共 '+lv.length+' 层，'+lv.reduce(function(a,b){return a+b.length;},0)+' 个前置点</span></h3>';
    if(!lv.length){
      h+='<div class="desc" style="color:var(--sub)">这是该学科链条里最基础的点，没有更上游的前置知识点。</div>';
    }else{
      lv.forEach(function(arr,i){
        h+='<div class="lv"><div class="lvt">第 '+(i+1)+' 层前置'+(i===0?'（学这个点之前要先会这些）':'')+'</div>';
        arr.forEach(function(e){ h+=nodeLine(e); });
        h+='</div>';
      });
      h+='<div class="mk" style="color:var(--sub)">橙色「必需」= 硬先修，不掌握会直接卡住；灰色「相关」= 软先修，影响理解深度。标「小学基础」的是回溯到小学的根节点——<b>反复错同一个初中点，往往要回到这一层补</b>。</div>';
    }
    h+='</div>';
    var postArr=(post[id]||[]).filter(function(a){return byId[a]&&byId[a].m===1;});
    if(postArr.length){
      h+='<div class="sec"><h3>后继知识点 <span class="cnt">这个点没掌握，会影响后面 '+postArr.length+' 个点</span></h3>';
      postArr.slice(0,14).forEach(function(a){
        var p=byId[a];
        h+='<div class="node" data-id="'+esc(a)+'"><span class="hh soft">后续</span><div><b>'+esc(p.n)+'</b> <span class="tag g">'+GRADE[p.g]+'</span></div></div>';
      });
      if(postArr.length>14) h+='<div class="mk" style="color:var(--sub)">…另有 '+(postArr.length-14)+' 个</div>';
      h+='</div>';
    }
    // 同章节邻近点：横向联系
    var near=mainNodes().filter(function(x){
      return x.i!==id && x.s===n.s && x.c===n.c;
    }).slice(0,10);
    if(near.length){
      h+='<div class="sec"><h3>同章节邻近点 <span class="cnt">横向串一遍更容易记</span></h3>';
      near.forEach(function(x){
        h+='<div class="node" data-id="'+esc(x.i)+'"><span class="hh soft">同章</span><div><b>'+esc(x.n)+'</b>'+
           (LESSONS[x.i]?' <span class="tag lsn">有讲解与题</span>':'')+'</div></div>';
      });
      h+='</div>';
    }
    return h;
  }

  function learnHTML(id,n,L){
    var h='';
    if(L){
      h+='<div class="lcard"><h4>课本要点 · 精讲</h4>';
      h+='<ul>';
      L.core.forEach(function(t){ h+='<li>'+esc(t)+'</li>'; });
      h+='</ul>';
      if(L.eg) h+='<div class="eg"><b>举个例子：</b>'+esc(L.eg)+'</div>';
      if(L.trap) h+='<div class="trap"><b>易错提醒：</b>'+esc(L.trap)+'</div>';
      h+='</div>';
    }else{
      h+='<div class="sec"><h3>知识点说明</h3><div class="basic">'+esc(n.x||'（本点暂无说明）')+'</div></div>'+
         '<div class="mk" style="font-size:12.5px;color:var(--sub)">这是图谱自带的课本式说明；本点尚未配「精讲 + 例子 + 易错提醒」。</div>';
    }
    if(n.k) h+='<div class="mk" style="margin-top:12px"><b>掌握标准：</b>'+esc(n.k)+'</div>';
    var rec=qrec[id]||{};
    h+='<div class="selfbox">现在能独立说出要点、并做对相关的题吗？'+
       '<div><button class="btn2" data-self="1">✓ 已掌握</button>'+
       '<button class="btn2" data-self="0">还没会，标为待复习</button></div>'+
       '<div class="sstate">当前状态：'+(rec.mastered?'<b style="color:#3a6b2f">已掌握</b>':'尚未标记')+'</div></div>';
    return h;
  }

  function quizHTML(id,n,L){
    if(!L || !L.quiz || !L.quiz.length){
      return '<div class="emptybox">本知识点暂未配随堂测。<br>可以先看「② 讲解」，再用下面的按钮做自评，同样会记进学习进度。</div>'+
             '<div class="selfbox"><div>自评一下这个点：</div>'+
             '<button class="btn2" data-self="1">✓ 已掌握</button>'+
             '<button class="btn2" data-self="0">还没会，标为待复习</button></div>';
    }
    var s=qs[id]||(qs[id]={ans:{},done:false});
    var answered=Object.keys(s.ans).length;
    var h='<div class="qhead">共 '+L.quiz.length+' 题 · 点选项即时判分 · 全部答完后判定本点是否掌握</div>'+
          '<div class="qbar"><div class="qbar-in" style="width:'+Math.round(answered/L.quiz.length*100)+'%"></div></div>';
    L.quiz.forEach(function(it,i){
      h+='<div class="qcard"><div class="qt"><b>'+(i+1)+'.</b> '+esc(it.q)+'</div><div class="qopts">';
      it.o.forEach(function(o,j){
        var cls='qopt';
        if(s.ans[i]!=null){
          if(j===it.a) cls+=' right';
          else if(j===s.ans[i]) cls+=' wrong';
          else cls+=' dim';
        }
        h+='<button class="'+cls+'" data-qi="'+i+'" data-oi="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>';
      });
      h+='</div>';
      if(s.ans[i]!=null){
        var ok=s.ans[i]===it.a;
        h+='<div class="qwhy '+(ok?'ok':'no')+'">'+(ok?'✓ 答对了。':'✗ 答错了，正确答案是 '+String.fromCharCode(65+it.a)+'。')+'　'+esc(it.why)+'</div>';
      }
      h+='</div>';
    });
    if(s.done){
      var right=0;
      L.quiz.forEach(function(it,i){ if(s.ans[i]===it.a) right++; });
      var all=right===L.quiz.length;
      h+='<div class="qsum '+(all?'good':'bad')+'"><b>'+right+' / '+L.quiz.length+' 题答对</b>　'+
         (all?'本点已判定为「已掌握」✓，列表里会出现绿色标记。':'有错的题，建议回「② 讲解」把易错提醒再看一遍，然后再练一次。')+
         '<div class="qsumact"><button class="btn2" id="redoBtn">再练一遍</button>'+
         '<button class="btn2" id="goLearn">回看讲解</button></div></div>';
    }
    return h;
  }

  function renderDetail(){
    var box=document.getElementById('detail'), id=st.sel, n=byId[id];
    if(!n){ return; }
    var L=LESSONS[id]||null;
    var h='<div class="dh"><h2>'+esc(n.n)+'</h2>'+
      '<button class="starbtn'+(stars[id]?' on':'')+'" id="starBtn">'+(stars[id]?'★ 已标复习':'☆ 标记复习')+'</button></div>';
    h+='<div class="kv"><span class="tag" style="background:'+SUBJC[n.s]+'18;color:'+SUBJC[n.s]+'">'+esc(n.s)+'</span> '+
       GRADE[n.g]+(n.sem?(' · '+esc(n.sem)+'册'):'')+' · '+esc(n.c||'')+(n.d?(' · '+esc(n.d)):'')+
       (n.m===0?' · <b style="color:#5a6b86">小学上游基础（仅用于追溯根因）</b>':'')+'</div>';
    h+=paneTabs(st.pane, !!L);
    h+='<div class="pane" id="paneLink" style="display:'+(st.pane==='link'?'':'none')+'">'+linkHTML(id,n)+'</div>';
    h+='<div class="pane" id="paneLearn" style="display:'+(st.pane==='learn'?'':'none')+'">'+learnHTML(id,n,L)+'</div>';
    h+='<div class="pane" id="paneQuiz" style="display:'+(st.pane==='quiz'?'':'none')+'">'+quizHTML(id,n,L)+'</div>';
    box.innerHTML=h;
    box.scrollTop=0;
    bindDetail(box,id,n,L);
  }

  function bindDetail(box,id,n,L){
    var sb=document.getElementById('starBtn');
    if(sb) sb.onclick=function(){ if(stars[id]) delete stars[id]; else stars[id]=1; saveStars(); renderList(); renderDetail(); };
    Array.prototype.forEach.call(box.querySelectorAll('.node'),function(el){
      el.onclick=function(){ st.sel=el.getAttribute('data-id'); renderDetail(); renderList(); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-mist]'),function(el){
      el.onclick=function(){ openMist(el.getAttribute('data-mist')); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('.ptab'),function(el){
      el.onclick=function(){
        st.pane=el.getAttribute('data-p');
        Array.prototype.forEach.call(box.querySelectorAll('.pane'),function(p){ p.style.display='none'; });
        document.getElementById('pane'+({link:'Link',learn:'Learn',quiz:'Quiz'}[st.pane])).style.display='';
        Array.prototype.forEach.call(box.querySelectorAll('.ptab'),function(t){ t.className='ptab'+(t===el?' on':''); });
        box.scrollTop=0;
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-self]'),function(el){
      el.onclick=function(){
        var v=el.getAttribute('data-self')==='1';
        var rec=qrec[id]||(qrec[id]={r:0,w:0,mastered:0});
        rec.mastered=v?1:0;
        if(!v) stars[id]=1;
        saveQ(); saveStars(); renderList(); renderDetail();
      };
    });
    Array.prototype.forEach.call(box.querySelectorAll('.qopt'),function(el){
      el.onclick=function(){
        var qi=+el.getAttribute('data-qi'), oi=+el.getAttribute('data-oi');
        var s=qs[id]||(qs[id]={ans:{},done:false});
        if(s.ans[qi]!=null) return;
        s.ans[qi]=oi;
        var ok=oi===L.quiz[qi].a;
        var rec=qrec[id]||(qrec[id]={r:0,w:0,mastered:0});
        if(ok) rec.r=(rec.r||0)+1; else rec.w=(rec.w||0)+1;
        var done=true, allRight=true;
        L.quiz.forEach(function(it,i){ if(s.ans[i]==null) done=false; else if(s.ans[i]!==it.a) allRight=false; });
        if(done){ s.done=true; rec.mastered=(allRight?1:0); }
        saveQ();
        var pane=document.getElementById('paneQuiz');
        pane.innerHTML=quizHTML(id,n,L);
        bindDetail(pane,id,n,L);
        renderList();
        if(s.done){
          var d=document.getElementById('detail');
          setTimeout(function(){ d.scrollTop=d.scrollHeight; },30);
        }
      };
    });
    var rb=document.getElementById('redoBtn');
    if(rb) rb.onclick=function(){ qs[id]={ans:{},done:false};
      document.getElementById('paneQuiz').innerHTML=quizHTML(id,n,L);
      bindDetail(document.getElementById('paneQuiz'),id,n,L); };
    var gl=document.getElementById('goLearn');
    if(gl) gl.onclick=function(){ st.pane='learn'; renderDetail(); };
  }

  // ===== 学习进度视图 =====

      '<div class="pcard"><div class="v">'+tested.length+'</div><div class="l">已做过的知识点</div></div>'+
      '<div class="pcard"><div class="v">'+mastered.length+'</div><div class="l">已判定掌握</div></div>'+
      '<div class="pcard"><div class="v">'+rate+'%</div><div class="l">累计正确率（'+(R+W)+' 题）</div></div>'+
      '</div>';

    h+='<div class="psect">分学科进度</div><table class="ptable"><thead><tr>'+
       '<th>学科</th><th>知识点</th><th>有精讲</th><th>已测点</th><th>已掌握</th><th>答题正确率</th></tr></thead><tbody>';
    SUBJ.forEach(function(s){
      var arr=all.filter(function(n){return n.s===s;});
      var l=arr.filter(function(n){return LESSONS[n.i];}).length;
      var t=arr.filter(function(n){return qrec[n.i] && (qrec[n.i].r||0)+(qrec[n.i].w||0)>0;}).length;
      var m=arr.filter(function(n){return qrec[n.i] && qrec[n.i].mastered;}).length;

      h+='<tr><td>'+s+'</td><td class="n">'+arr.length+'</td><td class="n">'+l+'</td>'+
         '<td class="n">'+t+'</td><td class="n">'+m+'</td><td class="n">'+pc+'</td></tr>';
    });
    h+='</tbody></table>';

    var weak=ids.filter(function(k){return (qrec[k].w||0)>0;})
      .sort(function(a,b){return (qrec[b].w||0)-(qrec[a].w||0);}).slice(0,15);
    h+='<div class="psect">需要回头看的点 <span style="font-weight:400;color:var(--sub);font-size:12px">按答错次数排</span></div>';
    if(!weak.length){
      h+='<div class="emptybox">还没有答错记录。勾上筛选栏的「只看有随堂测的点」，挑一个带「精讲」标签的点练一练。</div>';
    }else{
      h+='<div class="pweak">';
      weak.forEach(function(k){
        var nn=byId[k];
        h+='<div class="w" data-go="'+esc(k)+'"><span class="tag" style="background:'+SUBJC[nn.s]+'18;color:'+SUBJC[nn.s]+'">'+esc(nn.s)+'</span>'+
           esc(nn.n)+'<span class="c">错 '+(qrec[k].w||0)+' 次 / 对 '+(qrec[k].r||0)+' 次</span></div>';
      });
      h+='</div>';
    }
    h+='<div class="note" style="margin-top:22px">'+
       '<b>关于题目：</b>随堂测是依据每个知识点自带的「课本说明 / 掌握标准」编写的<b>巩固练习题</b>，不是真题，也不是学校原题；'+
       '目的是看完讲解后立刻自检。真正的试卷原题仍在四科错题档案里，本页只做知识点定位。<br>'+
       '<b>关于覆盖：</b>物理、数学两科的知识点已全部配齐精讲与随堂测；其余学科的知识点可看讲解、先修链，并用自评标记掌握。<br>'+
       '<b>关于数据：</b>答题、掌握、★ 复习标记全部只存在本机浏览器，不上传、不联网。换浏览器或换设备会各存一份。<br>'+
       '<button class="btn2" id="clrBtn" style="color:var(--err)">清空本机学习记录</button></div>';
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('[data-go]'),function(el){
      el.onclick=function(){ st.sel=el.getAttribute('data-go'); st.pane='quiz'; st.q=''; st.subj='全部';
        st.grade=0; st.onlyErr=false; st.onlyStar=false; st.onlyQuiz=false;
        switchView('map'); document.getElementById('q').value='';
        buildChips(); renderList(); renderDetail(); };
    });
    var cb=document.getElementById('clrBtn');
    if(cb) cb.onclick=function(){
      if(!window.confirm('确定清空本机全部答题与掌握记录？此操作不可撤销。')) return;
      qrec={}; qs={}; saveQ(); renderList(); renderProg();
    };
  }

  // ---------- 错题本 ----------
  function renderMist(){
    var box=document.getElementById('vMist'), h='';
    ['语文','数学','英语','道法','历史','物理','化学'].forEach(function(s){
      var arr=MIST.filter(function(m){return m.s===s;});
      if(!arr.length) return;
      h+='<div class="grp">'+esc(s)+'（'+arr.length+'）</div>';
      arr.forEach(function(m){
        var rel=mainNodes().filter(function(n){return n.s===s && n.w && n.w.indexOf(m.t)>=0;});
        var empty=m.q==='—';
        h+='<div class="mist'+(empty?' m-empty':'')+'">'+
          '<div class="mt">'+esc(m.t)+(empty?'':'<span class="mq">'+esc(m.q)+'</span>')+'</div>'+
          '<div class="ml"><b>错因</b>'+esc(m.w)+'</div>'+
          '<div class="ml"><b>对策</b>'+esc(m.fix)+'</div>'+
          (rel.length?'<div class="mact"><a data-go="'+esc(rel[0].i)+'">→ 定位到 '+rel.length+' 个相关知识点（点第一个查看先修链）</a></div>':'')+
          '</div>';
      });
    });
    h+='<div class="note">错题来源：2026 秋期中四科错题档案（语文 / 道法 / 历史 / 物理）。数学、英语、化学试卷尚未上传，为占位条目。<br>'+
       '「关联知识点」按关键词自动匹配，仅作定位参考，请以试卷和课本为准。</div>';
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('[data-go]'),function(el){
      el.onclick=function(){ st.sel=el.getAttribute('data-go'); st.q=''; st.subj='全部'; st.grade=0;
        st.onlyErr=false; st.onlyStar=false; switchView('map'); document.getElementById('q').value='';
        buildChips(); renderList(); renderDetail(); };
    });
  }
  function openMist(t){
    switchView('mist'); renderMist();
    setTimeout(function(){
      var els=document.querySelectorAll('#vMist .mt');
      for(var i=0;i<els.length;i++){ if(els[i].textContent.indexOf(t)>=0){
        els[i].scrollIntoView({block:'center'}); els[i].parentNode.style.boxShadow='0 0 0 2px var(--err)'; break; } }
    },60);
  }

  // ---------- 视图切换 ----------
  function switchView(v){
    st.view=v;
    document.getElementById('vMap').style.display = v==='map'?'':'none';
    document.getElementById('vMist').style.display = v==='mist'?'':'none';
    document.getElementById('vProg').style.display = v==='prog'?'':'none';
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
      t.className='tab'+(t.getAttribute('data-v')===v?' on':'');
    });
    if(v==='mist') renderMist();
    if(v==='prog') renderProg();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.onclick=function(){ switchView(t.getAttribute('data-v')); };
  });

  // ---------- 事件 ----------
  var qt;
  document.getElementById('q').oninput=function(e){
    clearTimeout(qt); var v=e.target.value;
    qt=setTimeout(function(){ st.q=v; st.limit=60; renderList(); },160);
  };
  document.getElementById('onlyErr').onchange=function(e){ st.onlyErr=e.target.checked; st.limit=60; renderList(); };
  document.getElementById('onlyStar').onchange=function(e){ st.onlyStar=e.target.checked; st.limit=60; renderList(); };
  document.getElementById('onlyQuiz').onchange=function(e){ st.onlyQuiz=e.target.checked; st.limit=60; renderList(); };

  // ---------- 底部说明 ----------
  var main=mainNodes().length;
  document.getElementById('note').innerHTML =
    '数据说明：知识点与先修关系抽取自开源项目 <b>cn-math-taxonomy</b>（CC BY-NC 4.0，个人学习免费），'+
    '覆盖七至九年级 7 科共 <b>'+main+'</b> 个知识点、'+E.length+' 条先修关系；'+
    '另有小学上游基础点仅用于回溯根因，不列入主列表。题目与先修强弱关系由项目作者整理，尚待一线教师审核，请与课本、老师讲评对照使用。<br>'+
    '本页面为完全离线的单文件工具：数据内嵌、无联网请求、无外部依赖；「★ 复习」、答题与掌握记录均保存在本机浏览器。<br>'+
    '<b>学习版新增：</b>每个知识点分「① 联系点 / ② 讲解 / ③ 随堂测」三段；随堂测是依据课本说明编写的<b>巩固练习题（非真题、非学校原题）</b>，仅用于看完讲解后自检，请以课本和老师讲评为准。<br>'+
    '当前已为 <b>'+mainNodes().filter(function(n){return LESSONS[n.i];}).length+'</b> 个知识点配齐精讲与随堂测，其中<b>物理、数学两科全覆盖</b>；其余学科知识点可正常查看讲解、先修链并用自评标记掌握。';

  buildChips(); renderList();
})();
</script>
