m":1,"c":"九年级下册 第4单元 读书与鉴赏","d":"阅读理解","x":"读懂李可染谈的意境：景和情结合，还要有认识对象的能力和意匠。","k":"能根据课文选出和文字一致的信息；能说出文章的主要内容和思想感情","sem":"下"},{"i":"cnc_j181","n":"鉴赏两篇：无言与想象","s":"语文","g":9,"m":1,"c":"九年级下册 第4单元 读书与鉴赏","d":"阅读理解","x":"分清朱光潜《无言之美》里的含蓄，和叶圣陶《驱遣我们的想象》里读者要做的事。","k":"能根据课文选出和文字一致的信息；能说出文章的主要内容和思想感情","sem":"下"},{"i":"cnc_j182","n":"写作：修改润色","s":"语文","g":9,"m":1,"c":"九年级下册 第4单元 读书与鉴赏","d":"习作基础","x":"修改要先看意思对不对、顺不顺，再调词语，不是只把句子换成更华丽的说法。","k":"能判断哪一段更符合本次写作要求；能指出材料、中心或顺序上的明显问题","sem":"下"},{"i":"cnc_j183","n":"口语交际：辩论","s":"语文","g":9,"m":1,"c":"九年级下册 第4单元 读书与鉴赏","d":"习作基础","x":"辩论要先听清对方的观点，再用理由和例子反驳，不攻击人，也不只重复自己的口号。","k":"能判断哪一段更符合本次写作要求；能指出材料、中心或顺序上的明显问题","sem":"下"},{"i":"cnc_j184","n":"话剧《屈原》（节选）","s":"语文","g":9,"m":1,"c":"九年级下册 第5单元 舞台人生","d":"阅读理解","x":"读懂郭沫若历史剧《屈原》的节选：雷电颂是人物的独白，不是屈原的传记。","k":"能根据课文选出和文字一致的信息；能说出文章的主要内容和思想感情","sem":"下"},{"i":"cnc_j185","n":"话剧《天下第一楼》（节选）","s":"语文","g":9,"m":1,"c":"九年级下册 第5单元 舞台人生","d":"阅读理解","x":"读懂何冀平《天下第一楼》：福聚德烤鸭店的兴衰，以及卢孟实怎样撑住这座「楼」。","k":"能根据课文选出和文字一致的信息；能说出文章的主要内容和思想感情","sem":"下"},{"i":"cnc_j186","n":"话剧《枣儿》","s":"语文","g":9,"m":1,"c":"九年级下册 第5单元 舞台人生","d":"阅读理解","x":"读懂孙鸿《枣儿》：老人和男孩都在枣树下等不归的亲人，枣儿连着乡情。","k":"能根据课文选出和文字一致的信息；能说出文章的主要内容和思想感情","sem":"下"},{"i":"cnc_j187","n":"戏剧排练与评议","s":"语文","g":9,"m":1,"c":"九年级下册 第5单元 舞台人生","d":"习作基础","x":"排练要分清台词和舞台说明，评议要说出哪里听得见人物，而不是只说「演得很好」。","k":"能判断哪一段更符合本次写作要求；能指出材料、中心或顺序上的明显问题","sem":"下"},{"i":"cnc_j188","n":"写作：有创意地表达","s":"语文","g":9,"m":1,"c":"九年级下册 第6单元 创意与余响","d":"习作基础","x":"创意是换一个自己的角度把话说清，仍然扣题，不是故意写得别人看不懂。题目原文未逐页核对。","k":"能判断哪一段更符合本次写作要求；能指出材料、中心或顺序上的明显问题","sem":"下"},{"i":"cnc_j189","n":"课外古诗词四首（下）","s":"语文","g":9,"m":1,"c":"九年级下册 第6单元 创意与余响","d":"古诗文积累","x":"分清文天祥《南安军》、夏完淳《别云间》、张养浩《山坡羊·骊山怀古》、王磐《朝天子·咏喇叭》。","k":"能背出本课要求积累的诗句；能分清作者、诗题和名句，不把字句记错","sem":"下"},{"i":"cnd_j001","n":"把初中安排写成可执行计划","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"开启初中生活框：奏响中学序曲；规划初中生活。可执行计划要写出谁在何时做哪一件具体事、做到什么程度、用什么办法检查，并在做不到时改步骤而不是只改口号。","k":"能指出一份安排缺了时间、动作或检查中的哪一项，因而还不能执行。；能在时间或条件变了之后，把原步骤改成仍可完成的下一步。","sem":"上"},{"i":"cnd_j002","n":"适应初中新变化","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"开启初中生活框：奏响中学序曲；规划初中生活。适应是看清初中在学习方式、校园环境或同伴交往上已经改变的地方，并改用对得上这种变化的做法；不适应当作没变化，也不把短暂不习惯当成无法留下。","k":"能指出一件具体的新变化，并选出与它对得上的做法。；能把短暂不习惯和拒绝了解新环境区分开。","sem":"上"},{"i":"cnd_j003","n":"把初中目标定得可核对且贴合条件","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"开启初中生活框：奏响中学序曲；规划初中生活。合理目标写清在当前时间内要做到、并能事后判断有没有做到的结果；它不是口号，也不是照搬别人在不同条件下的成绩。","k":"能区分可事后判断的目标与无法核对的口号。；能根据自己的时间和已有基础，拒绝明显不贴合的目标。","sem":"上"},{"i":"cnd_j004","n":"用多种渠道认识自己","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"正确认识自我框：认识自己；做更好的自己。认识自己要把自己的观察、别人指出的具体事实和做事的结果放在一起看；一次夸奖或一次指责都不足以概括整个人。","k":"能说明为什么不能只凭一句评价断定自己的全部。；能把至少两种渠道里的具体事实合成一个可行动的判断。","sem":"上"},{"i":"cnd_j005","n":"用已有优势改进短处","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"正确认识自我框：认识自己；做更好的自己。做更好的自己，是把已经表现出来的优势用在某一处具体短处上：优势不能代替短处，一处短处也不取消其他做得到的优势。","k":"能指出用优势掩盖短处，或用一处短处否定优势的问题。；能选出一项借助已有优势、并仍对着短处去做的做法。","sem":"上"},{"i":"cnd_j006","n":"用当下实事靠近梦想","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"梦想始于当下框：做有梦想的少年；学习成就梦想。梦想是较远的方向。靠近它，是在当下做一件与这个方向有关的实事；只把梦想说出来，或干一件与方向无关的事，都还没有靠近。","k":"能区分说出梦想和做一件与梦想方向有关的实事。；能判断某件当下的事是否沿着所说的梦想方向。","sem":"上"},{"i":"cnd_j007","n":"按学习结果改下次方法","s":"道法","g":7,"m":1,"c":"七年级上册 第1单元 少年有梦","d":"生命安全与健康教育","x":"梦想始于当下框：做有梦想的少年；学习成就梦想。有效反思要写清这次用了什么学法、得到什么结果、下次改哪一步学法。只给自己贴“会了”或“学不会”的标签，没有对着结果改方法。","k":"能指出只有标签、没有学法和结果的反思缺了什么。；能按错误或做对的事实，选出该改的那一步学法。","sem":"上"},{"i":"cnd_j008","n":"家庭关爱与责任的辨识","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"幸福和睦的家庭框：家的意味；让家更美好。关爱是看见家人的具体需要并给出自己做得到的支持；责任是自己约定或力所能及的那一部分事务。辨识时要承认不同的家庭成员组合都可以有关爱，也不把隐瞒伤害、无条件服从或独自承担成人事务当成责任。","k":"能把力所能及的关爱或责任，和超出儿童能力、要求忍受伤害的说法区分开。；能在不同家庭成员组合中指出仍然算关爱的具体做法。","sem":"上"},{"i":"cnd_j009","n":"家庭沟通与冲突处理","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"幸福和睦的家庭框：家的意味；让家更美好。沟通是把自己的需要和理由说清楚，并听清对方在意什么；处理冲突时先停止伤害，再约定下一步谁做什么。意见可以不同，但不能把辱骂、动手或继续忍受伤害当成把家维持下去的办法。","k":"能选出把需要说清楚、并听对方理由的说法。；能在出现打骂或受伤风险时，把离开并求助放在忍着不说之前。；能指出一项双方都执行得了的后续约定。","sem":"上"},{"i":"cnd_j010","n":"带着具体问题走近老师","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"和谐的师生关系框：走近老师。走近老师，是在合适的场合把学习或相处中的具体问题说清楚，并听老师的说明。老师有正在进行的工作，学生可以请教，但不把送礼讨好、当众指责或打听私事当成亲近。","k":"能选出把卡壳之处和请教场合说清楚的做法。；能把尊重老师当下的工作，与用礼物或起哄换取特殊对待区分开。","sem":"上"},{"i":"cnd_j011","n":"用具体行动珍惜师生情谊","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"和谐的师生关系框：珍惜师生情谊。师生情谊是记得老师给予的具体帮助，并用认真完成、守约和适度表达来回应。情谊不是依附老师的私人生活，也不能用“关系好”要求透露试题、传播隐私或取消应有的批评。","k":"能指出哪一种回应是对着老师已经给予的具体帮助。；能拒绝把情谊说成特殊照顾、公开隐私或无视既有要求。","sem":"上"},{"i":"cnd_j012","n":"按彼此尊重判断友谊与朋友的要求","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"友谊之树常青框：友谊的真谛；交友的智慧。友谊是双方自愿、真诚相待、彼此尊重，并在对方遇到具体困难时给出自己做得到的支持。交友要看对方怎样对待人。朋友若要求伤害自己、伤害别人，或用“不跟就不够朋友”来施压，可以拒绝；拒绝不等于背叛。","k":"能用具体帮助和彼此尊重说明什么算友谊。；能在朋友要求做会伤害自己或他人的事时拒绝，并改成安全、不伤害人的做法。","sem":"上"},{"i":"cnd_j013","n":"集体生活成就个人的具体途径","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"在集体中成长框：集体生活成就我。集体生活成就个人，是指在班级、小组等集体里获得归属，并在共同目标下练习自己做得到的角色。成就看的是可核对的支持与练习，不把取消个人判断、只认竞赛名次，或退出一切个人事务当成集体带来的成长。","k":"能指出一项来自集体的具体支持或角色练习。；能把归属、角色练习与“个人必须消失”或“只有名次才算成长”区分开。","sem":"上"},{"i":"cnd_j014","n":"在共建中承担自己做得到的那一份","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"在集体中成长框：共建美好集体。共建美好集体，是在共同约定下完成自己做得到的那一份；做完后可以询问要不要帮忙，但不把全部任务揽下，也不用别人的成果顶替自己未做的部分。能力不同时，仍按各自约定的任务区分，而不是把人排除在集体之外。","k":"能按约定指出哪一份是自己该完成的。；能把做完后的帮忙，与推给别人、包办全部或用他人成果顶替区分开。","sem":"上"},{"i":"cnd_j015","n":"在集体中提出不同意见并避免排斥","s":"道法","g":7,"m":1,"c":"七年级上册 第2单元 成长的时空","d":"生命安全与健康教育","x":"在集体中成长框：共建美好集体。在集体中，不同意见可以在表决或讨论的约定办法里说明；说明之后仍按已经宣布的办法执行。指出漏洞、说话较慢，都不是被排除的理由。辱骂、号召孤立或禁止发言，不是在坚持看法，而是在伤害同伴。","k":"能选出在约定办法里说明不同意见、并接受已宣布办法的做法。；能把指出漏洞或说话较慢，与不合群、应被排除区分开。；能拒绝用辱骂或孤立来压过不同看法。","sem":"上"},{"i":"cnd_j016","n":"认识生命不可替代且时间有限","s":"道法","g":7,"m":1,"c":"七年级上册 第3单元 珍爱我们的生命","d":"生命安全与健康教育","x":"生命可贵框：认识生命。每个人的生命都有自己的成长过程，不能由另一条生命、一项成绩或外貌来代替或取消。生命有限，是指时间会过去、身体状况会变化，因而今天的照料和安排有意义，而不是催人放弃。","k":"能说明一条生命不能由别人的生命或一项成绩代替。；能把“时间有限”理解成今天的照料仍有意义，而不是放弃的理由。","sem":"上"},{"i":"cnd_j017","n":"敬畏自己和他人的生命","s":"道法","g":7,"m":1,"c":"七年级上册 第3单元 珍爱我们的生命","d":"生命安全与健康教育","x":"生命可贵框：敬畏生命。敬畏生命是日常里的道德态度：不把自己的身体当证明胆量的道具，也不把他人或小动物的痛苦当笑料。看见有人起哄时，应停止围观、明确劝阻，并在自己不会陷入危险时告诉老师或家长。这是应当这样做的道德要求，这里不把它写成处罚条文。","k":"能把取乐式伤害、起哄围观与敬畏生命区分开。；能在不把自己置于危险中的前提下选择劝阻或告诉大人。","sem":"上"},{"i":"cnd_j018","n":"遇险时先撤离求助而不是逞能","s":"道法","g":7,"m":1,"c":"七年级上册 第3单元 珍爱我们的生命","d":"生命安全与健康教育","x":"守护生命安全框：增强安全意识；提高防护能力。安全意识要落到可做的选择上：对可预见的危险邀约直接拒绝。已经遇险时，先离开危险处、呼喊并告诉大人，不返回取物，也不跳进自己控制不了的险境。保全生命优先于面子和表演勇敢。 两框收在同一可测做法里：事先拒绝危险，遇险时撤离求助。","k":"能拒绝可预见会使人坠落、迷路或受困的邀约。；能在遇险时选择离开、呼救和不返回，而不是进入险境逞能。","sem":"上"},{"i":"cnd_j019","n":"用能长期坚持的方式爱护身体","s":"道法","g":7,"m":1,"c":"七年级上册 第3单元 珍爱我们的生命","d":"生命安全与健康教育","x":"保持身心健康框：爱护身体。爱护身体是每天可重复的照料：睡眠、饮食和活动要让身体能恢复，而不是用熬夜、节食或硬撑去换一次成绩或一种外表。身体不适时先停下并告诉可信任的大人。这是对自己身体的道德责任，这里不写成处罚条文。","k":"能拒绝用熬夜、过度节食或带伤硬撑来换成绩和外表。；能在身体发出不适时选择休息并告诉大人，而不是把硬撑当成爱护。","sem":"上"},{"i":"cnd_j020","n":"用能恢复心情的事滋养心灵","s":"道法","g":7,"m":1,"c":"七年级上册 第3单元 珍爱我们的生命","d":"生命安全与健康教育","x":"保持身心健康框：滋养心灵。滋养心灵是让心情有地方安放：一次失败不把整个人写成没有价值；难过时找可信任的人说，并留一点自己愿意做的事。长时间用屏幕挤掉睡眠和交谈，或用伤害自己来表达心情，都不再是滋养。这是道德上对自己的照料，不是法律义务清单。","k":"能把一次失败和整个人的价值分开。；能在心情低落时选择诉说和可恢复的活动，而不是伤害自己或通宵消耗。","sem":"上"},{"i":"cnd_j021","n":"探问人生目标是追问自己愿长期投入什么","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"确立人生目标框：探问人生目标。探问人生目标，是问自己愿意长期成为怎样的人、把时间投到什么事情上，而不是抄一份别人的志愿或一句流行的话。一时说不清可以继续问；问的时候要看这件事对自己和他人意味着什么。还没想好不等于没有资格谈目标。","k":"能区分自己愿意长期投入的方向和照抄来的说法。；能说明暂时说不清时仍可以继续追问，而不是停止思考。","sem":"上"},{"i":"cnd_j022","n":"树立不损害人且能指引行动的人生目标","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"确立人生目标框：树立正确的人生目标。正确的人生目标要能指引接下来的行动，同时不把损害他人、牺牲健康或违法当作达到它的办法。名次和收入可以是努力的一种结果，不能成为衡量人生的唯一尺子。目标可以随认识调整，调整是把方向说得更清楚，不是宣布人生失败。这里谈的是道德上的选择，不编法律条文。","k":"能拒绝以伤害他人或牺牲健康为代价的目标。；能把目标改写成接下来可做的行动，并允许在认识变化时调整。","sem":"上"},{"i":"cnd_j023","n":"积极的人生态度是看见困难后仍做自己能做的事","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"端正人生态度框：拥有积极的人生态度。积极的人生态度，是承认眼前的困难，同时找出自己还能做的一步，并相信继续努力有意义。它不是假装没有问题，也不是等心情变好或等别人把路铺平再行动。一次不如意不把今后全部写成没有希望。这里谈的是对自己生活的道德态度，不写成法律义务。","k":"能把承认困难和仍去做自己能做的一步同时说清楚。；能拒绝用假装顺利或干脆不再行动来代替积极态度。","sem":"上"},{"i":"cnd_j024","n":"顺境用来继续积累，逆境里调整并寻求正当帮助","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"端正人生态度框：正确对待顺境和逆境。顺境是条件比较顺利的时候，适合继续学习、不轻视别人，而不是停下来挥霍或炫耀。逆境是条件变差的时候，适合改方法、请可信任的人帮忙，而不是认定自己完了，也不用冒险或伤害自己来证明能扛。两种处境都不是对人生的最终判决。这里是道德上怎样对待处境，不编法律条文。","k":"能说明顺境中仍要积累，不能把顺利当成可以轻视他人的理由。；能在逆境中选择调整和求助，并拒绝用危险行为表示自己能承受。","sem":"上"},{"i":"cnd_j025","n":"人生价值要在实在的劳动里创造","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"实现人生价值框：在劳动中创造人生价值。人生价值不是等来的头衔，而是在实在劳动中做出来的：把一件事认真做完，对别人有用，自己也由此生长。普通的值日、修理、照料和作业同样可以创造价值。不愿劳动、轻视普通劳动、用没做过的成果冒充，都不是在劳动中创造价值。劳动付出以不损害健康为度。这里是道德认识，不编法律义…","k":"能说明普通而认真的劳动也在创造人生价值。；能拒绝用等待、轻视或不真实的成果代替自己的劳动。","sem":"上"},{"i":"cnd_j107","n":"把小我融入祖国和人民，在岗位上作奉献","s":"道法","g":7,"m":1,"c":"七年级上册 第4单元 追求美好人生","d":"生命安全与健康教育","x":"实现人生价值框：在奉献中成就精彩人生。每个人都有自己的人生追求，也会从事各种不同的工作，但只有把自己的小我融入时代，融入祖国和人民的大我之中，才能更好地实现人生价值。任何一项工作都是社会存在和发展的需要，没有高低贵贱之分；人们在自己的岗位上勤勤恳恳、兢兢业业，在奉献社会中创造自身价值。青春是用来奋斗…","k":"能说明要把小我融入祖国和人民的大我，并在普通岗位上作奉献。；能拒绝把奉献理解成只做显赫工作，或与他人、集体和国家的命运无关。","sem":"上"},{"i":"cnd_j026","n":"把青春变化看成成长的邀约","s":"道法","g":7,"m":1,"c":"七年级下册 第1单元 珍惜青春时光","d":"生命安全与健康教育","x":"青春正当时框：青春的邀约。青春的邀约是指身体、想法和同伴关系正在变化，人可以因此学着为自己的选择负责、把时间用在愿意长期做的事上。变化不等于必须和别人比谁更早成熟，也不等于把不适都藏起来。还没想清楚可以继续问，问的是自己能承担什么，不是抄一句“青春就要拼”。","k":"能把身体或想法上的变化说成可以学习新的承担，而不是比谁更早成熟。；能指出只喊口号或否认变化，还没有回应这次邀约。","sem":"下"},{"i":"cnd_j027","n":"交往中不写死性别并守住身体边界","s":"道法","g":7,"m":1,"c":"七年级下册 第1单元 珍惜青春时光","d":"生命安全与健康教育","x":"青春正当时框：男生女生；学会自我保护。男生女生交往时，兴趣、能力和家务不按性别写死；玩笑和靠近要停在对方愿意的地方。不愿意的身体接触应离开，并告诉可信任的成年人。这是对自己和他人的尊重与安全做法。是否构成违法由具体事实和法律判断，本点不把道德上的体贴写成某条处罚，也不把拒绝体贴说成违法。 不考违法认…","k":"能指出按性别规定兴趣或分工是刻板印象，并换一种看能力与意愿的做法。；能在不愿意的靠近出现时离开并告诉可信任的人，而不是继续忍受或自行跟踪对方。","sem":"下"},{"i":"cnd_j028","n":"辨认情绪并在持续不适时求助","s":"道法","g":7,"m":1,"c":"七年级下册 第1单元 珍惜青春时光","d":"生命安全与健康教育","x":"做情绪情感的主人框：揭开情绪的面纱；学会管理情绪；品味美好情感。情绪有线索：心跳、语气、想做的动作可以帮人说出自己是生气、紧张、高兴还是难过。辨认之后，可以先停一下再决定怎么说，而不是用砸东西、辱骂或伤害自己来发泄。高兴、被理解这类感受也值得停下来留意，不必当成幼稚。情绪连续多日压着人，或出现想伤害…","k":"能根据情境中的身体或行为线索说出较贴切的情绪名称，并把它和立刻发泄分开。；能在情绪持续或出现伤害念头时选择告诉可信任的成年人，也能留意一件真实的愉快感受。","sem":"下"},{"i":"cnd_j029","n":"自尊是肯定自己的人格并同样尊重他人","s":"道法","g":7,"m":1,"c":"七年级下册 第2单元 焕发青春活力","d":"生命安全与健康教育","x":"人贵自尊框：人须有自尊。自尊是承认自己作为人的价值：一次失败、外貌或家境，都不能把人变成可以随意贬低的对象。这种看重同时指向别人，不能靠压低他人来证明自己有尊严。它是对自己和他人的道德态度，不是比赛名次，也不是必须忍下所有批评。 自尊写成道德上的自我看重，不写成法律义务或处罚。","k":"能把自尊说成对自身人格的肯定，而不是永远第一或从不认错。；能指出贬低他人并不能增加自己的尊严。","sem":"下","w":["文明有礼（30题漏答角度）"]},{"i":"cnd_j030","n":"用自重和清楚的边界做自尊的人","s":"道法","g":7,"m":1,"c":"七年级下册 第2单元 焕发青春活力","d":"生命安全与健康教育","x":"人贵自尊框：做自尊的人。做自尊的人，是在具体场合不自轻，也不用伤人的方式换取笑声或面子。可以拒绝侮辱性玩笑，可以用平静的话要求被正常对待，同时承认自己做错的事实。维护尊严的方式应停在说清楚和求助可信任的成年人，而不是升级成对他人的伤害。 拒绝伤害只作为安全做法，不写处罚或年龄细则。公开住址、约架均视…","k":"能选出拒绝自轻、同时不侮辱他人的做法。；能把认错和失去人格区分开。","sem":"下"},{"i":"cnd_j031","n":"自信是看清不足后仍愿意准备并尝试","s":"道法","g":7,"m":1,"c":"七年级下册 第2单元 焕发青春活力","d":"生命安全与健康教育","x":"自信给人力量框：人要有自信；做自信的人。自信是相信自己能把一件看得懂的事，通过练习做下去，而不是相信自己样样第一或从不紧张。它允许说出短板，也要求把信心放到具体准备上：选一件够得着的任务，先做一小步，再用结果修正下一回。空口比较和一旦失误就全盘否定，都离开了这种信心。 两框同属第四课，合成“看清不足…","k":"能把自信与“永远最好”或“不许紧张”区分开。；能选出针对一件具体任务去准备和尝试的做法。","sem":"下"},{"i":"cnd_j032","n":"自强是遇挫后自己把还能做的部分做完","s":"道法","g":7,"m":1,"c":"七年级下册 第2单元 焕发青春活力","d":"生命安全与健康教育","x":"人生当自强框：人要自强。自强是在一件具体困难里先看清自己还能做哪一部分，然后持续做完，而不是等别人把整件事代劳，也不是用冒险证明坚强。可以请教方法和使用工具，完成的责任仍在自己身上。一次没做成，应缩小步骤再来，而不是改口说自己这个人永远不行。 翻越围墙、通宵硬撑和油锅冒险都写成不可取，不展开做法。","k":"能把自强与推给别人代劳、或用危险行为换坚强区分开。；能在一次失败后选出自己继续完成力所能及部分的做法。","sem":"下"},{"i":"cnd_j033","n":"自强不息是把自己那一份公共小事持续做完","s":"道法","g":7,"m":1,"c":"七年级下册 第2单元 焕发青春活力","d":"国情教育","x":"人生当自强框：做自强不息的中国人。做自强不息的中国人，是把不放弃的劲头用在自己真能承担的学习、劳动和公共事务上，并承认这些事要靠许多人长期各做一份。它不是在作文里写下一句口号，不是贬低别的国家，也不是要求学生离开本分去冒险。个人暂时帮不上现场，仍可以把相关的基础学习自己做扎实。 不写具体工程名称和现…","k":"能选出在自己负责的公共或集体事务上持续做完的做法。；能拒绝把口号、辱骂或危险逞能当成自强不息。","sem":"下"},{"i":"cnd_j034","n":"传承是用仍然说得通的理念判断今天的选择","s":"道法","g":7,"m":1,"c":"七年级下册 第3单元 传承中华优秀传统文化","d":"中华优秀传统文化教育","x":"传承核心思想理念框：历久弥新的思想理念；做核心思想理念的传承者。有些核心思想理念历久弥新，是因为它们还能帮助今天的人判断怎样待人、怎样守信、怎样对待分歧，而不是因为句子古老就必须照搬一切旧习惯。做传承者，是说得出一句理念对应自己这周的哪一个选择，并照着做。只会在墙上抄词语，或把压制提问、弄虚作假说成…","k":"能指出一句理念对应的是今天哪一个具体选择。；能拒绝把抄写词语、隐瞒事实或禁止提问当成传承。","sem":"下"},{"i":"cnd_j035","n":"人文精神是在相处中承认具体的人的尊严","s":"道法","g":7,"m":1,"c":"七年级下册 第3单元 传承中华优秀传统文化","d":"中华优秀传统文化教育","x":"弘扬中华人文精神框：影响深远的人文精神。中华人文精神把人的尊严和价值放在相处的中心：关心一个人的处境，留出表达和改正的余地。它影响深远，是因为今天仍能用它判断怎样对待同学、邻里和不同意见，而不是因为标语古老。只对熟人客气、用取乐伤害人、或把“以人为本”收成只顾自己，都还没有抓住这一精神。 不编法条，…","k":"能说明人文精神要落在对具体的人的尊重上，而不是只看活动是否热闹。；能拒绝把羞辱、不许别人把话说完或只顾自己说成对人的尊重。","sem":"下"},{"i":"cnd_j036","n":"弘扬人文精神是自己做成一件尊重人的事","s":"道法","g":7,"m":1,"c":"七年级下册 第3单元 传承中华优秀传统文化","d":"中华优秀传统文化教育","x":"弘扬中华人文精神框：做中华人文精神的弘扬者。做中华人文精神的弘扬者，是在自己经手的事上把尊重做出来：问清别人愿不愿意被公开、停止附和侮辱性绰号、在力所能及又安全的范围内帮到具体的人。转发一句标语或参加一次合影，本身还不构成弘扬。弘扬也不是无原则迁就，更不是用冒险或公开别人的私事来表示关心。 关心情绪…","k":"能指出自己可以完成的一件尊重具体的人的行为。；能拒绝用合影口号、冒险或散布私事代替真正的弘扬。","sem":"下"},{"i":"cnd_j037","n":"践行传统美德是把一条美德做成可重复且安全的行为","s":"道法","g":7,"m":1,"c":"七年级下册 第3单元 传承中华优秀传统文化","d":"中华优秀传统文化教育","x":"践行中华传统美德框：薪火相传的传统美德；做中华传统美德的践行者。传统美德薪火相传，是因为每一代人还在做一件说得通的事，例如把还能用的纸写完再取新的、回家先问候长辈并做力所能及的家务、把公共座位让给站不稳的人。做践行者，是选定一条自己这周重复得了的行为。美德多是道德上应当尽力的建议，不是把长辈的每一句…","k":"能把一条传统美德说成自己可以重复、并且安全的行为。；能区分道德上的应当与法律义务，并拒绝为美德冒险或损害别人。","sem":"下"},{"i":"cnd_j038","n":"不同法律各调整一类关系才构成法律体系","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"法律为我们护航框：日益完善的法律体系。日益完善的法律体系，是多部法律按各自任务并存，而不是用一部法律或一本校规回答所有问题。宪法确认公民在法律面前一律平等，享有权利同时必须履行义务，并确认言论自由与人格尊严。民法典调整平等主体之间的人身关系和财产关系。刑法只处理法律明文规定为犯罪的行为；情节显著轻微…","k":"能按关系类型区分宪法上的基本权利与义务、民法上的平等主体人身财产关系、刑法上须有法律明文规定的犯罪。；能拒绝把道德建议、校规或显著轻微的吵闹直接说成犯罪。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j039","n":"法律保障生活同时禁止滥用权利","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"法律为我们护航框：法律保障生活。法律保障生活，是把公民的权利和义务一起确认下来，并给日常生活里的正当要求一个边界。受教育既是权利也是义务。公民可以批评、建议、申诉、控告和检举，但不得捏造或者歪曲事实进行诬告陷害。行使自由和权利时，不得损害国家的、社会的、集体的利益和其他公民的合法的自由和权利；民事权…","k":"能说明权利受保障的同时附有义务，并且行使权利不得损害公共和他人的合法权益。；能把道德上的好意与法律义务分开，并拒绝用危险行为或诬告来行使权利。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j040","n":"人身权与财产权要分开保护","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"走近民法典框：保护人身权；保障财产权。民法典调整平等主体之间的人身关系和财产关系，自2021年1月1日起施行。人身权这一侧保护人身自由、人格尊严、肖像、名誉、隐私和个人信息等，不能因好奇就公开别人的病历或照片。财产权这一侧平等保护合法财产，东西被拿走可以要求返还，不能因为“不值钱”就当成可以侵占。两…","k":"能判断公开病历、限制人身属于人身权益，擅自使用或侵占物品属于财产权益。；能在要回财物时拒绝伤害身体或毁坏对方财物，并拒绝公开他人个人信息。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j041","n":"一般违法与犯罪以刑法是否明文规定为界","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"远离违法犯罪框：法不可违；犯罪与刑罚。法不可违，是说不能因为一件事可能够不上犯罪就继续去做。一般违法与犯罪的分界，在于法律有没有把该行为明文规定为犯罪，以及它是不是依照法律应当受刑罚处罚的行为。法律没有明文规定为犯罪行为的，不得定罪处刑。情节显著轻微、危害不大的，不认为是犯罪。老师的批评、同学觉得严…","k":"能用刑法是否明文规定为犯罪、是否应当受刑罚处罚，把一般违法和犯罪分开。；能指出不构成犯罪的行为仍然不应当做，批评或厌恶不能代替定罪。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j042","n":"受到侵害要向法定途径求助而不是私自处刑","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"远离违法犯罪框：犯罪与刑罚；严于律己。遇到可能的侵害，应当马上告诉家长、老师，或请成人向公安机关求助，由国家机关依法处理。人民法院是国家审判机关，个人投票或私设审问不能代替审判。人民检察院是国家法律监督机关，不是让同学自己去跟踪、围堵。求助时只讲发生过的事实，不公开与查明无关的住址、电话和病历。生命…","k":"能在侵害发生时选择告诉家长老师或向公安机关求助。；能拒绝锁人、跟踪、对打和公开无关的个人信息，并说明审判不能由个人代替。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j043","n":"严于律己是守住边界而不是自我处刑","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"远离违法犯罪框：严于律己；法不可违。严于律己，是在日常选择里主动不越过法律和纪律：不拿别人的东西，不散布别人的隐私，不因为生气就报复。它不是把一句失礼叫做犯罪，也不是把家人“早点休息”这类关心说成法律义务。已经发生侵害时，律己表现为停下来、离开危险，并把事情告诉老师或家长，而不是用冒险去证明自己守法…","k":"能把日常守法与把小失礼当成犯罪区分开。；能把道德上的关心与法律义务分开，并拒绝用危险或报复来表示律己。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j108","n":"民法典调整平等主体的人身财产关系并确立基本原则","s":"道法","g":7,"m":1,"c":"七年级下册 第4单元 生活在法治社会","d":"法治教育","x":"走近民法典框：认识民法典。民法典是新中国第一部以“法典”命名的法律，是社会生活的百科全书，同人民群众生产生活密不可分。它调整平等主体之间的人身关系和财产关系，体现对生命健康、财产安全、交易便利、生活幸福、人格尊严等各方面权利的平等保护。实施民法典，能够更好地保障人民群众合法权益，有利于营造稳定、公平…","k":"能说明民法典是调整平等主体人身关系和财产关系的法律，并与日常生活密切相关。；能指出平等、自愿、公平、诚信、守法和公序良俗、绿色是民事活动的基本原则。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j044","n":"认识社会生活是看见人与人的相互联系","s":"道法","g":8,"m":1,"c":"八年级上册 第1单元 走进社会生活","d":"国情教育","x":"丰富的社会生活框：认识社会生活。社会生活是人们在家庭、学校、社区和公共场合里相互联系、一起完成的活动。个人可以有自己的安排，但不能靠一句“我不参与”取消衣食住行、信息和服务里本来就有的他人劳动与公共安排。认识社会生活，是看清这些联系怎样影响自己，也看清自己的做法怎样影响别人。它不是把刷短视频当成全部…","k":"能用具体场合说明社会生活是人与人相互联系的活动。；能指出只认熟人、只看屏幕或口头宣布退出，都还没有看清联系的范围。","sem":"上"},{"i":"cnd_j045","n":"社会成员受保护也要顾及他人合法权益","s":"道法","g":8,"m":1,"c":"八年级上册 第1单元 走进社会生活","d":"法治教育","x":"丰富的社会生活框：我们都是社会的一员。我们都是社会的一员，是说人生活在家庭、学校、社区等关系里，人格尊严受尊重，人身、财产和个人信息等合法权益受保护，同时也要履行与自己身份相称的责任。行使自己的便利时，不得损害公共利益和他人的合法权益。家长或同学的一句关心，常常是道德上的建议，不能自动变成法律义务；…","k":"能说明社会成员既受保护，行使便利时也不得损害他人和公共利益。；能把道德建议与法律义务分开，并拒绝由个人宣布别人犯罪。","sem":"上","w":["依法办事与诉讼类型"]},{"i":"cnd_j046","n":"社会化是学会共同生活，亲社会行为要安全可做","s":"道法","g":8,"m":1,"c":"八年级上册 第1单元 走进社会生活","d":"国情教育","x":"在社会中健康成长框：人的社会化；养成亲社会行为。人的社会化，是在家庭、学校和更广的交往里，逐步学会参与共同生活所需要的技能、规则和待人方式。它不是把个性磨成和别人一模一样。亲社会行为是在这个过程中养成的、有益于他人和共同生活的行动，例如把路线说清楚、在安全的前提下帮忙、主动把自己能做的公共小事做完。…","k":"能说明社会化是学习共同生活的技能和规范，而不是取消个性。；能选择安全、尊重他人的亲社会行为，并把它与法律义务、冒险逞能区分开。","sem":"上"},{"i":"cnd_j047","n":"网络改变的是联系的速度和范围","s":"道法","g":8,"m":1,"c":"八年级上册 第1单元 走进社会生活","d":"国情教育","x":"共建网络美好家园框：网络改变世界。网络改变世界，主要是改变人们获取信息、商量事情、学习和办理日常事务的速度与范围。远方的同学可以很快对上话，资料也比以前容易找到。这种改变没有取消人与人的联系，也没有让网上的内容自动变成真的。方便和麻烦会一起出现：消息传得更快，未核实的说法也能更快地传到更多人那里。网…","k":"能说明网络改变的是交往、学习和办事的速度与范围，联系本身还在。；能指出传得快不等于内容为真，网上办事也仍然牵涉别人。","sem":"上"},{"i":"cnd_j048","n":"清朗空间要求网上表达不扩大对他人的伤害","s":"道法","g":8,"m":1,"c":"八年级上册 第1单元 走进社会生活","d":"法治教育","x":"共建网络美好家园框：营造清朗空间。营造清朗空间，是让网络上的表达尊重他人的人格尊严，不把未经核实的猜测写成事实去扩散，也不借着“只是在网上”去侮辱、公开别人不愿公开的信息。公民有言论自由，行使时不得损害公共利益和他人的合法权益；对真实问题可以反映，但不能诬告陷害。礼貌通常是道德上的要求，不是每一句没…","k":"能说明网上的玩笑、转发和匿名，都不能成为伤害人格尊严或扩散未核实指责的理由。；能把礼貌建议、反映真实问题与自行公开他人信息或独自赴约区分开。","sem":"上","w":["依法办事与诉讼类型"]},{"i":"cnd_j049","n":"社会秩序靠共同遵守的规则变得可预期","s":"道法","g":8,"m":1,"c":"八年级上册 第2单元 维护社会秩序","d":"法治教育","x":"遵守社会规则框：维护秩序靠规则；遵守规则。社会秩序是人们在公共生活里能大致预见到别人会怎样行动，从而顺利地相处、排队、上课和通行。这种可预期靠规则来维持：大家知道什么时候该停、什么时候该走、什么时候该先做哪一步。规则限制的是妨碍他人的任性，不是取消一切选择。道德劝导、学校纪律和法律的约束力度不同，违…","k":"能用排队、课堂或通行说明规则怎样让他人的行动可预期。；能区分道德劝导、纪律和法律义务，并拒绝用冒险来逃避规则。","sem":"上","w":["社会秩序与规则的种类","依法办事与诉讼类型"]},{"i":"cnd_j050","n":"道德倡议不能代替法律规定的义务","s":"道法","g":8,"m":1,"c":"八年级上册 第2单元 维护社会秩序","d":"法治教育","x":"提升法治素养框：树立法治观念；学会依法办事。道德倡议是号召人们自愿做得更好，例如参加一次楼道清扫、转发一条倡议、选择绿色出行。海报上的希望不会因为写出来就成为法律义务，校规和班约也不能自动升格成犯罪。法律义务来自法律的规定：公民享有权利，同时履行法律规定的义务；行使自己的便利时，不得损害公共利益和他…","k":"能指出倡议和校规不能自行变成法律义务或犯罪。；能说明法律义务来自法律的规定，行使权利不得损害他人合法权益。","sem":"上","w":["社会秩序与规则的种类","依法办事与诉讼类型"]},{"i":"cnd_j051","n":"文明有礼是按场合表达对他人的尊重","s":"道法","g":8,"m":1,"c":"八年级上册 第2单元 维护社会秩序","d":"中华优秀传统文化教育","x":"社会生活讲道德框：文明有礼。文明有礼是在具体场合里用得体的言行尊重别人：图书馆把声音放低，赛场上可以为进球欢呼，讨论时把反对说成理由而不是外号。它不是见面说一句“你好”之后就可以妨碍别人，也不是要求人在任何地方都不出声、都假装同意。礼貌限制的是侮辱、抢话和不顾场合的打扰。别人用“请”把人约到危险的地…","k":"能用图书馆和赛场说明文明有礼要随场合变化。；能区分清楚表达不同意见和用言语侮辱别人。；能拒绝以礼貌为名的危险邀约。","sem":"上","w":["社会秩序与规则的种类","文明有礼（30题漏答角度）"]},{"i":"cnd_j052","n":"诚实守信是说清该说的事实并履行承诺","s":"道法","g":8,"m":1,"c":"八年级上册 第2单元 维护社会秩序","d":"中华优秀传统文化教育","x":"社会生活讲道德框：诚实守信。诚实是把应当说明的事实说清楚，不把没做的事写成已做，也不编造成绩。守信是对自己作出的正当约定尽力履行；临时做不到，要尽早说明并另约，而不是拖着不还、也不交代。诚实不是把别人不愿公开的私事拿到班里扩散，需要老师帮助时可以单独告诉老师。守信也不包括去执行危险或伤害别人的约定：…","k":"能指出虚假记录和隐瞒约定进度是不诚实、不守信。；能把尊重别人不愿公开的私事和当众扩散区分开。；能拒绝用守信为名去执行危险约定。","sem":"上","w":["社会秩序与规则的种类","诚信"]},{"i":"cnd_j109","n":"友善是待人热情友好，宽容但有原则","s":"道法","g":8,"m":1,"c":"八年级上册 第2单元 维护社会秩序","d":"中华优秀传统文化教育","x":"社会生活讲道德框：友善待人。友善就是待人热情友好、与人为善。它是社会主义核心价值观的要求，也是中华民族的传统美德。以友善的态度对待他人，彼此尊重、包容多样，能够传递温情、加深信任、促进社会和谐。我们要与人为善、守望相助。宽容他人，要做到体谅包容、求同存异，但不因差异就拒绝合作；宽容是有原则的，在涉及…","k":"能说明友善是待人热情友好、与人为善，并且要守望相助、换位思考、助人为乐。；能指出宽容有原则，涉及道德底线与法律的问题不能事事忍让。","sem":"上","w":["社会秩序与规则的种类"]},{"i":"cnd_j053","n":"珍视自由是自己作主并给别人留下同样空间","s":"道法","g":8,"m":1,"c":"八年级上册 第3单元 勇担社会责任","d":"法治教育","x":"追求自由平等框：珍视自由。珍视自由，是在法律允许的范围内自己决定个人事务，例如选哪个合规社团、用什么方式表达真实看法。自由同时属于别人：自己播放声音、占用共享空间或替别人做决定时，不能损害公共利益和他人的合法权益。表达看法可以指出能核对的问题，不能借自由编造事实指责同学。自由也不是用冒险证明自己作主…","k":"能说明合法的个人选择属于珍视自由，且别人享有同样空间。；能拒绝用自由为名伤害他人、编造指责或从事危险行为。","sem":"上","w":["社会规则与自由的关系","依法办事与诉讼类型"]},{"i":"cnd_j054","n":"践行平等是同等尊重而不是成绩和结果完全一样","s":"道法","g":8,"m":1,"c":"八年级上册 第3单元 勇担社会责任","d":"法治教育","x":"追求自由平等框：践行平等。践行平等，是承认同学作为人的人格平等，同一规则对大家同样适用，不因口音、家庭或性别把人排除在机会之外。平等不是每次考试分数相同，也不是比赛用时必须一样。合理的不同安排要看任务本身是否需要，而不能把刻板印象当成分配角色的理由。家庭条件或熟人关系不能成为免受同一规则约束的特权。…","k":"能区分人格和规则上的平等与分数、名次必须相同。；能指出以口音、性别或家庭条件排除他人、豁免规则，不符合平等。","sem":"上","w":["依法办事与诉讼类型"]},{"i":"cnd_j055","n":"坚守公平靠同一标准，守护正义走正当途径","s":"道法","g":8,"m":1,"c":"八年级上册 第3单元 勇担社会责任","d":"法治教育","x":"维护公平正义框：坚守公平；守护正义。坚守公平，是事先公布的标准对同样情况同样适用。为熟人改分、只记录其中一个人的同样迟到，是偏袒。给行动不便的同学使用无障碍通道，是任务所需要的合理安排，不是破坏公平。守护正义，是发现标准被破坏时，拿出作品或记录请老师、活动组织者复核。不能打人、撕毁别人的作品，也不能…","k":"能用同一标准识别偏袒，并把合理的特殊安排与偏袒分开。；能选择凭事实请有权处理的人复核，拒绝私自处罚和编造事实。","sem":"上","w":["依法办事与诉讼类型"]},{"i":"cnd_j056","n":"社会责任是角色里能做的事，不能推说总会有人做","s":"道法","g":8,"m":1,"c":"八年级上册 第3单元 勇担社会责任","d":"国情教育","x":"积极奉献社会框：社会责任我担当。社会责任来自一个人在班级、家庭和社区中的角色。轮到自己的值日、已经答应的记录，是应当自己完成的事，不能用“社会很大、总会有人做”推掉。学校或社区发出的志愿邀请，多是道德上的倡导；一次没参加，不等于违法，也不等于从此可以不做分内的事。不损坏别人正在完成的成果，是行为底线…","k":"能说明角色里已经落到自己身上的事应当担当，不能推给“总会有人做”。；能把一次志愿邀请与分内责任、不损害他人成果这三条分开。","sem":"上"},{"i":"cnd_j057","n":"践行奉献是在能力和安全范围内做具体的事","s":"道法","g":8,"m":1,"c":"八年级上册 第3单元 勇担社会责任","d":"国情教育","x":"积极奉献社会框：奉献社会我践行。践行奉献，是把愿意帮助变成自己做得了的具体行动：课间讲清自己会的思路，或在老师带领下做白天的公共清扫。只在群里写“我很有爱心”，还没有践行。事情普通，不减少它的意义。遇到落水而自己不会游泳，应当呼救并找成人和专业救援，不能跳下去。半夜翻墙进入工地，也不能叫做奉献。老师…","k":"能举出能力范围内的具体帮助，并指出只有口头表态还不算践行。；能拒绝把跳水、翻墙等危险行为当成奉献，同时保留安全场合中的服务。","sem":"上"},{"i":"cnd_j058","n":"国家利益高于眼前私利，捍卫要真实、合法且安全","s":"道法","g":8,"m":1,"c":"八年级上册 第4单元 维护国家利益","d":"国情教育","x":"国家利益至上框：国家利益高于一切；捍卫国家利益。国家利益是人民的整体利益，包括安全、主权、发展和应当共同维护的文化纪念。它与个人的正当生活在根本上一致；当真发生冲突时，个人或小团体的眼前好处要让位于这个整体利益。例如不能为了点赞，公开组织已经说明不得实时散布的集体参访位置。高于一切不是按口音取消同学…","k":"能在个人眼前好处与整体的安全或纪念利益冲突时，说明后者优先。；能拒绝借国家利益侮辱同学、编造事实或从事危险的所谓捍卫。","sem":"上"},{"i":"cnd_j059","n":"人民军队受党和人民信赖，是因为保卫和服务人民","s":"道法","g":8,"m":1,"c":"八年级上册 第4单元 维护国家利益","d":"革命传统教育","x":"军强才能国安框：党和人民信赖的英雄军队。党和人民信赖的英雄军队，武装力量属于人民，由中央军委领导全国武装力量。它赢得信赖，是因为听党指挥、保卫祖国并在人民遇险时救助人民，而不是谁出钱谁指挥，也不是用来欺负弱小。穿上迷彩、自称热爱，不能把霸凌或翻入营区说成军队行为。尊敬可以在学校组织的合法活动里表达。…","k":"能说明人民军队受信赖，是因为它属于人民并保卫、服务人民。；能把私人指挥、欺负同学和翻入营区与真正的军队行为区分开。","sem":"上"},{"i":"cnd_j060","n":"国防和军队现代化是为了捍卫主权、安全和发展利益","s":"道法","g":8,"m":1,"c":"八年级上册 第4单元 维护国家利益","d":"国情教育","x":"军强才能国安框：全面推进国防和军队现代化。全面推进国防和军队现代化，是为了使国防和军队更能捍卫国家主权、安全和发展利益。国家富裕不能代替这种能力，建设也不是为了向别人挑衅，或把装备当成同学之间的炫耀。关心现代化，要通过课堂和公开的权威信息，不扩散来源不明的部队调动地点。 不编密级和情报手法，只要求不…","k":"能说明现代化服务于主权、安全和发展利益，而不是炫耀或挑衅。；能指出经济发展不能代替国防能力，也不应传播来源不明的调动信息。","sem":"上"},{"i":"cnd_j061","n":"总体国家安全观以人民安全为宗旨，不只是打仗或日常不满","s":"道法","g":8,"m":1,"c":"八年级上册 第4单元 维护国家利益","d":"国情教育","x":"树立总体国家安全观框：认识国家安全；维护国家安全。认识国家安全，是看到国家政权、主权、统一、领土完整和人民福祉相对处于没有危险、不受内外威胁的状态。总体国家安全观以人民安全为宗旨，因此它不只等于一场战争的胜负，也不把食堂口味、普通争执说成国家安全问题。维护时，学生把看见的可疑情况告诉老师或公安机关；…","k":"能说明国家安全是主权、统一、领土完整和人民安全等相对不受威胁的状态。；能把日常不满与国家安全分开，并拒绝用跟踪代替告知主管人员。","sem":"上"},{"i":"cnd_j062","n":"党领导人民制定宪法，统一党的主张和人民意志","s":"道法","g":8,"m":1,"c":"八年级下册 第1单元 坚持宪法至上","d":"法治教育","x":"治国安邦的总章程框：党领导人民制定宪法。我国宪法是中国共产党领导人民制定的。它把党的主张和人民意志统一起来，不是某个干部的私人文件，也不是把人民排除在外的公告。班会投票、几名同学商量，都不能代替这一制定过程，也不能把宪法改成只照顾本班的文本。 党领导人民制定宪法按公开目录框名作概念，题目不写条号、不…","k":"能说明宪法由党领导人民制定，体现的是党的主张和人民意志的统一。；能拒绝把私人起草、排除人民或班内投票当成制定宪法。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j063","n":"宪法是治国安邦的总章程，规定根本内容并具有最高效力","s":"道法","g":8,"m":1,"c":"八年级下册 第1单元 坚持宪法至上","d":"法治教育","x":"治国安邦的总章程框：宪法的内容和作用。宪法规定国家的根本制度、根本任务、公民的基本权利和义务，以及国家机构的组织与职权，所以称为治国安邦的总章程。它具有最高法律效力。班规、村委会通知和普通文件可以安排日常事务，不能抵触宪法，也不能取代宪法对国家机构性质的规定。全国人大是最高国家权力机关，全国人大及其…","k":"能说明宪法规定根本制度、基本权利义务和国家机构，并具有最高法律效力。；能指出班规、基层群众性自治组织的通知不能抵消宪法或改写国家机关的性质。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j064","n":"依宪治国要求在宪法范围内活动，尊崇宪法要落到遵守","s":"道法","g":8,"m":1,"c":"八年级下册 第1单元 坚持宪法至上","d":"法治教育","x":"维护宪法权威框：依宪治国；尊崇宪法。依法治国首先要依宪治国。一切组织和个人都要遵守宪法，在宪法范围内活动，不得享有超越宪法的特权。尊崇宪法，是学习它、认同它，并在具体选择中遵守它，不是只喊口号或强迫别人为文本行礼。国家主席依全国人大或其常委会的决定公布法律，不能把个人随口一句话当成已经公布的法律。道…","k":"能说明依宪治国是任何组织和个人都要在宪法范围内活动。；能把遵守宪法与口号、行礼或把建议说成法律义务区分开。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j065","n":"公民在法律面前平等，人格尊严和人身财产受保护","s":"道法","g":8,"m":1,"c":"八年级下册 第2单元 理解权利义务","d":"法治教育","x":"公民的基本权利和义务框：公民基本权利。公民在法律面前一律平等，不因班干部、家庭或发言先后而享有特权。人格尊严不受侵犯。人身权、个人信息、财产权受法律保护，自己的权利不能变成拿走别人合法利益的理由。公民依法享有的政治权利不能被说成任何人都不附条件地享有全部政治权利。题目不写选举年龄和限制的具体名单。 …","k":"能说明公民在法律面前一律平等，人格尊严、人身、个人信息、财产受保护。；能拒绝用自己的权利去剥夺他人合法利益，也不把全部政治权利说成人人无条件享有。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j066","n":"受教育既是权利也是义务，道德建议不是法律义务","s":"道法","g":8,"m":1,"c":"八年级下册 第2单元 理解权利义务","d":"法治教育","x":"公民的基本权利和义务框：公民基本义务。公民有受教育的权利，也有受教育的义务。不能把上学当成可有可无的兴趣小组，也不能由同学取消别人的受教育机会。老师或家长提出的关心、阅读、捐物，是道德和学习上的倡导，不因为说出口就变成法律义务。珍惜生命不能被解释成必须接受危险挑战。 受教育既是权利又是义务，据宪法2…","k":"能说明受教育既是权利也是义务，别人不能任意取消。；能把道德倡导与法律义务分开，并拒绝用危险行为冒充珍惜生命。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j067","n":"权利义务相统一，依法行使不得滥用或盲从","s":"道法","g":8,"m":1,"c":"八年级下册 第2单元 理解权利义务","d":"法治教育","x":"依法行使权利和履行义务框：权利与义务相统一；依法行使权利；依法履行义务。权利与义务相统一，不是每一项权利都要换走另一项权利，也不是一次失约就失去全部权利。依法行使权利，不得滥用权利损害国家、社会、集体的利益和其他公民的合法权利，也不等于一概服从任何校规或管理要求。公民可以提出批评和建议；监督不得诬告…","k":"能说明相统一不是逐项对换，一次失约也不丧失全部权利。；能区分真实批评与诬告，并拒绝把任何管理要求或轻微违纪说成犯罪。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j068","n":"人民代表大会制度是根本政治制度","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的政治制度框：人民代表大会制度。社会主义制度是我国的根本制度。人民代表大会制度是我国的根本政治制度，不是又一项基本政治制度，也不能被国家主席或国务院替换。全国人民代表大会是最高国家权力机关，它的常委会是常设机关；国家立法权由全国人大及其常委会行使。国家主席由全国人大选举，依照全国人大或常委会的决…","k":"能把根本制度、根本政治制度和基本政治制度三者分开。；能说明全国人大及其常委会的地位，并拒绝把国家主席或国务院说成最高国家权力机关。","sem":"下"},{"i":"cnd_j069","n":"多党合作和政治协商是基本政治制度","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的政治制度框：中国共产党领导的多党合作和政治协商制度。中国共产党领导的多党合作和政治协商制度是我国的一项基本政治制度。中国共产党是执政党，各民主党派是参政党，不是轮流执政，也不能取消共产党的领导。政治协商不代替全国人民代表大会及其常委会行使国家立法权，也不是把人民政协说成最高国家权力机关或国务院…","k":"能说明这项制度是基本政治制度，不是根本政治制度，也不等于轮流执政。；能把政治协商与全国人大及其常委会的国家立法权分开。","sem":"下"},{"i":"cnd_j070","n":"民族区域自治与基层群众自治各有范围","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的政治制度框：民族区域自治制度；基层群众自治制度。民族区域自治制度是基本政治制度：在国家统一领导下，各少数民族聚居的地方实行区域自治，自治地方不脱离国家。基层群众自治制度也是基本政治制度：居民委员会、村民委员会是基层群众性自治组织，不是国家机关，也不是民族自治地方的自治机关。两项制度都不是根本政…","k":"能说明民族区域自治是在国家统一领导下的基本政治制度，不是脱离国家。；能说明居委会、村委会不是国家机关，也不能被说成民族自治机关。","sem":"下"},{"i":"cnd_j071","n":"公有制为主体，多种所有制共同发展","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的基本经济制度框：公有制为主体、多种所有制经济共同发展。公有制为主体、多种所有制经济共同发展，是我国基本经济制度的所有制方面。公有制经济包括国有经济、集体经济，以及混合所有制经济中的国有成分和集体成分。个体经济、私营经济和外资经济属于非公有制经济，是社会主义市场经济的重要组成部分，不是公有制。公…","k":"能把国有经济、集体经济和混合所有制中的国有、集体成分归入公有制，并把个体、私营、外资归入非公有制。；能说明公有制为主体是多种所有制共同发展中的主体地位，不是只留公有制或把每家店铺改成国有。","sem":"下"},{"i":"cnd_j072","n":"按劳分配为主体，多种分配方式并存","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的基本经济制度框：按劳分配为主体、多种分配方式并存。按劳分配为主体、多种分配方式并存，是我国基本经济制度中的分配制度。在公有制范围内，人们主要按提供的劳动取得报酬，多劳多得、少劳少得，不是按人头平均，也不是按身份世袭。劳动、资本、技术、管理等生产要素按贡献参与分配，可以与按劳分配并存。合法的要素…","k":"能说明按劳分配是按劳动贡献取得报酬，不是平均分配，也不是只按资本或身份分配。；能把合法的多种分配方式与按劳分配并存，并拒绝用多种方式为违法所得开脱。","sem":"下"},{"i":"cnd_j073","n":"社会主义市场经济体制","s":"道法","g":8,"m":1,"c":"八年级下册 第3单元 认识国家制度","d":"国情教育","x":"我国的基本经济制度框：社会主义市场经济体制。我国实行社会主义市场经济。它把社会主义制度和市场经济结合起来，不是把市场等同于不要国家制度，也不是把政府作用等同于取消市场。市场在资源配置中起决定性作用，同时要更好发挥政府作用。经营者仍须遵守法律，市场决定价格和作用范围，并不允许用欺诈、损害他人或公共利益…","k":"能说明社会主义市场经济是社会主义制度与市场经济的结合，市场起决定性作用的同时要更好发挥政府作用。；能拒绝把市场决定性作用理解成可以违法经营，或把政府作用理解成取代一切市场交换。","sem":"下"},{"i":"cnd_j074","n":"不同国家机关的性质不能互换","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"国家权力机关框：国家权力机关的组成和地位。全国人民代表大会是最高国家权力机关，它的常委会是常设机关。国务院是最高国家行政机关。中央军事委员会领导全国武装力量，实行主席负责制，不是常委会负责制。监察委员会是国家监察机关，人民法院是国家审判机关，人民检察院是国家法律监督机关。公安机关属于行政机关，不能改…","k":"能区分国家权力机关、行政机关、军事机关、监察机关、审判机关和法律监督机关。；能说明居委会、村委会不是国家机关，中央军委实行的是主席负责制。","sem":"下"},{"i":"cnd_j075","n":"全国人大选举特定国家机构负责人","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"国家权力机关框：人民代表大会的职权。全国人民代表大会选举中华人民共和国主席、中央军事委员会主席、国家监察委员会主任、最高人民法院院长和最高人民检察院检察长。这是全国人大的职权，不是国务院、国家主席个人、人民法院或人民检察院的职权。它也不表示所有机构都有这项选举权，更不表示中央军委改成常委会负责制后就…","k":"能指出国家主席、中央军委主席、国家监委主任、最高法院院长和最高检察院检察长由全国人大选举。；能拒绝把这项选举权转移到国务院、主席个人或法院、检察院。","sem":"下"},{"i":"cnd_j076","n":"国家主席的产生、地位和职权","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"中华人民共和国主席框：国家主席的产生和地位；国家主席的职权。中华人民共和国主席、副主席由全国人民代表大会选举。国家主席不是全国人民代表大会，也不是国务院，不能把主席等同于最高国家行政机关。国家主席根据全国人大或其常委会的决定公布法律、任免，并代表国家进行国事活动。代表国家进行国事活动，不能代替公布法…","k":"能说明国家主席、副主席由全国人大选举，主席的地位不同于全国人大和国务院。；能区分依决定公布法律、任免和代表国家进行国事活动，拒绝用其中一项代替另一项。","sem":"下"},{"i":"cnd_j077","n":"行政机关依法行使职权，建设法治政府","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"法治教育","x":"国家行政机关框：依法行政，建设法治政府。依法行政是对行政机关的要求：行政职权要依法行使，建设法治政府是把行政放在法律之内，不是取消行政，也不是把国务院改成全国人大或人民法院。行政机关工作人员没有法律依据的个人要求，不是公民必须服从的行政命令。公民依法提出批评，不等于破坏依法行政。不服从某一项要求，也…","k":"能说明依法行政约束行政机关依法行使职权，法治政府不是取消行政或改换机关性质。；能区分没有法律依据的个人要求、依法批评和必须服从的行政职权。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j078","n":"中央军委领导全国武装力量，不兼其他机关职权","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"中央军事委员会框：中央军事委员会的领导体制和职权。中央军事委员会领导全国武装力量，实行主席负责制。领导全国武装力量不等于行使国家立法权，不等于审判，也不等于国务院作为最高国家行政机关的行政职权。主席负责制不是常委会负责制，也不能推出国家主席那种依照全国人大或常委会决定公布法律的职权。地方部门或人民法…","k":"能说明中央军委的职权是领导全国武装力量，领导体制是主席负责制。；能拒绝把这项职权扩成立法、审判、最高行政或国家主席公布法律。","sem":"下"},{"i":"cnd_j079","n":"中央军委主席由全国人大选举产生","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"中央军事委员会框：中央军事委员会的性质和产生。中央军事委员会领导全国武装力量，中央军委主席由全国人民代表大会选举产生。选举国家主席、国家主席代表国家进行国事活动，都不能代替选举军委主席。国务院不能任命军委主席。选举产生以后，中央军委仍不是最高国家行政机关，也不变成基层群众性自治组织。两个主席职务分别…","k":"能说明中央军委主席由全国人大选举产生，国家主席的选举和国事活动不能代替。；能拒绝由国务院任命军委主席，或把产生后的中央军委改成行政机关、自治组织。","sem":"下"},{"i":"cnd_j080","n":"监察委员会的设立、产生和负责关系","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"国情教育","x":"国家监察机关框：国家监察机关的产生和性质。我国设立国家监察委员会和地方各级监察委员会。国家监察委员会是最高监察机关，领导地方各级监察委员会的工作，上级监察委员会领导下级监察委员会的工作。国家监察委员会主任由全国人民代表大会选举，县级以上地方各级人民代表大会选举本级监察委员会主任。国家监察委员会对全国…","k":"能说明国家监委是最高监察机关并领导下级，地方监委对产生它的权力机关和上一级监察委员会负责。；能区分全国人大选举国家监委主任和县级以上地方人大选举本级监委主任，拒绝改由法院或国务院产生。","sem":"下"},{"i":"cnd_j081","n":"监察权依法独立行使并与其他机关配合制约","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"法治教育","x":"国家监察机关框：国家监察机关的职责。监察委员会依照法律规定独立行使监察权，不受行政机关、社会团体和个人的干涉。这种独立不是不受产生它的国家权力机关监督，也不是可以不依照法律规定。监察机关办理职务违法和职务犯罪案件，应当与审判机关、检察机关、执法部门互相配合、互相制约。配合不是代替人民法院审判，也不是…","k":"能说明监察权依法独立行使，不受行政机关、社会团体和个人干涉，同时仍受产生它的权力机关监督。；能说明办理职务违法和职务犯罪案件时与审判、检察、执法部门配合制约，拒绝互相替代。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j082","n":"审判权、检察权的行使和刑事案件分工","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"法治教育","x":"国家司法机关框：人民法院；人民检察院。人民法院依照法律规定独立行使审判权，人民检察院依照法律规定独立行使检察权，都不受行政机关、社会团体和个人的干涉。人民法院审理案件，除法律规定的特别情况外一律公开进行，被告人有权获得辩护。最高人民法院监督地方各级人民法院和专门人民法院的审判工作，这是监督而不是领导…","k":"能区分法院依法独立审判、除法律规定的特别情况外公开审理并保障辩护，以及检察院依法独立行使检察权。；能区分最高法监督下级法院审判工作、最高检领导下级检察院，以及公检法办理刑事案件分工配合制约。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j110","n":"行政机关依法设立并行使国家行政权","s":"道法","g":8,"m":1,"c":"八年级下册 第4单元 走近国家机构","d":"法治教育","x":"国家行政机关框：国家行政机关的性质和职权。行政机关是依法设立、行使国家行政权、组织和管理国家行政事务的国家机关。我国行政机关由国务院及其领导的地方各级人民政府组成。国家行政机关是国家权力机关的执行机关，执行国家权力机关通过的有关法律、决议和决定。各级人民政府对本级人民代表大会负责并报告工作；县级以上…","k":"能说明行政机关依法设立并行使国家行政权，国务院是最高国家行政机关。；能指出各级人民政府对本级人大负责并报告工作，行政权由人民通过宪法和法律授予。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j083","n":"全面依法治国以习近平法治思想为指导思想","s":"道法","g":8,"m":1,"c":"八年级下册 第5单元 建设法治中国","d":"法治教育","x":"坚持全面依法治国框：全面依法治国的指导思想。全面依法治国的指导思想是习近平法治思想。它用来指导科学立法、严格执法、公正司法、全民守法，不是某一个国家机关的职权，也不是把个人口号或某一具体法律文本本身叫做指导思想。确立指导思想，不能代替组织和个人遵守宪法法律，也不能让某一机关因此取得其他机关的职权。 …","k":"能说明全面依法治国的指导思想是习近平法治思想，而不是某一机关职权或某一句口号。；能说明有了指导思想仍须遵守宪法法律，指导思想不改写各国家机关的性质。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j084","n":"科学立法、严格执法、公正司法、全民守法","s":"道法","g":8,"m":1,"c":"八年级下册 第5单元 建设法治中国","d":"法治教育","x":"坚持全面依法治国框：全面依法治国的基本要求。全面依法治国的基本要求是科学立法、严格执法、公正司法、全民守法。四项对应的事情不同：立法要由行使国家立法权的全国人大及其常委会按法定程序进行；行政机关严格执法，不能把执法说成审判；人民法院公正司法，不能改行立法；一切组织和个人都要守法，不只约束群众。守法是…","k":"能把科学立法、严格执法、公正司法、全民守法分开，拒绝互相替代。；能说明全民守法包括一切组织和个人，同时不把道德倡议或任意校规说成法律义务。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j085","n":"重大改革于法有据，法治与德治不能互相代替","s":"道法","g":8,"m":1,"c":"八年级下册 第5单元 建设法治中国","d":"法治教育","x":"以法治推进国家治理现代化框：法治与改革相互促进；法治与德治相得益彰。法治与改革相互促进：重大改革要于法有据，在法治下推进改革，在改革中完善法治。这不是先把宪法法律搁下再补，也不是法律一旦制定就禁止一切完善。法治与德治相得益彰：法律体现道德的底线要求，道德滋养法治，但善良愿望不能抵消违法行为，道德倡议…","k":"能说明重大改革要于法有据，既可以完善法律，也不能先搁置宪法法律。；能说明德治不能代替守法，道德倡议也不能被说成法律义务。","sem":"下","w":["依法办事与诉讼类型"]},{"i":"cnd_j086","n":"党团结带领人民书写百年恢宏史诗","s":"道法","g":9,"m":1,"c":"九年级上册 第1单元 坚持党的全面领导","d":"革命传统教育","x":"百年大党风华正茂框：书写恢宏史诗。中国共产党团结带领人民，走过新民主主义革命、社会主义革命和建设、改革开放和社会主义现代化建设、中国特色社会主义新时代，书写了中华民族历史上的恢宏史诗。今天的国家成就接在这段历程后面。它不是可以按喜好删改的故事，也不是与人民无关的个人功绩簿。","k":"能按顺序说出四个历史时期，并说明史诗是党团结带领人民创造的。；能拒绝把百年历程说成与今天无关，或把其中一段整个删去。","sem":"上"},{"i":"cnd_j087","n":"弘扬伟大建党精神","s":"道法","g":9,"m":1,"c":"九年级上册 第1单元 坚持党的全面领导","d":"革命传统教育","x":"百年大党风华正茂框：弘扬伟大建党精神。伟大建党精神是坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。弘扬它，是把这些精神用在今天的学习和担当里，而不是只在纪念活动上念一遍，也不是鼓励无谓冒险。","k":"能说出伟大建党精神的四句内涵，并把它和新发展理念等其他表述分开。；能说明弘扬是在具体事上继承这种精神，而不是只停留在口号或冒险。","sem":"上"},{"i":"cnd_j088","n":"牢记初心使命并站稳人民立场","s":"道法","g":9,"m":1,"c":"九年级上册 第1单元 坚持党的全面领导","d":"国情教育","x":"坚持以人民为中心框：牢记初心使命；站稳人民立场。中国共产党人的初心和使命，是为中国人民谋幸福、为中华民族谋复兴。站稳人民立场，是把人民利益摆在心中最高位置，坚持以人民为中心，而不是把个人前程或网上一句偏激的话当成人民的根本利益。","k":"能说出初心使命是为中国人民谋幸福、为中华民族谋复兴。；能把人民立场和个人算计、随声附和区分开。","sem":"上"},{"i":"cnd_j089","n":"中国共产党是坚强的领导核心","s":"道法","g":9,"m":1,"c":"九年级上册 第1单元 坚持党的全面领导","d":"国情教育","x":"党是领导一切的框：坚强的领导核心。中国共产党是中国特色社会主义事业的领导核心，是最高政治领导力量。这个核心领导人民当家作主，总揽全局、协调各方，不是取消人民代表大会等国家机关，也不是可以换成别的政治力量轮流充当核心。","k":"能说明党是中国特色社会主义事业的领导核心。；能把领导核心与取消国家机关、与多党轮流坐庄区分开。","sem":"上"},{"i":"cnd_j090","n":"坚持和加强党的全面领导","s":"道法","g":9,"m":1,"c":"九年级上册 第1单元 坚持党的全面领导","d":"国情教育","x":"党是领导一切的框：坚持和加强党的全面领导。中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。全面领导是对经济、政治、文化、社会、生态文明建设和党的建设等全部工作的领导，要通过制度和程序来实现，不是某个领域可以退出，也不是一名党员的私人吩咐。","k":"能说明党的领导是最本质的特征和最大优势，并且是全面的领导。；能拒绝把全面领导缩成一个领域，或理解成私人命令。","sem":"上"},{"i":"cnd_j091","n":"我国社会主要矛盾已经变化","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"新的历史方位框：社会主要矛盾的变化。中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这不是说发展已经平衡、充分，也不是说我国已经越过社会主义初级阶段。","k":"能准确说出转化之后的社会主要矛盾。；能说明主要矛盾变了，并不等于初级阶段的基本国情已经改变。","sem":"上"},{"i":"cnd_j092","n":"中国特色社会主义进入新时代的意义","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"新的历史方位框：进入新时代的意义。中国特色社会主义进入新时代，是我国发展新的历史方位。它意味着中华民族迎来了从站起来、富起来到强起来的伟大飞跃，意味着科学社会主义在二十一世纪的中国焕发出强大生机活力，意味着中国特色社会主义拓展了发展中国家走向现代化的途径。这不是日历换了一页，也不是所有问题都已经解决…","k":"能说明进入新时代是新的历史方位，并说出其意义中的关键判断。；能拒绝把新时代理解成问题已经全部解决，或只是年份变更。","sem":"上"},{"i":"cnd_j093","n":"习近平新时代中国特色社会主义思想是必须长期坚持的指导思想","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"新时代的思想旗帜框：系统科学的理论体系；必须长期坚持的指导思想。习近平新时代中国特色社会主义思想是系统科学的理论体系，是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华。它是全党全国必须长期坚持的指导思想，要用来观察和推动实践，而不是一阵口号或脱离实际的词句。","k":"能说明这一思想是系统科学的理论，并须长期坚持。；能把长期坚持理解成指导实践，而不是只在考试时背诵。","sem":"上"},{"i":"cnd_j094","n":"新时代经济实力大幅跃升","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"中国腾飞谱新篇框：经济实力大幅跃升。进入新时代，我国经济实力大幅跃升，经济总量稳居世界第二，综合国力显著增强。这是党领导人民奋斗的成果。跃升不是说发展已经平衡充分，也不是说我国已经变成发达国家，更不是只比速度、不要质量。","k":"能说明经济实力跃升的基本事实，并把它和平衡充分、发达国家区分开。；能指出跃升之后仍要重视质量，而不是回到只追速度。","sem":"上"},{"i":"cnd_j095","n":"新时代民主政治不断发展","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"中国腾飞谱新篇框：民主政治不断发展。我国社会主义民主是全过程人民民主，人民当家作主是社会主义民主政治的本质。人民代表大会制度是我国的根本政治制度。党的领导、人民当家作主、依法治国有机统一。民主不是只有投票那一天，也不是照搬别国的政党轮替。","k":"能说明全过程人民民主和人民代表大会制度的地位。；能把我国的民主政治与只在投票日出现、或与党的领导对立起来的说法区分开。","sem":"上"},{"i":"cnd_j096","n":"文化自信日益增强","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"中国腾飞谱新篇框：文化自信日益增强。文化自信是更基础、更广泛、更深厚的自信，来自中华优秀传统文化、革命文化和社会主义先进文化。它不是封闭自傲，不是全盘照搬外来文化，也不是把传统一概丢掉。自信包括在交流互鉴中发展自己的文化。","k":"能说明文化自信在四个自信中的地位及其文化来源。；能拒绝自傲、全盘照搬和抛弃传统这三种偏向。","sem":"上"},{"i":"cnd_j097","n":"民生福祉持续增进","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"中国腾飞谱新篇框：民生福祉持续增进。发展的根本目的是增进民生福祉。进入新时代，我国全面建成小康社会，历史性地解决了绝对贫困问题，教育、就业、收入、社保、医疗、住房等方面持续改善。共同富裕是要逐步实现的全体人民的富裕，不是同时同步同等富裕，也不是已经完全实现，更不是说具体困难已经全部消失。","k":"能说明发展以增进民生福祉为根本目的，并知道小康和绝对贫困上的历史性成就。；能把共同富裕与同时同等富裕、与困难已经消失区分开。","sem":"上"},{"i":"cnd_j098","n":"美丽中国加快建设","s":"道法","g":9,"m":1,"c":"九年级上册 第2单元 进入新时代","d":"国情教育","x":"中国腾飞谱新篇框：美丽中国加快建设。建设美丽中国，要推动人与自然和谐共生。绿水青山就是金山银山，不是先破坏再补救，也不是停止一切生产。节约资源和保护环境要落实到生产和生活的具体约束里。","k":"能用绿水青山就是金山银山说明保护与发展的关系。；能选择既保护环境又继续发展的做法，拒绝先污染后治理和空喊口号。","sem":"上"},{"i":"cnd_j099","n":"分两步把我国建成社会主义现代化强国","s":"道法","g":9,"m":1,"c":"九年级上册 第3单元 奋进新征程","d":"国情教育","x":"擘画宏伟蓝图框：“两步走”战略。全面建成小康社会之后，从二〇二〇年到本世纪中叶分两步走：第一步，二〇二〇年到二〇三五年，基本实现社会主义现代化；第二步，二〇三五年到本世纪中叶，把我国建成富强民主文明和谐美丽的社会主义现代化强国。二〇三五年还不是建成强国。这个安排不否定小康已经建成。","k":"能分清两个阶段各自的时间和目标，不把二〇三五年说成已经建成强国。；能说明“两步走”是小康建成之后向第二个百年奋斗目标前进的安排。","sem":"上"},{"i":"cnd_j100","n":"中国式现代化有自己的特征","s":"道法","g":9,"m":1,"c":"九年级上册 第3单元 奋进新征程","d":"国情教育","x":"擘画宏伟蓝图框：中国式现代化。中国式现代化是中国共产党领导的社会主义现代化。它的中国特色包括人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路。它不是照搬别国现代化，也不把党的领导从中拿掉。","k":"能说出中国式现代化五个方面的中国特色。；能说明它是党领导的社会主义现代化，不是别国模式的复制。","sem":"上"},{"i":"cnd_j101","n":"完整贯彻新发展理念","s":"道法","g":9,"m":1,"c":"九年级上册 第3单元 奋进新征程","d":"国情教育","x":"实现高质量发展框：贯彻新发展理念。新发展理念是创新、协调、绿色、开放、共享。创新是引领发展的第一动力，协调是持续健康发展的内在要求，绿色是永续发展的必要条件，开放是国家繁荣发展的必由之路，共享是中国特色社会主义的本质要求。五个理念要完整、准确、全面地贯彻，不能只留下一个。","k":"能说出新发展理念的五个方面，并配上各自的定位。；能拒绝只取一个理念、或把定位互相替换。","sem":"上"},{"i":"cnd_j102","n":"构建以国内大循环为主体的新发展格局","s":"道法","g":9,"m":1,"c":"九年级上册 第3单元 奋进新征程","d":"国情教育","x":"实现高质量发展框：构建新发展格局。新发展格局是以国内大循环为主体、国内国际双循环相互促进。国内大循环成为主体，是因为我国市场广大，也需要把发展和安全的主动权掌握在自己手里。这不是关起门来的封闭循环，开放仍然要推进。","k":"能说出新发展格局是国内大循环为主体、国内国际双循环相互促进。；能说明这不是封闭，也不是国内国际互相代替。","sem":"上"},{"i":"cnd_j103","n":"推动高质量发展","s":"道法","g":9,"m":1,"c":"九年级上册 第3单元 奋进新征程","d":"国情教育","x":"实现高质量发展框：推动高质量发展。第八课的课名是实现高质量发展，推动高质量发展是这一课中的一个框。高质量发展是全面建设社会主义现代化国家的首要任务，是体现新发展理念的发展，要由“有没有”转向“好不好”。它不是把速度本身当成质量，也不是为了质量就否定合理增长，更不是退回粗放扩张。","k":"能说明高质量发展是全面建设社会主义现代化国家的首要任务。；能把课名“实现高质量发展”和框名“推动高质量发展”分开，并拒绝只追速度或只喊停。","sem":"上"},{"i":"cnd_j104","n":"铸牢中华民族共同体意识","s":"道法","g":9,"m":1,"c":"九年级上册 第4单元 共圆中国梦","d":"国情教育","x":"凝聚团结伟力框：铸牢中华民族共同体意识。铸牢中华民族共同体意识，是国家统一之基、民族团结之本、精神力量之魂。各族人民要像石榴籽一样紧紧抱在一起，增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同。这不是取消各民族的语言文字和风俗，而是在平等团结中共同繁荣，也不是把某一个民族从中华…","k":"能说明中华民族共同体意识是国家统一之基、民族团结之本、精神力量之魂。；能说出五个认同，并拒绝分裂共同体或取消民族特点两种偏向。","sem":"上"},{"i":"cnd_j105","n":"坚持一个中国原则、实现祖国完全统一","s":"道法","g":9,"m":1,"c":"九年级上册 第4单元 共圆中国梦","d":"国情教育","x":"凝聚团结伟力框：实现祖国完全统一。解决台湾问题、实现祖国完全统一，是全体中华儿女的共同愿望，是党的历史任务。一个中国原则是两岸关系的政治基础。和平统一、一国两制是实现两岸统一的最佳方式。香港、澳门已经回归。我们争取和平统一的前景，但决不承诺放弃使用武力，针对的是外部势力干涉和极少数分裂分子，绝非针对…","k":"能说明一个中国原则，以及和平统一、一国两制的方针。；能把香港、澳门已经回归和台湾尚未统一区分开，并说清不放弃使用武力所针对的对象。","sem":"上"},{"i":"cnd_j106","n":"民族复兴梦要靠每个人追梦","s":"道法","g":9,"m":1,"c":"九年级上册 第4单元 共圆中国梦","d":"国情教育","x":"实现伟大梦想框：民族复兴梦；我们都是追梦人。中国梦是实现中华民族伟大复兴，本质是国家富强、民族振兴、人民幸福。它是国家的梦、民族的梦，也是每一个中国人的梦，不是称霸的梦。我们都是追梦人，要把个人的正当发展融进民族复兴，用学习和本分上的行动去奋斗，而不是只喊口号，也不是说中学生还没有资格追梦。","k":"能说出中国梦的本质是国家富强、民族振兴、人民幸福。；能说明追梦是把个人奋斗融进民族复兴，而不是空喊或称霸。","sem":"上"}],"edges":[{"a":"cnm_p002","b":"cnm_p001","h":1,"r":"学习「5以内数的大小」需要先掌握「1到5各数的认识」。"},{"a":"cnm_p004","b":"cnm_p001","h":1,"r":"学习「5以内数的分与合」需要先掌握「1到5各数的认识」。"},{"a":"cnm_p006","b":"cnm_p004","h":1,"r":"学习「5以内的加法」需要先掌握「5以内数的分与合」。"},{"a":"cnm_p007","b":"cnm_p006","h":1,"r":"学习「5以内的减法」需要先掌握「5以内的加法」。"},{"a":"cnm_p008","b":"cnm_p001","h":1,"r":"学习「6～10各数的认识」需要先掌握「1到5各数的认识」。"},{"a":"cnm_p009","b":"cnm_p008","h":1,"r":"学习「10以内数的比较」需要先掌握「6～10各数的认识」。"},{"a":"cnm_p009","b":"cnm_p002","h":1,"r":"学习「10以内数的比较」需要先掌握「5以内数的大小」。"},{"a":"cnm_p010","b":"cnm_p006","h":1,"r":"学习「10以内的加法」需要先掌握「5以内的加法」。"},{"a":"cnm_p010","b":"cnm_p008","h":1,"r":"学习「10以内的加法」需要先掌握「6～10各数的认识」。"},{"a":"cnm_p011","b":"cnm_p007","h":1,"r":"学习「10以内的减法」需要先掌握「5以内的减法」。"},{"a":"cnm_p011","b":"cnm_p010","h":1,"r": ":1,"r":"品味含义深刻的词句之前，要先会联系上下文理解词语。"},{"a":"cnc_p467","b":"cnc_p429","h":1,"r":"推想词语在语境中的意思，要先会品味词句。"},{"a":"cnc_p028","b":"cnc_p001","h":1,"r":"把汉字连成句子之前，要先认识句中的常用字。"},{"a":"cnc_p041","b":"cnc_p028","h":1,"r":"看图按顺序说之前，要先会说完整的句子。"},{"a":"cnc_p059","b":"cnc_p028","h":1,"r":"给句子加标点之前，要先会说完整的句子。"},{"a":"cnc_p079","b":"cnc_p041","h":1,"r":"看图把事情说清楚之前，要先会按顺序说出谁在做什么。"},{"a":"cnc_p094","b":"cnc_p059","h":1,"r":"把句子补充完整之前，要先分清陈述、提问和感叹。"},{"a":"cnc_p157","b":"cnc_p094","h":1,"r":"把句子写具体之前，要先会把句子补充完整。"},{"a":"cnc_p183","b":"cnc_p157","h":1,"r":"区分的、地、得之前，要先会把一句话写完整、写具体。"},{"a":"cnc_p206","b":"cnc_p183","h":1,"r":"学习比喻和拟人之前，要先会把句子写通顺。"},{"a":"cnc_p206","b":"cnc_p204","h":1,"r":"分辨比喻和拟人，要先读过《荷花》里的句子。"},{"a":"cnc_p273","b":"cnc_p206","h":1,"r":"用关联词连接分句之前，要先会把句子写具体。"},{"a":"cnc_p311","b":"cnc_p059","h":1,"r":"给对话加引号之前，要先认识句号、问号和感叹号。"},{"a":"cnc_p359","b":"cnc_p273","h":1,"r":"修改搭配不当和重复啰嗦之前，要先会使用关联词。"},{"a":"cnc_p396","b":"cnc_p359","h":1,"r":"缩句、扩句之前，要先会修改重复和搭配不当的句子。"},{"a":"cnc_p441","b":"cnc_p273","h":1,"r":"学习不但而且、只要就之前，要先会把因为所以、虽然但是配成对。"},{"a":"cnc_p447","b":"cnc_p442","h":1,"r":"理解之、其、而之前，要先读懂《两小儿辩日》，这些字就在句子里。"},{"a":"cnc_p472","b":"cnc_p311","h":1,"r":"学习省略号和破折号之前，要先会给对话加引号。"},{"a":"cnc_p049","b":"cnc_p024","h":1,"r":"读稍长的故事之前，要先会借助拼音读懂短课文。"},{"a":"cnc_p101","b":"cnc_p080","h":1,"r":"读寓言之前，要先会按顺序弄清故事里谁说了什么。"},{"a":"cnc_p138","b":"cnc_p101","h":1,"r":"再读寓言之前，要先会说出一则寓言的道理。"},{"a":"cnc_p139","b":"cnc_p138","h":1,"r":"读《揠苗助长》之前，要先会从寓言里找出做法和结果。"},{"a":"cnc_p141","b":"cnc_p138","h":1,"r":"读《小马过河》之前，要先会从寓言里找出做法和结果。"},{"a":"cnc_p140","b":"cnc_p138","h":1,"r":"读《画杨桃》之前，要先会从故事里找出做法和结果。"},{"a":"cnc_p167","b":"cnc_p097","h":1,"r":"读《秋天的雨》之前，要先会抓住写景课文里的景物特点。"},{"a":"cnc_p171","b":"cnc_p160","h":1,"r":"边读边预测之前，要先会读懂一篇故事在讲谁做了什么。"},{"a":"cnc_p195","b":"cnc_p160","h":1,"r":"读文言文之前，要先会读懂一篇写人的故事在讲谁做了什么。"},{"a":"cnc_p182","b":"cnc_p180","h":1,"r":"写「我们眼中的缤纷世界」之前，要先会像《搭船的鸟》那样按顺序说出看到的样子。"},{"a":"cnc_p207","b":"cnc_p195","h":1,"r":"读《守株待兔》之前，要先会借助注释读懂短文言文。"},{"a":"cnc_p208","b":"cnc_p207","h":1,"r":"读《会摇尾巴的狼》之前，要先会说出《守株待兔》说明的道理。"},{"a":"cnc_p209","b":"cnc_p207","h":1,"r":"读《鹿角和鹿腿》之前，要先会从寓言里找出做法和结果。"},{"a":"cnc_p210","b":"cnc_p207","h":1,"r":"读《池子与河流》之前，要先会说出一则寓言的道理。"},{"a":"cnc_p204","b":"cnc_p167","h":1,"r":"读《荷花》之前，要先会抓住写景段落里的景物特点。"},{"a":"cnc_p213","b":"cnc_p184","h":1,"r":"读《海底世界》之前，要先会按方面读懂《富饶的西沙群岛》。"},{"a":"cnc_p214","b":"cnc_p213","h":1,"r":"读《石蜂》这种实验说明文之前，要先会按顺序读懂一篇说明文。"},{"a":"cnc_p215","b":"cnc_p213","h":1,"r":"读《小虾》之前，要先会从一篇写动物的短文里抓住它的样子和活动。"},{"a":"cnc_p234","b":"cnc_p213","h":1,"r":"从天空和大地两方面读《我们奇妙的世界》之前，要先会按方面读懂《海底世界》。"},{"a":"cnc_p257","b":"cnc_p207","h":1,"r":"读神话之前，要先会说出故事说明的道理。"},{"a":"cnc_p257","b":"cnc_p256","h":1,"r":"读《精卫填海》之前，要先读《盘古开天地》，才不会把开天和填海记成同一则神话。"},{"a":"cnc_p258","b":"cnc_p256","h":1,"r":"读《普罗米修斯》之前，要先读《盘古开天地》，才不会把盗火和开天记成同一个故事。"},{"a":"cnc_p259","b":"cnc_p257","h":1,"r":"读《女娲补天》之前，要先会读一则神话，才不会把补天和填海记成同一件事。"},{"a":"cnc_p254","b":"cnc_p253","h":1,"r":"读《蟋蟀的住宅》之前，要先会读《爬山虎的脚》，两篇都要把观察到的部位写清楚。"},{"a":"cnc_p266","b":"cnc_p265","h":1,"r":"读《颐和园》之前，要先会读《长城》这样介绍一处建筑的课文。"},{"a":"cnc_p267","b":"cnc_p265","h":1,"r":"读《秦兵马俑》之前，要先会读《长城》，两处都是中国的世界文化遗产。"},{"a":"cnc_p275","b":"cnc_p274","h":1,"r":"读《为中华之崛起而读书》之前，要先读《我将无我，不负人民》，两篇都在写把国家和人民放在自己前…"},{"a":"cnc_p276","b":"cnc_p275","h":1,"r":"读《延安，我把你追寻》之前，要先会读《为中华之崛起而读书》，才不会把少年立志和追寻延安精神记…"},{"a":"cnc_p272","b":"cnc_p195","h":1,"r":"读《王戎不取道旁李》之前，要先会读短文言文。"},{"a":"cnc_p240","b":"cnc_p204","h":1,"r":"按顺序概括写景课文之前，要先会找出景物特点。"},{"a":"cnc_p295","b":"cnc_p241","h":1,"r":"读冰心短诗《繁星》之前，要先读巴金的散文《繁星》，才不会把海上看星和母亲膝上的回忆记成同一篇…"},{"a":"cnc_p307","b":"cnc_p272","h":1,"r":"读文言文二则之前，要先会读懂另一则短文言文。"},{"a":"cnc_p308","b":"cnc_p240","h":1,"r":"把握较长叙事文的内容之前，要先会按顺序概括课文。"},{"a":"cnc_p289","b":"cnc_p288","h":1,"r":"读《飞向蓝天的恐龙》之前，要先会读《琥珀》这种根据实物来推测的说明文。"},{"a":"cnc_p290","b":"cnc_p289","h":1,"r":"读《纳米技术就在我们身边》之前，要先会读另一篇科学说明文，才不会把恐龙演化和纳米材料记成同一…"},{"a":"cnc_p291","b":"cnc_p290","h":1,"r":"读《千年梦圆在今朝》之前，要先会读身边的科学技术说明，才不会把飞天梦和纳米材料记成同一篇。"},{"a":"cnc_p297","b":"cnc_p296","h":1,"r":"读《白桦》之前，要先读《绿》，才不会把艾青写的绿和叶赛宁写的白桦记成同一首。"},{"a":"cnc_p298","b":"cnc_p297","h":1,"r":"读《在天晴了的时候》之前，要先会读《白桦》，两首写景物的诗才不会串在一起。"},{"a":"cnc_p301","b":"cnc_p300","h":1,"r":"读《母鸡》之前，要先会读老舍的《猫》，才不会把古怪可爱和先厌后敬记成同一种感情。"},{"a":"cnc_p302","b":"cnc_p300","h":1,"r":"读《白鹅》之前，要先会抓住《猫》里动物的特点，才不会把高傲和古怪记成同一种写法。"},{"a":"cnc_p305","b":"cnc_p304","h":1,"r":"读《记金华的双龙洞》之前，要先会按顺序读《海上日出》，才不会把海上的日出和洞里的石钟乳记成同…"},{"a":"cnc_p316","b":"cnc_p315","h":1,"r":"读《“诺曼底号”遇难记》之前，要先会读《黄继光》，才不会把堵住枪口和与船共存亡记成同一个人。"},{"a":"cnc_p319","b":"cnc_p175","h":1,"r":"读四下的《宝葫芦的秘密》之前，要先读过三上的节选，才不会把两处节选记成同一段。"},{"a":"cnc_p321","b":"cnc_p320","h":1,"r":"读《海的女儿》之前，要先会说出《巨人的花园》的道理，才不会把分享春天和牺牲成全记成同一个故事…"},{"a":"cnc_p322","b":"cnc_p320","h":1,"r":"给故事新编之前，要先读懂《巨人的花园》这样已经学过的故事，才知道人物不能写反。"},{"a":"cnc_p324","b":"cnc_p323","h":1,"r":"读《落花生》之前，要先读《桂花雨》，才不会把摇桂花和种花生记成同一家的事。"},{"a":"cnc_p325","b":"cnc_p324","h":1,"r":"读《珍珠鸟》之前，要先读《落花生》，才不会把做人要有用和信赖出美好境界记成同一篇。"},{"a":"cnc_p331","b":"cnc_p329","h":1,"r":"读《“诺曼底号”遇难记》之前，要先会梳理《将相和》的情节，才不会把负荆请罪和船长留在舰桥记成…"},{"a":"cnc_p332","b":"cnc_p329","h":1,"r":"写「漫画」老师、抓住人物特点之前，要先会从《将相和》里看出两个人物各有各的做法。"},{"a":"cnc_p342","b":"cnc_p308","h":1,"r":"读议论性节选之前，要先会把握叙事文的主要内容。"},{"a":"cnc_p336","b":"cnc_p335","h":1,"r":"读《牛郎织女》之前，要先读《猎人海力布》，两篇都是民间故事，才不会把变成石头和喜鹊搭桥记成同…"},{"a":"cnc_p337","b":"cnc_p336","h":1,"r":"给民间故事新编之前，要先读懂《牛郎织女》，才知道人物不能写反。"},{"a":"cnc_p343","b":"cnc_p342","h":1,"r":"读《圆明园的毁灭》之前，要先读《少年中国说》，才不会把少年强则国强和园林被毁记成同一篇。"},{"a":"cnc_p344","b":"cnc_p343","h":1,"r":"读《梅兰芳蓄须明志》之前，要先读《圆明园的毁灭》，两篇都在写面对外来侵略时不能忘记的事。"},{"a":"cnc_p347","b":"cnc_p346","h":1,"r":"读《金字塔》之前，要先会读《太阳》这样按方面介绍事物的说明文。"},{"a":"cnc_p348","b":"cnc_p347","h":1,"r":"介绍一种事物之前，要先会看出《金字塔》是从哪几方面写的。"},{"a":"cnc_p350","b":"cnc_p349","h":1,"r":"读《父爱之舟》之前，要先读《慈母情深》，才不会把母亲买书和父亲送考记成同一篇。"},{"a":"cnc_p351","b":"cnc_p350","h":1,"r":"读《航天员写给孩子的信》之前，要先会读《父爱之舟》，两篇都在写父母为孩子付出。"},{"a":"cnc_p352","b":"cnc_p351","h":1,"r":"写「我想对您说」之前，要先读过《航天员写给孩子的信》，才知道信里要把牵挂说具体。"},{"a":"cnc_p358","b":"cnc_p357","h":1,"r":"读《白鹭》之前，要先会读《第一场雪》，才不会把一场大雪和一只白鹭记成同一篇写景。"},{"a":"cnc_p361","b":"cnc_p360","h":1,"r":"读冰心《忆读书》之前，要先会读《古人谈读书》，才不会把三到、有志和自己七岁读《三国》记成同一…"},{"a":"cnc_p362","b":"cnc_p361","h":1,"r":"读《走遍天下书为侣》之前，要先会读《忆读书》，才不会把冰心的书单和荒岛上只带一本书记成同一篇…"},{"a":"cnc_p363","b":"cnc_p362","h":1,"r":"推荐一本书之前，要先会说出《走遍天下书为侣》里书为什么能当伴侣。"},{"a":"cnc_p372","b":"cnc_p329","h":1,"r":"读古典名著节选之前，要先会梳理《将相和》这类历史故事的情节。"},{"a":"cnc_p373","b":"cnc_p372","h":1,"r":"读《景阳冈》之前，要先会梳理名著故事的情节。"},{"a":"cnc_p374","b":"cnc_p372","h":1,"r":"读《猴王出世》之前，要先会抓住名著节选里的主要事件。"},{"a":"cnc_p375","b":"cnc_p374","h":1,"r":"读《红楼春趣》之前，要先会读《猴王出世》，才不会把放风筝和石猴跳瀑布记成同一篇。"},{"a":"cnc_p375","b":"cnc_p373","h":1,"r":"读《红楼春趣》之前，要先会读《景阳冈》，才不会把大观园和打虎记成同一个故事。"},{"a":"cnc_p376","b":"cnc_p375","h":1,"r":"写读后感之前，要先读过一篇古典名著节选，才知道感受要从读过的情节里来。"},{"a":"cnc_p378","b":"cnc_p376","h":1,"r":"读整本古典名著之前，要先会把一篇节选的读后想法说清楚。"},{"a":"cnc_p392","b":"cnc_p307","h":1,"r":"读《自相矛盾》之前，要先会读懂浅易文言文的大意。"},{"a":"cnc_p393","b":"cnc_p392","h":1,"r":"读《田忌赛马》之前，要先会读《自相矛盾》，两则文言文才不会把矛盾和赛马记成同一则。"},{"a":"cnc_p393","b":"cnc_p247","h":1,"r":"读文言文《田忌赛马》之前，要先读过四年级的《田忌赛马》，才知道这是同一件事的文言写法。"},{"a":"cnc_p394","b":"cnc_p373","h":1,"r":"读《跳水》并推断人物做法之前，要先会梳理故事情节。"},{"a":"cnc_p395","b":"cnc_p394","h":1,"r":"写探险之前，要先会读《跳水》，才知道危险来时要把人物的做法写清楚。"},{"a":"cnc_p402","b":"cnc_p393","h":1,"r":"读《杨氏之子》之前，要先会读《田忌赛马》这样的短文言文。"},{"a":"cnc_p403","b":"cnc_p402","h":1,"r":"读《手指》之前，要先读《杨氏之子》，才不会把孔君平的玩笑和五根手指记成同一篇。"},{"a":"cnc_p404","b":"cnc_p403","h":1,"r":"读《童年的发现》之前，要先读《手指》，才不会把五根手指和胚胎发育记成同一篇。"},{"a":"cnc_p368","b":"cnc_p367","h":1,"r":"读《月是故乡明》之前，要先读《祖父的园子》，两篇都写童年和故乡，才不会把园子和月亮记成同一篇…"},{"a":"cnc_p369","b":"cnc_p368","h":1,"r":"读《梅花魂》之前，要先读《月是故乡明》，才不会把思乡的月亮和外祖父的梅花记成同一篇。"},{"a":"cnc_p370","b":"cnc_p369","h":1,"r":"写「那一刻，我长大了」之前，要先读过一篇回忆童年的课文，才知道那一刻的场景要写具体。"},{"a":"cnc_p385","b":"cnc_p384","h":1,"r":"读《军神》之前，要先读《青山处处埋忠骨》，才不会把刘伯承拒绝麻药和毛岸英安葬在朝鲜记成同一篇…"},{"a":"cnc_p386","b":"cnc_p385","h":1,"r":"读《清贫》之前，要先读《军神》，两篇都写革命者，才不会把手术和搜身记成同一件事。"},{"a":"cnc_p387","b":"cnc_p386","h":1,"r":"写「他____了」之前，要先会从课文里看出人物心情发生了什么变化。"},{"a":"cnc_p390","b":"cnc_p389","h":1,"r":"读《刷子李》之前，要先会读《人物描写一组》，才不会把黑衣白点和两茎灯草记成同一种细节。"},{"a":"cnc_p398","b":"cnc_p397","h":1,"r":"读《牧场之国》之前，要先读《威尼斯的小艇》，才不会把荷兰的牧场和威尼斯的小艇记成同一篇。"},{"a":"cnc_p399","b":"cnc_p398","h":1,"r":"读五下《金字塔》之前，要先读《牧场之国》，两篇都写异域景物，才不会把牧场和金字塔记成同一处。"},{"a":"cnc_p399","b":"cnc_p347","h":1,"r":"读五下《金字塔夕照》和《不可思议的金字塔》之前，要先读过五上的说明文《金字塔》，才不会把夕照…"},{"a":"cnc_p400","b":"cnc_p399","h":1,"r":"介绍中国的世界文化遗产之前，要先会读五下《金字塔》这种把一处古迹写具体的课文。"},{"a":"cnc_p400","b":"cnc_p267","h":1,"r":"介绍中国的世界文化遗产之前，要先读过《秦兵马俑》，才知道这一类古迹可以怎样介绍。"},{"a":"cnc_p401","b":"cnc_p399","h":1,"r":"用色彩把景物写具体之前，要先读过《金字塔夕照》里成片的金色。"},{"a":"cnc_p425","b":"cnc_p394","h":1,"r":"体会小说结尾之前，要先会根据情节理解人物做法。"},{"a":"cnc_p426","b":"cnc_p425","h":1,"r":"理解人物对话的含义之前，要先会读懂小说的情节。"},{"a":"cnc_p427","b":"cnc_p426","h":1,"r":"读《金色的鱼钩》之前，要先读《穷人》，两篇都写把生的希望留给别人，才不会把西蒙的孩子和老班长…"},{"a":"cnc_p442","b":"cnc_p392","h":1,"r":"读《两小儿辩日》之前，要先会读懂《自相矛盾》这样的浅易文言文。"},{"a":"cnc_p443","b":"cnc_p442","h":1,"r":"读《曹冲称象》之前，要先读《两小儿辩日》，两则文言文才不会把称象和辩日记成同一则。"},{"a":"cnc_p481","b":"cnc_p442","h":1,"r":"读《学弈》之前，要先读过上册《两小儿辩日》。学弈选自《孟子》，辩日选自《列子》，不要记成同一…"},{"a":"cnc_p469","b":"cnc_p426","h":1,"r":"体会散文里的情感之前，要先会理解叙事文中的人物心情。"},{"a":"cnc_p454","b":"cnc_p357","h":1,"r":"按时间顺序把握《北京的春节》之前，要先会区分《第一场雪》里下雪时的动态和下雪后的静态，才不会…"},{"a":"cnc_p455","b":"cnc_p454","h":1,"r":"读《腊八粥》里八儿怎样盼粥之前，要先读过《北京的春节》，两篇写腊八的课文才不会记成同一篇。"},{"a":"cnc_p459","b":"cnc_p455","h":1,"r":"读《藏戏》之前，要先读过《腊八粥》，两篇都写民俗，才不会把盼粥和面具记成同一篇。"},{"a":"cnc_p460","b":"cnc_p454","h":1,"r":"写家乡的风俗之前，要先读过《北京的春节》，才知道习俗要按人们怎么过写清楚。"},{"a":"cnc_p462","b":"cnc_p372","h":1,"r":"读外国名著节选之前，要先会抓住古典名著里的主要事件。"},{"a":"cnc_p463","b":"cnc_p462","h":1,"r":"读《骑鹅旅行记》之前，要先会梳理《鲁滨逊漂流记》的情节，才不会把荒岛和骑鹅记成同一个故事。"},{"a":"cnc_p464","b":"cnc_p462","h":1,"r":"读《汤姆·索亚历险记》之前，要先会读懂另一篇外国名著节选的情节。"},{"a":"cnc_p465","b":"cnc_p462","h":1,"r":"写作品梗概之前，要先会梳理《鲁滨逊漂流记》的主要情节。"},{"a":"cnc_p468","b":"cnc_p464","h":1,"r":"漫步世界名著花园之前，要先读过本单元的名著节选，才知道要抓住人物和情节。"},{"a":"cnc_p471","b":"cnc_p470","h":1,"r":"让真情自然流露之前，要先读《那个星期天》，才知道心情要落在具体的等待上。"},{"a":"cnc_p477","b":"cnc_p476","h":1,"r":"读《为人民服务》之前，要先读《十六年前的回忆》，才不会把李大钊和张思德记成同一个人。"},{"a":"cnc_p478","b":"cnc_p477","h":1,"r":"读《董存瑞舍身炸暗堡》之前，要先读《为人民服务》，才不会把托炸药包和比泰山还重记成同一件事。"},{"a":"cnc_p478","b":"cnc_p417","h":1,"r":"读《董存瑞舍身炸暗堡》之前，要先读《我的战友邱少云》，才不会把炸暗堡和在烈火中一动不动记成同…"},{"a":"cnc_p479","b":"cnc_p478","h":1,"r":"做「奋斗的历程」之前，要先读过《董存瑞舍身炸暗堡》，才有具体的事迹可讲。"},{"a":"cnc_p480","b":"cnc_p476","h":1,"r":"体会开头和结尾之前，要先读《十六年前的回忆》，这篇开头和结尾都落在同一天上。"},{"a":"cnc_p482","b":"cnc_p481","h":1,"r":"读《真理诞生于一百个问号之后》之前，要先读《学弈》，才不会把专心下棋和科学家追问记成同一篇。"},{"a":"cnc_p483","b":"cnc_p482","h":1,"r":"围绕中心选择材料之前，要先看出《真理诞生于一百个问号之后》是怎样用三个事例说明一个观点的。"},{"a":"cnc_p484","b":"cnc_p482","h":1,"r":"辩论之前，要先会读一篇用事例说明观点的课文，才知道理由要落到事实上。"},{"a":"cnc_p485","b":"cnc_p476","h":1,"r":"回忆往事之前，要先读过《十六年前的回忆》，才知道回忆要有具体的一天和具体的人。"},{"a":"cnc_p486","b":"cnc_p485","h":1,"r":"写依依惜别之前，要先会回忆一件具体的事，离别才不会只剩空话。"},{"a":"cnc_p056","b":"cnc_p034","h":1,"r":"背《静夜思》之前，要先读过写月亮的《小小的船》，才不会把弯弯的月儿和床前明月装成同一篇。"},{"a":"cnc_p066","b":"cnc_p065","h":1,"r":"背《小池》之前，要先会背《池上》，才不会把偷采白莲和蜻蜓立上头记成同一首。"},{"a":"cnc_p095","b":"cnc_p065","h":1,"r":"背诵五言绝句《登鹳雀楼》之前，要先会背《池上》，才不会把句子串到别的诗里。"},{"a":"cnc_p096","b":"cnc_p095","h":1,"r":"背《望庐山瀑布》之前，要先会背《登鹳雀楼》，才不会把更上一层楼和飞流直下记成同一首。"},{"a":"cnc_p111","b":"cnc_p110","h":1,"r":"背《敕勒歌》之前，要先会背《江雪》，才不会把孤舟蓑笠翁和风吹草低见牛羊记成同一首。"},{"a":"cnc_p114","b":"cnc_p096","h":1,"r":"背《夜宿山寺》之前，要先会背《望庐山瀑布》，两首都是李白的，才不会把银河落九天和恐惊天上人记…"},{"a":"cnc_p119","b":"cnc_p096","h":1,"r":"背七言《咏柳》之前，要先会背七言《望庐山瀑布》，分清哪句写瀑布、哪句写柳。"},{"a":"cnc_p120","b":"cnc_p119","h":1,"r":"背《村居》之前，要先会背《咏柳》，才不会把春风似剪刀和放纸鸢记成同一首。"},{"a":"cnc_p143","b":"cnc_p119","h":1,"r":"背「两个黄鹂」之前，要先会背《咏柳》，才不会把春风和黄鹂装进同一首。"},{"a":"cnc_p144","b":"cnc_p143","h":1,"r":"背杨万里的西湖诗之前，要先会背杜甫的七言《绝句》，才不会把黄鹂和荷花记混。"},{"a":"cnc_p163","b":"cnc_p144","h":1,"r":"背刘禹锡《望洞庭》之前，要先会背杨万里的西湖诗，才不会把白银盘里的青螺和接天莲叶记成同一处湖…"},{"a":"cnc_p164","b":"cnc_p143","h":1,"r":"背杜牧《山行》之前，要先会背杜甫的七言《绝句》，才不会把两位诗人的句子装错。"},{"a":"cnc_p165","b":"cnc_p164","h":1,"r":"背叶绍翁《夜书所见》之前，要先会背杜牧《山行》，两首都写秋，才不会把霜叶和篱落一灯明记成同一…"},{"a":"cnc_p189","b":"cnc_p164","h":1,"r":"背王维《鹿柴》之前，要先会背杜牧《山行》，两首都写山，才不会把空山不见人和霜叶红于二月花记成…"},{"a":"cnc_p190","b":"cnc_p164","h":1,"r":"背写山水的《望天门山》之前，要先会背《山行》，分清山行和天门山不是同一首。"},{"a":"cnc_p191","b":"cnc_p144","h":1,"r":"背苏轼的西湖诗之前，要先会背杨万里的西湖诗，才不会把「比西子」和「接天莲叶」记混。"},{"a":"cnc_p200","b":"cnc_p143","h":1,"r":"背五言《绝句》之前，要先会背七言「两个黄鹂」，两首同名诗才不会串句。"},{"a":"cnc_p201","b":"cnc_p191","h":1,"r":"背苏轼题画的《惠崇春江晚景》之前，要先会背他的西湖诗，才不会把「鸭先知」和「比西子」记成同一…"},{"a":"cnc_p202","b":"cnc_p143","h":1,"r":"背《三衢道中》之前，要先会背「两个黄鹂」，才不会把黄鹂四五声和鸣翠柳记成同一首。"},{"a":"cnc_p218","b":"cnc_p164","h":1,"r":"背杜牧《清明》之前，要先知道《山行》也是杜牧的，才不会把《清明》记成杜甫的诗。"},{"a":"cnc_p219","b":"cnc_p217","h":1,"r":"背王维的重阳诗之前，要先会背王安石的《元日》，才不会把爆竹屠苏和遍插茱萸记成同一首。"},{"a":"cnc_p251","b":"cnc_p190","h":1,"r":"理解《题西林壁》之前，要先会背写山水的绝句。"},{"a":"cnc_p277","b":"cnc_p252","h":1,"r":"背《凉州词》之前，要先会背本册第三单元的古诗，才不会把雪梅和葡萄美酒装进同一首。"},{"a":"cnc_p278","b":"cnc_p251","h":1,"r":"背诵边塞诗之前，要先会背本册更早的古诗。"},{"a":"cnc_p278","b":"cnc_p277","h":1,"r":"背《出塞》之前，要先会背同课的《凉州词》，两首边塞诗才不会串句。"},{"a":"cnc_p279","b":"cnc_p278","h":1,"r":"背《夏日绝句》之前，要先会背《出塞》，才不会把人杰和飞将装进同一首。"},{"a":"cnc_p281","b":"cnc_p251","h":1,"r":"背诵《四时田园杂兴》之前，要先会背四年级上册的古诗。"},{"a":"cnc_p312","b":"cnc_p278","h":1,"r":"背诵送别诗之前，要先会背边塞诗里容易记错的句子。"},{"a":"cnc_p313","b":"cnc_p312","h":1,"r":"背《塞下曲》之前，要先会背《芙蓉楼送辛渐》，才不会把冰心玉壶和大雪满弓刀记成同一首。"},{"a":"cnc_p314","b":"cnc_p312","h":1,"r":"背《墨梅》之前，要先会背《芙蓉楼送辛渐》，才不会把一片冰心和只留清气记成同一首。"},{"a":"cnc_p339","b":"cnc_p278","h":1,"r":"背诵《示儿》之前，要先会背四年级的七言绝句。"},{"a":"cnc_p340","b":"cnc_p339","h":1,"r":"背《题临安邸》之前，要先会背《示儿》，两首写南宋的诗才不会把杭州和九州同装错。"},{"a":"cnc_p341","b":"cnc_p340","h":1,"r":"背《己亥杂诗》之前，要先会背《题临安邸》，才不会把万马齐喑和西湖歌舞装进同一首。"},{"a":"cnc_p354","b":"cnc_p341","h":1,"r":"背《山居秋暝》之前，要先会背本册第四单元的古诗，才不会把不拘一格和空山新雨记成同一首。"},{"a":"cnc_p355","b":"cnc_p354","h":1,"r":"背《枫桥夜泊》之前，要先会背同课的《山居秋暝》，才不会把清泉石上和江枫渔火装进同一首。"},{"a":"cnc_p356","b":"cnc_p355","h":1,"r":"背《早春呈水部张十八员外》之前，要先会背同课的《枫桥夜泊》，才不会把夜半钟声和草色遥看记成同…"},{"a":"cnc_p364","b":"cnc_p281","h":1,"r":"再背《四时田园杂兴》（其三十一）之前，要先会背四下学过的这一首，分清昼出耘田和夜绩麻。"},{"a":"cnc_p365","b":"cnc_p364","h":1,"r":"背《稚子弄冰》之前，要先分清《四时田园杂兴》（其三十一），才不会把学种瓜和银钲记成同一首。"},{"a":"cnc_p366","b":"cnc_p365","h":1,"r":"背《村晚》之前，要先会背《稚子弄冰》，才不会把银钲和短笛记成同一首。"},{"a":"cnc_p381","b":"cnc_p278","h":1,"r":"背王昌龄《从军行》之前，要先会背他的《出塞》，两首边塞诗才不会串句。"},{"a":"cnc_p382","b":"cnc_p381","h":1,"r":"背《秋夜将晓出篱门迎凉有感》之前，要先会背同课的《从军行》，才不会把楼兰和遗民泪尽记成同一首…"},{"a":"cnc_p382","b":"cnc_p339","h":1,"r":"背陆游《秋夜将晓出篱门迎凉有感》之前，要先会背他的《示儿》，才不会把南望王师和王师北定中原日…"},{"a":"cnc_p383","b":"cnc_p382","h":1,"r":"背《闻官军收河南河北》之前，要先分清《秋夜将晓出篱门迎凉有感》，一首是喜极而泣，一首是遗民还…"},{"a":"cnc_p409","b":"cnc_p355","h":1,"r":"背诵《西江月》之前，要先会背五年级的诗词。"},{"a":"cnc_p410","b":"cnc_p409","h":1,"r":"背《宿建德江》之前，要先会背《西江月》，才不会把蛙声和月近人记成同一首。"},{"a":"cnc_p411","b":"cnc_p409","h":1,"r":"背《望湖楼醉书》之前，要先会背《西江月》，才不会把忽见和跳珠装错。"},{"a":"cnc_p414","b":"cnc_p409","h":1,"r":"背诵《七律·长征》之前，要先会背本册的词。"},{"a":"cnc_p415","b":"cnc_p414","h":1,"r":"读《狼牙山五壮士》之前，要先会背《七律·长征》，两篇都写革命岁月，才不会把五岭和跳崖记成同一…"},{"a":"cnc_p417","b":"cnc_p415","h":1,"r":"读《我的战友邱少云》之前，要先读《狼牙山五壮士》，才不会把烈火中一动不动和砸枪跳崖记成同一件…"},{"a":"cnc_p431","b":"cnc_p416","h":1,"r":"读《灯光》之前，要先读《开国大典》，才不会把郝副营长梦见的灯和一九四九年的典礼记成同一件事。"},{"a":"cnc_p432","b":"cnc_p431","h":1,"r":"读《盼》之前，要先读《灯光》，才不会把盼穿雨衣和郝副营长牺牲记成同一个中心。"},{"a":"cnc_p434","b":"cnc_p421","h":1,"r":"读《只有一个地球》之前，要先读《宇宙生命之谜》，才不会把火星上有没有生命和必须保护地球记成同…"},{"a":"cnc_p435","b":"cnc_p434","h":1,"r":"读《青山不老》之前，要先读《只有一个地球》，才不会把一位老人种树和整颗星球的资源记成同一篇。"},{"a":"cnc_p436","b":"cnc_p435","h":1,"r":"读《三黑和土地》之前，要先读《青山不老》，才不会把农民重新得到土地和老人种树记成同一篇。"},{"a":"cnc_p438","b":"cnc_p437","h":1,"r":"背《江南春》之前，要先分清《浪淘沙》（其一），才不会把九曲黄河和千里莺啼记成同一首。"},{"a":"cnc_p439","b":"cnc_p438","h":1,"r":"背《书湖阴先生壁》之前，要先分清《江南春》，才不会把南朝四百八十寺和两山排闼记成同一首。"},{"a":"cnc_p449","b":"cnc_p448","h":1,"r":"读《好的故事》之前，要先读《少年闰土》，才不会把梦里的山水和海边刺猹记成同一篇。"},{"a":"cnc_p450","b":"cnc_p449","h":1,"r":"读《我的伯父鲁迅先生》之前，要先读《好的故事》，一篇是鲁迅写的梦，一篇是侄女写鲁迅，才不会把…"},{"a":"cnc_p451","b":"cnc_p450","h":1,"r":"读《有的人》之前，要先读《我的伯父鲁迅先生》，才不会把「俯下身子给人民当牛马」只记成诗句、忘…"},{"a":"cnc_p456","b":"cnc_p409","h":1,"r":"背诵《寒食》之前，要先会背六年级上册的诗词。"},{"a":"cnc_p457","b":"cnc_p456","h":1,"r":"背《迢迢牵牛星》之前，要先会背《寒食》，才不会把飞花和脉脉不得语记混。"},{"a":"cnc_p458","b":"cnc_p456","h":1,"r":"背《十五夜望月》之前，要先会背《寒食》，才不会把御柳斜和秋思落谁家记成同一首。"},{"a":"cnc_p473","b":"cnc_p456","h":1,"r":"背《马诗》之前，要先会背《寒食》，才不会把五侯家和金络脑记成同一首。"},{"a":"cnc_p474","b":"cnc_p473","h":1,"r":"背《石灰吟》之前，要先会背同课的《马诗》，才不会把金络脑和清白装进同一首。"},{"a":"cnc_p475","b":"cnc_p474","h":1,"r":"背《竹石》之前，要先会背《石灰吟》，两首咏物诗才不会把粉骨碎身和咬定青山记混。"},{"a":"cnc_p118","b":"cnc_p079","h":1,"r":"看图写几句连贯的话之前，要先会按顺序把事情说清楚。"},{"a":"cnc_p157","b":"cnc_p118","h":1,"r":"按顺序写一件小事之前，要先会写几句连贯的话。"},{"a":"cnc_p169","b":"cnc_p157","h":1,"r":"写日记之前，要先会按顺序把一件事写下来，并把样子写具体。"},{"a":"cnc_p226","b":"cnc_p169","h":1,"r":"围绕一个意思写一段话之前，要先会在日记里把看到的内容写清楚。"},{"a":"cnc_p226","b":"cnc_p225","h":1,"r":"围绕一个意思写之前，要先看出《我变成了一棵树》整篇都在写同一件事。"},{"a":"cnc_p216","b":"cnc_p214","h":1,"r":"按步骤写一项小实验之前，要先会按顺序说出《石蜂》的实验过程。"},{"a":"cnc_p235","b":"cnc_p234","h":1,"r":"分几方面介绍大熊猫之前，要先会看出《我们奇妙的世界》是从天空和大地两方面写的。"},{"a":"cnc_p264","b":"cnc_p226","h":1,"r":"写「生活万花筒」、把景物或事情写具体之前，要先会围绕一个意思把话写清楚。"},{"a":"cnc_p264","b":"cnc_p206","h":1,"r":"把景物或事情写具体，要用上已经学过的比喻。"},{"a":"cnc_p306","b":"cnc_p264","h":1,"r":"写游记、把游览见闻写具体之前，要先会把看到的景物和事情写具体。"},{"a":"cnc_p326","b":"cnc_p306","h":1,"r":"写「我的心爱之物」、把得到它或使用它的经过写清楚之前，要先会把游览中的见闻和动作写具体。"},{"a":"cnc_p391","b":"cnc_p326","h":1,"r":"写人抓住特点之前，要先会把一件心爱之物和相关事情的经过写清楚。"},{"a":"cnc_p391","b":"cnc_p332","h":1,"r":"写人抓住特点之前，要先会像写「漫画」老师那样用一件具体的事把特点写出来。"},{"a":"cnc_p391","b":"cnc_p390","h":1,"r":"把一个人的特点写具体之前，要先会看出《刷子李》是怎样用一件事把技艺写出来的。"},{"a":"cnc_p391","b":"cnc_p388","h":1,"r":"写人之前，要先会选用表现神态和动作的词语。"},{"a":"cnc_p405","b":"cnc_p391","h":1,"r":"写漫画的启示之前，要先会把一个人的特点写具体，才知道道理要落在看得见的画面上。"},{"a":"cnc_p433","b":"cnc_p391","h":1,"r":"围绕中心意思写之前，要先会抓住人或事的特点来写。"},{"a":"cnc_p483","b":"cnc_p433","h":1,"r":"围绕中心选择材料之前，要先会在上册习作里围绕一个中心把事情写清楚。"},{"a":"cnm_p246","b":"cnm_p178","h":1,"r":"学习「倒数的认识」需要先掌握「一个数乘分数」。"},{"a":"cnm_p246","b":"cnm_p177","h":0,"r":"「分数乘整数」对学习「倒数的认识」有帮助，但不会前者也可以开始学后者。"},{"a":"cnm_p182","b":"cnm_p246","h":1,"r":"学习「分数除以整数」需要先掌握「倒数的认识」。"},{"a":"cnm_p247","b":"cnm_p178","h":1,"r":"学习「分数、小数混合运算及运算律」需要先掌握「一个数乘分数」。"},{"a":"cnm_p247","b":"cnm_p133","h":1,"r":"学习「分数、小数混合运算及运算律」需要先掌握「小数乘小数」。"},{"a":"cnm_p247","b":"cnm_p117","h":0,"r":"「用运算律简便计算」对学习「分数、小数混合运算及运算律」有帮助，但不会前者也可以开始学后者。"},{"a":"cnm_p179","b":"cnm_p j128","h":1,"r":"自己写小诗之前，要先见过《乡愁》《我看》怎样用意象分行，才不会把课文整首抄进作业。"},{"a":"cnc_j132","b":"cnc_p482","h":1,"r":"小学《真理诞生于一百个问号之后》谈的是从疑问里找证据。顾颉刚的「会疑」接的是这件事，不是另一…"},{"a":"cnc_j133","b":"cnc_p343","h":1,"r":"先读过《圆明园的毁灭》，才知道雨果信里赞美又谴责的是同一座园，不会把圆明园听成法国的宫殿。"},{"a":"cnc_j135","b":"cnc_j112","h":1,"r":"梁启超把「有业、敬业、乐业」写成明明白白的观点。先见过这种句子，写议论才知道观点不能藏在故事…"},{"a":"cnc_j136","b":"cnc_j124","h":1,"r":"谈数字生活仍是公开表达。先会核对来源、对事不对人，才不会把没核实的转发当成讨论成果。"},{"a":"cnc_j137","b":"cnc_p447","h":1,"r":"《岳阳楼记》的「其」「而」连接的是迁客的两种心情。先会这几个虚词，才不会把「不以物喜」读成「…"},{"a":"cnc_j138","b":"cnc_j137","h":1,"r":"两篇都写亭台楼阁和「乐」。先读范仲淹的先忧后乐，才不会把欧阳修的与民同乐记成同一篇、同一作者…"},{"a":"cnc_j139","b":"cnc_j070","h":1,"r":"苏轼《记承天寺夜游》已写过月下的闲人。张岱写的是雪和「痴」，不能把「庭下如积水空明」安到湖心…"},{"a":"cnc_j140","b":"cnc_j070","h":1,"r":"八年级已读苏轼的月下短文。先分清那一篇，才不会把《水调歌头》的「明月几时有」说成写给张怀民。"},{"a":"cnc_j141","b":"cnc_j135","h":1,"r":"观点先要写成一句清楚的话，然后再找事实和名句去支撑。没有明确观点，材料就没有地方靠。"},{"a":"cnc_j142","b":"cnc_p219","h":1,"r":"王维《九月九日忆山东兄弟》是小学的思亲诗。杜甫《月夜忆舍弟》也写兄弟，作者、战争背景和名句都…"},{"a":"cnc_j143","b":"cnc_p448","h":1,"r":"小学《少年闰土》是月下刺猹的孩子。九年级《故乡》里他叫「老爷」。先读过少年版，才看得出变化，…"},{"a":"cnc_j144","b":"cnc_j143","h":1,"r":"两篇都写亲人变了。先分清闰土是鲁迅笔下的故乡人，才不会把卖牡蛎的于勒和咸亨酒店记成一篇。"},{"a":"cnc_j146","b":"cnc_p428","h":1,"r":"小学习作已要求故事有起因、经过、结果。小小说把这个结构收成一次转念，不能写成没有波折的流水账…"},{"a":"cnc_j147","b":"cnc_p462","h":1,"r":"小学读过《鲁滨逊漂流记》这种外国长篇。简·爱也是第一人称的外国小说，但人物、地点和「平等」的…"},{"a":"cnc_j148","b":"cnc_p477","h":1,"r":"小学《为人民服务》已谈过一个人为什么工作。这篇讲话谈的是培养什么人，不能把张思德的事例套成这…"},{"a":"cnc_j149","b":"cnc_j132","h":1,"r":"《怀疑与学问》是立论，用证据说明要会疑。鲁迅这篇题目本身是要驳倒的话。先分清立论，才不会把题…"},{"a":"cnc_j150","b":"cnc_j087","h":1,"r":"吴晗的三个例子对应《孟子》里「富贵不能淫，贫贱不能移，威武不能屈」。先读过这三章，才不会把这…"},{"a":"cnc_j151","b":"cnc_j149","h":1,"r":"「自信力」和作者自造的「自欺力」出现在同一篇驳论里。先读懂谁在被批评，才分得清褒义和贬义。"},{"a":"cnc_j152","b":"cnc_j141","h":1,"r":"先会给观点配上对得上的材料，再谈推理是否跳步。材料本身就无关时，还谈不上论证合理。"},{"a":"cnc_j154","b":"cnc_p447","h":1,"r":"「夫战，勇气也」「一鼓作气」里的虚词决定句子怎么停。先会「之、其、而」，才不会把长勺之战读成…"},{"a":"cnc_j155","b":"cnc_j154","h":1,"r":"两篇都是先秦散文里的劝说。曹刿问的是凭什么打仗，邹忌推的是谁在蒙蔽大王。先分开场合，才不会把…"},{"a":"cnc_j156","b":"cnc_j089","h":1,"r":"《周亚夫军细柳》和《陈涉世家》都出自司马迁《史记》。先读过细柳营只听将军令，才不会把周亚夫写…"},{"a":"cnc_j157","b":"cnc_j020","h":1,"r":"《诫子书》是诸葛亮写给儿子的。先读过那封家书，才不会把《出师表》里对刘禅说的亲贤远佞当成同一…"},{"a":"cnc_j158","b":"cnc_p381","h":1,"r":"小学《从军行》已是边塞诗。先记住那首，才不会把「黄沙百战穿金甲」和岑参的梨花、汉乐府《十五从…"},{"a":"cnc_j159","b":"cnc_j152","h":1,"r":"论证先要合理，再往下问一次为什么。例子和观点还接不上时，多写一层也只是把跳跃写得更长。"},{"a":"cnc_j160","b":"cnc_j072","h":1,"r":"八年级已按作者和名句分过五首唐诗。读《唐诗三百首》仍要这样分体裁，不能把它读成一本情节连着的…"},{"a":"cnc_j161","b":"cnc_j092","h":1,"r":"八年级课外已有晏殊《浣溪沙》。九年级这一首是秦观的「自在飞花轻似梦」，词牌相同，作者和句子都…"},{"a":"cnc_j162","b":"cnc_j128","h":1,"r":"九上已读《我爱这土地》《乡愁》。舒婷写的是祖国和「我」的关系，不能把邮票、海峡说成这首诗的意…"},{"a":"cnc_j164","b":"cnc_j077","h":1,"r":"《白杨礼赞》已用树来象征人。《海燕》用的是暴风雨里的鸟。先分开这两篇，才不会把象征读成说明文…"},{"a":"cnc_j165","b":"cnc_p428","h":1,"r":"扩写是给原来的故事补细节。小学已要求起因、经过、结果不能换人。人物或结局一变，就不是扩写。"},{"a":"cnc_j166","b":"cnc_j143","h":1,"r":"《故乡》和《孔乙己》都是鲁迅的小说。先记住闰土叫老爷，才不会把站着喝酒、穿长衫的人写成闰土。"},{"a":"cnc_j167","b":"cnc_j144","h":1,"r":"《我的叔叔于勒》已写过人对人的态度随身份变。奥楚蔑洛夫变的是对狗和伤者的口风，不是菲利普夫妇…"},{"a":"cnc_j168","b":"cnc_j145","h":1,"r":"《孤独之旅》写杜小康在芦荡放鸭。《溜索》写马帮过怒江。都有少年的害怕，地点、人物和作者都不能…"},{"a":"cnc_j169","b":"cnc_j014","h":1,"r":"七年级已要求材料指向一个中心。审题立意是先从题目里定下这个中心，再决定哪些材料留得下来。"},{"a":"cnc_j170","b":"cnc_p486","h":1,"r":"小学综合性学习「依依惜别」已要求用具体的人和事告别。回顾初中三年同样不能只写「时光飞逝」。"},{"a":"cnc_j171","b":"cnc_j087","h":1,"r":"八年级《孟子》三章已经谈过舍生取义和不能淫、不能移、不能屈。这篇接着写「万钟则不辩礼义而受之…"},{"a":"cnc_j171","b":"cnc_p481","h":1,"r":"小学《学弈》是《孟子》里的故事。先知道这个书名和它讲专心，再读《鱼我所欲也》，才不会把两篇都…"},{"a":"cnc_j172","b":"cnc_j155","h":1,"r":"两篇都出自《战国策》。邹忌是劝齐王纳谏，唐雎是对秦王保住安陵。先分开国家和事情，才不会把布衣…"},{"a":"cnc_j173","b":"cnc_j013","h":1,"r":"《论语》十二章里已有谈学习和修身的句子。宋濂写的是借书抄录、砚台结冰，不能把「学而时习之」当…"},{"a":"cnc_j174","b":"cnc_j171","h":1,"r":"「所识穷乏者得我与」「故患有所不辟」就在《鱼我所欲也》里。先读懂句子，才知道这里的得、与、辟…"},{"a":"cnc_j175","b":"cnc_j090","h":1,"r":"八年级《渔家傲》是李清照的「天接云涛连晓雾」。范仲淹的「塞下秋来风景异」词牌相同，作者和内容…"},{"a":"cnc_j175","b":"cnc_j140","h":1,"r":"九上已有苏轼《水调歌头》。先记住那是中秋怀子由，才不会把「左牵黄，右擎苍」和「明月几时有」收…"},{"a":"cnc_j176","b":"cnc_j021","h":1,"r":"思路清晰是段与段接得上。布局谋篇还要决定哪里详写、哪里略写，读者才看得出文章收在哪里。"},{"a":"cnc_j177","b":"cn ":"cnh_j028","h":0,"r":"毕昇的活字印刷是在隋唐雕版印刷的基础上改进而来，两者对照才知道改进了什么。"},{"a":"cnh_j036","b":"cnh_j032","h":1,"r":"明朝由朱元璋在推翻元朝统治的基础上建立，不先知道元末的统治和农民起义就接不上明的建立。"},{"a":"cnh_j038","b":"cnh_j036","h":0,"r":"明朝后期朝政腐败、君权高度集中后的弊端，是农民起义和明朝灭亡的前因。"},{"a":"cnh_j039","b":"cnh_j032","h":0,"r":"元朝行省制度和对西藏、台湾等地的管辖，是清朝治理边疆的历史基础。"},{"a":"cnh_j040","b":"cnh_j036","h":0,"r":"清朝设军机处、大兴文字狱，是明朝君主专制不断强化趋势的继续和推进。"},{"a":"cnh_j041","b":"cnh_j033","h":0,"r":"明清农业、手工业、商业的发展是在宋元经济繁荣的基础上展开的，比较才看得出新变化。"},{"a":"cnh_j044","b":"cnh_j041","h":0,"r":"清朝自给自足的小农经济抵制外来商品，是英国不满现状、走私鸦片的背景。"},{"a":"cnh_j046","b":"cnh_j044","h":0,"r":"鸦片战争后赔款转嫁到百姓身上，社会矛盾尖锐，洪秀全才得以聚起人心。"},{"a":"cnh_j047","b":"cnh_j045","h":0,"r":"两次鸦片战争中暴露的列强船坚炮利，是洋务派提出「师夷长技」的直接刺激。"},{"a":"cnh_j049","b":"cnh_j047","h":0,"r":"学「戊戌变法」前先知道「洋务运动」试图自强而未触及制度，才懂变法为什么要改制度。"},{"a":"cnh_j049","b":"cnh_j040","h":0,"r":"变法要把君主专制改为君主立宪，先认清清朝君主专制的强化，才懂改革的难处。"},{"a":"cnh_j051","b":"cnh_j049","h":0,"r":"维新变法失败，让人看到改良行不通，革命派主张推翻清朝的主张才有市场。"},{"a":"cnh_j054","b":"cnh_j052","h":0,"r":"辛亥革命后民主共和有名无实，才有新文化运动反思传统，这是五四运动的思想前奏。"},{"a":"cnh_j056","b":"cnh_j051","h":0,"r":"国民党一大对三民主义作了新解释，先知道同盟会时期的三民主义，才看得出新在哪里。"},{"a":"cnh_j059","b":"cnh_j048","h":0,"r":"日本自甲午战争就吞并台湾、窥视东北，九一八事变是其一贯侵华野心的延续。"},{"a":"cnh_j061","b":"cnh_j058","h":0,"r":"红军长征到达陕北，后来改编为八路军、新四军开赴敌后，这是敌后战场的力量来源。"},{"a":"cnh_j065","b":"cnh_j057","h":0,"r":"井冈山革命旧址是红色遗址的典型例子，先知道这段历史，才会读遗址里的信息。"},{"a":"cnh_j065","b":"cnh_j058","h":0,"r":"遵义会议会址、长征沿线的纪念地，是用文物认识红色历史的代表。"},{"a":"cnh_j070","b":"cnh_j068","h":1,"r":"社会主义建设道路的探索，以三大改造完成、社会主义制度确立为起点，不先知道这一点，就不知道探索…"},{"a":"cnh_j072","b":"cnh_j069","h":0,"r":"20世纪70年代的外交突破，是在新中国多年独立自主和平外交的积累上取得的。"},{"a":"cnh_j073","b":"cnh_j070","h":1,"r":"十一届三中全会是对探索中的失误和文化大革命的纠正，不知失误是什么，就看不懂转折为什么伟大。"},{"a":"cnh_j076","b":"cnh_j073","h":0,"r":"社会主义初级阶段理论的提出，以十一届三中全会确立的解放思想、实事求是路线为基础。"},{"a":"cnh_j080","b":"cnh_j077","h":0,"r":"加入世贸组织是社会主义市场经济体制建立、对外开放扩大之后的重要一步。"},{"a":"cnh_j084","b":"cnh_j080","h":0,"r":"决胜全面建成小康社会，是在开始全面建设小康社会这个目标上的最后冲刺。"},{"a":"cnh_j085","b":"cnh_j078","h":0,"r":"祖国统一的方针中的一国两 \"","kw":["诉讼","依法办事","违法犯罪","维权","法治","法律"]},{"s":"历史","t":"图表因果推理（第4题）","q":"第4题","w":"没把\"书变多\"与\"造纸术普及\"建立因果","fix":"图表题先找变化，再问\"当时哪项技术/制度导致它\"","kw":["造纸","蔡伦","印刷","书籍","文字演变"]},{"s":"历史","t":"近代史细节·条约/人物/团体","q":"13、14、17、20、21、22、24、25题","w":"条约影响、人物对应、革命团体混淆；《辛丑条约》、同盟会、严复《天演论》","fix":"做时间轴+人物卡；抓\"不平等条约=损害主权\"；同盟会=第一个全国性资产阶级政党","kw":["辛丑条约","马关条约","南京条约","同盟会","武昌起义","辛亥革命","严复","天演论","维新","洋务","北洋军阀"]},{"s":"历史","t":"材料题不会提炼分点","q":"26题16分","w":"答案只会抄材料，不会归纳；汉字作用没分点","fix":"要点=材料关键词改写+课本结论句，两者缺一不可","kw":["甲骨文","汉字","百家争鸣","独尊儒术","传统文化"]},{"s":"历史","t":"原因/意义类答不到制度层","q":"27、28题","w":"甲午战败原因只答装备差，漏\"腐朽封建制度敌不过资本主义制度\"; 28题漏课本结论句","fix":"历史大题永远答到\"制度/性质\"层；背\"器物→制度→思想文化\"递进句","kw":["甲午","邓世昌","海防","洋务运动","近代化","戊戌","新文化","封建制度"]},{"s":"物理","t":"物态变化·名称偷换","q":"8题（选C，答案D）","w":"凝固/凝华混淆","fix":"凝固=液→固；凝华=气→固；白气/雾/露=液化，霜/雪/冰花=凝华","kw":["凝固","凝华","液化","熔化","汽化","升华","物态变化"]},{"s":"物理","t":"沸腾条件：达到沸点≠沸腾","q":"9题","w":"漏\"能继续吸热\"这个条件","fix":"沸腾两条件：达到沸点+继续吸热；炖盅不沸腾因无温差","kw":["沸腾","沸点"]},{"s":"物理","t":"声速与s-t图像","q":"12、24题","w":"漏\"人耳区分两声需间隔≥0.1s\"；s-t图越陡速度越大；表达式推导一步写出断链","fix":"\"0.1s才听得开两个声\"；实验推导两步法：每个过程列方程→消元","kw":["声速","回声","铁管","s-t","运动图像","路程时间"]},{"s":"物理","t":"平均速度：路程等分通分","q":"19题扣2分","w":"3倍挂错变量（应挂v₁）","fix":"设总路程4s，时间=s/v₁+3s/v₂；正确式4v₁v₂/(3v₁+v₂)；取v₁≠v₂验算","kw":["平均速度"]},{"s":"物理","t":"实验表述：探究问题与判断依据","q":"21题扣约3分","w":"不会写\"探究的问题\"和\"判断依据\"","fix":"探究问题=研究对象+变量；判断依据=可测量","kw":["探究","控制变量","隔音","实验设计"]},{"s":"物理","t":"沸腾前后气泡四图排序","q":"22题","w":"凭\"有没有白气\"判断导致排错","fix":"只看气泡多少+上升变大变小；记忆链无泡→小泡→变小→变大（丙→乙→丁→甲）","kw":["气泡","白气"]},{"s":"物理","t":"体温计与读数规范","q":"13题","w":"量程细节、俯视仰视偏大偏小记反","fix":"体温计35~42℃有缩口；俯视偏大仰视偏小；反向设问先圈题","kw":["体温计","量程","刻度","读数"]},{"s":"化学","t":"待上传化学试卷","q":"—","w":"本库暂无化学期中错题档案（九年级开课）","fix":"上传后按知识点归档","kw":[]}]};

const LESSONS={"cnp_001":{"core":["长度的国际单位是米（m），时间的国际单位是秒（s）","刻度尺读数要估读到分度值的下一位","误差不是错误：错误能避免，误差只能减小、不能消除","多次测量取平均值可以减小误差"],"eg":"刻度尺分度值 1 mm，物体左端对齐 2.00 cm、右端在 4.35 cm，长度 = 4.35 − 2.00 = 2.35 cm，末位的 5 是估读出来的。","trap":"读数时玻璃泡/刻度尺不能离开被测物体；误差 ≠ 错误，这是选择题最爱偷换的两个词。","quiz":[{"q":"用刻度尺测长度，关于读数，正确的是","o":["读到分度值那一位就够，不用再估读","要估读到分度值的下一位","分度值越小，误差就完全没有了"],"a":1,"why":"刻度尺、停表都要估读到分度值下一位；误差只能减小，永远不能消除。"},{"q":"多次测量取平均值的目的是","o":["消除测量中的错误","减小误差","把测量值变成没有误差的准确值"],"a":1,"why":"错误要靠规范操作避免；多次测量取平均只能减小偶然误差，不能消除误差。"}]},"cnp_004":{"core":["实验原理是 v = s/t","用刻度尺测路程 s、停表测时间 t","斜面上小车下半程一般比上半程运动得快"],"eg":"全程 s = 90.0 cm、t = 2.5 s，平均速度 v = 0.9 m ÷ 2.5 s = 0.36 m/s。注意先把 cm 换成 m。","trap":"斜面坡度要调小，让小车慢一点才来得及计时；不是越陡越好。","quiz":[{"q":"测量物体运动平均速度的实验原理是","o":["v = s/t","v = t/s","s = v·t 才是原理"],"a":0,"why":"先测出路程 s 和时间 t，再用 v = s/t 算出平均速度。"},{"q":"把斜面坡度调得很陡，主要麻烦是","o":["小车太快，时间测不准","路程没法测","v = s/t 这个公式就不成立了"],"a":0,"why":"坡陡小车下滑快、时间短，停表反应误差占比大。公式始终成立，只是测不准。"}]},"cnp_005":{"core":["声音由物体振动产生，振动停止发声也停止","声音传播需要介质，真空不能传声","声速与介质种类、温度有关；15 ℃ 空气中约 340 m/s"],"eg":"把正在发声的闹钟放进玻璃罩，逐渐抽走空气，声音越来越小——推理得出真空不能传声（实验加推理）。","trap":"真空不能传声，但光可以在真空里传播；340 m/s 是 15 ℃ 空气，不是任何情况都这个数。","quiz":[{"q":"关于声音，说法正确的是","o":["真空也能传声","声音由物体振动产生","声音在真空中传播得最快"],"a":1,"why":"声音靠介质传播，真空中没有介质，不能传声。"},{"q":"15 ℃ 空气中的声速约为","o":["3×10⁸ m/s","340 m/s","1500 m/s"],"a":1,"why":"3×10⁸ m/s 是真空中的光速，不是声速；1500 m/s 接近声音在水中的速度。"}]},"cnp_006":{"core":["三个特性：音调、响度、音色","音调由频率决定，响度与振幅和距发声体远近有关","音色由发声体本身的材料、结构决定"],"eg":"「震耳欲聋」说响度大；「这声音太尖」说音调高；不看画面也能听出是谁在说话，靠音色。","trap":"「闻其声知其人」靠音色，不是音调；调音量旋钮改变的是响度，不是音调。","quiz":[{"q":"「闻其声而知其人」，判断的依据是声音的","o":["音调","响度","音色"],"a":2,"why":"音色由发声体本身决定，不同人声带结构不同，音色不同。"},{"q":"「震耳欲聋」形容的是声音的","o":["音调高","响度大","音色好"],"a":1,"why":"响度与振幅有关，振幅大听起来就响。"}]},"cnp_010":{"core":["温度表示物体的冷热程度","摄氏温度：冰水混合物定为 0 ℃，标准大气压下沸水定为 100 ℃","液体温度计原理是液体热胀冷缩","使用前先看量程和分度值，玻璃泡要全部浸入、不碰容器底和壁"],"eg":"读数时温度计仍留在被测液体中，视线与液柱上表面相平；零下要往下数，别把 −4 ℃ 读成 4 ℃。","trap":"普通温度计不能拿出来读数；体温计有缩口才可以离开人体读数。","quiz":[{"q":"常用液体温度计的工作原理是","o":["液体热胀冷缩","固体热胀冷缩","气体液化放热"],"a":0,"why":"液柱随温度升降而伸缩，刻度把长度换成温度读数。"},{"q":"用温度计测液体温度，正确做法是","o":["读数时把温度计拿出来看更清楚","玻璃泡全部浸入液体、不碰底和壁，读数时仍留在液体中","玻璃泡贴着容器底测更准"],"a":1,"why":"拿出来会受环境温度影响；碰底碰壁测到的是容器温度而不是液体温度。"}]},"cnp_011":{"core":["熔化：固态→液态，吸热；凝固：液态→固态，放热","晶体有固定熔点，非晶体没有","晶体熔化时持续吸热，但温度保持在熔点不变","会读熔化/凝固图像中的平台段"],"eg":"图像里水平的那一段就是晶体熔化过程：时间在走、热在吸、温度不动，此时物质是固液共存。","trap":"「温度不变」不等于「不吸热」，这是最容易丢分的一句；冰是晶体，蜡、玻璃、沥青是非晶体。","quiz":[{"q":"晶体在熔化过程中","o":["吸热，温度持续升高","吸热，温度保持不变","不吸热，温度也不变"],"a":1,"why":"吸收的热量用来改变状态（破坏晶格），不用来升温，所以出现平台段。"},{"q":"关于晶体和非晶体，正确的是","o":["两者都有固定熔点","晶体有熔点，非晶体没有","只有非晶体有熔点"],"a":1,"why":"有无固定熔点是区分晶体与非晶体的关键，也是读图时有没有水平段的依据。"}]},"cnp_012":{"core":["汽化两种方式：蒸发（任何温度、只在表面、缓慢）与沸腾（一定温度、表面和内部同时、剧烈）","影响蒸发快慢：液体温度、表面积、表面空气流动","沸腾必须同时满足：达到沸点 + 继续吸热","液化两种方法：降低温度、压缩体积；气压越低沸点越低"],"eg":"水沸腾后继续加热，温度不再上升；撤掉酒精灯，沸腾很快停止——说明「继续吸热」这个条件不能少。","trap":"「白气」不是水蒸气（水蒸气看不见），是水蒸气遇冷液化成的小水滴；霜是凝华，露是液化。","quiz":[{"q":"水沸腾必须满足的条件是","o":["只要温度达到沸点","达到沸点并且继续吸热","只要一直加热就行"],"a":1,"why":"两个条件缺一不可，这是期中卷反复考的设问方式。"},{"q":"关于蒸发和沸腾，说法正确的是","o":["蒸发只在液体表面发生，任何温度下都能进行","沸腾只在液体表面发生","蒸发必须达到沸点才能发生"],"a":0,"why":"蒸发在任何温度、只在表面缓慢进行；沸腾在表面和内部同时剧烈进行，且要达到沸点。"}]},"cnp_013":{"core":["升华：固态直接→气态，吸热；凝华：气态直接→固态，放热","升华实例：樟脑丸变小、干冰变小、冰冻衣服变干、灯丝变细","凝华实例：霜、雪、雾凇、冬天窗玻璃上的冰花"],"eg":"用六种物态变化串一遍水循环：冰雪升华、水蒸气凝华成霜、水蒸气液化成露和雾。","trap":"霜、雪是凝华不是凝固；雾、露是液化不是凝华。名称偷换是这一课最常见的错法。","quiz":[{"q":"冬天窗玻璃上出现的「霜」，属于","o":["凝固","凝华","液化"],"a":1,"why":"空气中的水蒸气遇极冷的玻璃直接变成固态小冰晶，是气→固的凝华。"},{"q":"下列现象属于升华的是","o":["樟脑丸放久了变小","清晨草叶上出现露水","水放进 freezer 结成冰"],"a":0,"why":"樟脑丸由固态直接变气态；露水是液化，水结冰是凝固。"}]},"cnp_015":{"core":["能自行发光的物体叫光源（月亮不是光源）","光在同种均匀介质中沿直线传播","可解释：影子、小孔成像、日食月食、激光准直","真空中光速约 3×10⁸ m/s"],"eg":"小孔成像成的是倒立的实像，像的形状由物体决定，与孔的形状无关。","trap":"必须强调「同种均匀」介质；水中筷子看起来弯折、彩虹属于折射/色散，不是直线传播。","quiz":[{"q":"下列现象不能用光的直线传播解释的是","o":["影子的形成","小孔成像","插入水中的筷子看起来弯折"],"a":2,"why":"筷子弯折是光从水进入空气发生折射造成的。"},{"q":"光在真空中的传播速度约为","o":["340 m/s","3×10⁸ m/s","1500 m/s"],"a":1,"why":"340 m/s 是 15 ℃ 空气中的声速，别和光速混。"}]},"cnp_026":{"core":["密度是物质的一种特性：ρ = m/V","单位 kg/m³ 与 g/cm³，1 g/cm³ = 1×10³ kg/m³","同种物质（状态不变）密度一定，不随质量、体积改变"],"eg":"一块铁切成两半，每半的质量和体积都减半，但 m/V 不变，密度还是 7.9×10³ kg/m³。","trap":"ρ = m/V 只是计算式，不能说「密度与质量成正比、与体积成反比」——这是判断题的经典陷阱。","quiz":[{"q":"对密度公式 ρ = m/V，正确的理解是","o":["密度与质量成正比","密度是物质特性，同种物质密度不随质量、体积改变","体积越大密度越小"],"a":1,"why":"质量变大的同时体积同比例变大，比值不变；公式只用来算，不表示决定关系。"},{"q":"1 g/cm³ 等于","o":["1 kg/m³","1×10³ kg/m³","1×10⁻³ kg/m³"],"a":1,"why":"水的密度 1.0 g/cm³ = 1.0×10³ kg/m³，这个换算几乎每份卷子都考。"}]},"cnm_001":{"core":["正数、负数用来表示一对相反意义的量","0 既不是正数，也不是负数","0 是正数和负数的分界"],"eg":"向东走 5 m 记作 +5 m，那么 −3 m 表示向西走 3 m；记作 0 m 表示没动，不代表方向。","trap":"「+」号可以省略，但「−」号不能省；0 不是「最小的正数」，也不是「没有」，比如 0 ℃ 是一个具体温度。","quiz":[{"q":"关于 0，说法正确的是","o":["0 是正数","0 既不是正数也不是负数","0 是负数"],"a":1,"why":"0 是正负数的分界点，单独一类。"},{"q":"若向东走 5 m 记作 +5 m，则 −3 m 表示","o":["向东走 3 m","向西走 3 m","原地不动"],"a":1,"why":"正负号表示相反方向，数值是走的距离。"}]},"cnm_003":{"core":["整数和分数统称有理数","两种分类：按「整数 / 分数」分，或按「正数 / 0 / 负数」分","有限小数、无限循环小数都能化成分数，属于有理数"],"eg":"−3、0、2/5、0.7、0.333… 都是有理数；π 是无限不循环小数，不是有理数。","trap":"分类时别把 0 漏掉；也别把「小数」当成和整数、分数并列的第三类。","quiz":[{"q":"下列各数中，不是有理数的是","o":["−3","0.5","π"],"a":2,"why":"π 是无限不循环小数，不能写成分数形式。"},{"q":"关于有理数，说法正确的是","o":["有理数只有正数和负数","整数和分数统称有理数","0 不属于有理数"],"a":1,"why":"按定义整数和分数统称有理数，0 是整数，当然算有理数。"}]},"cnm_004":{"core":["规定了原点、正方向、单位长度的直线叫数轴","数轴三要素缺一不可","数轴上右边的数总比左边的大"],"eg":"画出数轴后，−2 在原点左边 2 个单位，+3 在右边 3 个单位，所以 −2 < 0 < 3。","trap":"单位长度一旦选定就固定，但不一定非要 1 cm；没有箭头（正方向）就不是数轴。","quiz":[{"q":"数轴的三要素是","o":["原点、正方向、单位长度","原点、箭头、刻度值","正数、负数、0"],"a":0,"why":"三要素齐全才叫数轴，少任何一个都无法确定数的位置。"},{"q":"关于数轴，说法正确的是","o":["右边的数总比左边的小","右边的数总比左边的大","单位长度必须是 1 cm"],"a":1,"why":"沿正方向数越来越大；单位长度可按需要选取，只要统一。"}]},"cnm_006":{"core":["只有符号不同的两个数互为相反数","在数轴上位于原点两侧，且到原点距离相等","0 的相反数是 0"],"eg":"5 和 −5 互为相反数；−(−3) = 3，表示 −3 的相反数。","trap":"「只有符号不同」——数字部分必须一样，2 和 −3 不是相反数；正数的相反数是负数，但 0 例外。","quiz":[{"q":"−5 的相反数是","o":["5","−5","1/5"],"a":0,"why":"只改符号、数字不变；1/5 是倒数的方向，别混。"},{"q":"下列说法正确的是","o":["任何数的相反数一定比它小","0 的相反数是 0","相反数一定是负数"],"a":1,"why":"负数的相反数是正数（比原数大），0 的相反数是它自己。"}]},"cnm_007":{"core":["数轴上表示 a 的点到原点的距离叫 a 的绝对值，记作 |a|","|a| ≥ 0，绝对值永远非负","互为相反数的两个数绝对值相等"],"eg":"|−3| = 3，|3| = 3；绝对值等于 4 的数有两个：4 和 −4。","trap":"|a| 的结果不可能是负数；看到 |−a| 不要急着写 −a，要分情况。","quiz":[{"q":"|−3| 的值是","o":["−3","3","±3"],"a":1,"why":"绝对值是距离，距离不能为负。"},{"q":"绝对值等于 4 的数","o":["只有 4","4 和 −4","不存在"],"a":1,"why":"到原点距离为 4 的点，原点左右各一个。"}]},"cnm_010":{"core":["同号两数相加：取相同符号，绝对值相加","异号两数相加：取绝对值较大数的符号，用较大绝对值减较小绝对值","任何数与 0 相加仍得这个数","口诀：先定符号，再算绝对值"],"eg":"(−3)+(−5) = −8；(−7)+4 = −3（7>4，取负号，7−4=3）。","trap":"异号相加是「大减小」不是「加起来」；绝对值相等的两数相加得 0。","quiz":[{"q":"(−3) + (−5) =","o":["8","−8","−2"],"a":1,"why":"同号取负号，绝对值 3+5=8。"},{"q":"(−7) + 4 =","o":["−3","3","−11"],"a":0,"why":"异号，|−7| 大取负号，7−4=3，所以是 −3。"}]},"cnm_012":{"core":["减去一个数，等于加上这个数的相反数","减法统一转化成加法：a − b = a + (−b)","转化后按有理数加法法则算"],"eg":"5 − (−3) = 5 + 3 = 8；(−2) − 6 = (−2) + (−6) = −8。","trap":"减去负数等于加上正数，符号要变两次；别把 −b 抄成 +b。","quiz":[{"q":"5 − (−3) =","o":["2","8","−8"],"a":1,"why":"减 −3 就是加 3。"},{"q":"把 (−2) − 6 改写成加法，正确的是","o":["(−2) + 6","(−2) + (−6)","2 + 6"],"a":1,"why":"减 6 等于加 −6，被减数 −2 原样不动。"}]},"cnm_019":{"core":["求 n 个相同因数 a 的积的运算叫乘方，记作 aⁿ","a 叫底数，n 叫指数，结果叫幂","(−2)² 与 −2² 含义不同"],"eg":"(−2)³ = −8（底数是 −2）；−2² = −4（先算 2²，再添负号）。","trap":"负数作底数必须加括号；(−2)² = 4 而 −2² = −4，这一组是必考辨析。","quiz":[{"q":"(−2)³ 的值是","o":["8","−8","−6"],"a":1,"why":"三个 −2 相乘：(−2)×(−2)×(−2) = −8；也不是 2×3。"},{"q":"−2² 的值是","o":["4","−4","−2"],"a":1,"why":"没有括号时底数是 2，先算 2²=4 再取负；要得 4 得写成 (−2)²。"}]},"cnk_j005":{"core":["空气是混合物，不是纯净物","按体积分数：氮气约 78%、氧气约 21%、稀有气体 0.94%、二氧化碳 0.03%","氮气化学性质不活泼，可作保护气；氧气供给呼吸、支持燃烧"],"eg":"食品包装里充氮气防腐，利用的是氮气不活泼；医疗急救用氧气，利用的是供给呼吸。","trap":"78% / 21% 是**体积分数**，不是质量分数；氧气「支持燃烧」但本身一般不作燃料。","quiz":[{"q":"空气中体积分数最大的气体是","o":["氧气","氮气","二氧化碳"],"a":1,"why":"氮气约占 78%，氧气约 21%。"},{"q":"关于空气，说法正确的是","o":["空气是纯净物","空气是混合物","氧气约占空气体积的 78%"],"a":1,"why":"空气由氮气、氧气等多种物质组成，是混合物；78% 是氮气的份额。"}]},"cnk_j017":{"core":["参加化学反应的各物质质量总和 = 反应后生成的各物质质量总和","微观解释：反应前后原子的种类、数目、质量都不变","关键词是「参加」——没反应掉的部分不计入"],"eg":"镁条燃烧后固体变重，是因为空气中的氧气参加了反应；把氧气质量算进去，总质量仍然守恒。","trap":"反应前后**分子种类一定改变、原子种类一定不变**；有气体参加或生成时，别漏算气体的质量。","quiz":[{"q":"质量守恒定律的微观原因是反应前后","o":["分子种类不变","原子的种类、数目、质量都不变","物质的种类不变"],"a":1,"why":"化学反应的本质是原子重新组合，原子本身不增不减。"},{"q":"下列说法符合质量守恒定律的是","o":["蜡烛燃烧后变轻，说明质量不守恒","镁条燃烧后固体变重，是因为有氧气参加反应","化学反应前后分子种类一定不变"],"a":1,"why":"把参加反应的氧气算进去总质量守恒；分子种类在化学反应中一定改变。"}]},"cnh_j007":{"core":["儒家：孔子（仁、有教无类）、孟子（仁政）","道家：老子（无为而治）、庄子","墨家：墨子（兼爱、非攻）","法家：韩非（以法治国、中央集权）"],"eg":"把「人物—学派—主张」做成三列卡片串记：孔子—儒—仁；墨子—墨—兼爱非攻；韩非—法—法治。","trap":"「兼爱非攻」是墨家不是儒家；「无为而治」是道家不是法家，人物与主张张冠李戴是主要失分点。","quiz":[{"q":"主张「兼爱」「非攻」的是","o":["儒家","墨家","法家"],"a":1,"why":"墨子代表墨家，主张兼爱、非攻、尚贤。"},{"q":"提出「仁」的学说、创办私学的是","o":["孔子","韩非","老子"],"a":0,"why":"孔子是儒家创始人，核心思想是「仁」，主张有教无类。"}]},"cnh_j052":{"core":["1911 年武昌起义，辛亥革命爆发","1912 年中华民国成立，孙中山任临时大总统","推翻清王朝，结束中国两千多年君主专制制度","但没有改变半殖民地半封建社会的性质"],"eg":"按时间轴记：1898 戊戌变法 → 1911 武昌起义 → 1912 民国成立，别把三个年份串位。","trap":"是「结束君主专制」，不是「结束封建制度」，也不是「实现民族独立」——程度词最容易被替换。","quiz":[{"q":"武昌起义（辛亥革命爆发）的年份是","o":["1898 年","1911 年","1919 年"],"a":1,"why":"1898 是戊戌变法，1919 是五四运动。"},{"q":"辛亥革命最重要的历史意义是","o":["完全改变了中国半殖民地半封建的社会性质","推翻清王朝，结束了两千多年的君主专制制度","实现了民族独立和人民解放"],"a":1,"why":"革命果实被袁世凯窃取，社会性质并未根本改变，这一句常用来设错项。"}]},"cnc_j013":{"core":["《论语》记录孔子及其弟子的言行，是儒家经典","「学而时习之」「温故而知新」「学而不思则罔，思而不学则殆」讲学习方法","曾子「吾日三省吾身」讲修身，子夏「博学而笃志」"],"eg":"把十二章按「学习方法 / 学习态度 / 修身做人」分三类记，考试问出处和人物就不会串。","trap":"分清孔子、曾子、子夏三个人：『吾日三省吾身』是曾子说的，不是孔子。","quiz":[{"q":"「学而不思则罔，思而不学则殆」出自","o":["《论语》","《孟子》","《庄子》"],"a":0,"why":"这是《论语·为政》中孔子谈学与思关系的名句。"},{"q":"「吾日三省吾身」出自","o":["孔子","曾子","子夏"],"a":1,"why":"《论语·学而》里是曾子（曾参）说的，课本特意要求分清这几位。"}]},"cne_j009":{"core":["一般在词尾加 -s","以 s / x / ch / sh 结尾加 -es","辅音字母 + y 结尾：变 y 为 i 再加 -es","特殊：sheep 单复数同形，goose → geese"],"eg":"book→books，box→boxes，baby→babies，sheep→sheep，goose→geese。","trap":"sheep 不加 -s；goose 不是 gooses；这两课本单元特意列出来的不规则词最容易错。","quiz":[{"q":"sheep 的复数形式是","o":["sheeps","sheep","sheepes"],"a":1,"why":"sheep 单复数同形，是课本明确列出的不规则名词。"},{"q":"goose 的复数形式是","o":["gooses","geese","goose"],"a":1,"why":"goose → geese，和 tooth → teeth 一类，改内部元音。"}]},"cnd_j047":{"core":["网络改变世界，主要改变的是人们获取信息、商量事情、学习、办理日常事务的速度与范围","远方的同学可以很快对上话，距离不再是主要障碍","改变的是方式和范围，不是让现实交往失去意义"],"eg":"同样一件「商量班级活动」的事，以前要等见面或写信，现在群里几分钟就定下来——变的是速度和范围。","trap":"别答成「网络可以完全替代现实交往」；题目问「改变的是什么」，答「速度与范围」才对得上教材表述。","quiz":[{"q":"教材说网络改变世界，主要体现在","o":["让信息获取和沟通的速度、范围发生变化","让所有现实交往都不再需要","改变了人的生理结构"],"a":0,"why":"本框的核心表述就是「改变联系的速度和范围」。"},{"q":"关于网络，说法正确的是","o":["网络可以完全替代现实中的人际交往","网络让远方的人能很快对上话、商量事情","网络只有娱乐功能"],"a":1,"why":"网络拓展了交往的渠道和范围，但现实交往不可替代，也不只是娱乐。"}]},"cnm_002":{"core":["用正数和负数表示具有相反意义的量，如盈亏、增减、海拔高低"],"trap":"先找出「0 表示什么」，再定正方向；盈亏、增减、海拔高低、水位升降都用同一套思路。","quiz":[{"q":"若「盈利 200 元」记作 +200 元，则 −150 元表示","o":["亏损 150 元","盈利 150 元","收入 150 元"],"a":0,"why":"正负号表示一对相反意义的量，盈利与亏损相对，所以 −150 元表示亏损 150 元。"}]},"cnm_005":{"core":["会在数轴上画出表示给定有理数的点，并读出数轴上点所表示的数"],"trap":"画数轴先定原点、正方向、单位长度；标分数时要把一个单位长度等分。","quiz":[{"q":"数轴上原点左边 3 个单位处的点表示的数是","o":["−3","3","0"],"a":0,"why":"原点左边是负数，距原点 3 个单位即 −3；数轴上右边的数总比左边大。"}]},"cnm_008":{"core":["按“正数取本身、负数取相反数、0 取 0”的法则求绝对值并作简单化简"],"trap":"由 |x| = a（a>0）求 x，答案有两个：x = a 或 x = −a，别只写一个；互为相反数的两数绝对值相等。","quiz":[{"q":"|−3| + |2| 的值是","o":["5","1","−1"],"a":0,"why":"|−3| = 3，|2| = 2，所以和为 5；绝对值的结果永远非负。"}]},"cnm_009":{"core":["利用数轴（右边的数大）和绝对值（负数绝对值大的反而小）比较有理数大小"],"trap":"正数 > 0 > 负数；比较两个负数时，先比绝对值再反过来写不等号。","quiz":[{"q":"比较 −3 与 −5 的大小，正确的是","o":["−3 > −5","−3 < −5","两者相等"],"a":0,"why":"两个负数，绝对值大的反而小：|−3|=3 < |−5|=5，所以 −3 > −5；数轴上 −3 也在 −5 右边。"}]},"cnm_011":{"core":["把小学的交换律、结合律推广到有理数，用于凑整、同号结合等简算"],"trap":"三个常用简算思路：凑整、同号结合、互为相反数先抵消。","quiz":[{"q":"计算 (−7)+9+(−3)+1，最简便的第一步是","o":["把同号的项分别结合","严格从左到右依次算","先把所有数取绝对值相加"],"a":0,"why":"用交换律、结合律把 (−7)+(−3) = −10 与 9+1 = 10 分别结合，结果正好为 0。"}]},"cnm_013":{"core":["把加减混合式统一成“代数和”形式，省略加号和括号后按顺序或用运算律计算"],"trap":"省略加号后写成 −5−3−2+8，读作「负5、负3、负2、正8 的和」，别当成四个减法。","quiz":[{"q":"把 (−5)−(+3)+(−2)−(−8) 统一成加法，正确的是","o":["(−5)+(−3)+(−2)+(+8)","(−5)+(+3)+(−2)+(−8)","(−5)+(−3)+(−2)+(−8)"],"a":0,"why":"减去一个数等于加上它的相反数：减 +3 变加 −3，减 −8 变加 +8。"}]},"cnm_014":{"core":["同号得正、异号得负，并把绝对值相乘","任何数与 0 相乘都得 0"],"trap":"口诀「先定符号，再算绝对值」；任何数与 0 相乘都得 0。","quiz":[{"q":"(−4)×(−3) 的结果是","o":["12","−12","−7"],"a":0,"why":"同号得正，再把绝对值相乘：4×3 = 12。"}]},"cnm_015":{"core":["把交换律、结合律、分配律推广到有理数","多个非零因数相乘时由负因数个数定符号"],"trap":"多个非零因数相乘，负因数个数为奇数时积为负、偶数时为正；只要有一个因数为 0，积就是 0。","quiz":[{"q":"(−2)×3×(−5)×(−1)，积的符号是","o":["负","正","0"],"a":0,"why":"共有 3 个负因数（奇数个），积为负；绝对值相乘 2×3×5×1 = 30，结果是 −30。"}]},"cnm_016":{"core":["乘积为 1 的两个数互为倒数，0 没有倒数"],"trap":"0 没有倒数（找不到与 0 相乘得 1 的数）；求倒数时符号不变，分子分母调换。","quiz":[{"q":"−2/3 的倒数是","o":["−3/2","3/2","2/3"],"a":0,"why":"乘积为 1 的两数互为倒数，倒数的符号与原数相同：(−2/3)×(−3/2) = 1。"}]},"cnm_017":{"core":["除以一个不为 0 的数等于乘这个数的倒数，并掌握除法的符号法则"],"trap":"除以一个不为 0 的数等于乘它的倒数；0 不能作除数。","quiz":[{"q":"(−12)÷(−3) 的结果是","o":["4","−4","−36"],"a":0,"why":"同号得正，12÷3 = 4；也可写成 (−12)×(−1/3) = 4。"}]},"cnm_018":{"core":["按先乘除后加减、有括号先算括号的顺序进行四则混合运算"],"trap":"有括号先算括号，同级运算从左到右；减去一个负数一定要变成加。","quiz":[{"q":"计算 3 − 2×(−4) 的结果是","o":["11","−5","5"],"a":0,"why":"先乘除后加减：2×(−4) = −8，3 − (−8) = 3 + 8 = 11。"}]},"cnm_020":{"core":["负数的奇次幂为负、偶次幂为正","0 的正整数次幂为 0","会计算有理数的乘方"],"trap":"先看清底数有没有括号：负数作底数必须加括号；0 的正整数次幂是 0。","quiz":[{"q":"(−1) 的 2025 次幂的值是","o":["−1","1","2025"],"a":0,"why":"负数的奇次幂为负，2025 是奇数，所以结果是 −1；偶次幂才是 +1。"}]},"cnm_021":{"core":["按先乘方、再乘除、后加减的顺序进行有理数的混合运算"],"trap":"顺序：先乘方、再乘除、后加减；−2² 与 (−2)² 只差一个括号，结果一负一正。","quiz":[{"q":"计算 −2² + (−3)² 的结果是","o":["5","−13","13"],"a":0,"why":"−2² = −4（底数是 2，先乘方再取负），(−3)² = 9，−4 + 9 = 5。"}]},"cnm_022":{"core":["把一个大数写成 a×10ⁿ（1≤|a|<10，n 为正整数）的形式"],"trap":"n 等于原数整数位数减 1；还原时把小数点向右移 n 位，不足补 0。","quiz":[{"q":"把 350000 用科学记数法表示为","o":["3.5×10⁵","35×10⁴","3.5×10⁶"],"a":0,"why":"a 必须满足 1≤|a|<10，所以取 a = 3.5；小数点左移 5 位，n = 5。"}]},"cnm_023":{"core":["理解近似数、精确度，会按要求四舍五入取近似数并说出有效数字"],"trap":"有效数字从左边第一个非零数字起，数到精确到的那一位；3.14 有 3 个有效数字。","quiz":[{"q":"把 3.14159 精确到 0.01（百分位）得","o":["3.14","3.1","3.142"],"a":0,"why":"看千分位是 1，四舍五入舍去，得 3.14；3.142 是精确到千分位。"}]},"cnm_024":{"core":["认识二进制等进位制，探究不同进位制间的转换及其应用"],"trap":"「逢二进一」，从右往左各位权值依次是 2⁰、2¹、2²、2³……","quiz":[{"q":"二进制数 1011 化为十进制是","o":["11","9","13"],"a":0,"why":"1×2³ + 0×2² + 1×2¹ + 1×2⁰ = 8 + 0 + 2 + 1 = 11。"}]},"cnm_025":{"core":["用字母表示数、运算律和公式，体会从具体到一般的抽象过程"],"trap":"同一问题中同一个字母表示同一个量；不同量要用不同字母表示。","quiz":[{"q":"加法交换律用字母表示为","o":["a + b = b + a","a + b = a − b","ab = ba"],"a":0,"why":"加法交换律是两数相加交换位置和不变；ab = ba 是乘法交换律。"}]},"cnm_026":{"core":["用运算符号把数或字母连接而成的式子叫代数式，掌握省略乘号、分数线书写等规范"],"trap":"带分数与字母相乘要化成假分数；除法一般写成分数线形式；结果带单位时要给式子加括号。","quiz":[{"q":"下列代数式书写规范的是","o":["3a","a3","a×3"],"a":0,"why":"数字因数要写在字母前面，乘号省略；a3 与 a×3 都不符合规范。"}]},"cnm_027":{"core":["把文字叙述的数量关系用代数式表示，如和、差、倍、比多比少"],"trap":"读清「谁比谁多」「谁与谁的差」，先确定被减数和运算顺序再下笔。","quiz":[{"q":"「a 的 3 倍与 b 的差」用代数式表示为","o":["3a − b","3(a − b)","a − 3b"],"a":0,"why":"先求 a 的 3 倍得 3a，再减 b；3(a−b) 表示「a 与 b 的差的 3 倍」。"}]},"cnm_028":{"core":["结合具体情境说明代数式表示的数量含义"],"trap":"同一个代数式能编出很多情境，只要数量关系是 5×a 就成立。","quiz":[{"q":"代数式 5a 可以解释为","o":["单价 5 元的笔记本买 a 本的总价","a 与 5 的和","a 的 5 次方"],"a":0,"why":"5a 表示 5 与 a 的乘积，可对应「单价 × 数量 = 总价」这类关系。"}]},"cnm_029":{"core":["把字母的取值代入代数式并按运算顺序计算，注意负数代入要加括号"],"trap":"负数、分数代入一定要加括号，否则平方和符号都会算错；按先乘方后乘除再加减的顺序算。","quiz":[{"q":"当 a = −2 时，代数式 a² − 3a 的值是","o":["10","−2","4"],"a":0,"why":"(−2)² − 3×(−2) = 4 + 6 = 10。"}]},"cnm_030":{"core":["观察数列或图形序列，归纳第 n 项的代数式"],"trap":"先列出前几项与序号的对应关系，写完后把 n = 1、2 代回验证。","quiz":[{"q":"数列 2, 4, 6, 8, … 的第 n 项是","o":["2n","n + 2","2ⁿ"],"a":0,"why":"第 1 项 2 = 2×1，第 2 项 4 = 2×2，所以第 n 项是 2n；2ⁿ 是 2, 4, 8, 16…"}]},"cnm_031":{"core":["由数与字母的积组成的代数式叫单项式，认识系数与次数"],"trap":"单独的数或字母也是单项式；π 是数字不是字母；次数只数字母指数，不含系数。","quiz":[{"q":"单项式 −3x²y 的系数和次数分别是","o":["系数 −3，次数 3","系数 3，次数 2","系数 −3，次数 2"],"a":0,"why":"数字因数（连同符号）是系数 −3；字母指数和 2 + 1 = 3 是次数。"}]},"cnm_032":{"core":["几个单项式的和叫多项式，认识项、常数项、次数","单项式与多项式统称整式"],"trap":"单项式与多项式统称整式；分母里含字母的式子不是整式。","quiz":[{"q":"多项式 2x² − 3x + 1 的项数和次数分别是","o":["3 项，2 次","2 项，3 次","3 项，3 次"],"a":0,"why":"三项分别是 2x²、−3x、+1（项要带符号）；最高次项 2x² 为 2 次，是二次三项式。"}]},"cnm_033":{"core":["所含字母相同且相同字母的指数也相同的项叫同类项"],"trap":"所有常数项都是同类项；判断时只看字母部分，不看系数，也不看字母排列顺序。","quiz":[{"q":"下列各组是同类项的是","o":["3x²y 与 −5x²y","3x²y 与 3xy²","3x 与 3y"],"a":0,"why":"所含字母相同、且相同字母的指数也相同才是同类项，与系数大小、正负无关。"}]},"cnm_034":{"core":["同类项的系数相加，字母和字母的指数不变"],"trap":"
