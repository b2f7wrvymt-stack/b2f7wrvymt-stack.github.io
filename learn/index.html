不是同类项绝对不能合并；合并时只动系数，字母部分原样抄下来。","quiz":[{"q":"合并 3a + 2a 的结果是","o":["5a","5a²","6a"],"a":0,"why":"系数相加 3 + 2 = 5，字母和字母的指数不变；依据是分配律的逆用。"}]},"cnm_035":{"core":["括号前是 + 号去括号不变号，是 - 号去括号各项变号，并可用分配律去带系数的括号"],"trap":"括号前有系数时要用分配律乘遍每一项，别只乘第一项。","quiz":[{"q":"化简 a − (b − c) 的结果是","o":["a − b + c","a − b − c","a + b − c"],"a":0,"why":"括号前是「−」号，去括号后括号内各项都要变号：−(b − c) = −b + c。"}]},"cnm_036":{"core":["去括号并合并同类项，完成整式的加减运算"],"trap":"步骤固定：先去括号，再合并同类项；结果按某一字母降幂排列更清楚。","quiz":[{"q":"(3a + 2b) − (a − b) 化简得","o":["2a + 3b","2a + b","4a + b"],"a":0,"why":"去括号得 3a + 2b − a + b，合并同类项得 2a + 3b。"}]},"cnm_037":{"core":["先化简整式再代入字母的值求值"],"trap":"一定「先化简、后代入」；直接代入也能算，但步骤多、负数代入更容易错。","quiz":[{"q":"先化简 2(x+1) − 3x，再取 x = 2，结果是","o":["0","2","−2"],"a":0,"why":"2x + 2 − 3x = 2 − x，代入 x = 2 得 0。"}]},"cnm_038":{"core":["用整式表示几何图形的周长、面积或实际问题中的和差关系，并化简说明"],"trap":"分清周长（长度相加）与面积（长乘宽），单位也不同（a 与 a²）。","quiz":[{"q":"长方形长 3a、宽 2a，它的周长用整式表示为","o":["10a","6a²","5a"],"a":0,"why":"周长 = 2(长 + 宽) = 2(3a + 2a) = 10a；6a² 是面积，别混。"}]},"cnm_039":{"core":["含未知数的等式叫方程，使方程左右两边相等的未知数的值叫方程的解"],"trap":"方程要同时满足「是等式」且「含未知数」；2x + 3 只是代数式，不是方程。","quiz":[{"q":"检验 x = 2 是不是方程 3x − 1 = 5 的解，正确做法是","o":["把 x=2 代入左右两边分别计算，相等则是解","只看右边是不是 5","看 x 是不是整数"],"a":0,"why":"代入左边得 3×2 − 1 = 5，与右边相等，所以 x = 2 是方程的解。"}]},"cnm_040":{"core":["等式两边同加（减）同一个数或式，或同乘（除以）同一个不为 0 的数，等式仍成立"],"trap":"两边必须同时进行同一个运算；同乘或同除的数不能为 0。","quiz":[{"q":"由 3x = 12 得到 x = 4，依据是","o":["等式两边同除以 3","等式两边同加 3","移项要变号"],"a":0,"why":"等式两边同除以同一个不为 0 的数，等式仍成立：12÷3 = 4。"}]},"cnm_041":{"core":["只含一个未知数、未知数的次数为 1 且等号两边都是整式的方程叫一元一次方程"],"trap":"标准形式 ax + b = 0（a ≠ 0）；分母中含未知数的式子不是整式，也就不属于一元一次方程。","quiz":[{"q":"下列是一元一次方程的是","o":["2x + 1 = 5","x² + 1 = 5","2x + 3y = 5"],"a":0,"why":"只含一个未知数、未知数次数为 1、等号两边都是整式；第二个是二次，第三个含两个未知数。"}]},"cnm_042":{"core":["把含未知数的项移到一边、常数项移到另一边（移项要变号），再合并同类项、系数化为 1"],"trap":"移项必须变号，依据是等式的性质；没有移动的项符号保持不变。","quiz":[{"q":"解方程 3x + 2 = x − 6，移项后正确的是","o":["3x − x = −6 − 2","3x + x = −6 + 2","3x − x = −6 + 2"],"a":0,"why":"x 移到左边变 −x，+2 移到右边变 −2，得 2x = −8，x = −4。"}]},"cnm_043":{"core":["先去括号再移项合并，注意括号前系数和符号"],"trap":"括号前是负数时各顶都要变号；系数别漏乘常数项，这是最常见的错。","quiz":[{"q":"解方程 2(x − 3) = 8，去括号后得","o":["2x − 6 = 8","2x − 3 = 8","2x + 6 = 8"],"a":0,"why":"用分配律，2 要乘遍括号内每一项：2×x − 2×3 = 2x − 6。"}]},"cnm_044":{"core":["方程两边同乘各分母的最小公倍数去分母，注意不漏乘不含分母的项"],"trap":"不含分母的项也要乘最小公倍数，这是最高频失分点；分子是多项式时要先加括号再去分母。","quiz":[{"q":"解方程 (x − 1)/2 = 3，去分母后得","o":["x − 1 = 6","x − 1 = 3","2x − 1 = 6"],"a":0,"why":"方程两边同乘 2：x − 1 = 6，解得 x = 7。"}]},"cnm_045":{"core":["经过设未知数、找等量关系、列方程、求解、检验作答的建模过程解决实际问题"],"trap":"解完要检验结果是否符合题意：人数不能是小数、长度不能为负、天数通常取整数。","quiz":[{"q":"列一元一次方程解应用题，最关键的一步是","o":["找出题目中的等量关系","立刻设未知数","先把所有数字加起来"],"a":0,"why":"设、列、解、验、答五步里，能否找到等量关系直接决定方程列得对不对。"}]},"cnm_046":{"core":["通过“总量相等”“工作总量为 1”等关系列方程解决配套和工程问题"],"trap":"工程问题常把总量设为 1；配套问题抓「数量比」，如 1 个螺栓配 2 个螺母。","quiz":[{"q":"一项工程甲单独做 10 天完成，甲的工作效率是","o":["1/10","10","1/10 天"],"a":0,"why":"把工作总量看作 1，效率 = 总量 ÷ 时间 = 1/10，即每天完成总量的十分之一。"}]},"cnm_047":{"core":["用路程=速度×时间，分析相遇、追及等行程问题中的等量关系"],"trap":"相遇用「路程和」，追及用「路程差」；先画线段图，再按 路程 = 速度 × 时间 列式。","quiz":[{"q":"甲乙相向而行，速度分别为 4 m/s 和 6 m/s，相距 100 m，相遇时间是","o":["10 s","20 s","50 s"],"a":0,"why":"相遇时两人路程之和 = 100，(4 + 6)t = 100，所以 t = 10 s。"}]},"cnm_048":{"core":["结合标价、折扣、进价、利润率，用方程解决销售问题"],"trap":"利润率的分母是「进价」不是售价；打 x 折就是按标价的 x/10 出售。","quiz":[{"q":"某商品进价 80 元、售价 100 元，利润率是","o":["25%","20%","80%"],"a":0,"why":"利润 = 100 − 80 = 20 元，利润率 = 利润 ÷ 进价 = 20/80 = 25%。"}]},"cnm_049":{"core":["用方程比较不同付费方案，寻找使方案费用相等的临界点"],"trap":"分段计费要先判断用量落在哪个区间，再套对应单价，不能一把算到底。","quiz":[{"q":"比较两种付费方案、寻找临界点，常用方法是","o":["令两方案费用相等，列方程求解","只比较两者的单价","取两种费用的平均值"],"a":0,"why":"先分别列出两方案费用的代数式，再令它们相等解出临界值，之后分区间判断谁更省。"}]},"cnm_050":{"core":["认识棱柱、圆柱、圆锥、球等立体图形和其由平面图形构成的特征，并辨别常见的平面图形"],"trap":"棱柱按底面边数叫三棱柱、四棱柱……；面与面相交成线，线与线相交成点。","quiz":[{"q":"下列全部属于立体图形的是","o":["圆柱、圆锥、球","圆、三角形、圆柱","正方形、长方形、球"],"a":0,"why":"圆柱、圆锥、球都占空间；圆、三角形、正方形是平面图形。"}]},"cnm_051":{"core":["会从正面、左面、上面观察简单立体图形，认识正方体等的展开图"],"trap":"正方体展开图共 11 种；出现「田」字格或「凹」字形的一定不是正方体展开图。","quiz":[{"q":"从正面、左面、上面看同一物体得到的三个图形叫","o":["三视图","展开图","截面图"],"a":0,"why":"三视图指主视图（正面）、左视图、俯视图；展开图是把立体表面摊平后的平面图形。"}]},"cnm_052":{"core":["理解点动成线、线动成面、面动成体，认识几何图形的组成"],"trap":"记死三组对应：点→线、线→面、面→体，别把「体」和「面」对调。","quiz":[{"q":"下列与「点动成线、线动成面、面动成体」对应正确的是","o":["笔尖划过纸面留下痕迹——点动成线","长方形绕一边旋转成圆柱——点动成线","雨刷扫过扇形——面动成体"],"a":0,"why":"笔尖是点，划过成线；长方形旋转是面动成体；雨刷是线动成面。"}]},"cnm_053":{"core":["认识直线、射线、线段的特征、表示方法及相互区别"],"trap":"表示射线时端点字母必须写在前面；「延长线段 AB」与「反向延长线段 AB」方向相反。","quiz":[{"q":"关于直线、射线、线段，下列说法正确的是","o":["线段有两个端点，可以度量长度","射线有两个端点","直线可以度量长度"],"a":0,"why":"直线无端点、向两方无限延伸；射线只有一个端点；线段有两个端点、可度量。"}]},"cnm_054":{"core":["两点确定一条直线","两点之间线段最短","两点间线段的长度叫两点间的距离"],"trap":"两点间的距离指线段的「长度」，是一个数，不是线段本身。","quiz":[{"q":"「两点确定一条直线」的含义是","o":["经过两点有且只有一条直线","两点之间可以画很多条直线","两点之间线段最长"],"a":0,"why":"存在且唯一；另一条基本事实是「两点之间，线段最短」。"}]},"cnm_055":{"core":["用度量或叠合比较线段长短，掌握线段的和差与中点概念"],"trap":"比较线段可用叠合法或度量法；涉及和差时先画图标出各点顺序，别凭想象加减。","quiz":[{"q":"线段 AB = 6 cm，点 C 是 AB 的中点，则 AC =","o":["3 cm","6 cm","12 cm"],"a":0,"why":"中点把线段分成相等的两段，AC = AB ÷ 2 = 3 cm。"}]},"cnm_056":{"core":["角是由有公共端点的两条射线组成的图形，也可看作射线绕端点旋转形成，会用三种方式表示角"],"trap":"用三个字母表示角时顶点字母必须写在中间；顶点处只有一个角时可用顶点字母表示。","quiz":[{"q":"关于角，下列说法正确的是","o":["角也可看作一条射线绕端点旋转而成","角的两边是两条直线","角的大小与画出的边长有关"],"a":0,"why":"角由有公共端点的两条射线组成；大小只取决于张开的程度，与边画多长无关。"}]},"cnm_057":{"core":["1°=60′，1′=60″，会进行度分秒的互化及简单加减"],"trap":"借位时按 1° = 60′、1′ = 60″ 退位，千万别按十进制的 100 换算。","quiz":[{"q":"1° 等于","o":["60′","100′","3600′"],"a":0,"why":"度分秒是 60 进制：1° = 60′，1′ = 60″，所以 1° = 3600″。"}]},"cnm_058":{"core":["比较角的大小，进行角的和差运算，认识角的平分线"],"trap":"求角的和差要先看清各射线的顺序；「平分」是从顶点出发把角分成两半。","quiz":[{"q":"OC 平分 ∠AOB，且 ∠AOB = 70°，则 ∠AOC =","o":["35°","70°","140°"],"a":0,"why":"角平分线把角分成两个相等的角，70° ÷ 2 = 35°。"}]},"cnm_059":{"core":["两角之和为 90° 称互为余角，和为 180° 称互为补角"],"trap":"余角和为 90°，补角和为 180°；钝角没有余角，但一定有补角。","quiz":[{"q":"一个角是 35°，它的余角和补角分别是","o":["55° 和 145°","65° 和 145°","55° 和 125°"],"a":0,"why":"余角 = 90° − 35° = 55°；补角 = 180° − 35° = 145°。"}]},"cnm_060":{"core":["理解并用“同角或等角的余角（补角）相等”进行简单说理"],"trap":"「同角（等角）的余角相等」「等角的补角相等」常用来在证明中传递角相等。","quiz":[{"q":"若 ∠1 与 ∠2 互余，∠1 与 ∠3 也互余，则","o":["∠2 = ∠3","∠2 + ∠3 = 90°","∠2 = ∠1"],"a":0,"why":"同角的余角相等：∠2 与 ∠3 都等于 90° − ∠1。"}]},"cnm_061":{"core":["综合运用图形、线段与测量知识，为学校田径运动会设计场地方案"],"trap":"综合与实践不必死记结论，抓住「测量 → 换算 → 检验是否满足要求」这条主线。","quiz":[{"q":"设计学校田径运动会比赛场地，最先要明确的是","o":["各项目的尺寸标准与可用场地的长宽","只画一条起跑线","只考虑颜色搭配"],"a":0,"why":"这类实践题考的是把实际约束转成几何量（长度、角度、面积），再核对是否满足标准。"}]},"cnm_062":{"core":["两条直线相交所成的角中，有一条公共边且另一边互为反向延长线的两个角叫邻补角，它们互补"],"trap":"邻补角一定互补，互补的两个角不一定是邻补角；对顶角相等但一般不互补。","quiz":[{"q":"关于邻补角，下列说法正确的是","o":["有公共顶点和一条公共边，另一边互为反向延长线，两角和为 180°","只要两角和为 180° 就是邻补角","邻补角一定相等"],"a":0,"why":"邻补角既要「互补」（和为 180°）又要「相邻」（有公共顶点和公共边）；只互补不一定相邻。"}]},"cnm_063":{"core":["一个角的两边分别是另一个角两边的反向延长线，这样的两个角是对顶角，对顶角相等"],"trap":"判断对顶角要看两边是否互为反向延长线；相等的角不一定是对顶角。","quiz":[{"q":"对顶角的性质是","o":["对顶角相等","对顶角互补","对顶角之和为 90°"],"a":0,"why":"两直线相交形成的对顶角相等，这是由邻补角关系推出来的。"}]},"cnm_064":{"core":["两条直线相交成直角叫互相垂直，其中一条叫另一条的垂线，掌握过一点作已知直线垂线的方法及其唯一性"],"trap":"两直线夹角为 90° 才叫垂直；作图时别忘了标直角符号。","quiz":[{"q":"关于垂线，下列说法正确的是","o":["同一平面内，过一点有且只有一条直线与已知直线垂直","过一点可以作无数条垂线","垂线一定是水平线"],"a":0,"why":"存在且唯一，这个点可以在直线上，也可以在直线外。"}]},"cnm_065":{"core":["直线外一点与直线上各点的连线中垂线段最短，垂线段的长度叫点到直线的距离"],"trap":"「垂线段最短」常用来求最短路径；别把「距离」答成某条线段的名称。","quiz":[{"q":"点到直线的距离是指","o":["从该点到直线的垂线段的长度","从该点到直线的任意一条线段的长度","垂线段这条图形本身"],"a":0,"why":"距离是一个「长度」（数），不是线段图形；所有连线中垂线段最短。"}]},"cnm_066":{"core":["两条直线被第三条直线所截形成八个角，能辨认同位角、内错角、同旁内角"],"trap":"记形状：同位角像「F」、内错角像「Z」、同旁内角像「U」；先找准截线再判断。","quiz":[{"q":"两直线被第三条直线所截，位于两直线之间、截线两侧的两个角叫","o":["内错角","同位角","同旁内角"],"a":0,"why":"内错角在两直线之间、截线两侧；同位角在截线同侧且位置相同；同旁内角在两线之间、截线同侧。"}]},"cnm_067":{"core":["在同一平面内不相交的两条直线叫平行线","过直线外一点有且只有一条直线与已知直线平行","平行于同一直线的两直线平行"],"trap":"平行线定义里的「在同一平面内」不能省；空间里不相交也不一定平行。","quiz":[{"q":"平行公理的内容是","o":["经过直线外一点，有且只有一条直线与这条直线平行","过一点可作无数条平行线","任意两条直线都平行"],"a":0,"why":"存在且唯一；推论是「若两条直线都与第三条直线平行，则这两条直线也互相平行」。"}]},"cnm_068":{"core":["同位角相等，或内错角相等，或同旁内角互补，两直线平行"],"trap":"「判定」是由角的关系推平行；同旁内角要的是「互补」而不是「相等」。","quiz":[{"q":"下列条件能判定两直线平行的是","o":["同位角相等","同旁内角相等","内错角互补"],"a":0,"why":"判定定理：同位角相等 / 内错角相等 / 同旁内角互补，都能推出两直线平行。"}]},"cnm_069":{"core":["两直线平行，同位角相等、内错角相等、同旁内角互补"],"trap":"性质的前提是「已知平行」；题目没给平行条件时不能直接套用。","quiz":[{"q":"两直线平行时，下列结论正确的是","o":["同位角相等","同旁内角相等","内错角互补"],"a":0,"why":"性质：两直线平行 → 同位角相等、内错角相等、同旁内角互补。"}]},"cnm_070":{"core":["综合运用判定与性质完成说理，处理含拐点的折线（如“猪蹄”“铅笔”模型）中的角度问题"],"trap":"每一步都要写出依据（哪条判定或性质定理），不能跳步。","quiz":[{"q":"平行线判定与性质综合题的常见推理顺序是","o":["先由角相等判定平行，再由平行得出另一组角相等","先假定角相等再倒推","只靠量角器测量"],"a":0,"why":"这类题通常「判定 → 性质」两步走：先用角关系证平行，再借平行把角转移到别处。"}]},"cnm_071":{"core":["认识定义、命题（条件与结论）、真命题与假命题、公理、定理和证明"],"trap":"疑问句、祈使句、作图语句都不是命题；举一个反例就能说明命题为假。","quiz":[{"q":"关于命题，下列说法正确的是","o":["命题由题设和结论两部分组成，常写成「如果…那么…」","所有句子都是命题","命题一定正确"],"a":0,"why":"命题是判断一件事情的句子，由题设（如果）和结论（那么）构成；命题有真有假，真命题经证明可作定理。"}]},"cnm_072":{"core":["把图形沿某一方向移动一定距离，图形的形状和大小不变，对应点连线平行（或在同一直线上）且相等"],"trap":"平移由「方向」和「距离」两个要素决定，角度和长度都不改变。","quiz":[{"q":"关于平移，下列说法正确的是","o":["平移后图形的形状和大小都不变，对应点连线平行且相等","平移会改变图形的大小","平移后对应线段互相垂直"],"a":0,"why":"平移只改变位置；对应点所连线段平行（或共线）且相等，对应线段也平行且相等。"}]},"cnm_073":{"core":["根据平移方向与距离，画出已知图形平移后的图形"],"trap":"所有点移动的方向和距离必须完全一致；别漏掉图形内部的关键点。","quiz":[{"q":"作一个图形平移后的图形，关键步骤是","o":["按同一方向和距离确定几个关键点的对应点，再顺次连接","只移动一个点","把图形旋转一下"],"a":0,"why":"先选关键点（如多边形各顶点），逐个按相同方向、相同距离移动，再按原顺序连接。"}]},"cnm_074":{"core":["如果 x²=a（a≥0）则 x 叫 a 的平方根，正的平方根叫算术平方根，正数有两个互为相反数的平方根，0 的平方根为 0，负数没有平方根"],"trap":"负数没有平方根；0 的平方根与算术平方根都是 0；√a 中 a 必须 ≥ 0。","quiz":[{"q":"9 的平方根与算术平方根分别是","o":["±3 和 3","3 和 ±3","±3 和 −3"],"a":0,"why":"正数有两个平方根（互为相反数），算术平方根只取非负的那个，记作 √9 = 3。"}]},"cnm_075":{"core":["会用平方运算求完全平方数的平方根，了解 √(a²)=|a|，并能用计算器求近似值"],"trap":"开平方与平方互为逆运算；别把 √16 与 16² 混为一谈。","quiz":[{"q":"√16 的值是","o":["4","±4","8"],"a":0,"why":"根号表示算术平方根，只取非负值 4；写「16 的平方根」才是 ±4。"}]},"cnm_076":{"core":["如果 x³=a，则 x 叫 a 的立方根，任何数都有唯一立方根，会求常见数的立方根"],"trap":"立方根只有一个，符号与被开方数相同；0 的立方根是 0。","quiz":[{"q":"−8 的立方根是","o":["−2","2","没有立方根"],"a":0,"why":"因为 (−2)³ = −8；负数有立方根，但没有平方根。"}]},"cnm_077":{"core":["无限不循环小数叫无理数，如 √2、π","有限小数和无限循环小数都是有理数"],"trap":"带根号不一定是无理数（√4 = 2）；常见无理数还有开不尽的方根、有规律但不循环的构造小数。","quiz":[{"q":"下列是无理数的是","o":["π","0.5","22/7"],"a":0,"why":"无理数是无限不循环小数；π 是，0.5 是有限小数、22/7 是分数，都属于有理数。"}]},"cnm_078":{"core":["有理数与无理数统称实数，实数与数轴上的点一一对应，实数的相反数、绝对值意义同有理数"],"trap":"也可按「正实数 / 0 / 负实数」分类；0 既不是正数也不是负数。","quiz":[{"q":"关于实数，下列说法正确的是","o":["有理数和无理数统称实数，实数与数轴上的点一一对应","实数只包括有理数","数轴上有些点不对应实数"],"a":0,"why":"实数 = 有理数 + 无理数；每个实数对应数轴上唯一一点，反之每个点也对应唯一实数。"}]},"cnm_079":{"core":["利用平方夹逼估计 √a 的大致范围，并比较含根号的实数大小"],"trap":"估值用「夹逼」：找被开方数两侧最接近的完全平方数；比较两个含根号的数可先平方再比。","quiz":[{"q":"√10 介于哪两个连续整数之间","o":["3 和 4","2 和 3","4 和 5"],"a":0,"why":"因为 3² = 9 < 10 < 16 = 4²，所以 3 < √10 < 4。"}]},"cnm_080":{"core":["有理数的运算法则和运算律在实数范围内仍适用，会进行含根号的简单运算"],"trap":"实数范围内运算顺序与运算律和有理数相同；先化简根号与绝对值，再做加减。","quiz":[{"q":"计算 √4 + |−3| 的结果是","o":["5","1","7"],"a":0,"why":"√4 = 2，|−3| = 3，和为 5。"}]},"cnm_081":{"core":["用有顺序的两个数表示位置，如（列，行），顺序不同表示的位置不同"],"trap":"用数对定位前必须先约定顺序（如先排后列、先横后纵），顺序一变含义就变。","quiz":[{"q":"有序数对 (3, 5) 与 (5, 3)","o":["表示不同的位置","表示同一个位置","无法比较"],"a":0,"why":"有序数对强调「顺序」，两个数的先后不同，表示的位置就不同。"}]},"cnm_082":{"core":["两条互相垂直、原点重合的数轴构成平面直角坐标系，会根据坐标描点并读出点的坐标"],"trap":"建系时要画互相垂直的 x 轴、y 轴，标明原点、正方向与单位长度。","quiz":[{"q":"点 P(−3, 2) 的横坐标和纵坐标分别是","o":["−3 和 2","2 和 −3","3 和 −2"],"a":0,"why":"坐标写成 (横坐标, 纵坐标)，横在前、纵在后。"}]},"cnm_083":{"core":["会判断点所在象限，坐标轴上点的特征：x 轴上点纵坐标为 0，y 轴上点横坐标为 0"],"trap":"x 轴上的点纵坐标为 0，y 轴上的点横坐标为 0；坐标轴上的点不属于任何象限。","quiz":[{"q":"点 (−2, −3) 在","o":["第三象限","第一象限","第二象限"],"a":0,"why":"象限符号：一(+,+)、二(−,+)、三(−,−)、四(+,−)；两个坐标都为负，在第三象限。"}]},"cnm_084":{"core":["建立坐标系，用坐标表示点、线段和多边形，并求线段长及图形面积"],"trap":"平行于 x 轴的线段上各点纵坐标相同，平行于 y 轴的线段上各点横坐标相同。","quiz":[{"q":"用坐标描述一个简单几何图形，通常做法是","o":["先确定各顶点坐标，再由坐标说明边长和位置关系","只写出一个顶点坐标","只写出图形面积"],"a":0,"why":"把图形放进坐标系，用顶点坐标定位；坐标差可求边长，坐标相等可判断线段与坐标轴平行。"}]},"cnm_085":{"core":["选择适当的原点和单位长度建立坐标系，用坐标表示平面图上的地理位置"],"trap":"原点或单位长度变了，同一地点的坐标也会变，所以必须先说明坐标系怎么建立的。","quiz":[{"q":"用坐标表示地理位置，首先要","o":["选定参照点作原点，并确定方向与单位长度","直接写经纬度","只测量距离"],"a":0,"why":"建系三件事：选原点、定 x/y 轴正方向（常取东、北）、定单位长度。"}]},"cnm_086":{"core":["点向右（左）平移 a 个单位横坐标加（减）a，向上（下）平移 b 个单位纵坐标加（减）b","图形平移即各顶点同样平移"],"trap":"右加左减改横坐标，上加下减改纵坐标——「左右动 x，上下动 y」。","quiz":[{"q":"点 (2, 3) 向右平移 4 个单位，再向下平移 2 个单位后是","o":["(6, 1)","(6, 5)","(−2, 1)"],"a":0,"why":"右移横坐标 +4 得 6，下移纵坐标 −2 得 1，所以是 (6, 1)。"}]},"cnm_087":{"core":["含有两个未知数且未知数的次数都是 1 的整式方程叫二元一次方程，它有无数组解"],"trap":"二元一次方程要求含两个未知数、未知数项次数都是 1、等号两边都是整式。","quiz":[{"q":"关于二元一次方程 x + y = 5，下列说法正确的是","o":["它有无数个解","它只有一个解","它没有解"],"a":0,"why":"单个二元一次方程有无数组解（给定一个 x 就能求出对应 y）；组成方程组后才可能唯一。"}]},"cnm_088":{"core":["共含两个未知数的两个一次方程合在一起，叫二元一次方程组，两个方程的公共解叫方程组的解"],"trap":"检验时要把这对值逐个代入所有方程，别只验一个。","quiz":[{"q":"二元一次方程组的解是指","o":["能同时满足组里每一个方程的一组未知数的值","只满足其中一个方程即可","两个方程各自解的乘积"],"a":0,"why":"必须代入每一个方程都成立，才叫这个方程组的解。"}]},"cnm_089":{"core":["把一个方程变形用一个未知数表示另一个，代入另一个方程消元，转化为一元一次方程"],"trap":"优先选系数为 1 或 −1 的未知数来变形，计算量最小；解完要回代求另一个未知数。","quiz":[{"q":"用代入消元法解 y = 2x 与 x + y = 9，第一步是","o":["把 y = 2x 代入第二个方程，得 x + 2x = 9","两式相加","直接令 x = 0"],"a":0,"why":"把一个方程变形成「用一个未知数表示另一个」，代入另一方程即可消去 y，化为一元一次方程。"}]},"cnm_090":{"core":["当某未知数的系数相等或相反时，把两个方程相加或相减消去该未知数"],"trap":"同一未知数系数相同就相减、互为相反数就相加；系数不同时先乘适当数把系数凑齐。","quiz":[{"q":"用加减消元法解 2x + y = 7 与 2x − y = 3，应","o":["两式相加消去 y","两式相减消去 x","两式相乘"],"a":0,"why":"y 的系数互为相反数，两式相加得 4x = 10，即 x = 2.5。"}]},"cnm_091":{"core":["根据两个等量关系设两个未知数、列方程组、求解并检验作答"],"trap":"设、列、解、验、答五步与一元一次方程相同，只是等量关系多了一个。","quiz":[{"q":"列二元一次方程组解应用题，通常需要","o":["设两个未知数，并找出两个不同的等量关系","只找出一个等量关系","只设一个未知数"],"a":0,"why":"两个未知数需要两个独立方程约束，所以要找出两个不重复的等量关系。"}]},"cnm_092":{"core":["处理和差倍分、行程、浓度配比、分配与方案等需要两个未知数的实际问题"],"trap":"常见类型还有和差倍分、行程、配套、销售；关键是找出两个不重复的等量关系并检验结果是否为整数。","quiz":[{"q":"「鸡兔同笼」类问题适合","o":["设两个未知数，按头数与腿数两个等量关系列方程组","只按头数列一个方程","套用面积公式"],"a":0,"why":"头数给出一个等量关系、腿数给出另一个，正好两个方程解两个未知数。"}]},"cnm_093":{"core":["通过消元把三元一次方程组转化为二元、再转化为一元一次方程求解"],"trap":"「消元」是方程组的主线：每消一次，未知数个数就减一。","quiz":[{"q":"解三元一次方程组的基本思路是","o":["逐步消元：先化成二元、再化为一元","一次同时消掉两个未知数","直接猜整数解"],"a":0,"why":"用代入或加减消去一个未知数得二元方程组，再消一次得一元方程，最后逐个回代。"}]},"cnm_094":{"core":["用不等号表示大小关系的式子叫不等式，使不等式成立的未知数的值叫解，所有解的集合叫解集"],"trap":"「解」是单个值，「解集」是全体解；检验边界值时注意是否包含等号。","quiz":[{"q":"关于不等式的解集，下列说法正确的是","o":["解集是使不等式成立的所有未知数值组成的集合","解集通常只有一个数","解集就是一条数轴"],"a":0,"why":"与方程不同，不等式的解往往有无数个，要用集合、区间或在数轴上表示。"}]},"cnm_095":{"core":["用数轴上的空心圈（不含端点）和实心点（含端点）表示不等式的解集"],"trap":"实心/空心和方向是两处高频错，画完随意取一个数代回验证。","quiz":[{"q":"在数轴上表示 x ≥ 2，应画成","o":["2 处画实心点，向右画线","2 处画空心圈，向右画线","2 处画实心点，向左画线"],"a":0,"why":"含等号（≥、≤）用实心点，不含等号（>、<）用空心圈；大于向右、小于向左。"}]},"cnm_096":{"core":["不等式两边同加（减）同一个数，不等号方向不变","同乘（除以）正数方向不变，同乘（除以）负数方向改变"],"trap":"性质 3 最易错：乘除正数不变号，乘除负数要变号；0 不能作除数。","quiz":[{"q":"若 a > b，下列一定成立的是","o":["a − 3 > b − 3","−2a > −2b","两边同除以 0 仍成立"],"a":0,"why":"两边同加减同一个数，方向不变；同乘或同除以负数时，不等号方向必须改变。"}]},"cnm_097":{"core":["类比一元一次方程的解法：去分母、去括号、移项、合并、系数化为 1，注意乘除负数时改变不等号方向"],"trap":"去分母、去括号、移项、合并与解方程相同，只在最后「系数化为 1」时留意是否除了负数。","quiz":[{"q":"不等式 −2x > 6 的解集是","o":["x < −3","x > −3","x < 3"],"a":0,"why":"两边同除以 −2（负数），不等号方向改变，得 x < −3。"}]},"cnm_098":{"core":["把“不超过、至少、不低于”等表述转化为不等式并求整数解或最优方案"],"trap":"抓关键词：「不超过」≤、「至少」≥、「超过」>、「不足」<。","quiz":[{"q":"用一元一次不等式解应用题，最后一步要","o":["结合实际意义取符合要求的整数或范围解","把不等式的解集原样照抄作答","只取边界值"],"a":0,"why":"数学解集常是连续区间，实际问题里人数、件数必须取整，且常取「至少 / 最多」的临界值。"}]},"cnm_099":{"core":["分别解各不等式，再用数轴取公共部分得到不等式组的解集（同大取大、同小取小、大小小大中间找、大大小小无解）"],"trap":"口诀：同大取大、同小取小、大小小大中间找、大大小小无处找；先分别解，再取交集。","quiz":[{"q":"不等式组 x > 1 且 x < 4 的解集是","o":["1 < x < 4","x > 4","无解"],"a":0,"why":"不等式组的解集是各个不等式解集的公共部分（交集）。"}]},"cnm_100":{"core":["用不等式组描述含有多个限制条件的实际问题，如分配方案、参数取值范围"],"trap":"解出交集后还要按实际意义取整，并逐条检验是否所有条件都满足。","quiz":[{"q":"实际问题要列不等式组，通常是因为","o":["需要同时满足两个或多个限制条件","一个条件就已经足够","只是为了凑步骤"],"a":0,"why":"每个限制条件对应一个不等式，几个条件同时成立就构成不等式组。"}]},"cnm_101":{"core":["收集生活数据，用方程、不等式比较不同出行或用能方案的碳排放"],"trap":"结论要说清「哪种方案可行、在什么范围内可行」，不能只写一个算式。","quiz":[{"q":"用不等式知识做「低碳生活」方案比较，核心是","o":["把各方案的用量或费用列成不等式（组），求满足限制的范围","只比较一个数字","只画一张统计图"],"a":0,"why":"关键是把「不超过某标准」翻译成不等式，求解集后给出可行方案。"}]},"cnm_300":{"core":["一次完整的统计活动包括提出问题、收集数据、整理数据、描述数据、分析数据、得出结论并作出决策"],"trap":"明确「调查目的」和「调查对象」是第一步，目的不同，要收集的数据也不同。","quiz":[{"q":"一次完整统计活动的合理顺序是","o":["收集数据 → 整理数据 → 描述数据 → 分析并作出决策","先画统计图再收集数据","直接下结论"],"a":0,"why":"收集、整理、描述、分析是四个基本环节，顺序不能颠倒。"}]},"cnm_102":{"core":["全面调查对全体对象调查，抽样调查只调查一部分，知道各自适用的情形"],"trap":"抽样调查得到的是「估计」、一定存在误差；全面调查结论准确但成本高。","quiz":[{"q":"下列适合用抽样调查的是","o":["了解一批灯泡的使用寿命","统计全班 40 名同学的身高","检查本班今天的考勤"],"a":0,"why":"破坏性、范围极大或成本过高的调查用抽样；范围小、要求准确且无破坏的用全面调查。"}]},"cnm_292":{"core":["了解问卷调查、访谈、实验观测、查阅文献或网络资料等常见的数据收集方法及各自适用的情形"],"trap":"问卷设计要避免诱导性提问，选项要互斥并覆盖所有可能。","quiz":[{"q":"下列都属于收集数据方法的是","o":["问卷调查、实验测量、查阅资料","只做问卷调查","只画统计图"],"a":0,"why":"常见方法有问卷、访谈、实验测量、查阅资料、观察记录，按调查目的选用。"}]},"cnm_103":{"core":["辨认调查中的总体、个体、样本和样本容量"],"trap":"研究对象是「数据」（视力）而不是「人」；样本容量只写数字，别写成「100 名」。","quiz":[{"q":"为估计全校 1200 名学生的视力，抽查 100 名，其中「样本容量」是","o":["100","1200","100 名学生的视力"],"a":0,"why":"样本容量是样本中个体的数目，是一个不带单位的数；本题为 100。总体是全校学生的视力，个体是每名学生的视力。"}]},"cnm_104":{"core":["认识抽样要具有代表性和随机性，能判断抽样方式是否合理"],"trap":"「随机」指每个个体都有同等被抽中的机会；图方便只问身边的人，结论往往偏。","quiz":[{"q":"下列抽样最有代表性的是","o":["从全校各年级随机抽取若干名学生","只调查某一个班","只调查篮球队员"],"a":0,"why":"样本要随机、容量足够、覆盖各类对象，才能代表总体；只抽特定群体会产生系统偏差。"}]},"cnm_298":{"core":["按随机原则抽取样本，用抽签法或随机数（随机数表、计算器产生的随机数）使每个个体被抽到的机会相等"],"trap":"编号要全、搅匀要够、抽取不能挑；随机数表与随机数生成器是同一思路。","quiz":[{"q":"抽签法属于","o":["简单随机抽样","分层抽样","全面调查"],"a":0,"why":"编号后充分搅匀再随机抽取，每个个体被抽到的机会相等，就是简单随机抽样。"}]},"cnm_299":{"core":["用样本中某类个体所占的百分比估计总体中该类个体的数量，如估计全校喜欢阅读的人数或池塘中鱼的条数"],"trap":"结果要写「约」，是估计值不是精确值；样本代表性越好，估计越可靠。","quiz":[{"q":"抽查 200 件产品合格率为 95%，估计 2000 件中合格品约有","o":["1900 件","95 件","200 件"],"a":0,"why":"用样本百分比估计总体：2000 × 95% = 1900 件。"}]},"cnm_105":{"core":["按目的选择扇形图（占比）、条形图（数量）、折线图（变化趋势），并从图中读取信息"],"trap":"扇形图各部分百分比之和应为 100%；选错统计图会让结论不直观。","quiz":[{"q":"要清楚表示各部分占总体的百分比，最适合用","o":["扇形图","条形图","折线图"],"a":0,"why":"扇形图看「占比」，条形图看「数量多少」，折线图看「随时间的变化趋势」。"}]},"cnm_293":{"core":["按一定标准对原始数据分类，用划记法计数，并把结果填入含合计的统计表"],"trap":"整理前先定分组标准，组别要互斥、不重不漏；统计表要标清单位与合计。","quiz":[{"q":"用「正」字划记法整理数据，主要好处是","o":["边记录边累计，能快速得到各组频数且不易漏计","让表格更好看","改变原始数据"],"a":0,"why":"按类别逐笔累计，最后数笔画即得频数，避免漏计或重复。"}]},"cnm_294":{"core":["根据数据范围选取合适的纵轴刻度，画出并标注条形图（比较各类数量）和折线图（反映随时间的变化）"],"trap":"折线图横轴一般是时间或有序变量，用点连线表示变化趋势。","quiz":[{"q":"绘制条形图时，两个轴通常分别表示","o":["类别与数量（频数）","时间与百分比","只有数量"],"a":0,"why":"横轴放类别、纵轴放数量；纵轴刻度要从 0 开始且等距，否则会夸大差异。"}]},"cnm_295":{"core":["把各类数据占总数的百分比换算成圆心角（百分比×360°），用量角器画出扇形图"],"trap":"先算百分比再乘 360°；所有扇形的圆心角之和必须等于 360°。","quiz":[{"q":"某部分占 25%，在扇形图中对应的圆心角是","o":["90°","25°","180°"],"a":0,"why":"圆心角 = 百分比 × 360° = 0.25 × 360° = 90°。"}]},"cnm_296":{"core":["识别截断纵轴、刻度间隔不均、只选取部分数据等使统计图产生误导的做法，并能说明如何改正"],"trap":"看图先查三件事：纵轴起点、刻度是否均匀、样本是否有代表性。","quiz":[{"q":"下列做法最容易让统计图产生误导的是","o":["纵轴不从 0 开始、刻度不均匀","标注清楚单位和数据来源","各组柱宽保持相等"],"a":0,"why":"纵轴截断或刻度不等距会夸大或缩小差异，让人误判大小关系。"}]},"cnm_106":{"core":["对数据进行分组，统计各组频数，画频数分布表"],"trap":"分组要不重不漏，常用左闭右开区间；组数太少看不出分布，太多又太碎。","quiz":[{"q":"一组数据最大值 98、最小值 62，组距取 5，应分的组数约为","o":["8 组","5 组","36 组"],"a":0,"why":"极差 = 98 − 62 = 36，36 ÷ 5 = 7.2，进一取整得 8 组。"}]},"cnm_107":{"core":["用直方图直观表示数据分布，从图中读取各组频数并分析"],"trap":"组距相等时矩形的高与频数成正比；组距不等时不能直接用高比大小。","quiz":[{"q":"频数分布直方图与条形图的主要区别是","o":["直方图横轴是连续分组、各矩形一般相连","两者完全一样","直方图纵轴一定表示百分比"],"a":0,"why":"直方图横轴是连续的数值区间，矩形之间通常没有空隙；条形图横轴是离散类别、柱间留空。"}]},"cnm_297":{"core":["频率等于频数除以数据总数，各组频率之和为 1","用频率反映各组数据占总体的比例"],"trap":"各组频率之和等于 1；频率反映「占比」，频数反映「个数」。","quiz":[{"q":"某组频数为 12，样本容量为 60，该组频率是","o":["0.2","12","5"],"a":0,"why":"频率 = 频数 ÷ 样本容量 = 12 ÷ 60 = 0.2，即 20%。"}]},"cnm_301":{"core":["从直方图读出各组频数，求某个范围内的人数或所占比例，并判断数据分布的特点"],"trap":"分组数据只能「估计」平均数，通常用各组组中值加权计算。","quiz":[{"q":"从频数分布直方图能直接读出的是","o":["各组数据个数的多少及分布的大致形状","每一个原始数据","平均数的精确值"],"a":0,"why":"直方图给出各组的频数（或频率），能看出哪组多、整体偏向哪边，但看不到具体数值。"}]},"cnm_108":{"core":["通过趋势图观察数据随时间变化的规律，并作简单预测"],"trap":"预测要谨慎：只在趋势延续、条件不变时成立，不能无限外推。","quiz":[{"q":"趋势图最适合用来","o":["观察数据随时间变化的走向并作粗略预测","精确计算每一个数据","只比较各部分占比"],"a":0,"why":"趋势图用连线显示增减，能看出上升、下降、周期或拐点。"}]},"cnm_109":{"core":["收集不同日期、地点的昼长数据，用统计图探究其变化规律"],"trap":"结论要说明依据的数据范围，写成「在这段时间内观察到」的规律，别过度推广。","quiz":[{"q":"探究日昼时长的变化规律，合理做法是","o":["连续记录多日日出日落时刻，整理成表并画趋势图再归纳","只看某一天的数据","凭印象直接下结论"],"a":0,"why":"走完整统计流程：收集 → 整理 → 描述 → 分析，用多期数据找规律。"}]},"cnm_110":{"core":["认识三角形的边、角、顶点，按边（不等边、等腰、等边）和按角（锐角、直角、钝角）对三角形分类"],"trap":"三角形至少有两个锐角；判断时先看最大角属于哪一类。","quiz":[{"q":"关于三角形的分类，下列说法正确的是","o":["按角可分为锐角、直角、钝角三角形","按边只分等边三角形一类","三角形可以有两个直角"],"a":0,"why":"按角分三类；按边分不等边三角形与等腰三角形（等边是特殊的等腰）；内角和 180° 决定了最多只能有一个直角或钝角。"}]},"cnm_111":{"core":["三角形任意两边之和大于第三边，任意两边之差小于第三边（依据两点之间线段最短）"],"trap":"两边之和等于第三边时三点共线，不能构成三角形；已知两边求第三边范围：|a−b| < c < a+b。","quiz":[{"q":"下列长度的三条线段能组成三角形的是","o":["3，4，5","1，2，3","1，1，3"],"a":0,"why":"只需检验较短两边之和是否大于最长边：3+4=7>5 成立；1+2=3 不成立；1+1=2<3 不成立。"}]},"cnm_112":{"core":["从三角形的一个顶点向对边（或其延长线）作垂线，顶点与垂足间的线段叫高，三角形有三条高"],"trap":"高是从顶点向对边「所在直线」作垂线；三条高所在直线交于一点。","quiz":[{"q":"关于三角形的高，下列说法正确的是","o":["钝角三角形有两条高落在三角形外部","每条高都在三角形内部","三角形只有一条高"],"a":0,"why":"锐角三角形三条高都在内部；直角三角形两条高就是两条直角边；钝角三角形有两条高在外部。"}]},"cnm_113":{"core":["连接顶点与对边中点的线段叫中线，三条中线交于重心，一条中线把三角形分成面积相等的两部分"],"trap":"三条中线交于重心；中线是「顶点到对边中点」的线段，与高、角平分线不同。","quiz":[{"q":"三角形的一条中线把这个三角形分成两个面积","o":["相等","不相等","无法确定"],"a":0,"why":"中线平分对边，两个小三角形等底同高，所以面积相等。"}]},"cnm_114":{"core":["三角形一个内角的平分线与对边相交，顶点与交点间的线段叫三角形的角平分线"],"trap":"注意区分「角的平分线」（射线）与「三角形的角平分线」（线段）。","quiz":[{"q":"三角形的角平分线是","o":["顶点与内角平分线和对边交点之间的线段","一条射线","一条直线"],"a":0,"why":"三角形的角平分线是一条线段，三条交于一点；而「一个角的平分线」是射线。"}]},"cnm_115":{"core":["三角形三个内角的和等于 180°，可通过过一顶点作平行线说明"],"trap":"内角和恒为 180°，与形状大小无关；常用辅助线是过一顶点作对边的平行线来证明。","quiz":[{"q":"三角形三个内角之比为 1:2:3，最大角是","o":["90°","60°","120°"],"a":0,"why":"总份数 6，180°÷6 = 30°，最大角 3×30° = 90°，是直角三角形。"}]},"cnm_116":{"core":["直角三角形的两个锐角互余","有两个角互余的三角形是直角三角形"],"trap":"反过来，若三角形两角互余，则它是直角三角形。","quiz":[{"q":"直角三角形中一个锐角为 35°，另一个锐角是","o":["55°","145°","65°"],"a":0,"why":"直角三角形两锐角互余：90° − 35° = 55°。"}]},"cnm_117":{"core":["三角形的外角等于与它不相邻的两个内角之和，并大于任何一个与它不相邻的内角"],"trap":"审题先分清「相邻」和「不相邻」，这是外角题最常设的陷阱。","quiz":[{"q":"三角形的一个外角等于","o":["与它不相邻的两个内角之和","与它相邻的那个内角","三个内角之和"],"a":0,"why":"外角等于不相邻两内角之和，因此大于任何一个不相邻的内角；外角与相邻内角互补。"}]},"cnm_118":{"core":["认识“已知、求证、证明”的格式，体会每一步都要有依据，理解为什么要证明"],"trap":"格式：已知 / 求证 / 证明；先在图上标出条件，再决定从哪个判定或性质入手。","quiz":[{"q":"几何证明中，每一步结论后面应当","o":["注明依据（定义、公理、定理或已知条件）","只写结论","把题目重抄一遍"],"a":0,"why":"证明要求「步步有据」，括号内写清所用依据，别人才能复现推理。"}]},"cnm_119":{"core":["通过悬挂实验和作中线，探究三角形等匀质薄板的重心位置"],"trap":"与「三角形三条中线交于重心」是同一个概念；实践题要写清操作步骤和依据。","quiz":[{"q":"用悬挂法确定不规则匀质薄板的重心，依据主要是","o":["重心必在每次悬线的延长线上，两次悬挂所得直线的交点即重心","薄板的面积大小","薄板的颜色"],"a":0,"why":"悬挂静止时重力作用线通过悬点，换一个悬点再画一条，两线交点就是重心。"}]},"cnm_120":{"core":["能够完全重合的两个图形叫全等图形，认识全等三角形的对应顶点、对应边、对应角及“≌”的记法"],"trap":"写全等式时对应顶点字母要放在对应位置；全等三角形对应边、对应角分别相等。","quiz":[{"q":"关于全等图形，下列说法正确的是","o":["能够完全重合，形状和大小都相同","只要形状相同即可","只要面积相等即可"],"a":0,"why":"全等要求形状与大小都相同；形状相同、大小不同是相似。"}]},"cnm_121":{"core":["全等三角形的对应边相等、对应角相等"],"trap":"找对应元素可看公共边、公共角、对顶角，或直接按全等式的字母顺序。","quiz":[{"q":"若 △ABC ≌ △DEF，下列对应正确的是","o":["AB = DE，∠A = ∠D","AB = EF","∠B = ∠F"],"a":0,"why":"按字母顺序对应：A↔D、B↔E、C↔F，故 AB↔DE、∠A↔∠D。"}]},"cnm_122":{"core":["三边分别相等的两个三角形全等"],"trap":"SSS 是唯一只靠「边」的判定；必须三组边都对应相等。","quiz":[{"q":"三边分别对应相等的两个三角形全等，简写为","o":["SSS","SAS","ASA"],"a":0,"why":"SSS（边边边）；三边确定则三角形形状大小唯一，这也是三角形具有稳定性的原因。"}]},"cnm_123":{"core":["两边及其夹角分别相等的两个三角形全等"],"trap":"SSA 不能判定全等，是最高频陷阱；写证明时先说明这个角是夹角。","quiz":[{"q":"SAS 中的「A」必须是","o":["两组对应边的夹角","任意一组角","其中一边的对角"],"a":0,"why":"必须是两边的夹角；若是其中一边的对角（SSA），不能保证全等。"}]},"cnm_124":{"core":["两角及其夹边分别相等，或两角及其中一角的对边分别相等的两个三角形全等"],"trap":"AAA 只能判相似、不能判全等；所有全等判定里都必须至少含一组边。","quiz":[{"q":"两角及其中一角的对边对应相等，判定全等的依据是","o":["AAS","ASA","SSS"],"a":0,"why":"两角与夹边是 ASA，两角与其中一角的对边是 AAS；AAS 可由内角和推出第三角后转成 ASA。"}]},"cnm_125":{"core":["斜边和一条直角边分别相等的两个直角三角形全等"],"trap":"用 HL 前必须先说明两三角形都是直角三角形，并指明哪条是斜边。","quiz":[{"q":"HL 判定适用于","o":["两个直角三角形，斜边和一条直角边对应相等","任意两个三角形","两个锐角三角形"],"a":0,"why":"HL（斜边、直角边）只适用于直角三角形，本质可由勾股定理配合 SSS 得到。"}]},"cnm_126":{"core":["根据已知条件选择合适的判定方法，补全条件并规范书写证明"],"trap":"书写顺序：准备条件 → 判定全等 → 由全等得对应边/角相等，不要跳步。","quiz":[{"q":"证明两个三角形全等之前，通常先要","o":["找齐三个条件（至少含一组边）并确认对应关系","直接写出全等结论","先用量角器量角"],"a":0,"why":"先把已知、公共边、公共角、对顶角等条件整理齐，再选择合适的判定方法。"}]},"cnm_127":{"core":["用圆规和无刻度直尺作一个角等于已知角以及作已知角的平分线，作图依据是 SSS"],"trap":"尺规作图只用无刻度直尺和圆规，要保留作图痕迹并写出作法。","quiz":[{"q":"尺规作「一个角等于已知角」，其原理是","o":["用圆规截取等长线段，构造 SSS 全等从而对应角相等","只用量角器量出度数","只画一条射线"],"a":0,"why":"两次截取等长线段构造出三边对应相等的两个三角形，由 SSS 得对应角相等。"}]},"cnm_128":{"core":["角平分线上的点到角两边的距离相等"],"trap":"用性质时必须从该点向两边各作一条垂线；不是到顶点的距离。","quiz":[{"q":"角平分线上的点到","o":["角的两边的距离相等","角的顶点距离相等","两边中点距离相等"],"a":0,"why":"性质定理：角平分线上的点到角两边的距离相等，这里的「距离」指垂线段的长度。"}]},"cnm_129":{"core":["角的内部到角两边距离相等的点在角的平分线上"],"trap":"性质与判定互为逆命题、方向别用反；三角形三条角平分线交于一点，该点到三边距离相等。","quiz":[{"q":"在角的内部，到角两边距离相等的点在","o":["这个角的平分线上","角的一边上","无法确定位置"],"a":0,"why":"这是角平分线性质的逆命题（判定定理），前提要点在角的内部。"}]},"cnm_130":{"core":["掌握倍长中线、截长补短、旋转型全等等构造全等三角形的常见方法"],"trap":"常见模型：公共边、公共角、对顶角、倍长中线、截长补短；加辅助线前先想清要凑哪个判定。","quiz":[{"q":"要证明两条线段相等，最常用的思路是","o":["找（或构造）分别以这两条线段为对应边的全等三角形","直接用尺子量长度","只比较两个图形的外观"],"a":0,"why":"先证两条线段所在的两个三角形全等，再由对应边相等得出结论。"}]},"cnm_131":{"core":["一个图形沿一条直线折叠两侧能重合是轴对称图形，两个图形沿直线折叠重合叫成轴对称，认识对称轴与对称点"],"trap":"对称轴是一条直线不是线段；正方形有 4 条对称轴，圆有无数条。","quiz":[{"q":"关于轴对称，下列说法正确的是","o":["轴对称图形指一个图形自身沿某直线对折重合；两个图形成轴对称指两个图形关于某直线对折重合","两者完全是一回事","轴对称图形必须由两个图形组成"],"a":0,"why":"前者说的是「一个图形」，后者说的是「两个图形」；把成轴对称的两个图形看作整体，它也是轴对称图形。"}]},"cnm_132":{"core":["成轴对称的两个图形全等，对称点连线被对称轴垂直平分"],"trap":"若两点的连线被某直线垂直平分，这两点就关于该直线对称。","quiz":[{"q":"关于轴对称的性质，正确的是","o":["对称轴垂直平分任意一对对应点所连的线段","对应线段互相垂直","对应点连线与对称轴平行"],"a":0,"why":"对称轴是任何一对对应点连线的垂直平分线；对应线段、对应角分别相等。"}]},"cnm_133":{"core":["线段垂直平分线上的点到线段两端距离相等","到线段两端距离相等的点在垂直平分线上"],"trap":"三角形三边垂直平分线交于外心，外心到三个顶点距离相等。","quiz":[{"q":"线段垂直平分线上的点","o":["到线段两个端点的距离相等","到两端点距离之和最小","一定与线段中点重合"],"a":0,"why":"性质：到两端点距离相等；逆命题（判定）：到两端点距离相等的点在这条垂直平分线上。"}]},"cnm_134":{"core":["用尺规作线段的垂直平分线及确定线段的中点"],"trap":"半径必须大于 AB 的一半，否则两弧不相交；作图痕迹要保留。","quiz":[{"q":"尺规作线段 AB 的垂直平分线，正确作法是","o":["分别以 A、B 为圆心、取大于 AB 一半的相同半径画弧，连接两弧交点","量出中点后随手画一条垂线","只以 A 为圆心任取半径画弧"],"a":0,"why":"两弧交点到 A、B 距离相等，由判定知它们在垂直平分线上，两点确定一条直线。"}]},"cnm_135":{"core":["根据对称轴作出已知图形的轴对称图形，关键是作出关键点的对称点"],"trap":"若某个关键点恰好在对称轴上，它的对称点就是它本身。","quiz":[{"q":"画一个图形关于直线 l 的对称图形，关键是","o":["作出各关键点关于 l 的对称点，再顺次连接","把图形整体平移","把图形旋转 180°"],"a":0,"why":"对顶点等关键点逐个作垂线、延长等长得到对称点，再按原顺序连接。"}]},"cnm_136":{"core":["点 (a,b) 关于 x 轴对称点为 (a,-b)，关于 y 轴对称点为 (-a,b)"],"trap":"口诀「关于谁对称，谁不变」：关于 x 轴 x 不变，关于 y 轴 y 不变。","quiz":[{"q":"点 (3, −2) 关于 x 轴对称的点是","o":["(3, 2)","(−3, −2)","(−3, 2)"],"a":0,"why":"关于 x 轴对称：横坐标不变、纵坐标变为相反数；关于 y 轴对称则相反。"}]},"cnm_137":{"core":["等腰三角形两底角相等，顶角平分线、底边中线、底边上的高互相重合（三线合一）"],"trap":"「等边对等角」与「三线合一」（顶角平分线、底边中线、底边高重合）；用三线合一前先说明是等腰三角形。","quiz":[{"q":"等腰三角形顶角为 40°，则一个底角是","o":["70°","40°","100°"],"a":0,"why":"两底角相等，(180° − 40°) ÷ 2 = 70°。"}]},"cnm_138":{"core":["有两个角相等的三角形是等腰三角形（等角对等边）"],"trap":"只有一个角是 60° 不足以判定等腰；「等腰 + 一个角 60°」才能推出等边。","quiz":[{"q":"判定一个三角形是等腰三角形，可用","o":["有两个角相等（等角对等边）","有两条高相等","有一个角是 60°"],"a":0,"why":"「等角对等边」：两角相等则其所对的边相等。"}]},"cnm_139":{"core":["等边三角形三边相等、三角均为 60°","三边相等、三角相等或有一个角为 60° 的等腰三角形是等边三角形"],"trap":"等边三角形有 3 条对称轴，是特殊的等腰三角形。","quiz":[{"q":"等边三角形每个内角是","o":["60°","90°","45°"],"a":0,"why":"三边相等则三角相等，180° ÷ 3 = 60°；判定可用三边相等、三角相等，或有一个角为 60° 的等腰三角形。"}]},"cnm_140":{"core":["直角三角形中 30° 角所对的直角边等于斜边的一半"],"trap":"前提是「直角三角形」且角为 30°；反过来，直角边等于斜边一半时，它所对的角是 30°。","quiz":[{"q":"在直角三角形中，30° 角所对的直角边等于","o":["斜边的一半","斜边","另一直角边的一半"],"a":0,"why":"可由等边三角形沿高分割成两个 30°-60°-90° 直角三角形得到。"}]},"cnm_141":{"core":["利用轴对称把折线转化为线段，解决“将军饮马”等最短路径问题"],"trap":"依据：对称点到对应点距离相等 + 两点之间线段最短；结论要说明取等条件。","quiz":[{"q":"「将军饮马」类最短路径问题，常用方法是","o":["作某点关于直线的对称点，把折线转化为两点间线段","直接把两点连起来","作角平分线"],"a":0,"why":"利用轴对称把折线段换成等长的直线段，再用「两点之间线段最短」求解。"}]},"cnm_142":{"core":["aᵐ·aⁿ=aᵐ⁺ⁿ（m、n 为正整数），即底数不变、指数相加"],"trap":"底数必须相同才能相加指数；a³ + a⁴ 不是同类项，不能合并成 a⁷。","quiz":[{"q":"a³ · a⁴ 的结果是","o":["a⁷","a¹²","2a⁷"],"a":0,"why":"同底数幂相乘，底数不变、指数相加：3 + 4 = 7。"}]},"cnm_143":{"core":["(aᵐ)ⁿ=aᵐⁿ，(ab)ⁿ=aⁿbⁿ"],"trap":"区分「同底数幂相乘（指数相加）」与「幂的乘方（指数相乘）」；积的乘方别漏掉系数。","quiz":[{"q":"(a³)² 的结果是","o":["a⁶","a⁵","a⁹"],"a":0,"why":"幂的乘方：底数不变、指数相乘 3×2 = 6；积的乘方 (ab)ⁿ = aⁿbⁿ，每个因式都要乘方。"}]},"cnm_144":{"core":["系数相乘、同底数幂相乘，只在一个单项式里出现的字母连同指数作为积的因式"],"trap":"只出现在某一个单项式里的字母，要连同它的指数照抄进结果。","quiz":[{"q":"2x² · 3x³ 的结果是","o":["6x⁵","6x⁶","5x⁵"],"a":0,"why":"系数相乘 2×3 = 6，同底数幂相乘 x²·x³ = x⁵。"}]},"cnm_145":{"core":["用分配律把单项式乘以多项式的每一项，再把积相加"],"trap":"别漏乘常数项；单项式为负时括号内各项都要变号。","quiz":[{"q":"2x(x − 3) 的结果是","o":["2x² − 6x","2x² − 3","2x² − 6"],"a":0,"why":"用分配律乘遍每一项：2x·x − 2x·3 = 2x² − 6x。"}]},"cnm_146":{"core":["用一个多项式的每一项乘另一个多项式的每一项，再把积相加"],"trap":"用一个多项式的每一项分别乘另一个多项式的每一项，别漏项，最后合并同类项。","quiz":[{"q":"(x + 2)(x + 3) 的结果是","o":["x² + 5x + 6","x² + 6","x² + 6x + 6"],"a":0,"why":"逐项相乘：x² + 3x + 2x + 6，合并同类项得 x² + 5x + 6。"}]},"cnm_147":{"core":["(a+b)(a-b)=a²-b²，抓住“相同项”与“相反项”"],"trap":"适用条件是「一项完全相同、另一项互为相反数」；第三个选项是差的完全平方公式。","quiz":[{"q":"(a + b)(a − b) 的结果是","o":["a² − b²","a² + b²","a² − 2ab + b²"],"a":0,"why":"平方差公式：两数和乘两数差，等于这两数的平方差。"}]},"cnm_148":{"core":["(a±b)²=a²±2ab+b²，可用图形面积解释"],"trap":"最常犯的错是写成 a² + b²；遇到 (−a−b)² 先提出负号再套公式。","quiz":[{"q":"(a + b)² 的结果是","o":["a² + 2ab + b²","a² + b²","a² − 2ab + b²"],"a":0,"why":"完全平方和公式；差的公式是 a² − 2ab + b²，中间项 2ab 不能漏。"}]},"cnm_149":{"core":["综合运用乘法公式、添括号与整式混合运算，化简求值"],"trap":"先分别套公式再合并；括号前是负号时，去括号各项都要变号。","quiz":[{"q":"化简 (x + 1)² − (x + 1)(x − 1)，结果是","o":["2x + 2","2","2x"],"a":0,"why":"(x² + 2x + 1) − (x² − 1) = 2x + 2。"}]},"cnm_150":{"core":["把一个多项式化为几个整式的积叫因式分解，它与整式乘法互为逆运算"],"trap":"结果里若某个括号内还能继续分解，就说明没做完；每个因式必须是整式。","quiz":[{"q":"因式分解是把一个多项式","o":["化成几个整式的积的形式","化成几个整式的和","展开成更长的多项式"],"a":0,"why":"因式分解与整式乘法互为逆变形，结果必须是「积」，且每个因式都要分解到不能再分。"}]},"cnm_151":{"core":["找出各项的公因式（系数的最大公约数与相同字母最低次幂），提到括号外"],"trap":"提公因式后括号内的项数与原式相同，别漏掉常数项 1；首项为负时通常先提负号。","quiz":[{"q":"分解 6x² + 3x，应提取的公因式是","o":["3x","3","x²"],"a":0,"why":"系数取最大公约数 3，字母取共有字母的最低次幂 x，得 3x(2x + 1)。"}]},"cnm_152":{"core":["a²-b²=(a+b)(a-b)，把符合平方差结构的多项式因式分解"],"trap":"先确认「两项、符号相反、都能写成平方」；分解完检查每个因式能否继续分解。","quiz":[{"q":"分解 x² − 9，结果是","o":["(x + 3)(x − 3)","(x − 3)²","(x + 3)²"],"a":0,"why":"x² − 9 = x² − 3²，套平方差公式即得。"}]},"cnm_153":{"core":["a²±2ab+b²=(a±b)²，识别完全平方式"],"trap":"先核对中间项是否等于两数乘积的 2 倍，符号决定用「和」还是「差」的公式。","quiz":[{"q":"分解 x² + 6x + 9，结果是","o":["(x + 3)²","(x + 9)²","(x + 3)(x − 3)"],"a":0,"why":"9 = 3²，6x = 2·x·3，符合完全平方和公式。"}]},"cnm_154":{"core":["一般先提公因式，再用公式，直至不能再分解"],"trap":"顺序口诀「一提（公因式）、二套（公式）、三检查」，检查每个因式是否还能再分。","quiz":[{"q":"分解 2x² − 8，正确步骤是","o":["先提 2，再用平方差得 2(x+2)(x−2)","写成 (2x+4)(x−2) 就结束","无法分解"],"a":0,"why":"先提公因式 2 得 2(x² − 4)，再套平方差公式；必须分解到底。"}]},"cnm_155":{"core":["利用因式分解简化计算、求值、判断整除或化简代数式"],"trap":"看到平方差或可提公因式，先别硬算；因式分解也常用于化简求值、解方程与整除判断。","quiz":[{"q":"简便计算 99² − 1，最合适的方法是","o":["用平方差：(99+1)(99−1) = 100×98 = 9800","直接算 99×99","套完全平方公式"],"a":0,"why":"99² − 1 = 99² − 1² = (99+1)(99−1) = 9800。"}]},"cnm_156":{"core":["形如 A/B（A、B 为整式且 B 含字母）的式子叫分式，分母不为 0 时分式有意义，分子为 0 且分母不为 0 时值为 0"],"trap":"分式有意义的条件是分母 ≠ 0；分式值为 0 要同时满足分子 = 0 且分母 ≠ 0。","quiz":[{"q":"下列是分式的是","o":["2/(x − 1)","x/2","(x + 1)/3"],"a":0,"why":"分母中含有字母的式子叫分式；后两个分母是常数，属于整式。"}]},"cnm_157":{"core":["分式的分子分母同乘（除以）同一个不为 0 的整式，分式值不变"],"trap":"是「乘除」不是「加减」；同时改变分子、分母或分式本身的符号时要按规则成对处理。","quiz":[{"q":"分式的基本性质是","o":["分子分母同乘（或同除）同一个不为 0 的整式，分式值不变","分子分母同加同一个数，值不变","分子分母同乘 0 也可以"],"a":0,"why":"乘或除的那个整式必须不为 0；这是约分与通分的共同依据。"}]},"cnm_158":{"core":["把分子分母的公因式约去，化为最简分式，必要时先因式分解"],"trap":"约分前必须先把分子分母因式分解；约去的因式不能为 0，所以要注明取值限制。","quiz":[{"q":"化简 (x² − 1)/(x + 1)（x ≠ −1）得","o":["x − 1","x + 1","1"],"a":0,"why":"分子分解为 (x+1)(x−1)，约去公因式 x+1，得 x − 1。"}]},"cnm_159":{"core":["把异分母分式化为同分母分式，需要确定最简公分母"],"trap":"分母是多项式时先因式分解再找公分母；通分后分子也要乘上相应因式。","quiz":[{"q":"分式通分的关键是确定","o":["各分母的最简公分母","分子的最小公倍数","随便取一个分母"],"a":0,"why":"系数取各分母系数的最小公倍数，字母取所有因式的最高次幂。"}]},"cnm_160":{"core":["分式相乘分子乘分子、分母乘分母","除以分式等于乘它的倒数，乘除后要约分"],"trap":"先把除法统一成乘法再约分；结果要化成最简，且字母取值不能使任何分母为 0。","quiz":[{"q":"(a/b) ÷ (c/d) 等于","o":["ad/(bc)","ac/(bd)","ab/(cd)"],"a":0,"why":"除以一个分式等于乘它的倒数：(a/b)×(d/c) = ad/(bc)。"}]},"cnm_161":{"core":["同分母分式相加减分母不变，异分母先通分","结果化为最简"],"trap":"分子是多项式时先整体加括号再合并，避免符号错；结果要约成最简。","quiz":[{"q":"同分母分式相加的法则是","o":["分母不变，分子相加","分子分母分别相加","分母相加、分子不变"],"a":0,"why":"同分母：分母不变、分子相加；异分母要先通分再按同分母计算。"}]},"cnm_162":{"core":["按先乘方、再乘除、后加减、有括号先算括号的顺序进行混合运算，并化简求值"],"trap":"使分母为 0 的值不能取，这是化简求值题最经典的陷阱。","quiz":[{"q":"分式化简求值的合理顺序是","o":["先化简到最简，再代入使原式有意义的值","先代入数值再化简","随便代入一个数即可"],"a":0,"why":"先化简再代入计算量小；但代入的值必须让原分式及过程中所有分母都有意义。"}]},"cnm_163":{"core":["aᵐ÷aⁿ=aᵐ⁻ⁿ（a≠0，m>n），底数不变、指数相减"],"trap":"底数不能为 0；指数相减可能得到 0 或负数，对应零指数幂与负整数指数幂。","quiz":[{"q":"a⁵ ÷ a²（a ≠ 0）的结果是","o":["a³","a¹⁰","a⁷"],"a":0,"why":"同底数幂相除，底数不变、指数相减：5 − 2 = 3。"}]},"cnm_164":{"core":["a⁰=1（a≠0），a⁻ⁿ=1/aⁿ，并用 a×10⁻ⁿ 表示绝对值较小的数"],"trap":"负指数不表示负数，表示「取倒数」；0 的 0 次幂和 0 的负整数次幂都没有意义。","quiz":[{"q":"2⁻² 的值是","o":["1/4","−4","4"],"a":0,"why":"a⁻ᵖ = 1/aᵖ（a ≠ 0），所以 2⁻² = 1/4；任何非零数的 0 次幂等于 1。"}]},"cnm_165":{"core":["分母中含未知数的方程叫分式方程，去分母化为整式方程求解，必须检验是否为增根"],"trap":"去分母要乘遍每一项（不含分母的项也要乘）；增根不是算错，而是变形时额外产生的根。","quiz":[{"q":"解分式方程最后必须","o":["检验：把解代入最简公分母，为 0 则是增根要舍去","直接写出答案","只验算分子是否为 0"],"a":0,"why":"去分母时两边同乘了可能为 0 的整式，会引入使原分母为 0 的增根，必须检验。"}]},"cnm_166":{"core":["用分式方程解决工程、行程、销售等问题，求解后检验并写出答案"],"trap":"常见类型：行程（时间差）、工程（效率）、销售；作答别忘写「经检验」。","quiz":[{"q":"用分式方程解应用题，检验时应当","o":["既检验是否为增根，又检验结果是否符合实际意义","只检验计算过程","不需要检验"],"a":0,"why":"双重检验：分母不为 0（数学上成立）＋ 结果符合实际（速度为正、人数为整数等）。"}]},"cnm_167":{"core":["形如 √a（a≥0）的式子叫二次根式，被开方数必须非负"],"trap":"被开方数 ≥ 0（不是 > 0）；若式子在分母上还需额外排除使分母为 0 的值。","quiz":[{"q":"二次根式 √(x − 2) 有意义的条件是","o":["x ≥ 2","x > 2","x ≤ 2"],"a":0,"why":"被开方数必须非负：x − 2 ≥ 0，即 x ≥ 2；等于 0 时 √0 = 0 仍有意义。"}]},"cnm_168":{"core":["(√a)²=a（a≥0），√(a²)=|a|"],"trap":"两个常用性质：(√a)² = a（a≥0）与 √(a²) = |a|，前者要求 a 非负，后者对任意实数成立。","quiz":[{"q":"√(a²)（a 为任意实数）等于","o":["|a|","a","−a"],"a":0,"why":"算术平方根的结果非负，所以 √(a²) = |a|；当 a < 0 时结果是 −a 而不是 a。"}]},"cnm_169":{"core":["√a·√b=√(ab)（a≥0，b≥0），可逆用化简"],"trap":"二次根式相乘：√a·√b = √(ab)（a、b 均非负），结果要化成最简二次根式。","quiz":[{"q":"√2 × √8 的结果是","o":["4","2√2","16"],"a":0,"why":"√2 × √8 = √16 = 4；也可先化简 √8 = 2√2，再得 √2 × 2√2 = 4。"}]},"cnm_170":{"core":["√a÷√b=√(a/b)（a≥0，b>0）"],"trap":"√a ÷ √b = √(a/b)（a≥0、b>0）；分母不能为 0。","quiz":[{"q":"√18 ÷ √2 的结果是","o":["3","9","√3"],"a":0,"why":"√18 ÷ √2 = √9 = 3；结果必须化成最简，写成 √9 不算做完。"}]},"cnm_171":{"core":["被开方数不含能开尽方的因数或因式、也不含分母的二次根式是最简二次根式，会化简并有理化分母"],"trap":"分母有理化常用乘共轭因式；判断能否化简先看被开方数里有没有完全平方数因子。","quiz":[{"q":"下列是最简二次根式的是","o":["√3","√8","√(1/2)"],"a":0,"why":"最简要求：被开方数不含能开得尽方的因数、且不含分母；√8 = 2√2、√(1/2) = √2/2 都还可化简。"}]},"cnm_172":{"core":["先化为最简二次根式，再合并被开方数相同的根式（类似合并同类项）"],"trap":"只有被开方数相同的二次根式才能合并；先化简、再合并，步骤不能颠倒。","quiz":[{"q":"√8 + √2 化简后是","o":["3√2","√10","2√2"],"a":0,"why":"先把 √8 化为 2√2，再与 √2 合并：2√2 + √2 = 3√2。"}]},"cnm_173":{"core":["综合运用二次根式的四则运算与乘法公式"],"trap":"二次根式混合运算顺序与实数相同，乘法公式照样适用；结果要化为最简。","quiz":[{"q":"计算 (√3 + 1)(√3 − 1) 的结果是","o":["2","3","4"],"a":0,"why":"套平方差公式：(√3)² − 1² = 3 − 1 = 2。"}]},"cnm_174":{"core":["直角三角形两直角边的平方和等于斜边的平方：a²+b²=c²"],"trap":"斜边必须是直角所对的最长边；已知两边求第三边时要先确认哪条是斜边。","quiz":[{"q":"直角三角形两直角边分别为 3 和 4，斜边长是","o":["5","7","√7"],"a":0,"why":"勾股定理 a² + b² = c²：9 + 16 = 25，c = 5。"}]},"cnm_175":{"core":["通过拼图和面积关系（如赵爽弦图）证明勾股定理"],"trap":"面积法的核心是同一个图形用两种方式表示面积，再令两式相等化简。","quiz":[{"q":"勾股定理的常见证明思路是","o":["用面积法：把四个全等直角三角形拼成正方形，比较两种面积表达","用量角器量角","用相似三角形平移"],"a":0,"why":"赵爽弦图等面积法通过「大正方形面积 = 4 个三角形 + 小正方形」推出 a²+b²=c²。"}]},"cnm_176":{"core":["用勾股定理解决梯子、折叠、最短路径等实际问题"],"trap":"实际应用先把情境抽象成直角三角形，标清直角与斜边，再代入勾股定理。","quiz":[{"q":"一架 5 m 长的梯子斜靠墙，底端离墙 3 m，梯顶到地面的高度是","o":["4 m","2 m","√34 m"],"a":0,"why":"墙、地面、梯子构成直角三角形，斜边 5：h = √(25 − 9) = 4 m。"}]},"cnm_177":{"core":["如果三角形三边满足 a²+b²=c²，那么它是直角三角形，满足的三个正整数叫勾股数"],"trap":"只需检验「两较小边的平方和 = 最大边的平方」；满足则为直角三角形，且最大边所对角是直角。","quiz":[{"q":"下列三条边能构成直角三角形的是","o":["5，12，13","2，3，4","4，5，6"],"a":0,"why":"勾股定理逆定理：5²+12² = 169 = 13² 成立；另两组不满足两小边平方和等于最大边平方。"}]},"cnm_178":{"core":["在实际问题（方向、距离）中用逆定理判断垂直关系并求值"],"trap":"若 a²+b² < c² 为钝角三角形，> c² 为锐角三角形（c 为最长边）。","quiz":[{"q":"用勾股定理逆定理判断形状时，应先","o":["找出最长边并计算它的平方，再看另两边平方和是否相等","任意取两边平方相加","直接用量角器"],"a":0,"why":"先确定最长边（可能的斜边），再验证 a² + b² 是否等于 c²。"}]},"cnm_179":{"core":["借助直角三角形斜边在数轴上作出 √2、√5 等对应的点"],"trap":"关键是把无理数写成「两个平方数之和的算术平方根」，再构造直角三角形。","quiz":[{"q":"在数轴上作出表示 √5 的点，常用的方法是","o":["作两直角边分别为 1 和 2 的直角三角形，其斜边即 √5，再用圆规截取到数轴上","直接估一个位置","把 √5 四舍五入成 2.2"],"a":0,"why":"由勾股定理 √(1²+2²) = √5，用圆规把斜边长度转移到数轴上，实现无理数的几何表示。"}]},"cnm_180":{"core":["认识多边形的边、顶点、内角、外角、对角线及正多边形，知道 n 边形从一个顶点出发可引 n-3 条对角线"],"trap":"从一个顶点引对角线可把 n 边形分成 n − 2 个三角形，这正是内角和公式的来源。","quiz":[{"q":"从 n 边形一个顶点出发可引出的对角线条数是","o":["n − 3","n − 2","n"],"a":0,"why":"不能连自己及相邻两个顶点，故为 n − 3 条；n 边形对角线总数为 n(n−3)/2。"}]},"cnm_181":{"core":["n 边形内角和为 (n-2)×180°，可通过分割成三角形推导"],"trap":"正 n 边形每个内角 = (n−2)×180°/n；注意内角和随边数增加而增大。","quiz":[{"q":"n 边形的内角和公式是","o":["(n − 2)×180°","n×180°","(n − 1)×180°"],"a":0,"why":"从一个顶点引对角线分成 n−2 个三角形，每个三角形内角和 180°。"}]},"cnm_182":{"core":["任意多边形的外角和为 360°"],"trap":"外角和是常数，内角和随 n 变化——这一对比是高频考点。","quiz":[{"q":"任意多边形的外角和等于","o":["360°","180°","(n−2)×180°"],"a":0,"why":"外角和恒为 360°，与边数无关；正 n 边形每个外角 = 360°/n。"}]},"cnm_183":{"core":["平行四边形对边平行且相等、对角相等、对角线互相平分"],"trap":"平行四边形是中心对称图形，对称中心是两条对角线的交点。","quiz":[{"q":"关于平行四边形的性质，正确的是","o":["对边平行且相等、对角相等、对角线互相平分","四个角都是直角","对角线相等"],"a":0,"why":"对角线相等是矩形的性质；四角为直角也是矩形，一般平行四边形不具备。"}]},"cnm_184":{"core":["两组对边分别平行（相等）、一组对边平行且相等、对角线互相平分、两组对角分别相等的四边形是平行四边形"],"trap":"「一组对边平行、另一组对边相等」可能是等腰梯形，不能判定；对角线相等也不够。","quiz":[{"q":"下列条件能判定一个四边形是平行四边形的是","o":["两组对边分别相等","一组对边平行、另一组对边相等","对角线相等"],"a":0,"why":"常用判定：两组对边分别平行 / 分别相等、一组对边平行且相等、对角线互相平分。"}]},"cnm_185":{"core":["三角形的中位线平行于第三边且等于第三边的一半"],"trap":"中位线（两边中点连线）与中线（顶点到对边中点）是两条不同的线段，别混。","quiz":[{"q":"三角形中位线的性质是","o":["平行于第三边，且等于第三边的一半","等于第三边","垂直于第三边"],"a":0,"why":"连接两边中点的线段叫中位线，它平行于第三边且长度为第三边的一半。"}]},"cnm_186":{"core":["矩形的四个角都是直角，对角线相等且互相平分"],"trap":"矩形既是轴对称图形又是中心对称图形；判定常用「三个角是直角」或「对角线相等的平行四边形」。","quiz":[{"q":"矩形具有而一般平行四边形不一定具有的性质是","o":["四个角都是直角、对角线相等","对边平行且相等","对角线互相平分"],"a":0,"why":"矩形是有一个角为直角的平行四边形，因此四角皆直角、对角线相等；后两条是平行四边形共有性质。"}]},"cnm_187":{"core":["直角三角形斜边上的中线等于斜边的一半"],"trap":"它把直角三角形分成两个等腰三角形，常用于求角和线段；前提是直角且中线在斜边上。","quiz":[{"q":"直角三角形斜边上的中线等于","o":["斜边的一半","斜边","一条直角边"],"a":0,"why":"斜边中线等于斜边的一半，可由「矩形对角线相等且互相平分」推出。"}]},"cnm_188":{"core":["有一个角是直角的平行四边形、对角线相等的平行四边形、有三个角是直角的四边形是矩形"],"trap":"「对角线互相垂直」是菱形的判定方向，别用来判矩形。","quiz":[{"q":"判定一个平行四边形是矩形，可用","o":["有一个角是直角","有一组邻边相等","对角线互相垂直"],"a":0,"why":"定义法：有一个角是直角的平行四边形是矩形；也可用「对角线相等的平行四边形」。"}]},"cnm_189":{"core":["菱形四边相等，对角线互相垂直平分且平分每组对角，面积等于对角线乘积的一半"],"trap":"菱形面积 = 底×高，也等于两条对角线乘积的一半。","quiz":[{"q":"关于菱形的性质，正确的是","o":["四条边都相等、对角线互相垂直且平分每组对角","四个角都是直角","对角线相等"],"a":0,"why":"菱形是有一组邻边相等的平行四边形；四角为直角、对角线相等都是矩形的性质。"}]},"cnm_190":{"core":["四边相等的四边形、对角线互相垂直的平行四边形、一组邻边相等的平行四边形是菱形"],"trap":"有一个直角、对角线相等都指向矩形；判定时先确认「已知是平行四边形」。","quiz":[{"q":"判定一个平行四边形是菱形，可用","o":["有一组邻边相等","有一个角是直角","对角线相等"],"a":0,"why":"定义法：有一组邻边相等的平行四边形是菱形；也可用「对角线互相垂直的平行四边形」。"}]},"cnm_191":{"core":["正方形兼有矩形和菱形的性质，会判定正方形并梳理平行四边形、矩形、菱形、正方形的包含关系"],"trap":"判定思路：先证是矩形再证邻边相等，或先证是菱形再证有一个直角。","quiz":[{"q":"正方形具备的性质是","o":["兼有矩形和菱形的所有性质","只具备矩形的性质","只具备菱形的性质"],"a":0,"why":"正方形 = 有一个直角且有一组邻边相等的平行四边形，四边相等、四角直角、对角线相等且垂直平分。"}]},"cnm_192":{"core":["在矩形、菱形、正方形背景中处理折叠、动点，利用全等、勾股定理建立方程"],"trap":"动点、折叠题的固定套路：设一条线段为 x，用相等关系把其他量表示出来，再在直角三角形里用勾股定理列方程。","quiz":[{"q":"四边形中的折叠问题，主要利用","o":["折叠前后图形全等，对应线段和对应角相等","面积一定变大","所有角都变成直角"],"a":0,"why":"折叠即轴对称，折痕是对称轴；常配合勾股定理设未知数列方程求线段。"}]},"cnm_193":{"core":["在变化过程中取不同值的量是变量，取值不变的量是常量"],"trap":"同一个量在不同过程中角色可能改变；先说清「在哪个过程中」再判断变量与常量。","quiz":[{"q":"在某一变化过程中，「变量」是指","o":["数值会发生变化的量","数值始终不变的量","只能是时间"],"a":0,"why":"数值变化的量叫变量，数值不变的量叫常量；两者要放在同一个变化过程中讨论。"}]},"cnm_194":{"core":["如果一个变化过程中有两个变量 x、y，对于 x 的每一个确定的值，y 都有唯一确定的值与之对应，那么 y 是 x 的函数"],"trap":"判断是否为函数关系，看给定 x 后 y 是否唯一；如 y² = x（x>0）中一个 x 对应两个 y，就不是 y 关于 x 的函数。","quiz":[{"q":"函数的定义是","o":["在一个变化过程中，对于 x 的每一个值，y 都有唯一确定的值与其对应","x 与 y 只要有关联即可","y 可以对应多个值"],"a":0,"why":"关键是「唯一确定」：一个自变量取值只能对应一个函数值。"}]},"cnm_195":{"core":["根据分母不为 0、被开方数非负及实际意义确定自变量的取值范围"],"trap":"两个限制同时出现时要取交集；实际问题的取值范围往往比纯代数范围更窄。","quiz":[{"q":"求自变量取值范围时，通常要考虑","o":["分母不为 0、二次根式被开方数非负，以及实际意义","只需考虑分母","只需考虑是不是整数"],"a":0,"why":"代数上排除使式子无意义的值，实际问题还要符合情境（如时间非负、人数取整数）。"}]},"cnm_196":{"core":["给定自变量的值，代入函数关系求对应的函数值"],"trap":"函数值就是把自变量代入解析式算出的 y；书写时写「当 x = 3 时，y = 5」。","quiz":[{"q":"已知函数 y = 2x − 1，当 x = 3 时函数值是","o":["5","6","4"],"a":0,"why":"把 x = 3 代入：2×3 − 1 = 5。"}]},"cnm_197":{"core":["用列表、描点、连线画函数图象，并从图象读取信息"],"trap":"判断一个点是否在图象上，把横坐标代入解析式，看算出的值是否等于纵坐标。","quiz":[{"q":"函数图象上的点与其对应关系是","o":["点的横坐标为自变量值、纵坐标为对应的函数值","横坐标是函数值","两者无对应关系"],"a":0,"why":"图象是所有满足函数关系的点组成的，点 (x, y) 中的 y 就是 x 对应的函数值。"}]},"cnm_198":{"core":["函数可用解析式、列表、图象表示，了解三者的优缺点与相互转换"],"trap":"同一函数可在三种表示间转换；做题时按需要选择最直观的一种。","quiz":[{"q":"函数的三种常用表示方法是","o":["解析式法、列表法、图象法","只有解析式法","文字法、口算法、估算法"],"a":0,"why":"三种方法各有优势：解析式便于计算，列表便于查值，图象便于看变化趋势。"}]},"cnm_199":{"core":["把实际问题中的变量关系写成函数解析式并分析其变化"],"trap":"读图还要关注交点、拐点、起点与终点，并结合实际含义解释，别只看形状。","quiz":[{"q":"用函数刻画实际变化规律时，图象的上升或下降表示","o":["函数值随自变量增大而增大或减小","自变量的正负","函数一定是一次函数"],"a":0,"why":"从左到右上升表示递增、下降表示递减；水平段表示函数值不变。"}]},"cnm_200":{"core":["形如 y=kx（k≠0）的函数是正比例函数，图象是过原点的直线"],"trap":"正比例函数是特殊的一次函数（b = 0）；k>0 过一、三象限，k<0 过二、四象限。","quiz":[{"q":"正比例函数 y = kx（k ≠ 0）的图象一定经过","o":["原点 (0, 0)","点 (1, 0)","点 (0, 1)"],"a":0,"why":"x = 0 时 y = 0，所以图象是过原点的一条直线；k 决定倾斜方向与陡缓。"}]},"cnm_201":{"core":["形如 y=kx+b（k≠0）的函数叫一次函数，正比例函数是 b=0 的特例"],"trap":"k ≠ 0 不能省；当 b = 0 时退化为正比例函数，仍属于一次函数。","quiz":[{"q":"下列是一次函数的是","o":["y = 2x + 3","y = 2/x","y = x² + 1"],"a":0,"why":"一次函数形如 y = kx + b（k ≠ 0），自变量次数为 1 且不在分母里。"}]},"cnm_202":{"core":["一次函数图象是一条直线，用两点法（常取与坐标轴交点）作图"],"trap":"取的两点相距远一些画得更准；b 就是图象与 y 轴交点的纵坐标。","quiz":[{"q":"画一次函数 y = kx + b 的图象，最简便的方法是","o":["取与两坐标轴的交点（或任取两点）连成直线","描出十几个点再连","只画一个点"],"a":0,"why":"两点确定一条直线，通常取 (0, b) 与 (−b/k, 0)，或取两个便于计算的整数点。"}]},"cnm_203":{"core":["k 决定增减性与倾斜方向，b 决定与 y 轴交点，据此判断图象经过的象限"],"trap":"b>0 交 y 轴正半轴、b<0 交负半轴；判断图象经过哪些象限要同时看 k 和 b。","quiz":[{"q":"一次函数 y = kx + b 中，当 k > 0 时","o":["y 随 x 的增大而增大","y 随 x 的增大而减小","图象一定过原点"],"a":0,"why":"k 决定增减性：k>0 递增、k<0 递减；b 决定与 y 轴的交点位置。"}]},"cnm_204":{"core":["直线 y=kx+b 向上（下）平移 m 个单位得 y=kx+b±m"],"trap":"口诀「上加下减（b）、左加右减（x）」；平移不改变 k，所以直线斜率不变。","quiz":[{"q":"把 y = 2x 的图象向上平移 3 个单位，得到","o":["y = 2x + 3","y = 2x − 3","y = 2(x + 3)"],"a":0,"why":"上下平移改常数项：上加下减；y = 2(x+3) 是向左平移 3 个单位。"}]},"cnm_205":{"core":["设 y=kx+b，由两点（或条件）列方程组求出 k、b"],"trap":"步骤：设 → 代 → 解 → 写回；若已知是正比例函数，只需一个非原点条件即可。","quiz":[{"q":"用待定系数法求一次函数解析式，一般需要","o":["设 y = kx + b，代入两个已知点的坐标解方程组","只需一个点的坐标","只需知道 k 的符号"],"a":0,"why":"两个待定系数需要两个独立条件，通常来自图象上两个点的坐标。"}]},"cnm_206":{"core":["方程 kx+b=0 的解就是函数 y=kx+b 的图象与 x 轴交点的横坐标"],"trap":"也可从「两个函数图象交点的横坐标 = 相应方程的解」这个角度理解。","quiz":[{"q":"一次函数 y = kx + b 与一元一次方程 kx + b = 0 的关系是","o":["方程的解就是图象与 x 轴交点的横坐标","方程的解是与 y 轴交点的纵坐标","两者没有关系"],"a":0,"why":"y = 0 时的 x 值即图象与 x 轴交点的横坐标，正是方程 kx+b=0 的解。"}]},"cnm_207":{"core":["不等式 kx+b>0 的解集是图象在 x 轴上方部分对应的 x 的范围"],"trap":"数形结合：先求与 x 轴交点，再根据 k 的正负判断哪一侧在上方。","quiz":[{"q":"用一次函数图象解不等式 kx + b > 0，应看","o":["图象位于 x 轴上方部分所对应的 x 取值范围","图象位于 x 轴下方的部分","图象与 y 轴的交点"],"a":0,"why":"kx+b > 0 即 y > 0，对应图象在 x 轴上方的那段，读出它的 x 范围即为解集。"}]},"cnm_208":{"core":["两个一次函数图象的交点坐标就是对应二元一次方程组的解"],"trap":"反过来，方程组的解对应两直线交点；两直线平行（无交点）时方程组无解。","quiz":[{"q":"两个一次函数图象的交点坐标，与相应的二元一次方程组的关系是","o":["交点坐标就是该方程组的解","交点横坐标是方程组的解","两者无关"],"a":0,"why":"交点同时满足两个函数解析式，其坐标 (x, y) 正是把两式联立成方程组的解。"}]},"cnm_209":{"core":["建立一次函数模型（含分段函数）解决收费、行程、方案选择等实际问题"],"trap":"分段函数常出现在计费、行程、收费问题里，要分段列式并逐段检验。","quiz":[{"q":"用一次函数解决实际问题时，最后要","o":["结合实际意义确定自变量的取值范围并解释结果","只要算出解析式就结束","把图象画得越复杂越好"],"a":0,"why":"实际问题中自变量常受限制（如数量非负、整数、上限），结论要回到情境中解释。"}]},"cnm_210":{"core":["探究弦长、频率、音高等量之间的数量关系，用函数思想描述音乐中的数学"],"trap":"综合实践的落脚点是「把实际现象翻译成数学关系」，结论要说明依据与适用范围。","quiz":[{"q":"「音乐与数学」这类综合实践，主要体现","o":["用函数、比例等数量关系刻画音高、节拍等规律","只需记住乐理名词","与数学无关"],"a":0,"why":"把音高与频率、节拍与时长等对应到数量关系，再用表格、图象或式子描述。"}]},"cnm_211":{"core":["理解平均数是反映一组数据集中趋势的统计量，会求算术平均数"],"trap":"平均数 = 数据总和 ÷ 数据个数；它易受极端值影响，别忘除以个数。","quiz":[{"q":"数据 2，4，6，8，10 的平均数是","o":["6","5","30"],"a":0,"why":"(2+4+6+8+10) ÷ 5 = 30 ÷ 5 = 6。"}]},"cnm_212":{"core":["各数据重要程度不同时按权重计算加权平均数"],"trap":"计算时用各数据乘对应权再求和，最后除以权之和；权之和为 1 时可直接相加。","quiz":[{"q":"加权平均数中「权」的作用是","o":["反映各数据的重要程度或出现次数","把所有数据变成一样","只用于排序"],"a":0,"why":"权越大，该数据对平均数的影响越大；常见权是频数、比例或百分比。"}]},"cnm_213":{"core":["中位数是数据排序后居中的数据（偶数个取中间两数的平均），众数是出现次数最多的数据"],"trap":"求中位数必须先排序；数据个数为偶数时取中间两个数的平均数；众数可以不唯一，也可以没有。","quiz":[{"q":"数据 3，5，5，7，9 的中位数与众数分别是","o":["5 和 5","5 和 7","6 和 5"],"a":0,"why":"已按从小到大排列，共 5 个数，中间第 3 个是 5；出现次数最多的是 5（两次）。"}]},"cnm_214":{"core":["根据数据特点和问题需要选择平均数、中位数或众数描述集中趋势"],"trap":"选择统计量要看目的：反映典型水平选中位数/众数，需要参与总量计算时用平均数。","quiz":[{"q":"数据中有极端偏大值时，描述集中趋势更适合用","o":["中位数","平均数","极差"],"a":0,"why":"平均数对极端值敏感，中位数更稳健；众数适合描述「最常出现」的类别。"}]},"cnm_215":{"core":["用极差、方差、标准差刻画数据的离散程度，方差越小数据越稳定"],"trap":"极差只看最大最小，易受极端值影响；标准差是方差的算术平方根，单位与原数据一致。","quiz":[{"q":"方差反映的是数据的","o":["波动（离散）程度","平均水平","最大值"],"a":0,"why":"方差是各数据与平均数差的平方的平均，越大说明数据越分散、越不稳定。"}]},"cnm_302":{"core":["总体太大无法全部调查时，用随机抽取的样本的平均数估计总体的平均数"],"trap":"结论是「估计值」，要写「约」；抽样方法要在结论里一并说明。","quiz":[{"q":"用样本平均数估计总体平均数的前提是","o":["样本具有代表性且是随机抽取的","样本越大就一定准确","只抽最容易测到的个体"],"a":0,"why":"估计是否可靠取决于样本的代表性，而不只是样本量；抽样偏差再大的样本也纠不回来。"}]},"cnm_303":{"core":["个别特别大或特别小的数据会明显拉动平均数，而中位数基本不受影响，据此判断哪个统计量更能代表一般水平"],"trap":"这正是「有极端值时用中位数描述典型水平」的原因；考试常结合工资、房价情境。","quiz":[{"q":"一组数据中加入一个远大于其余值的数，受影响最明显的是","o":["平均数","中位数","众数"],"a":0,"why":"极端值会明显拉高平均数，中位数和众数通常变化很小甚至不变。"}]},"cnm_304":{"core":["在平均数相同或相近时，通过比较方差（或标准差）判断哪组数据波动更小、更稳定，并据此决策"],"trap":"前提条件是两组数据的平均数接近、量纲相同；否则不能直接比较方差大小。","quiz":[{"q":"比较两组数据的稳定性，应看","o":["方差（或标准差），越小越稳定","平均数，越大越稳定","最大值"],"a":0,"why":"在平均水平相近时，方差小的一组波动小、更稳定。"}]},"cnm_306":{"core":["用随机抽取样本的方差估计总体数据的波动程度，如比较两批产品尺寸的稳定性"],"trap":"估计总有误差；抽样越随机、样本容量越合适，估计越可信。","quiz":[{"q":"用样本方差估计总体稳定性，属于","o":["用样本的特征量估计总体的相应特征量","精确计算总体","只描述样本本身"],"a":0,"why":"与用样本平均数估计总体平均数是同一套思想：以样本的统计量作为总体参数的估计。"}]},"cnm_216":{"core":["把数据分成四等份的三个分点叫四分位数，可用来描述数据的分布范围"],"trap":"求四分位数必须先排序；不同教材对位置取整的规定略有差异，以课本为准。","quiz":[{"q":"一组数据的四分位数把排序后的数据","o":["大致分成四等份","分成两等份","按频数分组"],"a":0,"why":"四分位数是第 25%、50%、75% 位置上的值，其中第 50% 就是中位数。"}]},"cnm_305":{"core":["用最小值、第一四分位数、中位数、第三四分位数、最大值画成的箱线图，读出数据的中心与分散情况并比较两组数据"],"trap":"箱子越长说明中间一半数据越分散；比较两组数据可看中位数位置与箱子长短。","quiz":[{"q":"读箱线图时，箱子的长度表示","o":["中间 50% 数据的分布范围（四分位距）","全部数据的范围","平均数大小"],"a":0,"why":"箱子两端是下、上四分位数，箱内中线是中位数；须线延伸到最小、最大值（或剔除异常值后）。"}]},"cnm_217":{"core":["把数据分组后用组中值估计平均数，体会分组对信息的保留与损失"],"trap":"结果是估计值，要写「约」；组距越小、分组越细，估计通常越接近真实平均数。","quiz":[{"q":"由分组数据估计平均数，通常用","o":["各组的组中值乘以该组频数，求和后再除以总数","每组的最大值相加","直接取中位数"],"a":0,"why":"组内具体数值未知，用组中值代表该组，做加权平均得到估计值。"}]},"cnm_218":{"core":["设计调查方案，收集学生体质数据，用统计量与统计图分析并提出建议"],"trap":"报告要写清样本来源、样本容量、所用统计量与结论的适用范围，别把样本结论说成全校事实。","quiz":[{"q":"开展「学生体质健康调查与分析」，合理的流程是","o":["明确指标 → 抽样收集数据 → 整理并计算统计量 → 作图比较 → 得出结论与建议","直接给结论","只测量一名同学"],"a":0,"why":"这是完整统计流程加「用样本估计总体」，结论要落到具体改进建议上。"}]},"cnm_219":{"core":["只含一个未知数、未知数最高次数为 2 的整式方程叫一元二次方程，一般形式 ax²+bx+c=0（a≠0）"],"trap":"标准形式 ax²+bx+c=0 中 a ≠ 0，这个条件不能漏；二次项系数含参数时要单独讨论。","quiz":[{"q":"下列是一元二次方程的是","o":["x² − 3x + 2 = 0","x + 2 = 0","1/x² + x = 1"],"a":0,"why":"只含一个未知数、未知数最高次数为 2、等号两边都是整式；第三个分母含未知数，不是整式方程。"}]},"cnm_220":{"core":["形如 x²=p 或 (x+m)²=p 的方程，利用平方根的意义直接求解"],"trap":"形如 (x + m)² = n（n ≥ 0）可直接开平方得 x + m = ±√n；n < 0 时无实数解。","quiz":[{"q":"方程 x² = 9 的解是","o":["x = ±3","x = 3","x = 9"],"a":0,"why":"直接开平方要取正负两个平方根；只写 x = 3 会漏掉一个解。"}]},"cnm_221":{"core":["通过配方把方程化为 (x+m)²=n 的形式再求解，配方时加上一次项系数一半的平方"],"trap":"配方关键是加「一次项系数一半的平方」，等号两边要同时加；二次项系数不为 1 时先化为 1。","quiz":[{"q":"用配方法解 x² + 6x − 7 = 0，配方后正确的是","o":["(x + 3)² = 16","(x + 3)² = 7","(x + 6)² = 43"],"a":0,"why":"两边加一次项系数一半的平方 9：x²+6x+9 = 7+9，得 (x+3)² = 16，解得 x = 1 或 −7。"}]},"cnm_222":{"core":["由配方法推出求根公式 x=(-b±√(b²-4ac))/(2a)（b²-4ac≥0），并用其解方程"],"trap":"先算 Δ 再代入公式可减少无谓计算；系数含负号时建议先加括号再代入。","quiz":[{"q":"一元二次方程 ax²+bx+c=0（a≠0）的求根公式是","o":["x = [−b ± √(b²−4ac)] / (2a)","x = [−b ± √(b²+4ac)] / (2a)","x = (−b ± b²−4ac) / (2a)"],"a":0,"why":"由配方法推得，根号内是判别式 b²−4ac，分母是 2a；使用前要先化为一般式并确认 Δ ≥ 0。"}]},"cnm_223":{"core":["Δ=b²-4ac 决定根的情况：Δ>0 两个不等实根，Δ=0 两个相等实根，Δ<0 无实根"],"trap":"判别式只对一般式使用；说「有实数根」时是 Δ ≥ 0（包含相等的情形）。","quiz":[{"q":"若一元二次方程 x² − 4x + m = 0 有两个相等的实数根，则","o":["m = 4","m > 4","m < 4"],"a":0,"why":"Δ = b²−4ac = 16 − 4m = 0，解得 m = 4；Δ>0 两个不等实根，Δ<0 无实数根。"}]},"cnm_224":{"core":["把方程一边化为 0，另一边分解成一次因式的积，利用“若 ab=0 则 a=0 或 b=0”求解"],"trap":"前提是方程一边为 0；右边不为 0 时不能直接令每个因式为 0。","quiz":[{"q":"方程 x² − 5x + 6 = 0 用因式分解法可得","o":["(x − 2)(x − 3) = 0，解为 2 和 3","(x + 2)(x + 3) = 0","不能分解"],"a":0,"why":"分解为 (x−2)(x−3)=0，由「两因式乘积为 0 则至少一个为 0」得 x = 2 或 3。"}]},"cnm_225":{"core":["根据方程特点灵活选用直接开平方、因式分解、配方、公式法"],"trap":"观察系数特征：形如 (x+m)²=n 用开平方，易分解用因式分解法，其余用公式法。","quiz":[{"q":"解一元二次方程时，选择方法的一般顺序是","o":["先看能否直接开平方或因式分解，其次配方，最后用公式法","一律用公式法","一律用配方法"],"a":0,"why":"优先挑计算量小的特殊方法，公式法是通用兜底；缺一次项时直接开平方最快。"}]},"cnm_226":{"core":["若 x₁、x₂ 是 ax²+bx+c=0 的两根，则 x₁+x₂=-b/a，x₁x₂=c/a（课标仅要求“了解”，见例67）"],"trap":"使用前提是方程有实数根（Δ ≥ 0）；常用于求对称式如 x₁²+x₂² = (x₁+x₂)² − 2x₁x₂。","quiz":[{"q":"若 x₁、x₂ 是 x² + px + q = 0 的两根，则","o":["x₁ + x₂ = −p，x₁x₂ = q","x₁ + x₂ = p，x₁x₂ = q","x₁ + x₂ = −p，x₁x₂ = −q"],"a":0,"why":"韦达定理：两根之和 = −b/a，两根之积 = c/a；此处 a=1、b=p、c=q。"}]},"cnm_227":{"core":["用一元二次方程解决平均增长（降低）率、传播扩散等问题，注意检验根的合理性"],"trap":"传播问题（一人传 x 人）常列 1 + x + x(1+x) 之类；解出负值要按实际意义舍去。","quiz":[{"q":"某量连续两次以相同增长率 x 增长，由 a 变为 b，正确的方程是","o":["a(1 + x)² = b","a(1 + 2x) = b","a·2x = b"],"a":0,"why":"每次增长都在前一次的基础上乘 (1+x)，两次即 a(1+x)² = b；不能简单把增长率相加。"}]},"cnm_228":{"core":["用一元二次方程解决围图形面积、商品销售利润等问题"],"trap":"设未知数时尽量设「变化量」（如降价 x 元），等量关系用「总面积 / 总利润 = 给定值」。","quiz":[{"q":"用一元二次方程解面积或利润问题时，最后要","o":["检验根是否符合实际（边长为正、降价后销量非负等）","两个根全部保留作答","只取较大的根"],"a":0,"why":"方程的两个根里常有一个不符合情境（如长度为负、降价幅度超过原价），必须逐一代回检验。"}]},"cnm_229":{"core":["形如 y=ax²+bx+c（a≠0）的函数叫二次函数"],"trap":"a ≠ 0 不能省；判断前先化简整理，含 x² 项被抵消时就不是二次函数。","quiz":[{"q":"下列是二次函数的是","o":["y = 2x² − x + 1","y = 2x + 1","y = 2/x"],"a":0,"why":"二次函数形如 y = ax²+bx+c（a ≠ 0），自变量最高次数为 2。"}]},"cnm_230":{"core":["抛物线 y=ax² 顶点在原点，对称轴为 y 轴，a 的符号决定开口方向，|a| 决定开口大小"],"trap":"a>0 向上、a<0 向下，|a| 越大开口越窄；x 取相反数时 y 相等，图象关于 y 轴对称。","quiz":[{"q":"抛物线 y = 2x² 的开口方向和顶点分别是","o":["开口向上，顶点 (0, 0)","开口向下，顶点 (0, 0)","开口向上，顶点 (2, 0)"],"a":0,"why":"a = 2 > 0 开口向上；y = ax² 的顶点是原点，对称轴是 y 轴。"}]},"cnm_231":{"core":["抛物线 y=a(x-h)²+k 的顶点为 (h,k)，对称轴为 x=h，可由 y=ax² 平移得到"],"trap":"注意符号：括号里是 (x − h)，所以 x−2 对应 h = 2；平移规律「左加右减、上加下减」。","quiz":[{"q":"抛物线 y = (x − 2)² + 3 的顶点坐标是","o":["(2, 3)","(−2, 3)","(2, −3)"],"a":0,"why":"顶点式 y = a(x−h)²+k 的顶点是 (h, k)；这里 h = 2、k = 3。"}]},"cnm_232":{"core":["通过配方化为顶点式，得出顶点坐标 (-b/2a, (4ac-b²)/4a)，并研究增减性"],"trap":"也可用两根中点求对称轴：若与 x 轴交于 x₁、x₂，则对称轴为 x = (x₁+x₂)/2。","quiz":[{"q":"抛物线 y = ax²+bx+c 的对称轴公式是","o":["x = −b/(2a)","x = b/(2a)","x = −b/a"],"a":0,"why":"由配方法得对称轴 x = −b/(2a)，顶点坐标 (−b/(2a), (4ac−b²)/(4a))。"}]},"cnm_233":{"core":["根据条件选择一般式、顶点式或交点式，求出二次函数解析式"],"trap":"按已知条件选形式：已知三点设一般式，已知顶点设顶点式，已知与 x 轴两交点设交点式。","quiz":[{"q":"用待定系数法求二次函数解析式，一般需要","o":["三个独立条件（如三个点坐标或顶点加一点）","两个点坐标","一个点坐标"],"a":0,"why":"一般式有三个待定系数 a、b、c，需三个条件；若已知顶点可设顶点式，只需再一个点。"}]},"cnm_234":{"core":["抛物线与 x 轴交点的横坐标是对应一元二次方程的根，交点个数由判别式决定"],"trap":"这也是用图象估算一元二次方程根的依据；不等式 ax²+bx+c>0 看图象在 x 轴上方的部分。","quiz":[{"q":"二次函数 y = ax²+bx+c 的图象与 x 轴交点的横坐标，与方程 ax²+bx+c = 0 的根的关系是","o":["交点横坐标就是方程的实数根","没有交点时方程有两个根","交点个数与根无关"],"a":0,"why":"y = 0 时的 x 即图象与 x 轴交点的横坐标；两交点对应 Δ>0，一个交点对应 Δ=0，无交点对应 Δ<0。"}]},"cnm_235":{"core":["利用顶点求二次函数的最大值或最小值，注意自变量取值范围"],"trap":"实际问题求最值时，还要检查顶点横坐标是否落在自变量允许范围内，不在则取端点值。","quiz":[{"q":"二次函数 y = ax²+bx+c（a>0）在顶点处取得","o":["最小值","最大值","既非最大也非最小"],"a":0,"why":"a>0 开口向上，顶点是最低点，有最小值；a<0 时有最大值。"}]},"cnm_236":{"core":["建立二次函数模型解决最大利润、抛物线型运动轨迹、拱桥等问题"],"trap":"别忘写自变量取值范围；结果要回到情境（最大面积是多少、此时边长是多少）。","quiz":[{"q":"用二次函数解决「面积最大 / 利润最大」问题，一般思路是","o":["设自变量列函数关系式 → 求顶点 → 结合实际取值范围确定最值","直接取最大的一个数","只画草图估计"],"a":0,"why":"先建模得二次函数，再求顶点；若顶点不在允许范围内，要在区间端点比较取值。"}]},"cnm_237":{"core":["形如 y=k/x（k≠0）的函数叫反比例函数，也可写成 xy=k"],"trap":"k ≠ 0 且自变量在分母上、次数为 1；x 不能取 0，图象与坐标轴永不相交。","quiz":[{"q":"下列是反比例函数的是","o":["y = 3/x","y = 3x","y = 3/x²"],"a":0,"why":"反比例函数形如 y = k/x（k ≠ 0），也可写成 xy = k 或 y = kx⁻¹。"}]},"cnm_238":{"core":["图象是双曲线，k 的符号决定所在象限与增减性，图象关于原点对称"],"trap":"双曲线关于原点中心对称，也关于直线 y = x、y = −x 对称。","quiz":[{"q":"反比例函数 y = k/x 当 k > 0 时，图象位于","o":["第一、三象限，且在每个象限内 y 随 x 增大而减小","第二、四象限","第一、二象限"],"a":0,"why":"k>0 在一、三象限，k<0 在二、四象限；增减性只能「在每个象限内」描述，不能跨象限说。"}]},"cnm_239":{"core":["过双曲线上一点向坐标轴作垂线，所得矩形面积为 |k|，三角形面积为 |k|/2"],"trap":"常考变式：与原点连成的三角形面积为 |k|/2；k 的符号决定图象所在象限。","quiz":[{"q":"反比例函数 y = k/x 图象上一点向两坐标轴作垂线，与坐标轴围成的矩形面积等于","o":["|k|","k²","2|k|"],"a":0,"why":"设点为 (x, y)，矩形面积 = |x|·|y| = |xy| = |k|，与点的位置无关。"}]},"cnm_240":{"core":["由一个点的坐标代入 y=k/x 求出 k"],"trap":"若给的是面积或几何条件，先用 k 的几何意义把面积换成 |k|，再结合象限定符号。","quiz":[{"q":"求反比例函数解析式 y = k/x，一般需要","o":["图象上一个点的坐标即可求出 k","两个点的坐标","三个点的坐标"],"a":0,"why":"只有一个待定系数 k，代入一点 (x₀, y₀) 得 k = x₀y₀。"}]},"cnm_241":{"core":["求一次函数与反比例函数图象的交点，比较函数值大小，解有关面积问题"],"trap":"交点个数由联立后方程的判别式决定；比较两个函数值大小要看同一横坐标下谁的图象在上。","quiz":[{"q":"求反比例函数与一次函数图象的交点，正确做法是","o":["联立两个解析式，解所得方程（组）","把两个函数值相加","只画草图读数"],"a":0,"why":"交点坐标同时满足两个解析式，联立消元后常得到一元二次方程，解出 x 再回代求 y。"}]},"cnm_242":{"core":["用反比例函数描述总量一定时两个量的关系，如面积、工作量、压强等"],"trap":"建模后要写自变量取值范围（如长度、速度必须为正），结论也要符合实际。","quiz":[{"q":"实际问题中出现「面积一定，长与宽」「路程一定，速度与时间」，通常对应","o":["反比例函数关系","正比例函数关系","一次函数关系"],"a":0,"why":"两个量的乘积为定值（xy = k），就是反比例关系。"}]},"cnm_243":{"core":["收集高铁运行数据，探究路程、速度、时间等量之间的函数关系"],"trap":"结论要说明在哪个量被固定、哪个范围内成立，不能脱离条件谈正反比例。","quiz":[{"q":"「高铁列车运行中的数量关系」这类综合实践，主要用","o":["路程、速度、时间之间的函数（含反比例）关系建模并分析","只记忆列车时刻表","只用几何作图"],"a":0,"why":"路程一定时速度与时间成反比，时间一定时路程与速度成正比，都可用函数式与图象刻画。"}]},"cnm_244":{"core":["把图形绕某一点转动一个角度的变换叫旋转，旋转由旋转中心、方向、角度确定"],"trap":"旋转角一般按较小角、并注明顺时针或逆时针；对应点到旋转中心的距离相等。","quiz":[{"q":"图形的旋转由哪三个要素确定","o":["旋转中心、旋转方向、旋转角","旋转中心、边长、颜色","只由旋转角确定"],"a":0,"why":"三要素缺一不可；旋转不改变图形的形状和大小。"}]},"cnm_245":{"core":["旋转前后图形全等，对应点到旋转中心的距离相等，对应点与旋转中心连线所成的角等于旋转角"],"trap":"与平移（对应点连线平行且相等）区分开；旋转后图形方向一般改变。","quiz":[{"q":"关于旋转的性质，正确的是","o":["对应点到旋转中心距离相等，对应线段、对应角相等，任意一对对应点与中心连线所成的角等于旋转角","对应点连线互相平行","旋转会改变图形大小"],"a":0,"why":"旋转是全等变换；对应点与中心连线所成的角都等于旋转角。"}]},"cnm_246":{"core":["根据旋转中心、方向、角度，画出已知图形旋转后的图形"],"trap":"旋转中心若在图形上，该点旋转后位置不变；所有点旋转的角度和方向必须一致。","quiz":[{"q":"作一个图形绕点 O 旋转 90° 后的图形，关键步骤是","o":["把各关键点与 O 连线，按方向和角度旋转相同角度并截取等长，再顺次连接","只移动一个顶点","把图形整体放大"],"a":0,"why":"逐点旋转：连线 → 转过指定角 → 保持到 O 的距离不变得对应点 → 按原顺序连接。"}]},"cnm_247":{"core":["利用旋转构造全等三角形，解决正方形、等边三角形中的线段与角问题（“半角模型”等）"],"trap":"常见套路：遇 60° 想构造等边三角形，遇 90° 想旋转成直角三角形。","quiz":[{"q":"旋转变换常用于证明与计算，主要因为它能","o":["把分散的线段或角集中到一处，构造全等或特殊图形","改变线段长度","把曲线变成直线"],"a":0,"why":"旋转保持长度与角度不变，可把条件「搬」到一起，便于凑出全等三角形或等边三角形。"}]},"cnm_248":{"core":["一个图形绕某点旋转 180° 能与另一个图形重合叫中心对称","图形绕某点旋转 180° 与自身重合叫中心对称图形"],"trap":"中心对称图形绕中心旋转 180° 与自身重合，如平行四边形、圆；等边三角形不是中心对称图形。","quiz":[{"q":"关于中心对称，正确的是","o":["把一个图形绕某点旋转 180° 能与另一个图形重合，对称中心平分对应点连线","中心对称就是轴对称","旋转 90° 即可"],"a":0,"why":"中心对称是旋转角为 180° 的特殊旋转；对称中心是任意一对对应点连线的中点。"}]},"cnm_249":{"core":["点 (x,y) 关于原点的对称点为 (-x,-y)，会画关于原点成中心对称的图形"],"trap":"对比记忆：关于 x 轴只变纵坐标，关于 y 轴只变横坐标，关于原点两个都变。","quiz":[{"q":"点 (3, −2) 关于原点对称的点是","o":["(−3, 2)","(−3, −2)","(3, 2)"],"a":0,"why":"关于原点对称：横、纵坐标都变为相反数。"}]},"cnm_250":{"core":["认识圆、圆心、半径、弦、直径、弧、半圆、圆心角及等圆等概念"],"trap":"直径是圆中最长的弦；半圆（弧）与直径要分清；等弧指能完全重合的弧。","quiz":[{"q":"关于圆的概念，正确的是","o":["圆是到定点距离等于定长的所有点组成的图形，定点是圆心、定长是半径","圆是一条线段","弦一定经过圆心"],"a":0,"why":"圆由圆心和半径确定；连接圆上任意两点的线段叫弦，经过圆心的弦才是直径。"}]},"cnm_251":{"core":["垂直于弦的直径平分弦且平分弦所对的弧，常与勾股定理结合计算"],"trap":"常用辅助线：连半径、作弦心距，构造由半径、半弦、弦心距组成的直角三角形。","quiz":[{"q":"垂径定理的内容是","o":["垂直于弦的直径平分这条弦，并且平分弦所对的两条弧","任意直径都平分任意弦","弦一定垂直于直径"],"a":0,"why":"条件是「直径垂直于弦」，结论是平分弦及弦所对的两条弧；常配合勾股定理求半径或弦长。"}]},"cnm_252":{"core":["在同圆或等圆中，相等的圆心角所对的弧相等、弦相等"],"trap":"「同圆或等圆」这个前提不能省；不同大小的圆里角相等弧不一定相等。","quiz":[{"q":"在同圆或等圆中，下列说法正确的是","o":["相等的圆心角所对的弧相等、所对的弦相等","相等的弦所对的圆心角一定互补","弧长与圆心角无关"],"a":0,"why":"弧、弦、圆心角三组量中，只要有一组相等，其余两组也对应相等（同圆或等圆前提）。"}]},"cnm_253":{"core":["一条弧所对的圆周角等于它所对圆心角的一半，同弧所对的圆周角相等"],"trap":"要认准「同一条弧」；圆周角的顶点必须在圆上，两边都与圆相交。","quiz":[{"q":"圆周角定理的内容是","o":["一条弧所对的圆周角等于它所对圆心角的一半","圆周角等于圆心角","圆周角与圆心角互补"],"a":0,"why":"同弧或等弧所对的圆周角相等，且等于该弧所对圆心角的一半。"}]},"cnm_254":{"core":["直径所对的圆周角是直角","90° 的圆周角所对的弦是直径"],"trap":"见直径就想「直角」，是圆中最常用的辅助线思路之一。","quiz":[{"q":"半圆（或直径）所对的圆周角是","o":["90°","60°","180°"],"a":0,"why":"直径所对圆心角是 180°，圆周角为其一半即 90°；反过来，90° 圆周角所对的弦是直径。"}]},"cnm_255":{"core":["圆内接四边形的对角互补，外角等于内对角"],"trap":"前提是「四个顶点都在同一圆上」；矩形、正方形都是圆内接四边形的特例。","quiz":[{"q":"圆内接四边形的性质是","o":["对角互补，且任一外角等于它的内对角","对角相等","四个角都是直角"],"a":0,"why":"四个顶点都在圆上的四边形叫圆内接四边形，对角和为 180°。"}]},"cnm_256":{"core":["圆心角为 n° 半径为 r 的弧长 l=nπr/180"],"trap":"与扇形面积公式 S = nπR²/360 区分；也可用 S = (1/2)lR 由弧长求面积。","quiz":[{"q":"半径为 R、圆心角为 n° 的弧长公式是","o":["l = nπR/180","l = nπR²/360","l = 2πR·n"],"a":0,"why":"弧长是周长的一部分：l = (n/360)·2πR = nπR/180。"}]},"cnm_257":{"core":["圆心角为 n° 半径为 r 的扇形面积 S=nπr²/360=lr/2"],"trap":"n 是圆心角的度数（不带单位代入）；求阴影面积常用「整体减空白」。","quiz":[{"q":"半径为 R、圆心角为 n° 的扇形面积公式是","o":["S = nπR²/360","S = nπR/180","S = πR²·n"],"a":0,"why":"扇形是圆面积的一部分：S = (n/360)·πR²；也可写成 S = (1/2)lR。"}]},"cnm_258":{"core":["圆锥侧面展开为扇形，侧面积 S=πrl（r 底面半径，l 母线）"],"trap":"全面积 = 侧面积 + 底面积；由弧长与母线可求扇形圆心角：n = 360r/l。","quiz":[{"q":"圆锥的侧面展开图是","o":["一个扇形，其弧长等于圆锥底面圆的周长","一个三角形","一个圆"],"a":0,"why":"展开后扇形的半径是母线长 l，弧长 = 底面周长 2πr；侧面积 = πrl。"}]},"cnm_259":{"core":["点在圆外、圆上、圆内，分别对应点到圆心距离大于、等于、小于半径"],"trap":"这是判断位置关系的唯一依据；反过来由位置也能确定 d 与 r 的大小。","quiz":[{"q":"点到圆心的距离为 d、半径为 r，点在圆上时","o":["d = r","d > r","d < r"],"a":0,"why":"d < r 在圆内，d = r 在圆上，d > r 在圆外。"}]},"cnm_260":{"core":["直线与圆相离、相切、相交，对应圆心到直线的距离 d 与半径 r 的大小关系"],"trap":"也可由交点个数反推：相切只有一个公共点，别把「相切」和「相离」记反。","quiz":[{"q":"圆心到直线的距离为 d、半径为 r，直线与圆相切时","o":["d = r","d > r","d < r"],"a":0,"why":"d < r 相交（两个交点），d = r 相切（一个交点），d > r 相离（无交点）。"}]},"cnm_261":{"core":["经过半径外端且垂直于这条半径的直线是圆的切线"],"trap":"若题目未给公共点，作垂直并证距离等于半径；已给公共点时连半径证垂直。","quiz":[{"q":"切线的判定定理是","o":["经过半径外端且垂直于这条半径的直线是圆的切线","任意垂直于半径的直线都是切线","与圆有一个公共点的直线一定不是切线"],"a":0,"why":"必须同时满足「过半径外端（在圆上）」和「垂直于该半径」；常作辅助线是连半径并证垂直。"}]},"cnm_262":{"core":["圆的切线垂直于过切点的半径"],"trap":"见切线就连半径得直角，这是圆中最高频的辅助线。","quiz":[{"q":"切线的性质是","o":["圆的切线垂直于过切点的半径","切线平行于过切点的半径","切线一定经过圆心"],"a":0,"why":"切线与过切点的半径垂直；圆心到切线的距离等于半径。"}]},"cnm_263":{"core":["从圆外一点引圆的两条切线，切线长相等，圆心与该点的连线平分两切线的夹角"],"trap":"常与「直角三角形内切圆」「线段和差」结合，注意切线长是从圆外点到切点的线段长度。","quiz":[{"q":"切线长定理的内容是","o":["从圆外一点引圆的两条切线，切线长相等，且该点与圆心的连线平分两切线的夹角","两条切线长度之和等于直径","两条切线互相垂直"],"a":0,"why":"由两个全等的直角三角形可得切线长相等、连线平分夹角。"}]},"cnm_264":{"core":["与三角形三边都相切的圆叫内切圆，圆心是三角形三条内角平分线的交点，内心到三边距离相等"],"trap":"内心一定在三角形内部；直角三角形内切圆半径 r = (a+b−c)/2（c 为斜边）。","quiz":[{"q":"三角形的内切圆圆心是","o":["三条角平分线的交点，到三边距离相等","三边垂直平分线的交点","三条中线的交点"],"a":0,"why":"内心由角平分线交点确定，到三边距离相等（等于内切圆半径）。"}]},"cnm_265":{"core":["经过三角形三个顶点的圆叫外接圆，圆心是三边垂直平分线的交点，叫外心"],"trap":"锐角三角形外心在内部，直角三角形外心在斜边中点，钝角三角形外心在外部。","quiz":[{"q":"三角形的外接圆圆心是","o":["三边垂直平分线的交点，到三个顶点距离相等","三条角平分线的交点","三条高的交点"],"a":0,"why":"外心由垂直平分线交点确定，到三个顶点距离相等（等于外接圆半径）。"}]},"cnm_266":{"core":["正多边形有外接圆和内切圆，认识中心、半径、边心距、中心角，并作正多边形"],"trap":"常配合半径、边心距、半个边构成直角三角形，用勾股或三角函数求边长与面积。","quiz":[{"q":"把圆 n 等分可得到正 n 边形，其中心角等于","o":["360°/n","180°/n","(n−2)×180°/n"],"a":0,"why":"相邻两半径的夹角（中心角）为 360°/n；正 n 边形每个内角是 (n−2)×180°/n。"}]},"cnm_267":{"core":["利用函数、不等式、几何知识，解决最大面积、最省材料等生活中的优化问题"],"trap":"结论要写清最优方案与对应取值，并说明在哪个范围内成立。","quiz":[{"q":"「生活中的优化问题」用圆与几何知识解决时，通常要","o":["把约束条件转成几何量，建立关系式后求最值并检验可行性","只凭直觉选一个方案","只画出示意图即可"],"a":0,"why":"先建模（面积、周长、距离），再用函数或几何不等式求最优，最后核对实际限制。"}]},"cnm_268":{"core":["四条线段 a、b、c、d 满足 a/b=c/d 叫成比例线段，掌握比例的基本性质与合比等变形"],"trap":"写比例式时四条线段的顺序要对应；单位要统一，否则比没有意义。","quiz":[{"q":"四条线段 a、b、c、d 成比例，正确的写法是","o":["a/b = c/d","a + b = c + d","a·b = c·d"],"a":0,"why":"成比例线段指两个比相等，即 a:b = c:d 或 a/b = c/d；由比例基本性质可得 ad = bc。"}]},"cnm_269":{"core":["三条平行线截两条直线，所得对应线段成比例","平行于三角形一边的直线截其他两边，对应线段成比例"],"trap":"平行于三角形一边截其他两边，所得三角形与原三角形相似，这是最常用的推论。","quiz":[{"q":"平行线分线段成比例定理说明","o":["三条平行线截两条直线，所得对应线段成比例","平行线把线段平分","对应线段一定相等"],"a":0,"why":"两条直线被一组平行线所截，截得的对应线段之比相等；是相似三角形判定的基础。"}]},"cnm_270":{"core":["各角分别相等、各边成比例的两个多边形叫相似多边形，相似比等于对应边之比"],"trap":"仅角相等（如矩形与一般矩形）或仅边成比例都不足以判定多边形相似。","quiz":[{"q":"关于相似多边形，正确的是","o":["对应角相等、对应边成比例","对应边相等","只要求形状大致相同"],"a":0,"why":"相似要求「角分别相等」且「边对应成比例」，比值叫相似比；全等是相似比为 1 的特例。"}]},"cnm_271":{"core":["两角分别相等","两边成比例且夹角相等","三边成比例的两个三角形相似"],"trap":"只有一个角相等不足以判定；注意「两边成比例」必须是「夹角」相等（类似 SAS 的陷阱）。","quiz":[{"q":"下列能判定两个三角形相似的是","o":["两角分别相等（AA）","两边相等","一个角相等"],"a":0,"why":"常用判定：两角分别相等、两边成比例且夹角相等、三边成比例；平行于一边的直线截得的小三角形与原三角形相似。"}]},"cnm_272":{"core":["相似三角形对应角相等、对应边成比例，对应高、中线、角平分线之比及周长之比等于相似比，面积之比等于相似比的平方"],"trap":"对应高、对应中线、对应角平分线的比都等于相似比；面积比要平方，这一项最容易错。","quiz":[{"q":"两个相似三角形的相似比为 2:3，则它们的面积比是","o":["4:9","2:3","√2:√3"],"a":0,"why":"相似三角形周长比等于相似比，面积比等于相似比的平方：2²:3² = 4:9。"}]},"cnm_273":{"core":["识别“A 型”“8 字型”“母子型（射影）”等相似基本图形并用于证明和计算"],"trap":"找模型时先标出公共角与平行线，写比例式务必按对应顶点顺序，别把边配错。","quiz":[{"q":"相似三角形的常见基本模型中，「A 字型」与「8 字型」共同的特点是","o":["都存在平行线（或共线角）带来的对应角相等，可由 AA 判定相似","都必须有直角","都必须有等边三角形"],"a":0,"why":"两类模型都由平行线或公共角产生两组相等角，从而用 AA 得到相似，再列比例式求线段。"}]},"cnm_274":{"core":["利用相似测量不能直接到达的高度和距离，如旗杆高度、河宽"],"trap":"也可用标杆、镜面反射构造相似；测量结果要注明同一时刻、同一地点、地面水平。","quiz":[{"q":"用相似三角形测物体高度（如影长法），依据是","o":["同一时刻物高与影长成比例，可由相似三角形列比例式求解","物体越高影子越短","高度等于影长"],"a":0,"why":"同一时刻太阳光线平行，物高与影长构成的两个直角三角形相似，故 物高/影长 为定值。"}]},"cnm_275":{"core":["如果两个相似图形的对应点连线相交于一点且对应边平行，这样的相似叫位似，会在平面直角坐标系中作位似图形"],"trap":"位似比 k>0 时两图形在位似中心同侧，k<0 时在两侧；坐标系中以原点为位似中心时，对应点坐标变为 (kx, ky)。","quiz":[{"q":"关于位似，正确的是","o":["位似图形一定相似，对应点连线都经过位似中心，对应边互相平行","位似图形一定全等","位似中心必须在图形内部"],"a":0,"why":"位似是特殊的相似：对应点连线交于一点（位似中心），对应边平行或在同一直线上。"}]},"cnm_276":{"core":["在直角三角形中，锐角的正弦、余弦、正切分别是对边比斜边、邻边比斜边、对边比邻边"],"trap":"先认清直角与斜边，再确定「对边、邻边」是相对哪个锐角而言；换一个锐角，对边邻边会互换。","quiz":[{"q":"在 Rt△ABC 中，∠C = 90°，则 sin A 等于","o":["∠A 的对边 / 斜边","∠A 的邻边 / 斜边","∠A 的对边 / 邻边"],"a":0,"why":"sin A = 对边/斜边，cos A = 邻边/斜边，tan A = 对边/邻边。"}]},"cnm_277":{"core":["熟记 30°、45°、60° 的正弦、余弦、正切值，并会借助计算器求一般角的值"],"trap":"tan30°=√3/3、tan45°=1、tan60°=√3；建议按 30°/45°/60° 列一张三行表一起记。","quiz":[{"q":"sin 30° 的值是","o":["1/2","√3/2","√2/2"],"a":0,"why":"特殊角：sin30°=1/2、sin45°=√2/2、sin60°=√3/2；cos 的顺序正好相反。"}]},"cnm_278":{"core":["已知直角三角形中的一些元素（至少一边），求出其余的边和角"],"trap":"选关系式时优先用「已知量 + 一个未知量」的三角函数式，尽量用乘法而不是除法减少误差。","quiz":[{"q":"解直角三角形时，已知一条边和一个锐角，一般可以","o":["求出其余所有边和角","只能求出角","无法求任何量"],"a":0,"why":"直角三角形除直角外还有 5 个量（2 锐角、3 边），已知 2 个（至少一条边）即可求其余。"}]},"cnm_279":{"core":["把仰角、俯角、方向角问题转化为直角三角形求解"],"trap":"画图时先画水平线，再标视线与水平线的夹角；两个观测点之间的水平线互相平行，常构成内错角相等。","quiz":[{"q":"关于仰角与俯角，正确的是","o":["仰角是视线在水平线上方时与水平线的夹角，俯角在下方","两者都是与竖直线的夹角","仰角一定大于 90°"],"a":0,"why":"都以观测点的水平线为基准；方向角则以正北/正南为基准描述方位。"}]},"cnm_280":{"core":["坡度是坡面的铅直高度与水平宽度之比，等于坡角的正切"],"trap":"别把坡度写成 sin α 或用斜坡长度作分母；题目给 1:2.4 时表示 h/l = 1/2.4。","quiz":[{"q":"坡度 i 的定义是","o":["坡面的铅直高度 h 与水平宽度 l 之比，即 i = h/l = tan α","水平宽度与高度之比","坡面的长度"],"a":0,"why":"坡度就是坡角 α 的正切值，常写成 1:m 的形式；坡角越大坡越陡。"}]},"cnm_281":{"core":["认识光线形成的平行投影与中心投影，知道其区别并用于判断影子"],"trap":"同一时刻同一地点，平行投影下物高与影长成比例；中心投影下这个比例不成立。","quiz":[{"q":"关于平行投影与中心投影，正确的是","o":["太阳光线形成的影子属于平行投影，灯光形成的影子属于中心投影","两者都是中心投影","平行投影的投射线交于一点"],"a":0,"why":"平行投影的投射线互相平行（如太阳光），中心投影的投射线交于一点（如灯泡、路灯）。"}]},"cnm_282":{"core":["投影线垂直于投影面的平行投影叫正投影，会求简单图形的正投影"],"trap":"当物体表面平行于投影面时，正投影能反映该面的真实形状与大小。","quiz":[{"q":"正投影是指","o":["投射线垂直于投影面的平行投影","投射线斜照的投影","只画物体正面的图"],"a":0,"why":"正投影是投射线与投影面垂直的平行投影；三视图正是正投影的应用。"}]},"cnm_283":{"core":["画出简单立体图形的主视图、左视图、俯视图，并能由三视图想象出立体图形"],"trap":"由三视图想象立体图形时先定主体轮廓，再逐处补台阶、孔洞；看不见的轮廓线用虚线。","quiz":[{"q":"三视图是指","o":["主视图、左视图、俯视图","正视图、侧视图、剖面图","只有主视图"],"a":0,"why":"分别从正面、左面、上面看物体得到的正投影图；画图遵循「长对正、高平齐、宽相等」。"}]},"cnm_284":{"core":["区分随机事件、必然事件和不可能事件"],"trap":"判断前先明确「条件」；标准大气压下水加热到 100 ℃ 沸腾也是必然事件。","quiz":[{"q":"「太阳从东方升起」属于","o":["必然事件","随机事件","不可能事件"],"a":0,"why":"在一定条件下必然发生的是必然事件，一定不发生的是不可能事件，可能发生也可能不发生的是随机事件。"}]},"cnm_307":{"core":["对随机事件按发生的可能性大小排序，知道可能性大小与事件包含的有利结果多少有关"],"trap":"比较前必须确认「等可能」；否则结果数多不代表可能性大。","quiz":[{"q":"比较几个事件发生可能性的大小，合理依据是","o":["各事件包含的结果数占所有等可能结果的比例","事件名称的长短","谁先被提到"],"a":0,"why":"在等可能前提下，包含的结果越多，发生的可能性越大。"}]},"cnm_285":{"core":["概率是衡量随机事件发生可能性大小的数，等可能事件的概率等于所求结果数除以总结果数"],"trap":"掷一枚均匀骰子，每个点数概率都是 1/6；先列全所有等可能结果再数目标结果。","quiz":[{"q":"等可能事件概率的计算方法是","o":["P(A) = 事件 A 包含的结果数 / 所有等可能结果总数","P(A) = 结果数 × 总数","P(A) = 试验次数"],"a":0,"why":"古典概型要求每个结果出现的可能性相等，且结果总数有限。"}]},"cnm_308":{"core":["概率满足 0≤P≤1：必然事件的概率为 1，不可能事件的概率为 0，随机事件的概率在 0 与 1 之间"],"trap":"概率小不等于「不发生」，概率大也不等于「一定发生」，这是最常见的误解。","quiz":[{"q":"关于概率的取值范围，正确的是","o":["0 ≤ P(A) ≤ 1，必然事件为 1，不可能事件为 0","P(A) 可以大于 1","P(A) 一定大于 0"],"a":0,"why":"概率是 0 到 1 之间的数；P=0 不一定是不可能（在连续型情形），但初中阶段按此结论使用。"}]},"cnm_309":{"core":["判断一次试验的所有结果是否有限且发生的可能性相等，只有满足这两点才能用 P=m/n 计算概率"],"trap":"摸球时「除颜色外完全相同」、转盘「区域等分」都是为了保证等可能。","quiz":[{"q":"判断一个试验能否用古典概型，关键看","o":["结果是否有限且每个结果等可能","试验是否容易做","是否涉及球或骰子"],"a":0,"why":"两个条件缺一不可；例如掷一枚不均匀的硬币，虽然结果有限但不等可能，不能直接套公式。"}]},"cnm_286":{"core":["列出所有等可能结果，数出符合条件的结果数求概率"],"trap":"列举要做到不重不漏，建议按固定顺序（如先固定第一个量）逐个写出。","quiz":[{"q":"用列举法求概率，适用于","o":["结果数较少、能一一列全的试验","任何复杂试验","只有一步的试验"],"a":0,"why":"结果总数不多时直接列举所有等可能结果，再数出目标结果数求比值。"}]},"cnm_287":{"core":["对两步试验用列表法或树状图列出所有结果，求事件的概率"],"trap":"看清是「同时」还是「先后」；同时掷两枚骰子与先后掷两次，结果总数都是 36 但表述不同。","quiz":[{"q":"两步试验求概率，常用","o":["列表法或树状图","只凭感觉估计","只列一步"],"a":0,"why":"两步试验用表格（行列分别代表两步）或树状图列全所有结果，避免遗漏。"}]},"cnm_289":{"core":["用概率判断游戏是否公平并进行决策"],"trap":"常见错：只看「有几种赢法」而不看每种赢法的概率是否相等。","quiz":[{"q":"判断游戏是否公平，应当比较","o":["各方获胜的概率是否相等","谁先开始","规则字数多少"],"a":0,"why":"公平的标准是参与各方获胜概率相同；不相等时可修改规则或调整得分使期望相同。"}]},"cnm_310":{"core":["摸球试验中，放回时每次的结果总数不变，不放回时第二次的结果总数减少，需据此列出全部结果"],"trap":"先读清「放回」「不放回」「一次摸两个」——一次摸两个等价于不放回，且通常不计顺序。","quiz":[{"q":"摸球不放回与放回的主要区别是","o":["不放回时第二次的结果总数少 1 且各结果概率会变化","两者完全相同","放回时球会变多"],"a":0,"why":"不放回会使后续试验的样本空间和概率改变；列表或画树状图时要删去不可能的分支。"}]},"cnm_311":{"core":["试验有三步或更多步时，用树状图逐步分支列出全部结果，再数出所求事件的结果个数"],"trap":"每层分支数相乘得总结果数；树状图画完检查各条路径是否等可能。","quiz":[{"q":"三步及以上的试验求概率，最稳妥的方法是","o":["画树状图逐层列全所有结果","只列第一步","用列举法随意写几个"],"a":0,"why":"表格只适合两步，三步以上用树状图按层展开，能清晰看到每条路径和总结果数。"}]},"cnm_313":{"core":["从条形图、扇形图或统计表中读取各类数据的数量，再按等可能计算随机抽取一个个体属于某类的概率"],"trap":"若用频率估计概率，要说明「在大量重复试验下」；样本量太小时结论不可靠。","quiz":[{"q":"概率与统计图表综合题，正确思路是","o":["先从图表读出频数或频率，再按概率公式计算并回答问题","只看图的颜色","直接用图表标题作答案"],"a":0,"why":"图表给出的是各类的数量或占比，把它转成等可能结果数（或直接用频率）即可求概率。"}]},"cnm_288":{"core":["大量重复试验中，事件发生的频率稳定于概率，可用频率估计概率"],"trap":"频率是「做出来的结果」，概率是「理论上的稳定值」，两者不能混为一谈。","quiz":[{"q":"用频率估计概率的前提是","o":["在大量重复试验中，事件发生的频率会稳定在一个常数附近","只做一两次试验","试验次数越少越准"],"a":0,"why":"频率随试验次数增加趋于稳定，这个稳定值可作为概率的估计值。"}]},"cnm_312":{"core":["在产品抽检、种子发芽等无法列举结果的情形中，用大量重复试验的频率估计概率，并用估计值预测总体"],"trap":"结论要写「约」；抽样不随机（只挑好的检）会使估计严重偏高。","quiz":[{"q":"用频率估计合格率、发芽率，通常","o":["用大量抽检中合格（发芽）的比例作为总体相应概率的估计","只看第一件产品","直接取 100%"],"a":0,"why":"抽检量足够大且抽样随机时，样本频率可作为总体概率的估计。"}]},"cnm_314":{"core":["辨析“概率是 0.5 就是每两次必有一次”“前几次都是反面下次一定是正面”等误解，理解概率反映的是大量重复试验中频率稳定的趋势"],"trap":"同理，「中奖率 1%」不代表买 100 张一定中奖；赌徒谬误（认为之前没中下次更该中）也是错的。","quiz":[{"q":"「明天下雨概率 70%」的正确理解是","o":["在类似气象条件下，下雨的可能性较大，但不代表一定下","明天有 70% 的时间在下雨","明天一定下雨"],"a":0,"why":"概率描述的是大量同类情形下发生的相对频率，不是时间长短，也不是对单次结果的保证。"}]},"cnm_315":{"core":["设计一个两人转盘或摸球游戏，用列表法、树状图算出双方获胜的概率，再用多次试验的频率检验游戏是否公平"],"trap":"试验次数要足够多，并如实记录每一次结果；频率与概率有偏差属正常，不能据此立刻否定规则。","quiz":[{"q":"用随机试验检验游戏是否公平，合理做法是","o":["大量重复试验，统计各方获胜频率并与理论概率对照","只玩一次看谁赢","只看规则文字"],"a":0,"why":"先算理论概率判公平，再用大量重复试验的频率验证；频率会围绕概率波动。"}]},"cnm_290":{"core":["以教材章末综合与实践的主题名建模：在给定场地中设计停车位的摆放角度与尺寸，用解直角三角形计算占用的宽度和深度并比较方案"],"trap":"结论要给出具体尺寸与安全余量，并说明所依据的假设（如地面水平、车辆视为矩形）。","quiz":[{"q":"「停车设计问题」这类综合实践，主要用到","o":["锐角三角函数与几何关系，把实际尺寸转成可计算的量","只需要画草图","只考概率"],"a":0,"why":"把坡道、车位尺寸、视线角等转成直角三角形中的边角关系，用三角函数求长度再判断方案是否可行。"}]},"cnm_291":{"core":["以教材章末综合与实践的主题名建模：从三视图、比例与对称等角度分析建筑的数学特征，并按比例读图或绘图"],"trap":"单位要统一，计算结果要回到实际意义（材料需取整、损耗要留余量）。","quiz":[{"q":"「建筑中的数学」综合实践，常把三视图与几何知识结合，用于","o":["由视图还原立体形状并计算表面积、体积或材料用量","只判断建筑颜色","只统计楼层数"],"a":0,"why":"先由三视图确定几何体形状与尺寸，再用面积、体积公式估算材料，最后核对实际约束。"}]},"cnp_002":{"core":["知道机械运动","知道判断物体是运动还是静止要先选参照物，同一物体选不同参照物时运动情况可能不同"],"trap":"「运动的相对性」：说一个物体在运动，必须同时说明相对于谁。","quiz":[{"q":"关于参照物和运动，下列说法正确的是","o":["物体是运动还是静止，取决于所选的参照物","参照物只能选地面","选不同参照物，同一物体的运动情况一定相同"],"a":0,"why":"判断运动必须先选参照物；参照物可任选（一般不选被研究物体本身），同一物体选不同参照物，结论可能不同。"}]},"cnp_003":{"core":["理解速度的意义和公式 v = s/t，知道单位 m/s 与 km/h 的换算，能区分匀速直线运动和变速运动，会用平均速度做简单计算"],"trap":"1 m/s = 3.6 km/h，别多写一个 0；平均速度不是速度的平均值，中途停留的时间也要算进总时间。","quiz":[{"q":"关于速度和平均速度，下列说法正确的是","o":["平均速度等于总路程除以总时间","平均速度就是各段速度的算术平均值","1 m/s = 36 km/h"],"a":0,"why":"平均速度必须用总路程÷总时间，不能把几段速度直接平均；1 m/s = 3.6 km/h。"}]},"cnp_007":{"core":["知道声可以传递信息，也可以传递能量，能举出回声定位、B 超、超声波清洗、碎石等实例"],"trap":"分清「信息」还是「能量」：看清、测距、探伤＝信息；清洗、碎石、加湿＝能量。","quiz":[{"q":"下列实例中，主要利用声传递能量的是","o":["超声波清洗眼镜","B 超检查身体","蝙蝠回声定位"],"a":0,"why":"清洗、碎石是靠声波把能量传过去做功；B 超、回声定位、声呐都是获取信息。"}]},"cnp_008":{"core":["知道噪声的来源和危害，知道用分贝（dB）表示声音强弱的等级，知道在声源处、传播过程中、人耳处控制噪声的方法"],"trap":"分贝（dB）是声音强弱的等级单位，不是音调高低；0 dB 是人刚能听到的最微弱声音，不是没有声音。","quiz":[{"q":"下列控制噪声的措施中，属于在声源处减弱的是","o":["摩托车安装消声器","道路两旁设置隔音墙","戴防噪声耳罩"],"a":0,"why":"三条途径：声源处（消声器）、传播过程中（隔音墙）、人耳处（耳罩）。"}]},"cnp_009":{"core":["运用声的传播和噪声控制知识，选择材料、设计并制作隔音房间模型，比较不同材料的隔音效果"],"trap":"跨学科实践题看着新，考的仍是控制变量和「声源/传播/人耳」三条控噪途径。","quiz":[{"q":"比较不同材料的隔音效果时，下列做法正确的是","o":["保持声源、距离、材料厚度等条件相同，只更换材料","每种材料换用不同的声源更全面","凭一次主观感受就下结论"],"a":0,"why":"这是控制变量法：只改变被研究的那个因素，其余条件全部保持一致。"}]},"cnp_014":{"core":["在厨房情境中观察和解释蒸、煮、冷冻、解冻等过程中的物态变化，提出节能、安全的改进办法"],"trap":"先判断变化前后各是什么状态（固/液/气），再套六种物态变化的名称，不要凭感觉猜。","quiz":[{"q":"下列厨房现象与物态变化对应正确的是","o":["锅盖内侧的水珠——水蒸气液化","冷冻的肉放久变干——熔化","水烧开后变少——升华"],"a":0,"why":"水珠是水蒸气遇冷液化；冻肉变干是冰直接升华；水烧开变少主要是汽化（沸腾与蒸发）。"}]},"cnp_016":{"core":["探究并了解光的反射定律：反射光线、入射光线和法线在同一平面内，反射光线和入射光线分居法线两侧，反射角等于入射角","知道镜面反射和漫反射，知道光路可逆"],"trap":"镜面反射和漫反射都遵守反射定律，区别只在反射面平不平；光路在反射和折射中都是可逆的。","quiz":[{"q":"关于光的反射定律，下列说法正确的是","o":["反射角等于入射角，两个角都是光线与法线的夹角","反射角是反射光线与镜面的夹角","入射角增大时反射角减小"],"a":0,"why":"入射角、反射角都从法线量起；反射角始终等于入射角，两者一起增大或减小。"}]},"cnp_017":{"core":["探究并了解平面镜成像的特点：像与物大小相等，像与物到镜面的距离相等，像与物的连线与镜面垂直，成的是虚像","知道平面镜的应用"],"trap":"实验中用玻璃板代替平面镜，是为了既能看到像、又能看到后面的蜡烛，便于确定像的位置。","quiz":[{"q":"关于平面镜成像，下列说法正确的是","o":["像与物大小相等、到镜面距离相等，是虚像","物体靠近镜面时，像会变大","所成的像能用光屏承接"],"a":0,"why":"平面镜成等大、等距、正立的虚像；像的大小始终与物体相同，虚像不能呈现在光屏上。"}]},"cnp_018":{"core":["通过实验了解光的折射现象及特点：光从空气斜射入水或玻璃中，折射角小于入射角","垂直入射时传播方向不变","能解释池水变浅、筷子“折断”等现象"],"trap":"池水看起来变浅、插入水中的筷子「折断」、海市蜃楼，都是光的折射造成的。","quiz":[{"q":"光从空气斜射入水中时","o":["折射角小于入射角，折射光线向法线偏折","折射角大于入射角","传播方向一定不改变"],"a":0,"why":"从空气（光疏）进入水或玻璃（光密），折射光线靠近法线，折射角小于入射角；只有垂直入射才不改变方向。"}]},"cnp_019":{"core":["通过实验了解白光由多种色光组成，知道光的三原色是红、绿、蓝，了解不同色光混合现象","了解红外线和紫外线的应用"],"trap":"红外线＝热效应 / 遥控 / 夜视；紫外线＝灭菌 / 验钞 / 荧光，两者应用别互换。","quiz":[{"q":"关于光的色散和色光，下列说法正确的是","o":["白光经三棱镜可分解成多种色光，光的三原色是红、绿、蓝","光的三原色是红、黄、蓝","红外线可用于灭菌、使荧光物质发光"],"a":0,"why":"光的三原色是红绿蓝（颜料三原色才是红黄蓝）；灭菌和荧光效应属于紫外线，红外线主要用于遥控、夜视、加热。"}]},"cnp_020":{"core":["认识凸透镜和凹透镜，知道主光轴、光心、焦点、焦距","了解凸透镜对光有会聚作用，凹透镜对光有发散作用，会画三条特殊光线"],"trap":"三条特殊光线里最容易漏的是「过光心的光线传播方向不改变」。","quiz":[{"q":"关于凸透镜和凹透镜，下列说法正确的是","o":["凸透镜对光有会聚作用，凹透镜对光有发散作用","凹透镜中间厚、边缘薄","平行于主光轴的光经凹透镜后会聚于焦点"],"a":0,"why":"凸透镜中间厚边缘薄、对光会聚；凹透镜中间薄边缘厚、对光发散。平行光只有经凸透镜才会聚于焦点。"}]},"cnp_021":{"core":["了解照相机、投影仪、放大镜的成像特点，知道实像和虚像的区别"],"trap":"实像能呈现在光屏上、一般是倒立的；虚像不能呈现在光屏上、一般是正立的。","quiz":[{"q":"下列透镜与成像性质对应正确的是","o":["照相机——倒立、缩小的实像","投影仪——正立、放大的虚像","放大镜——倒立、放大的实像"],"a":0,"why":"照相机成倒立缩小实像；投影仪成倒立放大实像；放大镜成正立放大虚像。"}]},"cnp_022":{"core":["探究并了解凸透镜成像规律：u > 2f 成倒立缩小实像，f < u < 2f 成倒立放大实像，u < f 成正立放大虚像","成实像时物近像远像变大"],"trap":"u = 2f 是成「放大还是缩小」的分界，u = f 是成「实像还是虚像」的分界；成实像时物近像远像变大。","quiz":[{"q":"凸透镜焦距为 f，把物体放在 u > 2f 处时，成","o":["倒立、缩小的实像","倒立、放大的实像","正立、放大的虚像"],"a":0,"why":"u>2f 成倒立缩小实像（照相机）；f<u<2f 成倒立放大实像（投影仪）；u<f 成正立放大虚像（放大镜）。"}]},"cnp_023":{"core":["知道眼睛相当于照相机，晶状体相当于凸透镜，视网膜上成倒立、缩小的实像","知道近视眼、远视眼的成因和矫正方法"],"trap":"近视＝成像在前＋凹透镜；远视＝成像在后＋凸透镜，这两组最容易被对调。","quiz":[{"q":"关于近视眼及其矫正，下列说法正确的是","o":["像成在视网膜前方，用凹透镜矫正","像成在视网膜后方，用凸透镜矫正","晶状体太薄、折光能力太弱"],"a":0,"why":"近视眼晶状体太厚或折光太强，像落在视网膜前方，需戴凹透镜发散；远视眼正好相反。"}]},"cnp_024":{"core":["了解开普勒望远镜由两个凸透镜组成，物镜成倒立、缩小的实像，目镜相当于放大镜","动手制作简易望远镜并调节"],"trap":"显微镜的物镜成的是倒立「放大」实像，望远镜的物镜成的是倒立「缩小」实像，别混。","quiz":[{"q":"关于开普勒望远镜，下列说法正确的是","o":["物镜和目镜都是凸透镜，物镜成倒立缩小的实像，目镜相当于放大镜","物镜是凹透镜，目镜是凸透镜","物镜和目镜都成正立放大的虚像"],"a":0,"why":"开普勒望远镜由两个凸透镜组成：物镜成倒立缩小的实像，目镜把这个中间像再放大。"}]},"cnp_025":{"core":["知道质量是物体所含物质的多少，是物体的属性，不随形状、状态、位置、温度改变","会用托盘天平测量质量"],"trap":"天平使用顺序：放水平 → 游码归零 → 调平衡螺母 → 左物右码，加减砝码必须用镊子。","quiz":[{"q":"关于质量，下列说法正确的是","o":["质量是物体的属性，不随形状、状态、位置和温度改变","把铁块压成铁片，质量变小","水结成冰后质量变大"],"a":0,"why":"质量表示物体所含物质的多少，形状、状态、位置、温度改变时都不变（体积可能变）。"}]},"cnp_027":{"core":["会用量筒测体积，会用天平和量筒测量固体和液体的密度，能分析实验步骤顺序对误差的影响"],"trap":"测液体密度先称「烧杯+液体」，倒一部分入量筒后再称「烧杯+剩余液体」，可避开杯壁残留带来的误差。","quiz":[{"q":"用量筒读液体体积时，正确做法是","o":["量筒放水平，视线与凹液面最低处相平","俯视读数更准确","手拿着量筒倾斜读数也可以"],"a":0,"why":"量筒必须放在水平面上，视线与凹液面最低处相平；俯视读数偏大，仰视读数偏小。"}]},"cnp_028":{"core":["能利用密度鉴别物质、计算不便直接测量的质量或体积，解释水结冰体积变大、气体密度受温度影响等现象"],"trap":"密度可以鉴别物质，但密度相同不一定就是同种物质，还要结合颜色、硬度等其他性质判断。","quiz":[{"q":"水结成冰后体积变大，主要原因是","o":["质量不变，冰的密度比水小，由 V = m/ρ 可知体积变大","结冰后质量变大了","冰的密度比水大"],"a":0,"why":"状态变化质量不变；冰的密度小于水，同质量下体积变大，这就是冬天水管会冻裂的原因。"}]},"cnp_029":{"core":["知道力是物体对物体的作用，物体间力的作用是相互的","知道力可以改变物体的运动状态和形状","知道力的三要素，会画力的示意图，力的单位是牛顿（N）"],"trap":"力的三要素是大小、方向、作用点，单位是牛顿（N）；「力的作用是相互的」指两个力分别作用在对方物体上。","quiz":[{"q":"关于力，下列说法正确的是","o":["力是物体对物体的作用，物体间力的作用是相互的","一个物体也能单独产生力","力只能改变运动状态，不能改变物体形状"],"a":0,"why":"力至少涉及两个物体；力的作用效果有两个——改变运动状态、改变形状。"}]},"cnp_030":{"core":["知道弹性和弹力，知道在弹性限度内弹簧伸长量与拉力成正比，会正确使用弹簧测力计测量力"],"trap":"用弹簧测力计前要看量程和分度值、检查指针是否指零，拉力方向要沿弹簧轴线，读数时视线正对刻度。","quiz":[{"q":"关于弹力与弹簧测力计，下列说法正确的是","o":["在弹性限度内，弹簧的伸长量与所受拉力成正比","弹簧伸长量与拉力永远成正比，没有任何前提","弹力不需要物体接触就能产生"],"a":0,"why":"必须加「在弹性限度内」这个前提；弹力产生需要相互接触并发生弹性形变。"}]},"cnp_031":{"core":["知道重力是由于地球的吸引而使物体受到的力，方向竖直向下，作用点在重心","知道 G = mg，g 约为 9.8 N/kg（题中常取 10 N/kg）"],"trap":"质量不随位置改变，重力会随 g 变化；重力的作用点叫重心，形状规则、质量分布均匀的物体重心在几何中心。","quiz":[{"q":"关于重力，下列说法正确的是","o":["重力方向竖直向下，可用 G = mg 计算","重力方向总是垂直于接触面","物体质量越大，g 就越大"],"a":0,"why":"g 在同一地点约为 9.8 N/kg（题中常取 10），与物体质量无关；「竖直向下」指向地面，不等于「垂直于斜面」。"}]},"cnp_032":{"core":["通过阻力对物体运动影响的实验和科学推理认识牛顿第一定律","知道一切物体都有惯性，惯性只与质量有关，能用惯性解释生活现象"],"trap":"惯性不是力，不能说「受到惯性的作用」；急刹车前倾、系安全带、跳远助跑都是惯性现象。","quiz":[{"q":"关于牛顿第一定律和惯性，下列说法正确的是","o":["一切物体都有惯性，惯性大小只与质量有关","物体运动速度越大，惯性越大","牛顿第一定律完全由实验直接得出"],"a":0,"why":"惯性是物体的固有属性，只由质量决定，与速度无关；定律是在实验基础上经科学推理得出的，因为无法真的消除一切阻力。"}]},"cnp_033":{"core":["知道平衡状态和平衡力，知道二力平衡的条件：作用在同一物体上，大小相等、方向相反、作用在同一直线上","能区分平衡力与相互作用力"],"trap":"平衡力「同体」，相互作用力「异体」——先看清两个力是不是作用在同一个物体上。","quiz":[{"q":"下列哪一组力一定是一对平衡力","o":["作用在同一物体上、大小相等、方向相反、作用在同一直线上","大小相等、方向相反、分别作用在两个物体上","大小相等、方向相同、作用在同一物体上"],"a":0,"why":"二力平衡的四个条件缺一不可；第二组描述的是相互作用力，不是平衡力。"}]},"cnp_034":{"core":["知道摩擦力，探究并了解滑动摩擦力大小与压力大小和接触面粗糙程度有关","知道增大和减小摩擦的方法"],"trap":"测滑动摩擦力必须用弹簧测力计沿水平方向匀速直线拉动木块，此时拉力才与摩擦力平衡、读数才等于摩擦力。","quiz":[{"q":"关于滑动摩擦力，下列说法正确的是","o":["大小与压力大小和接触面粗糙程度有关","接触面积越大，滑动摩擦力一定越大","物体运动得越快，滑动摩擦力越大"],"a":0,"why":"滑动摩擦力只由压力和接触面粗糙程度决定，与接触面积大小、运动速度一般无关。"}]},"cnp_035":{"core":["了解合力的概念，知道同一直线上方向相同的两个力的合力等于二力之和，方向相反时等于二力之差、方向与较大的力相同"],"trap":"同一直线上：同向相加、反向相减，合力的方向随较大的那个力。","quiz":[{"q":"同一直线上两个力：F₁ = 8 N 向右，F₂ = 3 N 向左，其合力是","o":["5 N，方向向右","11 N，方向向右","5 N，方向向左"],"a":0,"why":"方向相反时合力 = 大减小 = 8 − 3 = 5 N，方向与较大的力相同，即向右。"}]},"cnp_036":{"core":["理解压强 p = F/S，单位帕斯卡（Pa），知道增大和减小压强的方法","会计算固体压强"],"trap":"计算时 S 要换成 m²（1 cm² = 10⁻⁴ m²）；书包宽背带、铁轨铺枕木是增大面积减小压强，刀刃磨薄则相反。","quiz":[{"q":"关于压强 p = F/S，下列说法正确的是","o":["受力面积一定时，压力越大压强越大","压力越大，压强一定越大","受力面积越大，压强一定越大"],"a":0,"why":"压强由压力和受力面积共同决定，比较时必须控制其中一个量；面积增大反而会减小压强。"}]},"cnp_037":{"core":["知道液体内部向各个方向都有压强","探究并了解液体压强与深度和液体密度有关，p = ρgh","了解连通器及其应用"],"trap":"连通器装同种液体、静止时各容器液面相平；船闸、茶壶、锅炉水位计都是连通器的应用。","quiz":[{"q":"关于液体压强 p = ρgh，下列说法正确的是","o":["h 是该点到自由液面的竖直距离","h 等于容器的高度","液体压强只与液体密度有关"],"a":0,"why":"h 是深度，即到自由液面的竖直距离；压强随深度和密度增大，与容器形状、液体总量无关。"}]},"cnp_038":{"core":["知道大气压强的存在，了解托里拆利实验和标准大气压（约 1.013×10⁵ Pa，相当于 760 mm 水银柱），知道大气压随高度增加而减小及其与生活的关系"],"trap":"马德堡半球实验证明大气压「存在」，托里拆利实验测出大气压的「数值」，两个实验别混。","quiz":[{"q":"关于大气压强，下列说法正确的是","o":["大气压随海拔升高而减小","标准大气压约为 1.013×10³ Pa","托里拆利实验证明的是大气压随温度的变化"],"a":0,"why":"标准大气压约 1.013×10⁵ Pa，相当于 760 mm 高水银柱；海拔越高空气越稀薄，大气压越小。"}]},"cnp_039":{"core":["了解活塞式抽水机利用大气压把水抽上来的原理，动手制作简易抽水机，知道它能把水抽高的高度受大气压限制"],"trap":"抽水高度受大气压限制（理论约 10.3 m），不是把活塞做得更大就能抽得更高。","quiz":[{"q":"活塞式抽水机把水抽上来，主要依靠","o":["大气压把水压入筒内","活塞对水的吸引力","水自身的重力"],"a":0,"why":"活塞上提使筒内气压降低，外界大气压把水压上来；1 个标准大气压约能支持 10 m 高的水柱。"}]},"cnp_040":{"core":["知道流体在流速大的地方压强小、流速小的地方压强大，能解释飞机升力、站台安全线等现象"],"trap":"飞机机翼上表面流速大压强小、下表面流速小压强大，形成向上的升力；站台安全线、两船不能并排高速行驶同理。","quiz":[{"q":"关于流体压强与流速的关系，下列说法正确的是","o":["流速大的地方压强小","流速大的地方压强大","压强与流速无关"],"a":0,"why":"定性结论：流体流速越大的位置压强越小。"}]},"cnp_041":{"core":["知道浮力的方向竖直向上，浮力产生的原因是液体对物体上下表面的压力差","会用称重法测浮力","探究并了解浮力大小与排开液体的体积和液体密度有关"],"trap":"称重法 F浮 = G − F示；浮力产生的根本原因是液体对物体上下表面的压力差。","quiz":[{"q":"关于浮力，下列说法正确的是","o":["方向竖直向上，大小与排开液体的体积和液体密度有关","物体浸没得越深，浮力一定越大","浮力方向总是竖直向下"],"a":0,"why":"由 F浮 = ρ液 g V排，完全浸没后 V排 不再变化，浮力与深度无关；浮力方向竖直向上。"}]},"cnp_042":{"core":["知道阿基米德原理：浸在液体中的物体受到向上的浮力，大小等于它排开液体所受的重力，F浮 = G排 = ρ液 g V排"],"trap":"完全浸没时 V排 = V物，部分浸入时 V排 < V物——这一步最常算错。","quiz":[{"q":"阿基米德原理的正确表达式是","o":["F浮 = G排 = ρ液 g V排","F浮 = G物","F浮 = ρ物 g V物"],"a":0,"why":"浮力等于物体排开的液体所受的重力；只有漂浮或悬浮时，才额外有 F浮 = G物。"}]},"cnp_043":{"core":["知道物体的浮沉条件（比较 F浮 与 G，或 ρ物 与 ρ液），知道漂浮时 F浮 = G，了解轮船、潜水艇、气球、密度计的原理"],"trap":"也可比密度：ρ物 < ρ液 上浮最终漂浮，ρ物 = ρ液 悬浮，ρ物 > ρ液 下沉。","quiz":[{"q":"关于物体的浮沉，下列说法正确的是","o":["漂浮和悬浮时都有 F浮 = G","下沉过程中浮力大于重力","潜水艇靠改变自身体积实现浮沉"],"a":0,"why":"漂浮、悬浮时二力平衡；下沉时 F浮 < G；潜水艇靠水舱充水、排水改变自身重力。"}]},"cnp_044":{"core":["利用漂浮条件制作简易密度计，知道密度计在不同液体中受到的浮力相等，液体密度越大，浸入越浅，刻度上小下大"],"trap":"密度计刻度「上小下大」且不均匀，这是高频考点。","quiz":[{"q":"同一支密度计分别放入水和盐水中都漂浮，下列说法正确的是","o":["受到的浮力相等，在盐水中浸入较浅","在盐水中受到的浮力更大","在两种液体中浸入深度相同"],"a":0,"why":"漂浮时 F浮 = G，密度计自重不变所以浮力相等；盐水密度大，由 V排 = F浮/(ρ液 g) 得 V排 更小、浸入更浅。"}]},"cnp_045":{"core":["知道做功的两个必要因素（作用在物体上的力、物体在力的方向上移动的距离），会用 W = Fs 计算，单位焦耳（J）"],"trap":"W = Fs，单位焦耳（J），1 J = 1 N·m；这三种「劳而无功」的情形要能一眼认出。","quiz":[{"q":"下列情形中，力对物体做了功的是","o":["用水平推力推箱子，箱子沿推力方向移动了一段距离","提着水桶在水平路面匀速行走（提力竖直向上）","用力推大石头，石头纹丝不动"],"a":0,"why":"做功要同时满足「有力」和「在力的方向上有距离」：提桶水平走时力与位移垂直不做功；推不动时距离为零也不做功。"}]},"cnp_046":{"core":["知道功率表示做功的快慢，P = W/t，单位瓦特（W）","能推导并使用 P = Fv"],"trap":"功率讲「快慢」，功讲「多少」；1 W = 1 J/s，推导式 P = Fv 用于匀速直线运动。","quiz":[{"q":"关于功率，下列说法正确的是","o":["功率表示做功的快慢，P = W/t","做功越多，功率一定越大","功率越大，做的功一定越多"],"a":0,"why":"功率由功和时间共同决定；做功多但耗时很长，功率反而可能很小。"}]},"cnp_047":{"core":["知道动能、重力势能、弹性势能","知道动能与质量和速度有关，重力势能与质量和高度有关，弹性势能与弹性形变程度有关"],"trap":"弹性势能与弹性形变程度有关；答题时「质量」这一项最容易漏掉。","quiz":[{"q":"关于动能和势能，下列说法正确的是","o":["动能与质量和速度有关，重力势能与质量和高度有关","动能只与速度有关","重力势能只与高度有关"],"a":0,"why":"两种能量都同时与质量有关；探究影响因素时要用控制变量法，每次只改变一个量。"}]},"cnp_048":{"core":["知道机械能是动能和势能的总和，能分析动能和势能的相互转化，知道只有动能和势能相互转化时机械能守恒"],"trap":"一旦有摩擦或空气阻力，部分机械能转化为内能，机械能就不守恒（但总能量仍守恒）。","quiz":[{"q":"不计空气阻力，滚摆下降过程中","o":["重力势能减小、动能增大，机械能总量不变","重力势能增大、动能减小","机械能总量不断减小"],"a":0,"why":"高度降低、速度增大，重力势能转化为动能；只有动能与势能相互转化时机械能守恒。"}]},"cnp_049":{"core":["知道杠杆的五要素，会画力臂","探究并了解杠杆的平衡条件 F₁l₁ = F₂l₂","能区分省力杠杆、费力杠杆和等臂杠杆"],"trap":"画力臂要先延长力的作用线，再从支点作垂线；这一步画错，后面计算全错。","quiz":[{"q":"关于杠杆平衡条件 F₁l₁ = F₂l₂，下列说法正确的是","o":["l 是支点到力的作用线的垂直距离","l 就是支点到力的作用点的距离","动力臂越长越费力"],"a":0,"why":"力臂是「点到线的距离」，不是「点到点的距离」；动力臂大于阻力臂时是省力杠杆。"}]},"cnp_050":{"core":["运用杠杆平衡条件设计并制作简易杆秤，确定定盘星（零刻度）和刻度，了解我国古代杆秤的智慧"],"trap":"秤砣离提纽越远，能称的物体越重——本质是动力臂变大了。","quiz":[{"q":"关于杆秤，下列说法正确的是","o":["依据杠杆平衡条件制成，刻度是均匀的","刻度不均匀，越靠外越密","依据阿基米德原理制成"],"a":0,"why":"由 F₁l₁ = F₂l₂，力臂 l 与所称质量成正比，所以刻度均匀；定盘星就是零刻度位置。"}]},"cnp_051":{"core":["知道定滑轮不省力但能改变力的方向，动滑轮能省一半力但费距离","会分析滑轮组的承重绳子段数，F = (G物 + G动)/n，s = nh"],"trap":"滑轮组 F = (G物 + G动)/n、s = nh，关键是数清承担物重的绳子段数 n。","quiz":[{"q":"关于定滑轮和动滑轮，下列说法正确的是","o":["定滑轮不省力但能改变力的方向，动滑轮能省一半力但费距离","定滑轮能省一半力","动滑轮既能省力又能改变力的方向"],"a":0,"why":"定滑轮实质是等臂杠杆；动滑轮在不计动滑轮重与摩擦时能省一半力，但要多拉一倍距离。"}]},"cnp_052":{"core":["知道有用功、额外功、总功，知道机械效率 η = W有/W总，机械效率总小于 1","了解提高机械效率的方法"],"trap":"提高效率：减轻动滑轮重、减小摩擦、适当增大所提升物重；机械效率与「省不省力」是两回事。","quiz":[{"q":"关于机械效率 η = W有/W总，下列说法正确的是","o":["机械效率总小于 1","机械效率可以大于 1","额外功越少，机械效率越低"],"a":0,"why":"总功 = 有用功 + 额外功，额外功不可能为零，所以 η 恒小于 1；减小额外功反而能提高效率。"}]},"cnp_053":{"core":["知道热量是热传递过程中传递内能的多少","通过实验了解比热容，会用 Q = cmΔt 计算吸收或放出的热量","能用水的比热容大解释生活现象"],"trap":"Q = cmΔt 里的 Δt 是温度变化量，不是末温；沿海昼夜温差小、暖气用水作介质，都因为水的比热容大。","quiz":[{"q":"关于比热容和热量，下列说法正确的是","o":["比热容是物质的特性，水的比热容是 4.2×10³ J/(kg·℃)","比热容随物体质量增大而增大","热量是物体含有内能的多少"],"a":0,"why":"比热容只与物质种类和状态有关，与质量、温度变化无关；热量是热传递中转移的内能，不能说物体「含有热量」。"}]},"cnp_054":{"core":["知道物质由分子、原子构成","知道分子在不停地做无规则运动，温度越高运动越剧烈（扩散现象）","知道分子间存在引力和斥力，分子间有间隙"],"trap":"温度越高扩散越快（分子热运动越剧烈）；分子间引力和斥力同时存在，分子间还有间隙。","quiz":[{"q":"下列现象能说明分子在不停地做无规则运动的是","o":["在房间里喷香水，过一会儿各处都能闻到","阳光下看到灰尘飞舞","两块铅块压紧后能吊起重物"],"a":0,"why":"闻到气味是扩散现象，说明分子在运动；灰尘是宏观颗粒的机械运动；铅块粘合说明分子间存在引力。"}]},"cnp_055":{"core":["知道内能是物体内所有分子动能和分子势能的总和，一切物体都有内能","知道做功和热传递是改变内能的两种方式","能区分温度、热量和内能"],"trap":"做功是能量的转化，热传递是能量的转移，两者改变内能的效果相同、本质不同。","quiz":[{"q":"关于温度、热量和内能，下列说法正确的是","o":["一切物体都有内能；做功和热传递都能改变内能","0 ℃ 的物体没有内能","物体温度越高，含有的热量越多"],"a":0,"why":"一切物体（包括 0 ℃ 以下）都有内能；热量是过程量，只能说「吸收」或「放出」，不能说「含有」。"}]},"cnp_056":{"core":["知道能量既不会凭空消灭，也不会凭空产生，只会从一种形式转化为其他形式或从一个物体转移到其他物体，总量保持不变","知道永动机不可能实现"],"trap":"能量的转化和转移有方向性，所以总量虽守恒，散失到环境中的内能也无法自动全部回收。","quiz":[{"q":"关于能量守恒定律，下列说法正确的是","o":["能量既不会凭空产生也不会凭空消灭，总量保持不变","能量可以凭空产生","只要摩擦足够小，永动机就能实现"],"a":0,"why":"能量只会从一种形式转化为其他形式，或从一个物体转移到其他物体；永动机违反能量守恒，不可能制成。"}]},"cnp_057":{"core":["了解热机是把内能转化为机械能的机器","知道汽油机四个冲程（吸气、压缩、做功、排气）及其能量转化"],"trap":"四冲程顺序：吸气→压缩→做功→排气；一个工作循环飞轮转 2 周、对外做功 1 次。","quiz":[{"q":"汽油机四个冲程中，把内能转化为机械能的是","o":["做功冲程","压缩冲程","吸气冲程"],"a":0,"why":"压缩冲程是机械能转化为内能；做功冲程是内能转化为机械能；吸气、排气冲程靠飞轮惯性完成。"}]},"cnp_058":{"core":["知道燃料的热值，会用 Q放 = mq 计算","知道热机效率是用来做有用功的能量与燃料完全燃烧放出能量之比，了解提高热机效率的途径"],"trap":"提高效率：使燃料充分燃烧、减少废气带走的热量、减小机械摩擦。","quiz":[{"q":"关于热值和热机效率，下列说法正确的是","o":["热值是燃料的特性，可用 Q放 = mq 计算放出的热量","燃料燃烧越充分，热值越大","热机效率可以等于 100%"],"a":0,"why":"热值只与燃料种类有关，与燃烧是否充分、质量多少无关；热机总有能量损失，效率恒小于 1。"}]},"cnp_059":{"core":["利用内能做功的原理设计并制作简易热机模型（如蒸汽小船、热气流风车），分析其中的能量转化和提高效率的方法"],"trap":"改进方向：减少热量散失、减小转轴摩擦、让蒸汽更集中地作用在叶轮上。","quiz":[{"q":"蒸汽小船、热气流风车这类简易热机模型中的能量转化是","o":["内能转化为机械能","机械能转化为内能","电能转化为内能"],"a":0,"why":"热水或燃料提供内能，通过蒸汽、热气流推动叶轮做功，对外输出机械能。"}]},"cnp_060":{"core":["知道摩擦起电和两种电荷，同种电荷相互排斥、异种电荷相互吸引","了解验电器、导体和绝缘体","知道原子由原子核和电子构成，摩擦起电是电子的转移"],"trap":"验电器利用同种电荷相互排斥；导体有金属、人体、大地、酸碱盐水溶液，橡胶、玻璃、塑料是常见绝缘体。","quiz":[{"q":"关于电荷，下列说法正确的是","o":["同种电荷相互排斥、异种电荷相互吸引；摩擦起电的实质是电子转移","摩擦起电创造了新的电荷","同种电荷相互
